---
id: https://w3id.org/lmodel/common-domain-model/cdm_legaldocumentation_clauselibrary
name: cdm_legaldocumentation_clauselibrary
title: CDM cdm.legaldocumentation.clauselibrary
description: The CDM's cdm.legaldocumentation.clauselibrary namespace.
version: 8.0.0-dev.13
source: https://github.com/finos/common-domain-model/tree/8.0.0-dev.13
license: Apache-2.0
prefixes:
  common_domain_model: https://w3id.org/lmodel/common-domain-model/
  linkml: https://w3id.org/linkml/
default_prefix: common_domain_model
default_range: string
imports:
  - linkml:types
  - ./cdm_base_staticdata_identifier
  - ./cdm_base_staticdata_party
classes:
  ClauseLibraryClause:
    description: Defines clauses that make up the Agreement.
    attributes:
      identifier:
        description: Unique identifier for the clause.
        range: AssignedIdentifier
        required: true
      name:
        description: Optional textual description of the clause.
        range: string
      counterparty:
        description: Optional counterparty role. This can be used where a clause needs to be assigned
          to a specific party on the agreement based upon their role i.e. Party A or Party B.
        range: CounterpartyRoleEnum
        multivalued: true
        maximum_cardinality: 2
      otherParty:
        description: Optional party. This can be required for umbrella agreements where a clause may need
          to be assigned to a specific party who may or may not be on the agreement.
        range: PartyRoleEnum
        multivalued: true
      variant:
        description: Allows multiple variants to be defined for a clause. This needs to be an array as
          some clauses can specify different variants for different parties. At least one variant must
          be specified for a clause.
        range: ClauseLibraryClauseVariant
        required: true
        multivalued: true
  ClauseLibraryClauseVariant:
    description: Sets the details for a specific variant associated to a clause in the Agreement.
    attributes:
      identifier:
        description: Unique identifier for this variant.
        range: AssignedIdentifier
        required: true
      name:
        description: Optional textual description of the variant.
        range: string
      counterparty:
        description: Optional counterparty role. This can be used where a clause needs to assign a different
          variant to the different parties on the agreement based upon their role i.e. Party A or Party
          B.
        range: CounterpartyRoleEnum
        multivalued: true
        maximum_cardinality: 2
      otherParty:
        description: Optional party. This can be used where a clause needs to assign different variants
          to different parties who may or may not be on the agreement.
        range: PartyRoleEnum
        multivalued: true
      variableSet:
        description: For some variants of some clauses additional details are required to work out what
          has been elected. This array can be used to define the name and value of these variables. Please
          refer to the agreement documentation for more details of the variables that are available for
          any clause.
        range: ClauseLibraryVariableSet
        multivalued: true
  ClauseLibrarySchedule:
    description: The set of elections which specify an Agreement.
    attributes:
      clause:
        description: Clauses that have had elections made against them in this Agreement. There must be
          at least one clause defined in the agreement.
        range: ClauseLibraryClause
        required: true
        multivalued: true
  ClauseLibraryVariableSet:
    description: Defines a type where additional variables associated to clauses and their variants can
      be described.
    attributes:
      variableSet:
        description: For some variants a table of variables is required. To support this use case we need
          to be able to specify variables within variables. Including a variable set here gives us infinite
          nesting opportunities - realistically we are only ever expecting that a table would need to
          be defined for any particular clause, so we would expect two levels of nesting as a maximum
          i.e. variableSet->variableSet->name/value.
        range: ClauseLibraryVariableSet
        multivalued: true
      name:
        description: The name of the variable.
        range: string
      value:
        description: The value for this variable.
        range: string
    rules:
      - description: 'VariableSetExists: If we have a variableSet then we must not have any name/value
          pairs at this level.'
        preconditions:
          slot_conditions:
            variableSet:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            name:
              value_presence: ABSENT
            value:
              value_presence: ABSENT
      - description: 'NameMustExist: If we have a name then we must also have a value.'
        preconditions:
          slot_conditions:
            name:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            value:
              value_presence: PRESENT
      - description: 'ValueMustExist: If we have a value then we must also have a name.'
        preconditions:
          slot_conditions:
            value:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            name:
              value_presence: PRESENT
    comments:
      - 'Rosetta condition VariableSetNesting is not stated in LinkML: if variableSet -> variableSet exists
        then variableSet -> variableSet -> variableSet is absent'
