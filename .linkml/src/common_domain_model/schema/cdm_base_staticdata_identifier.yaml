---
id: https://w3id.org/lmodel/common-domain-model/cdm_base_staticdata_identifier
name: cdm_base_staticdata_identifier
title: CDM cdm.base.staticdata.identifier
description: Basic identifier and assigned identifier concepts that are applicable across the model.
version: 8.0.0-dev.13
source: https://github.com/finos/common-domain-model/tree/8.0.0-dev.13
license: Apache-2.0
prefixes:
  common_domain_model: https://w3id.org/lmodel/common-domain-model/
  linkml: https://w3id.org/linkml/
default_prefix: common_domain_model
default_range: string
imports:
  - linkml:types
  - ./cdm_base_staticdata_party
  - ./cdm_observable_asset
  - ./common_domain_model_keys
enums:
  CommodityLocationIdentifierTypeEnum:
    description: Defines the enumerated values to specify the nature of a location identifier.
    permissible_values:
      DeliveryPoint:
        description: The physical or virtual point at which the commodity will be delivered.
      EntryPoint:
        description: The physical or virtual point at which the commodity enters a transportation system.
      InterconnectionPoint:
        description: Identification of the border(s) or border point(s) of a transportation contract.
      WithdrawalPoint:
        description: The physical or virtual point at which the commodity is withdrawn from a transportation
          system.
      DeliveryZone:
        description: The zone covering potential delivery points for the commodity
      BuyerHub:
        description: The hub code of the buyer.
      SellerHub:
        description: The hub code of the seller.
  TradeIdentifierTypeEnum:
    description: Defines the enumerated values to specify the nature of a trade identifier.
    permissible_values:
      UniqueTransactionIdentifier: {}
      UniqueSwapIdentifier: {}
classes:
  AssignedIdentifier:
    description: A class to specify the identifier value and its associated version.
    slots:
      - version
    attributes:
      identifier:
        description: The identifier value.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
    slot_usage:
      version:
        description: The identifier version, which is specified as an integer and is meant to be incremented
          each time the transaction terms (whether contract or event) change. This version is made option
          to support the use case where the identifier is referenced without the version. The constraint
          that a contract and a lifecycle event need to have an associated version is enforced through
          data rules.
        range: integer
  IdentifiedList:
    description: Attaches an identifier to a collection of objects, when those objects themselves can
      each be represented by an identifier. One use case is the representation of package transactions,
      where each component is a separate trade with its own identifier, and those trades are linked together
      as a package with its own identifier. The data type has been named generically rather than referring
      to 'packages' as it may have a number of other uses.
    attributes:
      listId:
        description: The identifier for the list. In the case of a package transaction, this would be
          the package identifier. This attribute is mandatory to allow the list itself to be identified.
        range: Identifier
        required: true
      componentId:
        description: Identifiers for each component of the list. Since the data type is used to link multiple
          identified objects together, at least 2 components are required in the list. Creating an identified
          list with only 1 identified component has been deemed unnecessary, because it would just create
          a redundant identifier.
        range: Identifier
        required: true
        multivalued: true
        minimum_cardinality: 2
      price:
        description: The price of the package.
        range: Price
    annotations:
      rosetta_metadata: key
  Identifier:
    description: A class to specify a generic identifier, applicable to CDM artefacts such as executions,
      contracts, lifecycle events and legal documents. An issuer can be associated with the actual identifier
      value as a way to properly qualify it.
    attributes:
      issuerReference:
        description: The identifier issuer, when specified by reference to a party specified as part of
          the transaction.
        range: Party
        annotations:
          rosetta_metadata: reference
      issuer:
        description: The identifier issuer, when specified explicitly alongside the identifier value (instead
          of being specified by reference to a party).
        range: string
        annotations:
          rosetta_metadata: scheme
      assignedIdentifier:
        description: The identifier value. This level of indirection between the issuer and the identifier
          and its version provides the ability to associate multiple identifiers to one issuer, consistently
          with the FpML PartyTradeIdentifier.
        range: AssignedIdentifier
        required: true
        multivalued: true
    all_of:
      - description: 'IssuerChoice: The identifier issuer is specified either explicitly or by reference
          to one of the parties.'
        exactly_one_of:
          - slot_conditions:
              issuerReference:
                value_presence: PRESENT
          - slot_conditions:
              issuer:
                value_presence: PRESENT
    annotations:
      rosetta_metadata: key
      doc_reference: ICMA GMRA namingConvention Identifier
  LocationIdentifier:
    is_a: Identifier
    description: Specifies a location identifier. An issuer and an identifier type can be associated with
      the actual identifier value as a way to properly qualify it.
    attributes:
      locationIdentifierType:
        description: Specifies the nature of a location identifier.
        range: CommodityLocationIdentifierTypeEnum
    all_of:
      - description: 'From Identifier. IssuerChoice: The identifier issuer is specified either explicitly
          or by reference to one of the parties.'
        exactly_one_of:
          - slot_conditions:
              issuerReference:
                value_presence: PRESENT
          - slot_conditions:
              issuer:
                value_presence: PRESENT
    comments:
      - 'Rosetta condition IdentifierType is not stated in LinkML: if locationIdentifierType exists then
        assignedIdentifier count = 1'
