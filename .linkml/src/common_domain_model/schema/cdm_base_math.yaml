---
id: https://w3id.org/lmodel/common-domain-model/cdm_base_math
name: cdm_base_math
title: CDM cdm.base.math
description: 'Basic maths concepts: quantity and unit, rounding, curve / schedule, non-negativity constraint
  etc.'
version: 8.0.0-dev.13
source: https://github.com/finos/common-domain-model/tree/8.0.0-dev.13
license: Apache-2.0
prefixes:
  common_domain_model: https://w3id.org/lmodel/common-domain-model/
  linkml: https://w3id.org/linkml/
default_prefix: common_domain_model
default_range: string
imports:
  - linkml:types
  - ./cdm_base_datetime
  - ./cdm_observable_asset
  - ./common_domain_model_keys
types:
  NonNegativeNumber:
    typeof: decimal
    uri: common_domain_model:NonNegativeNumber
    description: Defined as a number with a minimum value of 0.
    minimum_value: 0
enums:
  ArithmeticOperationEnum:
    description: An arithmetic operator that can be passed to a function
    permissible_values:
      Add:
        description: Addition of 2 values
      Subtract:
        description: Subtraction of 2nd value from 1st value
      Multiply:
        description: Multiplication of 2 values
      Divide:
        description: Division of 1st value by 2nd value
      Max:
        description: Maximum of 2 values
      Min:
        description: Minimum of 2 values
  AveragingCalculationMethodEnum:
    description: Specifies enumerations for the type of averaging calculation.
    permissible_values:
      Arithmetic:
        description: Refers to the calculation of an average by taking the sum of observations divided
          by the count of observations.
      Geometric:
        description: Refers to the calculation of an average by taking the nth root of the product of
          n observations.
      Harmonic:
        description: Refers to the calculation of an average by taking the reciprocal of the arithmetic
          mean of the reciprocals of the observations.
  AveragingWeightingMethodEnum:
    description: The enumerated values to specify the method of calculation to be used when averaging
      rates. Per ISDA 2000 Definitions, Section 6.2. Certain Definitions Relating to Floating Amounts.
    permissible_values:
      Unweighted:
        description: The arithmetic mean of the relevant rates for each reset date.
      Weighted:
        description: The arithmetic mean of the relevant rates in effect for each day in a calculation
          period calculated by multiplying each relevant rate by the number of days such relevant rate
          is in effect, determining the sum of such products and dividing such sum by the number of days
          in the calculation period.
  CapacityUnitEnum:
    description: Provides enumerated values for capacity units, generally used in the context of defining
      quantities for commodities.
    permissible_values:
      ALW:
        description: Denotes Allowances as standard unit.
      BBL:
        description: Denotes a Barrel as a standard unit.
      BCF:
        description: Denotes Billion Cubic Feet as a standard unit.
      BDFT:
        description: Denotes Board Feet as a standard unit.
      CBM:
        description: Denotes Cubic Meters as a standard unit.
      CER:
        description: Denotes Certified Emissions Reduction as a standard unit.
      CRT:
        description: Denotes Climate Reserve Tonnes as a standard unit.
      DAG:
        description: Denotes 10 grams as a standard unit used in precious metals contracts (e.g MCX).
      DAY:
        description: Denotes a single day as a standard unit used in time charter trades.
      DMTU:
        description: Denotes Dry Metric Ton (Tonne) Units - Consists of a metric ton of mass excluding
          moisture.
      ENVCRD:
        description: Denotes Environmental Credit as a standard unit.
      ENVOFST:
        description: Denotes Environmental Offset as a standard unit.
      FEU:
        description: Denotes a 40 ft. Equivalent Unit container as a standard unit.
      G:
        description: Denotes a Gram as a standard unit.
      GBBSH:
        description: Denotes a GB Bushel as a standard unit.
      GBBTU:
        description: Denotes a GB British Thermal Unit as a standard unit.
      GBCWT:
        description: Denotes a GB Hundredweight unit as standard unit.
      GBGAL:
        description: Denotes a GB Gallon unit as standard unit.
      GBMBTU:
        description: Denotes a Thousand GB British Thermal Units as a standard unit.
      GBMMBTU:
        description: Denotes a Million GB British Thermal Units as a standard unit.
      GBT:
        description: Denotes a GB Ton as a standard unit.
      GBTHM:
        description: Denotes a GB Thermal Unit as a standard unit.
      GJ:
        description: Denotes a Gigajoule as a standard unit.
      GW:
        description: Denotes a Gigawatt as a standard unit.
      GWH:
        description: Denotes a Gigawatt-hour as a standard unit.
      HL:
        description: Denotes a Hectolitre as a standard unit.
      HOGB:
        description: Denotes a 100-troy ounces Gold Bar as a standard unit.
      ISOBTU:
        description: Denotes an ISO British Thermal Unit as a standard unit.
      ISOMBTU:
        description: Denotes a Thousand ISO British Thermal Unit as a standard unit.
      ISOMMBTU:
        description: Denotes a Million ISO British Thermal Unit as a standard unit.
      ISOTHM:
        description: Denotes an ISO Thermal Unit as a standard unit.
      J:
        description: Denotes a Joule as a standard unit.
      KG:
        description: Denotes a Kilogram as a standard unit.
      KL:
        description: Denotes a Kilolitre as a standard unit.
      KW:
        description: Denotes a Kilowatt as a standard unit.
      KWD:
        description: Denotes a Kilowatt-day as a standard unit.
      KWH:
        description: Denotes a Kilowatt-hour as a standard unit.
      KWM:
        description: Denotes a Kilowatt-month as a standard unit.
      KWMIN:
        description: Denotes a Kilowatt-minute as a standard unit.
      KWY:
        description: Denotes a Kilowatt-year as a standard unit.
      L:
        description: Denotes a Litre as a standard unit.
      LB:
        description: Denotes a Pound as a standard unit.
      MB:
        description: Denotes a Thousand Barrels as a standard unit.
      MBF:
        description: Denotes a Thousand board feet, which are used in contracts on forestry underlyers
          as a standard unit.
      MJ:
        description: Denotes a Megajoule as a standard unit.
      MMBF:
        description: Denotes a Million board feet, which are used in contracts on forestry underlyers
          as a standard unit.
      MMBBL:
        description: Denotes a Million Barrels as a standard unit.
      MSF:
        description: Denotes a Thousand square feet as a standard unit.
      MT:
        description: Denotes a Metric Ton as a standard unit.
      MW:
        description: Denotes a Megawatt as a standard unit.
      MWD:
        description: Denotes a Megawatt-day as a standard unit.
      MWH:
        description: Denotes a Megawatt-hour as a standard unit.
      MWM:
        description: Denotes a Megawatt-month as a standard unit.
      MWMIN:
        description: Denotes a Megawatt-minute as a standard unit.
      MWY:
        description: Denotes a Megawatt-year as a standard unit.
      OZT:
        description: Denotes a Troy Ounce as a standard unit.
      SGB:
        description: Denotes a Standard Gold Bar as a standard unit.
      TEU:
        description: Denotes a 20 ft. Equivalent Unit container as a standard unit.
      USBSH:
        description: Denotes a US Bushel as a standard unit.
      USBTU:
        description: Denotes a US British Thermal Unit as a standard unit.
      USCWT:
        description: Denotes US Hundredweight unit as a standard unit.
      USGAL:
        description: Denotes a US Gallon unit as a standard unit.
      USMBTU:
        description: Denotes a Thousand US British Thermal Units as a standard unit.
      USMMBTU:
        description: Denotes a Million US British Thermal Units as a standard unit.
      UST:
        description: Denotes a US Ton as a standard unit.
      USTHM:
        description: Denotes a US Thermal Unit as a standard unit.
  CompareOp:
    permissible_values:
      GreaterThan: {}
      GreaterThanOrEquals: {}
      Equals: {}
      LessThanOrEquals: {}
      LessThan: {}
  FinancialUnitEnum:
    description: Provides enumerated values for financial units, generally used in the context of defining
      quantities for securities.
    permissible_values:
      Contract:
        description: Denotes financial contracts, such as listed futures and options.
      ContractualProduct:
        description: Denotes a Contractual Product as defined in the CDM. This unit type would be used
          when the price applies to the whole product, for example, in the case of a premium expressed
          as a cash amount.
      IndexUnit:
        description: Denotes a price expressed in index points, e.g. for a stock index.
      LogNormalVolatility:
        description: Denotes a log normal volatility, expressed in %/month, where the percentage is represented
          as a decimal. For example, 0.15 means a log-normal volatility of 15% per month.
      Share:
        description: Denotes the number of units of financial stock shares.
      ValuePerDay:
        description: Denotes a value (expressed in currency units) for a one day change in a valuation
          date, which is typically used for expressing sensitivity to the passage of time, also known
          as theta risk, or carry, or other names.
      ValuePerPercent:
        description: Denotes a value (expressed in currency units) per percent change in the underlying
          rate which is typically used for expressing sensitivity to volatility changes, also known as
          vega risk.
      Weight:
        description: Denotes a quantity (expressed as a decimal value) represented the weight of a component
          in a basket.
  QuantifierEnum:
    description: Represents the enumerated values to specify a logical quantification, i.e. either All
      or Any.
    permissible_values:
      All:
        description: Specifies that the condition in the scope of the quantifier is true of every member
          of the domain i.e. every one of the elements in scope.
      Any:
        description: Specifies that the condition in the scope of the quantifier is true of at least one
          member of the domain i.e. one or more of the elements in scope.
  QuantityChangeDirectionEnum:
    description: Specifies whether a quantity change is an increase, a decrease or a replacement, whereby
      the quantity is always specified as a positive number.
    permissible_values:
      Increase:
        description: When the quantity should go up by the specified amount.
      Decrease:
        description: When the quantity should go down by the specified amount.
      Replace:
        description: When the quantity should be replaced by the specified amount.
  RoundingDirectionEnum:
    description: The enumerated values to specify the rounding direction and precision to be used in the
      rounding of a number. Used by function cdm.base.math.RoundToPrecision.
    permissible_values:
      Up:
        description: A fractional number will be rounded up to the specified number of decimal places
          (the precision). For example, 5.21 and 5.25 rounded up to 1 decimal place are 5.3 and 5.3 respectively.
      Down:
        description: A fractional number will be rounded down to the specified number of decimal places
          (the precision). For example, 5.29 and 5.25 rounded down to 1 decimal place are 5.2 and 5.2
          respectively.
      Nearest:
        description: A fractional number will be rounded either up or down to the specified number of
          decimal places (the precision) depending on its value. For example, 5.24 would be rounded down
          to 5.2 and 5.25 would be rounded up to 5.3 if a precision of 1 decimal place were specified.
  RoundingModeEnum:
    description: The enumerated values to specify the rounding direction when rounding of a number to
      nearest. Used by function cdm.base.math.RoundToNearest.
    permissible_values:
      Down:
        description: A number will be rounded down to the specified nearest number. For example, 529 rounded
          down to the nearest 10 is 520.
      Up:
        description: A number will be rounded up to the specified nearest number. For example, 521 rounded
          up to the nearest 10 is 530.
  WeatherUnitEnum:
    description: Provides enumerated values for weather units, generally used in the context of defining
      quantities for commodities.
    permissible_values:
      CDD:
        description: Denotes Cooling Degree Days as a standard unit.
      CPD:
        description: Denotes Critical Precipitation Day as a standard unit.
      HDD:
        description: Heating Degree Day as a standard unit.
classes:
  AveragingCalculationMethod:
    description: Defines the ways in which multiple values can be aggregated into a single value.
    attributes:
      isWeighted:
        description: Identifies whether the average values will be weighted or unweighted.
        range: boolean
        required: true
      calculationMethod:
        description: Identifies which of the Pythagorean means is being used to compute an average value.
        range: AveragingCalculationMethodEnum
        required: true
  DatedValue:
    description: Defines a date and value pair. This definition is used for varying rate or amount schedules,
      e.g. a notional amortisation or a step-up coupon schedule.
    attributes:
      date:
        description: The date on which the associated step value becomes effective. This day may be subject
          to adjustment in accordance with a business day convention.
        range: date
        required: true
      value:
        description: The rate of amount which becomes effective on the associated step date. A rate of
          5% would be represented as 0.05.
        range: decimal
        required: true
    annotations:
      rosetta_metadata: key
  Measure:
    is_a: MeasureBase
    description: Defines a concrete measure as a single number associated to a unit. It extends MeasureBase
      by requiring a single value attribute to be present. A measure may be unit-less so the unit attribute
      is still optional.
    slot_usage:
      value:
        description: The value attribute must be present in a concrete measure.
        range: decimal
        required: true
      datedValue:
        description: The schedule of step date and value pairs must be absent.
        range: DatedValue
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
      - description: 'DatedValueIsAbsent: Work around to ensure datedValue is absent because the 0 cardinality
          is not adequately handled at the language level.'
        slot_conditions:
          datedValue:
            value_presence: ABSENT
  MeasureBase:
    is_a: Schedule
    description: Provides an abstract type to define a measure as a single number or a schedule associated
      to a unit. This type is abstract because all its attributes are optional. The types that extend
      it can specify further existence constraints.
    slots:
      - unit
    slot_usage:
      unit:
        description: Qualifies the unit by which the amount is measured. Optional because a measure may
          be unit-less (e.g. when representing a ratio between amounts in the same unit).
        range: UnitType
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
  MoneyBound:
    description: The money bound is defined as a money amount and whether the bound is inclusive.
    attributes:
      money:
        description: The money amount to be used as the bound, e.g. 1,000 USD.
        range: Money
        required: true
      inclusive:
        description: Whether the money amount bound is inclusive, e.g. for a lower bound, false would
          indicate greater than, whereas true would indicate greater than or equal to.
        range: boolean
        required: true
  MoneyRange:
    description: The money range defined as either a lower and upper money bound, or both.
    attributes:
      lowerBound:
        description: The lower bound of a money range, e.g. greater than or equal to 1,000 USD.
        range: MoneyBound
      upperBound:
        description: The upper bound of a money range, e.g. less than 10,000 USD.
        range: MoneyBound
    all_of:
      - description: AtLeastOneOf
        any_of:
          - slot_conditions:
              lowerBound:
                value_presence: PRESENT
          - slot_conditions:
              upperBound:
                value_presence: PRESENT
  NonNegativeDatedValue:
    is_a: DatedValue
    description: Defines a date and value pair where the value is non-negative. This definition is used
      for varying rate or amount schedules, e.g. a notional amortisation or a step-up coupon schedule.
    slot_usage:
      value:
        description: requires the rate of amount which becomes effective on the associated step date to
          be non-negative. A rate of 5% would be represented as 0.05.
        range: NonNegativeNumber
        required: true
  NonNegativeMeasure:
    is_a: Measure
    description: Defines a concrete non-negative measure as a number associated to a unit. It extends
      Measure by requiring the value attribute to be non-negative. A measure may be unit-less so the unit
      attribute is still optional.
    slot_usage:
      value:
        description: The value attribute must be present in a concrete measure and non-negative.
        range: NonNegativeNumber
        required: true
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
      - description: 'From Measure. DatedValueIsAbsent: Work around to ensure datedValue is absent because
          the 0 cardinality is not adequately handled at the language level.'
        slot_conditions:
          datedValue:
            value_presence: ABSENT
  NonNegativeQuantity:
    is_a: Quantity
    description: Specifies a quantity as a non-negative number, which condition is enforced through a
      data rule that only applies to the extending class.
    slot_usage:
      value:
        description: For a non-negative quantity, the value attribute must be positive.
        range: NonNegativeNumber
        required: true
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
    rules:
      - description: 'From QuantitySchedule. TotalQuantity: A total quantity must only be specified when
          the frequency exists.'
        preconditions:
          slot_conditions:
            total:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            frequency:
              value_presence: PRESENT
  NonNegativeQuantitySchedule:
    is_a: QuantitySchedule
    description: Specifies a quantity schedule where all the values must be non-negative.
    slot_usage:
      value:
        description: For a non-negative quantity schedule, all amount attribute must be positive.
        range: NonNegativeNumber
      datedValue:
        description: For a non-negative quantity schedule, all amount attribute must be positive.
        range: NonNegativeDatedValue
        multivalued: true
      total:
        description: For a non-negative quantity schedule, all amount attribute must be positive.
        range: NonNegativeSchedule
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
    rules:
      - description: 'From QuantitySchedule. TotalQuantity: A total quantity must only be specified when
          the frequency exists.'
        preconditions:
          slot_conditions:
            total:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            frequency:
              value_presence: PRESENT
  NonNegativeSchedule:
    is_a: Schedule
    description: Specifies a schedule whose values are non-negative.
    slot_usage:
      value:
        description: The non-negative initial rate or amount, as the case may be. An initial rate of 5%
          would be represented as 0.05.
        range: NonNegativeNumber
      datedValue:
        description: The schedule of step date and non-negative value pairs. On each step date the associated
          step value becomes effective. A list of steps may be ordered in the document by ascending step
          date. An FpML document containing an unordered list of steps is still regarded as a conformant
          document.
        range: NonNegativeDatedValue
        multivalued: true
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
  NumberBound:
    description: The number bound is defined as a number and whether the bound is inclusive.
    attributes:
      number:
        description: The number to be used as the bound, e.g. 5.
        range: decimal
        required: true
      inclusive:
        description: Whether the number bound is inclusive, e.g. for a lower bound, false would indicate
          greater than, whereas true would indicate greater than or equal to.
        range: boolean
        required: true
  NumberRange:
    description: The number range defined as either a lower and upper number bound, or both.
    attributes:
      lowerBound:
        description: The lower bound of a number range, e.g. greater than or equal to 5.
        range: NumberBound
      upperBound:
        description: The upper bound of a number range, e.g. less than 10.
        range: NumberBound
    all_of:
      - description: AtLeastOneOf
        any_of:
          - slot_conditions:
              lowerBound:
                value_presence: PRESENT
          - slot_conditions:
              upperBound:
                value_presence: PRESENT
  Quantity:
    is_a: QuantitySchedule
    description: Specifies a quantity as a single value to be associated to a financial product, for example
      a transfer amount resulting from a trade. This data type extends QuantitySchedule and requires that
      only the single value exists.
    slot_usage:
      value:
        description: Requires the single rate or amount, as the case may be, to be present. An initial
          rate of 5% would be represented as 0.05.
        range: decimal
        required: true
      datedValue:
        description: The schedule must be absent.
        range: DatedValue
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
    rules:
      - description: 'From QuantitySchedule. TotalQuantity: A total quantity must only be specified when
          the frequency exists.'
        preconditions:
          slot_conditions:
            total:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            frequency:
              value_presence: PRESENT
    comments:
      - 'Rosetta condition DatedValueIsAbsent is not stated in LinkML: datedValue is absent and total
        -> datedValue is absent'
  QuantitySchedule:
    is_a: MeasureBase
    description: Specifies a quantity schedule to be associated to a financial product to represent a
      trade amount. This data type extends MeasureBase with several unit or multiplier attributes that
      are used to define financial quantities. This data type is generically based on a schedule and can
      also be used to represent a quantity as a single value.
    attributes:
      multiplier:
        description: Defines an optional measure that the quantity should be multiplied by to derive a
          total quantity. Requires that the multiplier must be positive. This number is associated to
          an optional unit. For example in the case of the Coal (API2) CIF ARA (ARGUS-McCloskey) Futures
          Contract on the CME, where the unit would be contracts, the multiplier value would 1,000 and
          the mulitiplier unit would be 1,000 MT (Metric Tons).
        range: NonNegativeMeasure
      frequency:
        description: Defines the frequency to be used when defining a quantity. For example a quantity
          may be specified as a number of barrels of oil per day, which needs multiplying by the number
          of days in the relevant period to get the total quantity as a number of barrels.
        range: Frequency
      total:
        description: Specifies the total quantity when the quantity itself is specified with a frequency.
        range: Schedule
    slot_usage:
      unit:
        description: Requires that a unit of amount must be specified for any quantity.
        range: UnitType
        required: true
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
    rules:
      - description: 'TotalQuantity: A total quantity must only be specified when the frequency exists.'
        preconditions:
          slot_conditions:
            total:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            frequency:
              value_presence: PRESENT
  Rounding:
    description: Defines rounding rules and precision to be used in the rounding of a number.
    attributes:
      roundingDirection:
        description: Specifies the rounding rule as up, down, or nearest.
        range: RoundingDirectionEnum
        required: true
      precision:
        description: Specifies the rounding precision in terms of a number of decimal places when the
          number is evaluated in decimal form (not percentage), e.g. 0.09876543 rounded to the nearest
          5 decimal places is 0.0987654.
        range: integer
  Schedule:
    description: Specifies an amount or quantity, either as a single value or as a schedule of dated values.
      This can be used where the applicable quantity changes over time, with each dated value becoming
      effective from its associated step date.
    attributes:
      value:
        description: The initial rate or amount, as the case may be. An initial rate of 5% would be represented
          as 0.05.
        range: decimal
      datedValue:
        description: The schedule of step date and value pairs. On each step date the associated step
          value becomes effective. A list of steps may be ordered in the document by ascending step date.
          An FpML document containing an unordered list of steps is still regarded as a conformant document.
        range: DatedValue
        multivalued: true
    all_of:
      - description: 'ValueExists: A schedule may be specified as a single value or as a set of date-value
          pairs. Both attributes may be specified, in which case the single amount number is the initial
          value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
  ScheduleWithInitialValue:
    is_a: Schedule
    description: A class defining a schedule of rates or amounts in terms of an initial value and then
      a series of step date and value pairs. On each step date the rate or amount changes to the new step
      value. The series of step date and value pairs are optional. If not specified, this implies that
      the initial value remains unchanged over time.
    slot_usage:
      value:
        description: The initial rate or amount must be specified, as the case may be. An initial rate
          of 5% would be represented as 0.05.
        range: decimal
        required: true
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
  UnitType:
