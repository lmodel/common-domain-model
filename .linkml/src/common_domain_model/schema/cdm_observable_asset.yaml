          on the same Business Day reported by GFI Brokers on Thomson Reuters Page GFIU by 9:30 am, London
          time, on that Rate Calculation Date.
        aliases:
          - UAH_GFI_UAH01
      VEF.FIX/VEF01:
        description: The Spot Rate for a Rate Calculation Date will be the midpoint of the Venezuelan
          Bolivar /U.S. Dollar Tipo de Cambio De Referencia buying and selling rates, expressed as the
          amount of Venezuelan Bolivar per one U.S. Dollar, for settlement in two Business Days reported
          by the Banco Central de Venezuela (www.bcv.org.ve) at approximately 5:00 p.m., Caracas time,
          on that Rate Calculation Date.
        aliases:
          - VEF_FIX_VEF01
      VND.ABS/VND01:
        description: The Spot Rate for a Rate Calculation Date will be the Vietnamese Dong/U.S. Dollar
          spot rate at 11:00 a.m., Singapore time, expressed as the amount of Vietnamese Dong per one
          U.S. Dollar, for settlement in two Business Days reported by the Association of Banks in Singapore,
          which appears on the Reuters Screen ABSIRFIX01 Page to the right of the caption 'Spot' under
          the column 'VND' at approximately 11:30 a.m., Singapore time, on that Rate Calculation Date.
        aliases:
          - VND_ABS_VND01
      VND.FX/VND02:
        description: The Spot Rate for a Rate Calculation Date will be the Vietnamese Dong/U.S. Dollar
          spot rate expressed as the amount of Vietnamese Dong per one U.S. Dollar, for settlement in
          two Business Days which appears on Reuters Screen VNDFIX=VN Page under the caption 'Spot' and
          to the right of the caption 'Average' at approximately 11:00 am, Hanoi time, on that Rate Calculation
          Date.
        aliases:
          - VND_FX_VND02
      VND.SFEMC.INDICATIVE.SURVEY.RATE/VND03:
        description: The Spot Rate for a Rate Calculation Date will be the Vietnamese Dong/U.S. Dollar
          Specified Rate for U.S. Dollars, expressed as the amount of Vietnamese Dong per one U.S. Dollar,
          for settlement in two Business Days, as published on SFEMC's website (www.sfemc.org) at approximately
          3:30 p.m., Singapore time, or as soon as thereafter as practicable, on that Rate Calculation
          Date. The Spot Rate shall be calculated by SFEMC (or a service provider SFEMC may select in
          its sole discretion) pursuant to the SFEMC VND Indicative Survey Methodology (which means a
          methodology, dated as of July 14, 2008, as amended from time to time, for a centralized industry-wide
          survey of financial institutions that are active participants in the Vietnamese Dong/U.S. Dollar
          markets for the purpose of determining the SFEMC VND Indicative Survey Rate).
        aliases:
          - VND_SFEMC_INDICATIVE_SURVEY_RATE_VND03
    annotations:
      doc_reference: ISDA FpML_Coding_Scheme schemeLocation http://www.fpml.org/coding-scheme/settlement-rate-option
    see_also:
      - http://www.fpml.org/coding-scheme/settlement-rate-option
  ValuationMethodEnum:
    description: The enumerated values to specify the ISDA defined methodology for determining the final
      price of the reference obligation for purposes of cash settlement.
    permissible_values:
      Market: {}
      Highest: {}
      AverageMarket: {}
      AverageHighest: {}
      BlendedMarket: {}
      BlendedHighest: {}
      AverageBlendedMarket: {}
      AverageBlendedHighest: {}
classes:
  AssetFloatingRateIndex:
    is_a: IndexBase
    description: Specification of an interest rate index which can change over time, e.g. the SONIA (Sterling
      Overnight Index Average) in the UK.
    attributes:
      floatingRateIndex:
        description: The reference index that is used to specify the floating interest rate.
        range: FloatingRateIndexEnum
        required: true
        annotations:
          rosetta_metadata: scheme
      indexTenor:
        description: The ISDA Designated Maturity, i.e. the floating rate tenor.
        range: Period
    all_of:
      - description: 'From IndexBase. AssetType: Asset type must be Other.'
        slot_conditions:
          assetType:
            equals_string: Other
      - description: 'InterestRateAssetClass: The asset class must be Interest Rate.'
        slot_conditions:
          assetClass:
            equals_string: InterestRate
            value_presence: PRESENT
    aliases:
      - FloatingRateIndex
    annotations:
      rosetta_name: cdm.observable.asset.FloatingRateIndex
  AssetSettlementRateOption:
    description: Defines the settlement rate option to use for fixing in case of cash settlement. Currently
      only applicable to foreign exchange fixing in case of cross-currency settlement.
    attributes:
      settlementRateOption:
        description: The rate source for the conversion to the settlement currency. This source is specified
          through a scheme that reflects the terms of the Annex A to the 1998 FX and Currency Option Definitions.
        range: SettlementRateOptionEnum
        required: true
        annotations:
          rosetta_metadata: scheme
      priceSourceDisruption:
        description: An attribute defining the parameters to get a new quote when a settlement rate option
          is disrupted.
        range: PriceSourceDisruption
    aliases:
      - SettlementRateOption
    annotations:
      rosetta_name: cdm.observable.asset.SettlementRateOption
  Basket:
    is_a: AssetBase
    description: Defines a custom basket by referencing an identifier and its constituents.
    attributes:
      basketConstituent:
        description: Identifies the constituents of the basket
        range: BasketConstituent
        required: true
        multivalued: true
        annotations:
          rosetta_metadata: location
    all_of:
      - description: 'AssetType: Asset type must be Security.'
        slot_conditions:
          assetType:
            equals_string: Security
  BasketConstituent:
    description: Identifies the constituents of the basket
    attributes:
      observable:
        description: Specifies the object to be observed for a price, it could be an asset or a reference,
          within the context of a Basket
        range: Observable
        required: true
      quantity:
        description: Specifies a quantity schedule to be associated to an individual underlier that is
          a basket constituent. The multiple cardinality is aligned to the one of the PriceQuantity->quantity
          that this quantity is referencing.
        range: NonNegativeQuantitySchedule
        multivalued: true
        annotations:
          rosetta_metadata: address "pointsTo"=PriceQuantity->quantity
      initialValuationPrice:
        description: Specifies an initial price schedule to be associated to an individual underlier that
          is a basket constituent. The multiple cardinality is aligned to the one of the PriceQuantity->price
          that this price is referencing.
        range: PriceSchedule
        multivalued: true
        annotations:
          rosetta_metadata: address "pointsTo"=PriceQuantity->price
      interimValuationPrice:
        description: Specifies an interim price schedule to be associated to an individual underlier that
          is a basket constituent. The multiple cardinality is aligned to the one of the PriceQuantity->price
          that this price is referencing.
        range: PriceSchedule
        multivalued: true
        annotations:
          rosetta_metadata: address "pointsTo"=PriceQuantity->price
      finalValuationPrice:
        description: Specifies a final price schedule to be associated to an individual underlier that
          is a basket constituent. The multiple cardinality is aligned to the one of the PriceQuantity->price
          that this price is referencing.
        range: PriceSchedule
        multivalued: true
        annotations:
          rosetta_metadata: address "pointsTo"=PriceQuantity->price
    comments:
      - 'Rosetta condition BasketsOfBaskets is not stated in LinkML: observable as Basket is absent'
  CalculationAgent:
    description: A class defining the ISDA calculation agent responsible for performing duties as defined
      in the applicable product definitions.
    attributes:
      calculationAgentParty:
        description: Specifies the party which is the ISDA Calculation Agent for the trade. If more than
          one party is referenced then the parties are assumed to be co-calculation agents, i.e. they
          have joint responsibility.
        range: AncillaryRoleEnum
      calculationAgentPartyEnum:
        description: Specifies the ISDA calculation agent responsible for performing duties as defined
          in the applicable product definitions. For example, the Calculation Agent may be defined as
          being the Non-exercising Party.
        range: PartyDeterminationEnum
      calculationAgentBusinessCenter:
        description: The city in which the office through which ISDA Calculation Agent is acting for purposes
          of the transaction is located The short-form confirm for a trade that is executed under a Sovereign
          or Asia Pacific Master Confirmation Agreement ( MCA ), does not need to specify the Calculation
          Agent. However, the confirm does need to specify the Calculation Agent City. This is due to
          the fact that the MCA sets the value for Calculation Agent but does not set the value for Calculation
          Agent City.
        range: BusinessCenter
        annotations:
          rosetta_metadata: scheme
    all_of:
      - description: 'CalculationAgentChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              calculationAgentParty:
                value_presence: PRESENT
          - slot_conditions:
              calculationAgentPartyEnum:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  calculationAgentParty:
                    value_presence: ABSENT
              - slot_conditions:
                  calculationAgentPartyEnum:
                    value_presence: ABSENT
  CashCollateralValuationMethod:
    description: This type is a generic structure that can represent the parameters of several mid-market
      valuation and replacement value methods described in the 2021 ISDA Definitions.
    attributes:
      applicableCsa:
        description: This may be used to specify what type of CSA (credit support annex/agreement) is
          to be used for cash settlement purposes.
        range: CsaTypeEnum
      cashCollateralCurrency:
        description: This may be used to indicate the currency of cash collateral for cash settlement
          purposes.
        range: string
      cashCollateralInterestRate:
        description: This may be used to indicate the interest rate to be used for cash collateral for
          cash settlement purposes.
        range: string
        annotations:
          rosetta_metadata: scheme
      agreedDiscountRate:
        description: This may be used to indicate the discount rate to be used for cash collateral for
          cash settlement purposes.
        range: string
        annotations:
          rosetta_metadata: scheme
      protectedParty:
        description: This may be used to specify which party is protected (e.g. under Replacement Value
          cash settlement methods).
        range: PartyDeterminationEnum
        multivalued: true
        maximum_cardinality: 2
      prescribedDocumentationAdjustment:
        description: This may be used to indicate that 'prescribed documentation adjustment' is applicable.
        range: boolean
  CreditIndex:
    is_a: IndexBase
    description: Specification of an index based on credit risk, typically composed using corporate debt
      instruments in a region or industry sector, e.g. the iTraxx indices.
    attributes:
      indexSeries:
        description: A CDS index series identifier, e.g. 1, 2, 3 etc.
        range: integer
      indexAnnexVersion:
        description: A CDS index series version identifier, e.g. 1, 2, 3 etc.
        range: integer
      indexAnnexDate:
        description: A CDS index series annex date.
        range: date
      indexAnnexSource:
        description: A CDS index series annex source.
        range: IndexAnnexSourceEnum
        annotations:
          rosetta_metadata: scheme
      excludedReferenceEntity:
        description: Excluded reference entity.
        range: ReferenceInformation
        multivalued: true
      tranche:
        description: This element contains CDS tranche terms.
        range: Tranche
      settledEntityMatrix:
        description: Used to specify the Relevant Settled Entity Matrix when there are settled entities
          at the time of the trade.
        range: SettledEntityMatrix
      indexFactor:
        description: Index Factor is the index version factor or percent, expressed as an absolute decimal
          value between 0 and 1, that multiplied by the original notional amount yields the notional amount
          covered by the seller of protection.
        range: decimal
      seniority:
        description: Seniority of debt instruments comprising the index.
        range: CreditSeniorityEnum
    all_of:
      - description: 'From IndexBase. AssetType: Asset type must be Other.'
        slot_conditions:
          assetType:
            equals_string: Other
      - description: 'CreditAssetClass: The asset class must be Credit.'
        slot_conditions:
          assetClass:
            equals_string: Credit
            value_presence: PRESENT
    rules:
      - description: 'IndexSeries: FpML specifies the type associated to indexSeries as a positive integer.'
        preconditions:
          slot_conditions:
            indexSeries:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            indexSeries:
              minimum_value: 0
              value_presence: PRESENT
      - description: 'IndexAnnexVersion: FpML specifies the type associated to indexVersion as a positive
          integer.'
        preconditions:
          slot_conditions:
            indexAnnexVersion:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            indexAnnexVersion:
              minimum_value: 0
              value_presence: PRESENT
      - description: 'IndexFactor: Index factor is expressed as a decimal and should be a positive number
          between o and 1.'
        preconditions:
          slot_conditions:
            indexFactor:
              value_presence: PRESENT
        postconditions:
          all_of:
            - slot_conditions:
                indexFactor:
                  minimum_value: 0
                  value_presence: PRESENT
            - slot_conditions:
                indexFactor:
                  maximum_value: 1
                  value_presence: PRESENT
    annotations:
      rosetta_metadata: key
  CreditNotation:
    description: Represents a class to specify the credit notation as the combination of agency, notation,
      scale and debt type qualifications.
    attributes:
      agency:
        description: Specifies The credit agency to which the other variables (notation, scale, debt type)
          refer to.
        range: CreditRatingAgencyEnum
        required: true
      notation:
        description: Specifies The credit rating notation. As it varies among credit rating agencies,
          FpML doesn't specify a default scheme.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      scale:
        description: Specifies the credit rating scale, with a typical distinction between short term,
          long term. FpML doesn't specify a default scheme, which is hence not specified as an enumeration
          as part of the CDM.
        range: string
        annotations:
          rosetta_metadata: scheme
      debt:
        description: Specifies the credit rating debt type (e.g. long term, high yield, deposits, ...)
          associated with the credit rating notation and scale.
        range: CreditRatingDebt
      outlook:
        description: Assesses the potential direction of a long-term credit rating over the intermediate
          term, which is generally up to two years for investment grade and generally up to one year for
          speculative grade.
        range: CreditRatingOutlookEnum
      creditWatch:
        description: Indicates the potential direction of a short-term or long-term rating. It focuses
          on identifiable events and short-term trends that cause ratings to be placed under special surveillance.
        range: CreditRatingCreditWatchEnum
  CreditNotations:
    description: Represents the credit rating notation higher level construct, which provides the ability
      to specify multiple rating notations.
    attributes:
      creditNotation:
        description: Specifies only one credit notation is determined.
        range: CreditNotation
      creditNotations:
        description: Specifies if several credit notations exist, alongside an 'any' or 'all' or all condition.
        range: MultipleCreditNotations
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              creditNotation:
                value_presence: PRESENT
          - slot_conditions:
              creditNotations:
                value_presence: PRESENT
  CreditRatingDebt:
    description: Specifies the credit rating debt type(s) associated with the credit rating notation and
      scale. When several debt types are specified, they must be qualified through an 'any' or 'all'.
    attributes:
      debtType:
        description: Specifies when there is only one debt type. FpML doesn't specify values in relation
          to the associated scheme, which is hence not specified as an enumeration as part of the CDM.
        range: string
        annotations:
          rosetta_metadata: scheme
      debtTypes:
        description: Specifies if there are several debt types, alongside an 'any' or 'all' or all condition.
          As an example, Baa1 rating is required for any long term debt and deposit.
        range: MultipleDebtTypes
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              debtType:
                value_presence: PRESENT
          - slot_conditions:
              debtTypes:
                value_presence: PRESENT
  DividendApplicability:
    description: The parameters which define whether dividends are applicable
    attributes:
      optionsExchangeDividends:
        description: If present and true, then options exchange dividends are applicable.
        range: boolean
      additionalDividends:
        description: If present and true, then additional dividends are applicable.
        range: boolean
      allDividends:
        description: Represents the European Master Confirmation value of 'All Dividends' which, when
          applicable, signifies that, for a given Ex-Date, the daily observed Share Price for that day
          is adjusted (reduced) by the cash dividend and/or the cash value of any non cash dividend per
          Share (including Extraordinary Dividends) declared by the Issuer. All Dividends in accordance
          with the ISDA 2002 Equity Derivatives Definitions.
        range: boolean
  EquityIndex:
    is_a: IndexBase
    description: Specification of an index based on equity securities, e.g. the S&P 500.
    all_of:
      - description: 'From IndexBase. AssetType: Asset type must be Other.'
        slot_conditions:
          assetType:
            equals_string: Other
      - description: 'EquityAssetClass: The asset class must be Equity.'
        slot_conditions:
          assetClass:
            equals_string: Equity
            value_presence: PRESENT
  FallbackReferencePrice:
    description: The method, prioritised by the order it is listed in this element, to get a replacement
      rate for the disrupted settlement rate option.
    attributes:
      valuationPostponement:
        description: Specifies how long to wait to get a quote from a settlement rate option upon a price
          source disruption.
        range: ValuationPostponement
      fallBackSettlementRateOption:
        description: This settlement rate option will be used in its place.
        range: SettlementRateOptionEnum
        multivalued: true
        annotations:
          rosetta_metadata: scheme
      fallbackSurveyValuationPostponement:
        description: Request rate quotes from the market. This element is set as type Empty in FpML. When
          present, the FpML synonym is mapped to a value True in the CDM.
        range: boolean
      calculationAgentDetermination:
        description: The calculation agent will decide the rate.
        range: CalculationAgent
    comments:
      - 'Rosetta condition MaximumDaysOfPostponement is not stated in LinkML: if valuationPostponement
        exists then valuationPostponement -> maximumDaysOfPostponement > 0'
      - 'Rosetta condition FallbackCalculationAgent is not stated in LinkML: if calculationAgentDetermination
        -> calculationAgentParty exists then calculationAgentDetermination -> calculationAgentParty =
        AncillaryRoleEnum -> CalculationAgentFallback'
  ForeignExchangeRateIndex:
    is_a: IndexBase
    description: Specification of a rate based on the exchange of a pair of cash assets in specific currencies,
      e.g. USD versus GBP.
    attributes:
      quotedCurrencyPair:
        description: Describes the composition of a rate that has been quoted or is to be quoted.
        range: QuotedCurrencyPair
        required: true
        annotations:
          rosetta_metadata: location
      primaryFxSpotRateSource:
        description: Specifies the primary source from which a rate should be observed.
        range: InformationSource
        required: true
      secondaryFxSpotRateSource:
        description: Specifies an alternative, or secondary, source from which a rate should be observed.
        range: InformationSource
    all_of:
      - description: 'From IndexBase. AssetType: Asset type must be Other.'
        slot_conditions:
          assetType:
            equals_string: Other
      - description: 'FXAssetClass: The asset class must be Foreign Exchange.'
        slot_conditions:
          assetClass:
            equals_string: ForeignExchange
            value_presence: PRESENT
  FxInformationSource:
    is_a: InformationSource
    description: Information source specific to Foreign Exchange products.
    attributes:
      fixingTime:
        description: The time that the fixing will be taken along with a business center to define the
          time zone.
        range: BusinessCenterTime
  FxRate:
    description: 'A class describing the rate of a currency conversion: pair of currency, quotation mode
      and exchange rate.'
    attributes:
      quotedCurrencyPair:
        description: Defines the two currencies for an FX trade and the quotation relationship between
          the two currencies.
        range: QuotedCurrencyPair
        required: true
      rate:
        description: The rate of exchange between the two currencies of the leg of a deal. Must be specified
          with a quote basis.
        range: decimal
  FxRateSourceFixing:
    description: Describes a rate source to be fixed and the date the fixing occurs
    attributes:
      settlementRateSource:
        range: FxSettlementRateSource
        required: true
      fixingDate:
        description: The date on which the fixing is scheduled to occur.
        range: AdjustableDate
        required: true
  FxSettlementRateSource:
    description: The source of the Foreign Exchange settlement rate.
    attributes:
      settlementRateOption:
        description: Indicates that an officially defined rate settlement rate option will be the used
          for the fixing.
        range: string
        annotations:
          rosetta_metadata: scheme
      nonstandardSettlementRate:
        description: Indicates that a non-standard rate source will be used for the fixing.
        range: FxInformationSource
    all_of:
      - description: FxSettlementRateSourceChoice
        exactly_one_of:
          - slot_conditions:
              settlementRateOption:
                value_presence: PRESENT
          - slot_conditions:
              nonstandardSettlementRate:
                value_presence: PRESENT
  FxSpotRateSource:
    description: A class defining the rate source and fixing time for an FX rate.
    attributes:
      primarySource:
        description: The primary source for where the rate observation will occur. Will typically be either
          a page or a reference bank published rate.
        range: InformationSource
        required: true
      secondarySource:
        description: An alternative, or secondary, source for where the rate observation will occur. Will
          typically be either a page or a reference bank published rate.
        range: InformationSource
  Index:
    description: An Index is an Observable which is computed based on the prices, rates or valuations
      of a number of assets that are tracked in a standardized way. Examples include equity market indices
      as well as indices on interest rates, inflation and credit instruments.
    attributes:
      CreditIndex:
        description: An index based on credit risk, typically composed using corporate debt instruments
          in a region or industry sector, e.g. the iTraxx indices.
        range: CreditIndex
      EquityIndex:
        description: An index based on equity securities, e.g. the S&P 500.
        range: EquityIndex
      InterestRateIndex:
        description: An index based in interest rates or inflation rates in a certain market.
        range: InterestRateIndex
        annotations:
          rosetta_metadata: location
      ForeignExchangeRateIndex:
        description: A rate based on the exchange of a pair of cash assets in specific currencies, e.g.
          USD versus GBP.
        range: ForeignExchangeRateIndex
      OtherIndex:
        description: An index created by a market participant which doesn't align with the other index
          types.
        range: OtherIndex
    all_of:
      - description: 'OneOf: A choice type holds exactly one of its options.'
        exactly_one_of:
          - slot_conditions:
              CreditIndex:
                value_presence: PRESENT
          - slot_conditions:
              EquityIndex:
                value_presence: PRESENT
          - slot_conditions:
              InterestRateIndex:
                value_presence: PRESENT
          - slot_conditions:
              ForeignExchangeRateIndex:
                value_presence: PRESENT
          - slot_conditions:
              OtherIndex:
                value_presence: PRESENT
    annotations:
      rosetta_choice: 'true'
  IndexBase:
    is_a: AssetBase
    description: Identifies an index by referencing an identifier.
    slots:
      - name
    attributes:
      provider:
        description: The organisation that creates or maintains the Index.
        range: LegalEntity
      assetClass:
        description: The Asset Class of the Index.
        range: AssetClassEnum
    slot_usage:
      name:
        description: A description of the Index.
        range: string
        annotations:
          rosetta_metadata: scheme
    all_of:
      - description: 'AssetType: Asset type must be Other.'
        slot_conditions:
          assetType:
            equals_string: Other
  InflationIndex:
    is_a: IndexBase
    description: Specification of an index that measures inflation in a specific market, e.g. the US Consumer
      Price Index.
    attributes:
      inflationRateIndex:
        description: The reference index that is used to specify the inflation interest rate.
        range: InflationRateIndexEnum
        required: true
        annotations:
          rosetta_metadata: scheme
      indexTenor:
        description: The ISDA Designated Maturity, i.e. the floating rate tenor.
        range: Period
    all_of:
      - description: 'From IndexBase. AssetType: Asset type must be Other.'
        slot_conditions:
          assetType:
            equals_string: Other
      - description: 'InterestRateAssetClass: The asset class must be Interest Rate.'
        slot_conditions:
          assetClass:
            equals_string: InterestRate
            value_presence: PRESENT
  InformationSource:
    description: A class defining the source for a piece of information (e.g. a rate fix or an FX fixing).
      The attribute names have been adjusted from FpML to address the fact that the information is not
      limited to rates.
    attributes:
      sourceProvider:
        description: An information source for obtaining a market data point. For example Bloomberg, Reuters,
          Telerate, etc.
        range: InformationProviderEnum
        required: true
        annotations:
          rosetta_metadata: scheme
      sourcePage:
        description: A specific page for the source for obtaining a market data point. In FpML, this is
          specified as a scheme, rateSourcePageScheme, for which no coding Scheme or URI is specified.
        range: string
        annotations:
          rosetta_metadata: scheme
      sourcePageHeading:
        description: The heading for the source on a given source page.
        range: string
  InterestRateIndex:
    description: An index based in interest rates or inflation rates in a certain market.
    attributes:
      FloatingRateIndex:
        description: An interest rate index which can change over time, e.g. the SONIA (Sterling Overnight
          Index Average) in the UK.
        range: AssetFloatingRateIndex
      InflationIndex:
        description: An index that measures inflation in a specific market, e.g. the US Consumer Price
          Index.
        range: InflationIndex
    all_of:
      - description: 'OneOf: A choice type holds exactly one of its options.'
        exactly_one_of:
          - slot_conditions:
              FloatingRateIndex:
                value_presence: PRESENT
          - slot_conditions:
              InflationIndex:
                value_presence: PRESENT
    annotations:
      rosetta_choice: 'true'
  MakeWholeAmount:
    is_a: SwapCurveValuation
    description: A class to specify the amount to be paid by the buyer of the option if the option is
      exercised prior to the Early Call Date (typically applicable to the convertible bond options).
    attributes:
      interpolationMethod:
        description: The type of interpolation method that the calculation agent reserves the right to
          use.
        range: InterpolationMethodEnum
      earlyCallDate:
        description: Date prior to which the option buyer will have to pay a Make Whole Amount to the
          option seller if he/she exercises the option.
        range: date
        required: true
        annotations:
          rosetta_metadata: id
  Money:
    is_a: Quantity
    description: Defines a monetary amount in a specified currency.
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
    annotations:
      rosetta_metadata: key
    comments:
      - 'Rosetta condition CurrencyUnitExists is not stated in LinkML: unit -> currency exists'
  MultipleCreditNotations:
    description: Represetns a class to specify multiple credit notations alongside a conditional 'any'
      or 'all' qualifier.
    comments:
      - 'Rosetta condition QuantifierEnum is not stated in LinkML: (1 .. 1) creditNotation CreditNotation
        (2 .. *) [metadata scheme] mismatchResolution CreditNotationMismatchResolutionEnum (0 .. 1) referenceAgency
        CreditRatingAgencyEnum (0 .. 1)'
      - 'Rosetta condition ReferenceAgency is not stated in LinkML: if mismatchResolution = CreditNotationMismatchResolutionEnum
        -> ReferenceAgency then referenceAgency exists'
  MultipleDebtTypes:
    description: Represents a class to specify multiple credit debt types alongside a conditional 'any'
      or 'all' qualifier.
    comments:
      - 'Rosetta condition QuantifierEnum is not stated in LinkML: (1 .. 1) debtType string (2 .. *) [metadata
        scheme]'
  MultipleValuationDates:
    is_a: SingleValuationDate
    attributes:
      businessDaysThereafter:
        description: 'The number of business days between successive valuation dates when multiple valuation
          dates are applicable for cash settlement. ISDA 2003 Term: Business Days thereafter.'
        range: integer
      numberValuationDates:
        description: 'Where multiple valuation dates are specified as being applicable for cash settlement,
          this element specifies (a) the number of applicable valuation dates, and (b) the number of business
          days after satisfaction of all conditions to settlement when the first such valuation date occurs,
          and (c) the number of business days thereafter of each successive valuation date. ISDA 2003
          Term: Multiple Valuation Dates.'
        range: integer
    rules:
      - description: 'BusinessDaysThereafter: FpML specifies businessDaysThereafter as a PositiveInteger.'
        preconditions:
          slot_conditions:
            businessDaysThereafter:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            businessDaysThereafter:
              minimum_value: 0
              value_presence: PRESENT
      - description: 'NumberValuationDates: FpML specifies numberValuationDates as a PositiveInteger.'
        preconditions:
          slot_conditions:
            numberValuationDates:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            numberValuationDates:
              minimum_value: 0
              value_presence: PRESENT
  Observable:
    description: Specifies the object to be observed for a price, it could be an asset or a reference.
    attributes:
      Asset:
        description: The object to be observed is an Asset, ie something that can be owned and transferred
          in the financial markets.
        range: Asset
      Basket:
        description: The object to be observed is a Basket, ie a collection of Observables with an identifier
          and optional weightings.
        range: Basket
      Index:
        description: The object to be observed is an Index, ie an observable computed on the prices, rates
          or valuations of a number of assets.
        range: Index
    all_of:
      - description: 'OneOf: A choice type holds exactly one of its options.'
        exactly_one_of:
          - slot_conditions:
              Asset:
                value_presence: PRESENT
          - slot_conditions:
              Basket:
                value_presence: PRESENT
          - slot_conditions:
              Index:
                value_presence: PRESENT
    annotations:
      rosetta_choice: 'true'
  OtherIndex:
    is_a: IndexBase
    description: Specification of a user-defined index that does not meet the criteria of other Index
      data types.
    slots:
      - description
    slot_usage:
      description:
        description: A description that defines the OtherIndex.
        range: string
    all_of:
      - description: 'From IndexBase. AssetType: Asset type must be Other.'
        slot_conditions:
          assetType:
            equals_string: Other
      - description: 'AssetClassRequired: The asset class must be explicitly set.'
        slot_conditions:
          assetClass:
            value_presence: PRESENT
  PerformanceValuationDates:
    description: Defines how and when a performance type option or performance type swap is to be valued.
    attributes:
      determinationMethod:
        description: Specifies the method according to which an amount or a date is determined.
        range: DeterminationMethodEnum
        required: true
      valuationDates:
        description: '2018 ISDA CDM Equity Confirmation for Security Equity Swap: Pricing Date'
        range: AdjustableRelativeOrPeriodicDates
      valuationDate:
        description: '2018 ISDA CDM Equity Confirmation for Security Equity Swap: Pricing Date'
        range: AdjustableOrRelativeDate
      valuationTime:
        description: The specific time of day at which the calculation agent values the underlying. The
          SpecificTime is the only case when the valuationTime (time + business center location e.g. 10:00:00
          USNY) should be provided. You should be able to provide just the valuationTime without valuationTimeType,
          which infer that this is a specific time.
        range: BusinessCenterTime
      valuationTimeType:
        description: The time of day at which the calculation agent values the underlying, for example
          the official closing time of the exchange.
        range: TimeTypeEnum
    annotations:
      rosetta_metadata: key
  Price:
    is_a: PriceSchedule
    description: Specifies a price as a single value to be associated to a financial product. This data
      type extends PriceSchedule and requires that only the amount value exists.
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
      - description: 'From PriceSchedule. Choice: The price can be specified mutually exclusively as an
          operator (e.g. a spread or multiplier) or a composite.'
        exactly_one_of:
          - slot_conditions:
              arithmeticOperator:
                value_presence: PRESENT
          - slot_conditions:
              composite:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  arithmeticOperator:
                    value_presence: ABSENT
              - slot_conditions:
                  composite:
                    value_presence: ABSENT
      - description: 'AmountOnlyExists: The amount must exist when the price represents a single value,
          and steps must be absent.'
        slot_conditions:
          value:
            value_presence: PRESENT
          datedValue:
            value_presence: ABSENT
    none_of:
      - description: 'From PriceSchedule. ArithmeticOperator: Operator must not be subtract or divide.'
        slot_conditions:
          arithmeticOperator:
            equals_string: Subtract
            value_presence: PRESENT
      - description: 'From PriceSchedule. ArithmeticOperator: Operator must not be subtract or divide.'
        slot_conditions:
          arithmeticOperator:
            equals_string: Divide
            value_presence: PRESENT
  PriceComposite:
    description: Defines the inputs required to calculate a price as a simple composite of 2 other values.
      The inputs consist of 2 numbers and a simple arithmetic operator. This generic data type applies
      to a variety of use cases where a price is obtained by simple composition, e.g. dirty = clean +
      accrued (Bond), forward rate = spot rate + forward point (FX) etc.
    attributes:
      baseValue:
        description: 'The 1st value in the arithmetic operation, which may be non-commutative in some
          cases: Subtract, Divide). This 1st operand is called ''baseValue'' as it refers to the price
          anchor in the arithmetic operation: e.g. the clean price (Bond) or the spot rate (FX).'
        range: decimal
        required: true
      operand:
        description: 'The 2nd value in the arithmetic operation, which may be non-commutative in some
          cases: Subtract, Divide). The 2nd operand is called ''operand'' to distinguish it from the 1st
          one which is the price anchor.'
        range: decimal
        required: true
      arithmeticOperator:
        description: Specifies the arithmetic operator via an enumeration.
        range: ArithmeticOperationEnum
        required: true
      operandType:
        description: 'Optionally qualifies the type of operand: e.g. accrued or forward point.'
        range: PriceOperandEnum
    rules:
      - description: 'ArithmeticOperator: If operand type is accrued or forward point, then operator must
          be either add or subtract.'
        preconditions:
          any_of:
            - slot_conditions:
                operandType:
                  equals_string: ForwardPoint
                  value_presence: PRESENT
            - slot_conditions:
                operandType:
                  equals_string: AccruedInterest
                  value_presence: PRESENT
        postconditions:
          any_of:
            - slot_conditions:
                arithmeticOperator:
                  equals_string: Add
            - slot_conditions:
                arithmeticOperator:
                  equals_string: Subtract
  PriceQuantity:
    description: Defines a settlement as an exchange between two parties of a specified quantity of an
      asset (the quantity) against a specified quantity of another asset (the price). The settlement is
      optional and can be either cash or physical. The quantity can additionally be specified in terms
      of one or more currency amounts. In the case of non-cash products, the settlement of the price/quantity
      would not be specified here and instead would be delegated to the product mechanics, as parameterised
      by the price/quantity values.
    attributes:
      price:
        description: Specifies a price to be used for trade amounts and other purposes.
        range: PriceSchedule
        multivalued: true
        annotations:
          rosetta_metadata: location
      quantity:
        description: Specifies a quantity to be associated with an event, for example a trade amount.
        range: NonNegativeQuantitySchedule
        annotations:
          rosetta_metadata: location
      observable:
        description: Specifies the object to be observed for a price, it could be an asset or an index.
          The cardinality is optional as some quantity / price cases have no observable (e.g. a fixed
          rate in a given currency).
        range: Observable
        annotations:
          rosetta_metadata: location
      effectiveDate:
        description: Specifies the date at which the price and quantity become effective. This day may
          be subject to adjustment in accordance with a business day convention, or could be specified
          as relative to a trade date, for instance. Optional cardinality, as the effective date is usually
          specified in the product definition, so it may only need to be specified as part of the PriceQuantity
          in an increase/decrease scenario for an existing trade.
        range: AdjustableOrRelativeDate
    annotations:
      rosetta_metadata: key
    comments:
      - 'Rosetta condition NonCurrencyQuantities is not stated in LinkML: (quantity count - quantity ->
        unit -> currency count) <= 1 or (observable as Commodity exists and quantity -> unit -> capacityUnit
        exists and (quantity count - quantity -> unit -> currency count) <= 2)'
      - 'Rosetta condition ArithmeticOperator is not stated in LinkML: if observable as InterestRateIndex
        exists and price exists then price -> arithmeticOperator exists'
      - 'Rosetta condition InterestRateObservable is not stated in LinkML: InterestRateObservableCondition'
      - 'Rosetta condition PriceQuantityTriangulation is not stated in LinkML: PriceQuantityTriangulation
        (price, quantity) = True'
  PriceSchedule:
    is_a: MeasureBase
    description: 'Specifies the price of a financial instrument in a trade as a schedule of measures.
      A price generically expresses the value of an exchange as a ratio: it measures the amount of one
      thing needed to be exchanged for 1 unit of another thing (e.g. cash in a specific currency in exchange
      for a bond or share). This generic representation can be used to support any type of financial price
      beyond just cash price: e.g. an interest rate, a foreign exchange rate, etc. This data type is generically
      based on a schedule and can also be used to represent a price as a single value.'
    attributes:
      perUnitOf:
        description: Provides an attribute to define the unit of the thing being priced. For example,
          {amount, unitOfAmount, PerUnitOfAmount} = [10, EUR, Shares] = (10.00 EUR/SHARE) * (300,000 SHARES)
          = EUR 3,000,000.00 (Shares cancel out in the calculation).
        range: UnitType
      priceType:
        description: 'Specifies the price type as an enumeration: interest rate, exchange rate, asset
          price etc. This attribute is mandatory so that prices can always be clasiffied according to
          their type. The price type implies some constraints on the price''s units.'
        range: PriceTypeEnum
        required: true
      priceSubType:
        description: Allows further classification of the chosen price type.
        range: PriceSubTypeEnum
      priceExpression:
        description: (Optionally) Specifies whether the price is expressed in absolute or percentage terms.
        range: PriceExpressionEnum
      composite:
        description: '(Optionally) Specifies the underlying price components if the price can be expressed
          as a composite: e.g. dirty price = clean price + accrued.'
        range: PriceComposite
      arithmeticOperator:
        description: (Optionally) When the price is to be understood as an operator to apply to an observable,
          i.e. a spread, multiplier or min/max.
        range: ArithmeticOperationEnum
      premiumType:
        description: (Optionally) Additional attribute that can further define any premium to the price.
        range: PremiumTypeEnum
      derivedQuantity:
        description: Specifies the derived quantity associated with the price. For instance when the price
          is an asset price expressed in a currency, the primary quantity is the asset's quantity while
          the derived quantity is the corresponding monetary amount in that currency. When the price is
          an exchange rate, both the primary quantity and the derived quantity are monetary amounts, in
          the 2 currencies of the exchange rate.
        range: NonNegativeQuantitySchedule
    all_of:
      - description: 'From Schedule. ValueExists: A schedule may be specified as a single value or as
          a set of date-value pairs. Both attributes may be specified, in which case the single amount
          number is the initial value.'
        any_of:
          - slot_conditions:
              value:
                value_presence: PRESENT
          - slot_conditions:
              datedValue:
                value_presence: PRESENT
      - description: 'Choice: The price can be specified mutually exclusively as an operator (e.g. a spread
          or multiplier) or a composite.'
        exactly_one_of:
          - slot_conditions:
              arithmeticOperator:
                value_presence: PRESENT
          - slot_conditions:
              composite:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  arithmeticOperator:
                    value_presence: ABSENT
              - slot_conditions:
                  composite:
                    value_presence: ABSENT
    none_of:
      - description: 'ArithmeticOperator: Operator must not be subtract or divide.'
        slot_conditions:
          arithmeticOperator:
            equals_string: Subtract
            value_presence: PRESENT
      - description: 'ArithmeticOperator: Operator must not be subtract or divide.'
        slot_conditions:
          arithmeticOperator:
            equals_string: Divide
            value_presence: PRESENT
    rules:
      - description: 'UnitOfAmountExists: Requires that a unit of amount must be specified for price unless
          price type is Variance, Volatility or Correlation.'
        preconditions:
          any_of:
            - slot_conditions:
                priceType:
                  equals_string: Variance
            - slot_conditions:
                priceType:
                  equals_string: Volatility
            - slot_conditions:
                priceType:
                  equals_string: Correlation
        postconditions:
          slot_conditions:
            unit:
              value_presence: ABSENT
            perUnitOf:
              value_presence: ABSENT
        elseconditions:
          slot_conditions:
            unit:
              value_presence: PRESENT
            perUnitOf:
              value_presence: PRESENT
      - description: 'Premium: If we are applying a premium to the price then we must define this as a
          premium in priceType.'
        preconditions:
          slot_conditions:
            premiumType:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            priceType:
              equals_string: Premium
      - description: 'SpreadPrice: A spread type can only be specified when the price type is an asset
          price or an interest rate.'
        preconditions:
          slot_conditions:
            arithmeticOperator:
              equals_string: Add
              value_presence: PRESENT
        postconditions:
          any_of:
            - slot_conditions:
                priceType:
                  equals_string: AssetPrice
            - slot_conditions:
                priceType:
                  equals_string: InterestRate
      - description: 'InterestRateFeeType: If a lending fee or rebate fee is specified then the price
          type must be InterestRate.'
        preconditions:
          any_of:
            - slot_conditions:
                priceSubType:
                  equals_string: Fee
                  value_presence: PRESENT
            - slot_conditions:
                priceSubType:
                  equals_string: Rebate
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            priceType:
              equals_string: InterestRate
    comments:
      - 'Rosetta condition PositiveAssetPrice is not stated in LinkML: if (priceType = ExchangeRate or
        priceType = AssetPrice) and arithmeticOperator is absent then value > 0 or datedValue -> value
        all > 0'
      - 'Rosetta condition PositiveSpotRate is not stated in LinkML: if (priceType = ExchangeRate or priceType
        = AssetPrice) and composite -> baseValue exists then composite -> baseValue > 0'
      - 'Rosetta condition PositivePremium is not stated in LinkML: if priceType = Premium then value
        > 0'
      - 'Rosetta condition CurrencyUnitForInterestRate is not stated in LinkML: if priceType = PriceTypeEnum
        -> InterestRate then unit -> currency exists'
      - 'Rosetta condition ForwardPoint is not stated in LinkML: if composite -> operandType = ForwardPoint
        then priceType = ExchangeRate'
      - 'Rosetta condition AccruedInterest is not stated in LinkML: if composite -> operandType = AccruedInterest
        then priceType = AssetPrice'
      - 'Rosetta condition DerivedQuantityMultiplier is not stated in LinkML: derivedQuantity -> multiplier
        is absent'
      - 'Rosetta condition DerivedQuantityUnit is not stated in LinkML: if derivedQuantity exists and
        unit exists then derivedQuantity -> unit = unit'
      - 'Rosetta condition DerivedQuantityCurrency is not stated in LinkML: if derivedQuantity exists
        and unit is absent then derivedQuantity -> unit -> currency exists'
  PriceSourceDisruption:
    description: 'A data defining: the parameters used to get a price quote to replace the settlement
      rate option that is disrupted.'
    attributes:
      fallbackReferencePrice:
        description: The method, prioritised by the order it is listed in this element, to get a replacement
          rate for the disrupted settlement rate option.
        range: FallbackReferencePrice
        required: true
  QuotedCurrencyPair:
    description: A class that describes the composition of a rate that has been quoted or is to be quoted.
      This includes the two currencies and the quotation relationship between the two currencies and is
      used as a building block throughout the FX specification.
    attributes:
      currency1:
        description: The first currency specified when a pair of currencies is to be evaluated.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      currency2:
        description: The second currency specified when a pair of currencies is to be evaluated.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      quoteBasis:
        description: The method by which the exchange rate is quoted.
        range: QuoteBasisEnum
        required: true
  RateObservation:
    description: A class defining parameters associated with an individual observation or fixing. This
      class forms part of the cashflow representation of a stream.
    attributes:
      resetDate:
        description: The reset date.
        range: date
      adjustedFixingDate:
        description: The adjusted fixing date, i.e. the actual date the rate is observed. The date should
          already be adjusted for any applicable business day convention.
        range: date
      observedRate:
        description: The actual observed rate before any required rate treatment is applied, e.g. before
          converting a rate quoted on a discount basis to an equivalent yield. An observed rate of 5%
          would be represented as 0.05.
        range: decimal
      treatedRate:
        description: The observed rate after any required rate treatment is applied. A treated rate of
          5% would be represented as 0.05.
        range: decimal
      observationWeight:
        description: The number of days weighting to be associated with the rate observation, i.e. the
          number of days such rate is in effect. This is applicable in the case of a weighted average
          method of calculation where more than one reset date is established for a single calculation
          period.
        range: integer
      rateReference:
        description: A pointer style reference to a floating rate component defined as part of a stub
          calculation period amount component. It is only required when it is necessary to distinguish
          two rate observations for the same fixing date which could occur when linear interpolation of
          two different rates occurs for a stub calculation period.
        range: RateObservation
        annotations:
          rosetta_metadata: reference
      forecastRate:
        description: The value representing the forecast rate used to calculate the forecast future value
          of the accrual period.A value of 1% should be represented as 0.01.
        range: decimal
      treatedForecastRate:
        description: The value representing the forecast rate after applying rate treatment rules. A value
          of 1% should be represented as 0.01.
        range: decimal
    rules:
      - description: 'PositiveObservationWeight: FpML specifies observationWeight as a positive integer.'
        preconditions:
          slot_conditions:
            observationWeight:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            observationWeight:
              minimum_value: 0
              value_presence: PRESENT
    annotations:
      rosetta_metadata: key
  ReferenceSwapCurve:
    description: A complex type used to specify the option and convertible bond option strike when expressed
      in reference to a swap curve.
    attributes:
      swapUnwindValue:
        range: SwapCurveValuation
        required: true
      makeWholeAmount:
        description: Amount to be paid by the buyer of the option if the option is exercised prior to
          the Early Call Date. (The market practice in the convertible bond option space being that the
          buyer should be penalised if he/she exercises the option early on.)
        range: MakeWholeAmount
  SingleValuationDate:
    description: A class to specify the number of business days after satisfaction of all conditions to
      settlement.
    attributes:
      businessDays:
        description: 'A number of business days. Its precise meaning is dependant on the context in which
          this element is used. ISDA 2003 Term: Business Day.'
        range: integer
    rules:
      - description: 'NonNegativeBusinessDays: FpML specifies businessDays as a NonNegativeInteger.'
        preconditions:
          slot_conditions:
            businessDays:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            businessDays:
              minimum_value: 0
              value_presence: PRESENT
  SwapCurveValuation:
    description: A class to specify a valuation swap curve, which is used as part of the strike construct
      for the bond and convertible bond options.
    attributes:
      floatingRateIndex:
        range: FloatingRateIndexEnum
        required: true
      indexTenor:
        description: The ISDA Designated Maturity, i.e. the tenor of the floating rate.
        range: Period
      spread:
        description: Spread in basis points over the floating rate index.
        range: decimal
        required: true
      side:
        description: The side (bid/mid/ask) of the measure.
        range: QuotationSideEnum
  TransactedPrice:
    description: A class to represent the transacted price attributes that are positioned as part of the
      FpML FeeLeg.
    attributes:
      marketFixedRate:
        description: An optional element that only has meaning in a credit index trade. This element contains
          the credit spread ('fair value') at which the trade was executed. Unlike the fixedRate of an
          index, the marketFixedRate varies over the life of the index depending on market conditions.
          The marketFixedRate is the price of the index as quoted by trading desks.
        range: decimal
      initialPoints:
        description: An optional element that contains the up-front points expressed as a percentage of
          the notional. An initialPoints value of 5% would be represented as 0.05. The initialPoints element
          is an alternative to marketFixedRate in quoting the traded level of a trade. When initialPoints
          is used, the traded level is the sum of fixedRate and initialPoints. The initialPoints is one
          of the items that are factored into the initialPayment calculation and is payable by the Buyer
          to the Seller. Note that initialPoints and marketFixedRate may both be present in the same document
          when both implied values are desired.
        range: decimal
      marketPrice:
        description: An optional element that only has meaning in a credit index trade. This element contains
          the price at which the trade was executed and is used instead of marketFixedRate on credit trades
          on certain indicies which are quoted using a price rather than a spread.
        range: decimal
      quotationStyle:
        description: An optional element that contains the up-front points expressed as a percentage of
          the notional. An initialPoints value of 5% would be represented as 0.05. The initialPoints element
          is an alternative to marketFixedRate in quoting the traded level of a trade. When initialPoints
          is used, the traded level is the sum of fixedRate and initialPoints. The initialPoints is one
          of the items that are factored into the initialPayment calculation and is payable by the Buyer
          to the Seller. Note that initialPoints and marketFixedRate may both be present in the same document
          when both implied values are desired.
        range: QuotationStyleEnum
  ValuationDates:
    description: Defines how and when a performance type option or performance type swap is to be valued,
      including initial, interim and final valuation dates.
    attributes:
      initialValuationDate:
        description: Specifies the initial valuation dates of the underlyer.
        range: PerformanceValuationDates
      interimValuationDate:
        description: Specifies the interim valuation dates of the underlyer.
        range: PerformanceValuationDates
      finalValuationDate:
        description: Specifies the final valuation dates of the underlyer.
        range: PerformanceValuationDates
        required: true
  ValuationMethod:
    description: Specifies the parameters required to obtain a valuation, including the source, quotation
      method (bid, mid etc.) and any applicable quotation amount.
    attributes:
      valuationSource:
        description: The source for obtaining a valuation. This may come from some information source
          (e.g. Reuters), from a rate option fixing (e.g. FX fixing for cross-currency settlement), or
          from a set of reference banks. This is a mandatory attribute as the valuation method relies
          on one of those sources to be specified.
        range: ValuationSource
        required: true
      quotationMethod:
        description: 'The type of price quotations to be requested from dealers when determining the market
          value of the reference obligation for purposes of cash settlement, or which rate quote is to
          be observed for a fixing. For example, Bid, Offer, Mid-market or Exercising Party Pays. ISDA
          2003 Term: Quotation Method. The meaning of Exercising Party Pays is defined in the 2000 ISDA
          Definitions, Section 17.2. Certain Definitions Relating to Cash Settlement, paragraph (j).'
        range: QuotationRateTypeEnum
      valuationMethod:
        description: 'The ISDA defined methodology for determining the final price of the reference obligation
          for purposes of cash settlement. (ISDA 2003 Term: Valuation Method). For example, Market, Highest
          etc.'
        range: ValuationMethodEnum
      quotationAmount:
        description: 'In the determination of a cash settlement amount, if weighted average quotations
          are to be obtained, the quotation amount specifies an upper limit to the outstanding principal
          balance of the reference obligation for which the quote should be obtained. If not specified,
          the ISDA definitions provide for a fallback amount equal to the floating rate payer calculation
          amount. ISDA 2003 Term: Quotation Amount.'
        range: Money
      minimumQuotationAmount:
        description: 'In the determination of a cash settlement amount, if weighted average quotations
          are to be obtained, the minimum quotation amount specifies a minimum intended threshold amount
          of outstanding principal balance of the reference obligation for which the quote should be obtained.
          If not specified, the ISDA definitions provide for a fallback amount of the lower of either
          USD 1,000,000 (or its equivalent in the relevant obligation currency) or the quotation amount.
          ISDA 2003 Term: Minimum Quotation Amount.'
        range: Money
      cashCollateralValuationMethod:
        description: Specifies the parameters representing several mid-market valuation and replacement
          value methods.
        range: CashCollateralValuationMethod
    comments:
      - 'Rosetta condition FpML_cd_37 is not stated in LinkML: if (quotationAmount -> unit -> currency
        exists and minimumQuotationAmount -> unit -> currency exists) and quotationAmount -> unit -> currency
        = minimumQuotationAmount -> unit -> currency then quotationAmount -> value > minimumQuotationAmount
        -> value'
      - 'Rosetta condition Dealer is not stated in LinkML: if quotationAmount exists or minimumQuotationAmount
        exists then valuationSource -> dealerOrCCP -> legalEntity exists'
  ValuationPostponement:
    description: Specifies how long to wait to get a quote from a settlement rate option upon a price
      source disruption.
    attributes:
      maximumDaysOfPostponement:
        description: The maximum number of days to wait for a quote from the disrupted settlement rate
          option before proceeding to the next method.
        range: integer
        required: true
  ValuationSource:
    description: A class describing the method for obtaining a settlement rate, specified through either
      an information source (page), a settlement rate option (fixing) or by using quotes from reference
      banks.
    attributes:
      quotedCurrencyPair:
        description: Defines the two currencies for an FX trade and the quotation relationship between
          the two currencies. This attribute was formerly part of 'fxSettlementTerms', which is now being
          harmonised into a common 'CashSettlementTerms' that includes a 'ValuationDate'.
        range: QuotedCurrencyPair
        annotations:
          rosetta_metadata: address "pointsTo"=Observable->Index->ForeignExchangeRateIndex->quotedCurrencyPair
      informationSource:
        description: The information source where a published or displayed market rate will be obtained,
          e.g. Telerate Page 3750.
        range: FxSpotRateSource
      settlementRateOption:
        description: The rate option to use for the fixing. Currently only applicable to foreign exchange
          fixing in case of cross-currency settlement.
        range: AssetSettlementRateOption
      referenceBanks:
        description: A container for a set of reference institutions that may be called upon to provide
          rate quotations as part of the method to determine the applicable cash settlement amount. If
          institutions are not specified, it is assumed that reference institutions will be agreed between
          the parties on the exercise date, or in the case of swap transaction to which mandatory early
          termination is applicable, the cash settlement valuation date.
        range: ReferenceBanks
      dealerOrCCP:
        description: 'Holds an identifier for the reference entity that is agreed by both parties as a
          basis for cash settlement calculations. This could be a dealer from whom quotations are obtained
          by the calculation agent on the reference obligation for purposes of cash settlement in a credit
          event. ISDA 2003 Term: Dealer. This could be the clearing organization (CCP, DCO) to which the
          trade should be cleared, as applicable for cash-settled swaptions.'
        range: AncillaryEntity
    all_of:
      - description: 'InformationSource: An information source must be provided.'
        exactly_one_of:
          - slot_conditions:
              informationSource:
                value_presence: PRESENT
          - slot_conditions:
              settlementRateOption:
                value_presence: PRESENT
          - slot_conditions:
              referenceBanks:
                value_presence: PRESENT
          - slot_conditions:
              dealerOrCCP:
                value_presence: PRESENT
