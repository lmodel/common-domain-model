      PostPaid: {}
      Variable: {}
      Fixed: {}
  PriceExpressionEnum:
    description: Enumerated values to specify whether the price is expressed in absolute or relative terms.
    permissible_values:
      AbsoluteTerms:
        description: The price is expressed as an absolute amount.
      PercentageOfNotional:
        description: The price is expressed in percentage of the notional amount.
      ParValueFraction:
        description: Denotes a price expressed in percentage of face value with fractions which is used
          for quoting bonds, e.g. 101 3/8 indicates that the buyer will pay 101.375 of the face value.
      PerOption:
        description: Denotes a price expressed per number of options.
  PriceOperandEnum:
    permissible_values:
      AccruedInterest: {}
      Commission: {}
      ForwardPoint: {}
  PriceSubTypeEnum:
    description: Provides a list of possible sub types of the chosen price type, used in conjunction with
      the PriceTypeEnum.
    permissible_values:
      Fee:
        description: The lending fee associated with borrowing a security.
      Rebate:
        description: Denotes any rebate that is attributed to the cashflow. For example, where a lender
          will provide a rebate on the cash given to them by the borrower as collateral on a securities
          lending trade.
  PriceTypeEnum:
    description: Provides enumerated values for types of prices in the Price data type in order to explain
      how to interpret the amount and use it in calculations.
    permissible_values:
      AssetPrice:
        description: Denotes a price expressed as a cash amount in a given currency to purchase a unit
          of an asset (e.g. a security or a commodity).
      Premium:
        description: Denotes the amount payable by the buyer to the seller for an option. The premium
          is paid on the specified premium payment date or on each premium payment date if specified.
      Correlation:
        description: Denotes a price expressed as the weighted average of all pairwise correlation coefficients.
      Dividend:
        description: Denotes a price expressed as the dividend payment from a index or share.
      ExchangeRate:
        description: Denotes a rate to convert one currency or other measure of value to another. Foreign
          Exchange rates are represented in decimals, e.g. {amount, unitOfAmount, PerUnitOfAmount} = [1.23,
          USD, GBP] = USD 1.23 for every 1 GBP.
      InterestRate:
        description: Denotes a price expressed as a rate to be applied to quantity/notional amount and
          represented as decimal, e.g. {amount, unitOfAmount, PerUnitOfAmount} = [0.08, EUR, EUR] = 8%
          of the EUR notional quantity/amount or 8 cents for every EUR of notional amount.
        annotations:
          doc_reference: ICMA GMRA namingConvention Pricing Rate | ICMA ERCCBestPractice namingConvention
            Pricing Rate
      Variance:
        description: Denotes a price expressed as the the arithmetic average of the squared differences
          from the mean value of an observable price.
      Volatility:
        description: Denotes a price expressed as the the square root of the arithmetic average of the
          squared differences from the mean value of an observable price.
  QuotationRateTypeEnum:
    description: The enumerated values to specify the type of quotation rate to be obtained from each
      cash settlement reference bank.
    permissible_values:
      Bid:
        description: A bid rate.
      Ask:
        description: An ask rate.
      Mid:
        description: A mid-market rate.
      ExercisingPartyPays:
        description: If optional early termination is applicable to a swap transaction, the rate, which
          may be a bid or ask rate, which would result, if seller is in-the-money, in the higher absolute
          value of the cash settlement amount, or, is seller is out-of-the-money, in the lower absolute
          value of the cash settlement amount.
  QuotationSideEnum:
    description: The enumerated values to specify the side from which perspective a value is quoted.
    permissible_values:
      Afternoon:
        description: Denotes a value as the Afternoon fixing reported in or by the relevant Price Source
          as specified in the relevant Confirmation.
      Ask:
        description: Denotes a value 'asked' by a seller for an asset, i.e. the value at which a seller
          is willing to sell.
      Bid:
        description: Denotes a value 'bid' by a buyer for an asset, i.e. the value a buyer is willing
          to pay.
      Closing:
        description: Denotes a value as the Closing price reported in or by the relevant Price Source
          as specified in the relevant Confirmation.
      High:
        description: Denotes a value as the High price reported in or by the relevant Price Source as
          specified in the relevant Confirmation.
      Index:
        description: Denotes a value as the Index price reported in or by the relevant Price Source as
          specified in the relevant Confirmation.
      MeanOfBidAndAsk:
        description: Denotes a value as the Average of the Bid and Ask prices reported in or by the relevant
          Price Source as specified in the relevant Confirmation.
      LocationalMarginal:
        description: Denotes a value as the Locational Marginal price reported in or by the relevant Price
          Source as specified in the relevant Confirmation.
      Low:
        description: Denotes a value as the Low price reported in or by the relevant Price Source as specified
          in the relevant Confirmation.
      MarginalHourly:
        description: Denotes a value as the Marginal Hourly price reported in or by the relevant Price
          Source as specified in the relevant Confirmation.
      MarketClearing:
        description: Denotes a value as the Market Clearing price reported in or by the relevant Price
          Source as specified in the relevant Confirmation.
      MeanOfHighAndLow:
        description: Denotes a value as the Average of the High and Low prices reported in or by the relevant
          Price Source as specified in the relevant Confirmation.
      Morning:
        description: Denotes a value as the Morning fixing reported in or by the relevant Price Source
          as specified in the relevant Confirmation.
      Official:
        description: Denotes a value as the Official price reported in or by the relevant Price Source
          as specified in the relevant Confirmation.
      Opening:
        description: Denotes a value as the Opening price reported in or by the relevant Price Source
          as specified in the relevant Confirmation.
      OSP:
        description: Denotes a value as the Official Settlement Price reported in or by the relevant Price
          Source as specified in the relevant Confirmation.
      Settlement:
        description: Denotes a value as the Settlement price reported in or by the relevant Price Source
          as specified in the relevant Confirmation.
      Spot:
        description: Denotes a value as the Spot price reported in or by the relevant Price Source as
          specified in the relevant Confirmation.
      Mid:
        description: Denotes a value as the Average of the Midpoint of prices reported in or by the relevant
          Price Source as specified in the relevant Confirmation.
      NationalSingle:
        description: Denotes a value as the National Single price reported in or by the relevant Price
          Source as specified in the relevant Confirmation.
      WeightedAverage:
        description: Denotes a value as the Volume Weighted Average of prices effective on the Pricing
          Date.
      UnWeightedAverage:
        description: Denotes a value as the Non-volume Weighted Average of prices effective on the Pricing
          Date.
  QuotationStyleEnum:
    description: The enumerated values to specify the actual quotation style (e.g. PointsUpFront, TradedSpread)
      used to quote a credit default swap fee leg.
    permissible_values:
      PointsUpFront:
        description: When quotation style is 'PointsUpFront', the initialPoints element of the Credit
          Default Swap feeLeg should be populated
      TradedSpread:
        description: When quotation style is 'TradedSpread', the marketFixedRate element of the Credit
          Default Swap feeLeg should be populated
      Price:
        description: When quotation style is 'Price', the marketPrice element of the Credit Default Swap
          feeLeg should be populated
  QuoteBasisEnum:
    description: The enumerated values to specify how an exchange rate is quoted.
    permissible_values:
      Currency1PerCurrency2:
        description: The amount of currency1 for one unit of currency2
      Currency2PerCurrency1:
        description: The amount of currency2 for one unit of currency1
  SettlementRateOptionEnum:
    description: The enumerated values to specify the settlement rate options as specified in the Annex
      A to the 1998 FX and Currency Options Definitions.
    permissible_values:
      ARS.BNAR/ARS01:
        description: The Spot Rate for a Rate Calculation Date will be the Argentine Peso/U.S. Dollar
          Specified Rate, expressed as the amount of Argentine Pesos per one U.S. Dollar, for settlement
          on the same day (or, if such day is not a Business Day in New York, for settlement on the first
          succeeding day that is a Business Day in both Buenos Aires and New York) which appears on the
          Reuters Screen BNAR Page at the close of business in Buenos Aires on that Rate Calculation Date.
        aliases:
          - ARS_BNAR_ARS01
      ARS.EMTA.INDICATIVE.SURVEY.RATE/ARS04:
        description: The Spot Rate for a Rate Calculation Date will be the Argentine Peso/U.S. Dollar
          Specified Rate for U.S. Dollars, expressed as the amount of Argentine Pesos per one U.S. Dollar,
          for settlement on the same day, as published on EMTA's web site (www.emta.org) at approximately
          1:00 p.m. (Buenos Aires time), or as soon thereafter as practicable, on such Rate Calculation
          Date. The Spot Rate shall be calculated by EMTA (or a service provider EMTA may select in its
          sole discretion) pursuant to the EMTA ARS Indicative Survey Methodology (which means a methodology,
          dated as of January 2, 2003, as amended from time to time, for a centralized industry-wide survey
          of financial institutions that are active participants in the Argentine Peso/U.S. Dollar markets
          for the purpose of determining the EMTA ARS Indicative Survey Rate).
        aliases:
          - ARS_EMTA_INDICATIVE_SURVEY_RATE_ARS04
      ARS.EMTA.INDUSTRY.SURVEY.RATE/ARS03:
        description: The Spot Rate for a Rate Calculation Date will be the Argentine Peso/U.S. Dollar
          Specified Rate for U.S. Dollars, expressed as the amount of Argentine Pesos per one U.S. Dollar,
          for settlement on the same day, as published on EMTA's web site (www.emta.org) at approximately
          1:00 p.m. (Buenos Aires time), or as soon thereafter as practicable, on such Rate Calculation
          Date. The Spot Rate shall be calculated by EMTA (or a service provider EMTA may select in its
          sole discretion) pursuant to the EMTA ARS Industry Survey Methodology (which means a methodology,
          dated as of January 2, 2003, as amended from time to time, for a centralized industry-wide survey
          of financial institutions in Buenos Aires that are active participants in the Argentine Peso/U.S.
          Dollar spot markets for the purpose of determining the EMTA ARS Industry Survey Rate).
        aliases:
          - ARS_EMTA_INDUSTRY_SURVEY_RATE_ARS03
      ARS.MAE/ARS05:
        description: The Spot Rate for a Rate Calculation Date will be the volume weighted average Argentine
          Peso/U.S. Dollar Rate of all trades executed in the electronic market for a Rate Calculation
          Day expressed as the amount of Argentine Pesos per one U.S. Dollar, for settlement on the same
          day, reported by the Mercado Abierto Electronico (the 'MAE') at approximately 3:00 pm, Buenos
          Aires time, and published on the FOREX-MAE Page as the 'PPN' rate ('Promedio Ponderado Noticiado')
          on www.mae.com.ar on that Rate Calculation Date.
        aliases:
          - ARS_MAE_ARS05
      ARS.OFFICIAL.RATE/ARS02:
        description: The Spot Rate for a Rate Calculation Date will be the Argentine Peso/U.S. Dollar
          offered rate for U.S. Dollars, expressed as the amount of Argentine Pesos per one U.S. Dollar,
          for settlement on the same day quoted by Banco de la Nacion (in accordance with the Convertibility
          Law of March 27, 1991 and Regulatory Decree No. 529/91 of April 1, 1991, as may be amended from
          time to time) for that Rate Calculation Date.
        aliases:
          - ARS_OFFICIAL_RATE_ARS02
      BRL.BRBY/BRL01:
        description: The Spot Rate for a Rate Calculation Date will be the Brazilian Real/U.S. Dollar
          Specified Rate, expressed as the amount of Brazilian Reais per one U.S. Dollar, for settlement
          in two Business Days (where such days are Business Days in both Sao Paulo and New York) which
          appears on the Reuters Screen BRBY Page under the caption 'INTBK FLTING (LAST)' at approximately
          11:00 a.m., Sao Paulo time, on that Rate Calculation Date.
        aliases:
          - BRL_BRBY_BRL01
      BRL.EMTA.INDICATIVE.SURVEY.RATE/BRL13:
        description: The Spot Rate for a Rate Calculation Date will be the Brazilian Real/U.S. Dollar
          Specified Rate for U.S. Dollars, expressed as the amount of Brazilian Reais per one U.S. Dollar,
          for settlement in two Business Days, as published on EMTA's web site (www.emta.org) at approximately
          12:00 p.m. (Sao Paulo time), or as soon thereafter as practicable, on such Rate Calculation
          Date. The Spot Rate shall be calculated by EMTA (or a service provider EMTA may select in its
          sole discretion) pursuant to the EMTA BRL Indicative Survey Methodology (which means a methodology,
          dated as of March 1, 2004, as amended from time to time, for a centralized industry-wide survey
          of financial institutions that are active participants in the Brazilian Real/U.S. Dollar markets
          for the purpose of determining the EMTA BRL Indicative Survey Rate).
        aliases:
          - BRL_EMTA_INDICATIVE_SURVEY_RATE_BRL13
      BRL.EMTA.INDUSTRY.SURVEY.RATE/BRL12:
        description: The Spot Rate for a Rate Calculation Date will be the Brazilian Real/U.S. Dollar
          Specified Rate for U.S. Dollars, expressed as the amount of Brazilian Reais per one U.S. Dollar,
          for settlement in two Business Days, as published on EMTA's web site (www.emta.org) at approximately
          3:45 p.m. (Sao Paulo time), or as soon thereafter as practicable, on such Rate Calculation Date.
          The Spot Rate shall be calculated by EMTA (or a service provider EMTA may select in its sole
          discretion) pursuant to the EMTA BRL Industry Survey Methodology (which means a methodology,
          dated as of March 1, 2004, as amended from time to time, for a centralized industry-wide survey
          of financial institutions in Brazil that are active participants in the Brazilian Real/U.S.
          Dollar spot markets for the purpose of determining the EMTA BRL Industry Survey Rate).
        aliases:
          - BRL_EMTA_INDUSTRY_SURVEY_RATE_BRL12
      BRL.OFFICIAL.RATE/BRL02:
        description: The Spot Rate for a Rate Calculation Date will be the Brazilian Real/U.S. Dollar
