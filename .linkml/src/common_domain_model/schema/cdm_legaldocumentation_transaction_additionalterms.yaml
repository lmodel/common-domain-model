          doc_reference: ISDA FXandCurrencyOptionsDefintions_1998 section 5.2.(c) paragraph (vii)
      LocalCurrencySubstitute:
        annotations:
          doc_reference: ISDA FXandCurrencyOptionsDefintions_1998 section 5.2.(c) paragraph (viii)
    annotations:
      doc_reference: ISDA FXandCurrencyOptionsDefintions_1998 section 5.2.(c)
  SpecifiedValueEnum:
    permissible_values:
      OutstandingPrincipalBalance: {}
      StatedPrincipalBalance: {}
      FaceValue: {}
      MarketValue: {}
    annotations:
