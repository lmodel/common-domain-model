classes:
  AdjustableDate:
    description: A class for defining a date that shall be subject to adjustment if it would otherwise
      fall on a day that is not a business day in the specified business centers, together with the convention
      for adjusting the date.
    attributes:
      unadjustedDate:
        description: A date subject to adjustment. While in FpML this date is required, this cardinality
          constraint has been relaxed as part of the CDM in order to support the FRA representation, which
          effective and termination dates are specified in FpML as adjusted dates.
        range: date
      dateAdjustments:
        description: The business day convention and financial business centers used for adjusting the
          date if it would otherwise fall on a day that is not a business date in the specified business
          centers.
        range: BusinessDayAdjustments
      dateAdjustmentsReference:
        description: A pointer style reference to date adjustments defined elsewhere in the document.
        range: BusinessDayAdjustments
        annotations:
          rosetta_metadata: reference
      adjustedDate:
        description: The date once the adjustment has been performed. (Note that this date may change
          if the business center holidays change).
        range: date
        annotations:
          rosetta_metadata: id
    all_of:
      - description: 'AdjustableDateChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              dateAdjustments:
                value_presence: PRESENT
          - slot_conditions:
              dateAdjustmentsReference:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  dateAdjustments:
                    value_presence: ABSENT
              - slot_conditions:
                  dateAdjustmentsReference:
                    value_presence: ABSENT
    annotations:
      rosetta_metadata: key
  AdjustableDates:
    description: A class for defining a series of dates that shall be subject to adjustment if they would
      otherwise fall on a day that is not a business day in the specified business centers, together with
      the convention for adjusting the dates.
    attributes:
      unadjustedDate:
        description: A date subject to adjustment.
        range: date
        multivalued: true
      dateAdjustments:
        description: The business day convention and financial business centers used for adjusting the
          date if it would otherwise fall on a day that is not a business date in the specified business
          centers.
        range: BusinessDayAdjustments
      adjustedDate:
        description: The date(s) once the adjustment has been performed. (Note that this date may change
          if the business center holidays change).
        range: date
        multivalued: true
        annotations:
          rosetta_metadata: id
    rules:
      - description: 'AdjustedDate: FpML specifies a choice between adjustedDate and [unadjustedDate (required),
          dateAdjutsments (required), adjustedDate (optional)].'
        preconditions:
          slot_conditions:
            adjustedDate:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            unadjustedDate:
              value_presence: PRESENT
            dateAdjustments:
              value_presence: PRESENT
    annotations:
      rosetta_metadata: key
  AdjustableOrAdjustedDate:
    description: A class for defining a date that shall be subject to adjustment if it would otherwise
      fall on a day that is not a business day in the specified business centers, together with the convention
      for adjusting the date.
    attributes:
      unadjustedDate:
        description: A date subject to adjustment.
        range: date
      dateAdjustments:
        description: The business day convention and financial business centers used for adjusting the
          date if it would otherwise fall on a day that is not a business date in the specified business
          centers.
        range: BusinessDayAdjustments
      adjustedDate:
        description: The date once the adjustment has been performed. (Note that this date may change
          if the business center holidays change).
        range: date
        annotations:
          rosetta_metadata: id
    rules:
      - description: 'AdjustedDate: FpML specifies a choice between adjustedDate and [unadjustedDate (required),
          dateAdjutsments (required), adjustedDate (optional)].'
        preconditions:
          slot_conditions:
            adjustedDate:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            unadjustedDate:
              value_presence: PRESENT
            dateAdjustments:
              value_presence: PRESENT
    annotations:
      rosetta_metadata: key
  AdjustableOrAdjustedOrRelativeDate:
    description: This Rosetta class specifies the date as either an unadjusted, adjusted or relative date.
      It supplements the features of the AdjustableOrAdjustedDate to support the credit default swap option
      premium, which uses the relative date construct.
    attributes:
      unadjustedDate:
        description: A date subject to adjustment.
        range: date
      dateAdjustments:
        description: The business day convention and financial business centers used for adjusting the
          date if it would otherwise fall on a day that is not a business date in the specified business
          centers.
        range: BusinessDayAdjustments
      adjustedDate:
        description: The date once the adjustment has been performed. (Note that this date may change
          if the business center holidays change).
        range: date
        annotations:
          rosetta_metadata: id
      relativeDate:
        description: A date specified as some offset to another date (the anchor date).
        range: RelativeDateOffset
    all_of:
      - description: 'AdjustedDate: This data rule extends the data rule AdjustableOrAdjustedDate_adjustedDate
          by specifying logic applicable to the relative date.'
        any_of:
          - slot_conditions:
              adjustedDate:
                value_presence: PRESENT
          - slot_conditions:
              relativeDate:
                value_presence: PRESENT
          - slot_conditions:
              unadjustedDate:
                value_presence: PRESENT
          - slot_conditions:
              unadjustedDate:
                value_presence: PRESENT
              dateAdjustments:
                value_presence: PRESENT
              adjustedDate:
                value_presence: ABSENT
  AdjustableOrRelativeDate:
    description: A class giving the choice between defining a date as an explicit date together with applicable
      adjustments or as relative to some other (anchor) date.
    attributes:
      adjustableDate:
        description: A date that shall be subject to adjustment if it would otherwise fall on a day that
          is not a business day in the specified business centers, together with the convention for adjusting
          the date.
        range: AdjustableDate
      relativeDate:
        description: A date specified as some offset to another date (the anchor date).
        range: AdjustedRelativeDateOffset
    all_of:
      - description: 'AdjustableOrRelativeDateChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              adjustableDate:
                value_presence: PRESENT
          - slot_conditions:
              relativeDate:
                value_presence: PRESENT
    annotations:
      rosetta_metadata: key
  AdjustableOrRelativeDates:
    description: A class giving the choice between defining a series of dates as an explicit list of dates
      together with applicable adjustments or as relative to some other series of (anchor) dates.
    attributes:
      adjustableDates:
        description: A series of dates that shall be subject to adjustment if they would otherwise fall
          on a day that is not a business day in the specified business centers, together with the convention
          for adjusting the date.
        range: AdjustableDates
      relativeDates:
        description: A series of dates specified as some offset to another series of dates (the anchor
          dates).
        range: RelativeDates
    all_of:
      - description: 'AdjustableOrRelativeDatesChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              adjustableDates:
                value_presence: PRESENT
          - slot_conditions:
              relativeDates:
                value_presence: PRESENT
    annotations:
      rosetta_metadata: key
  AdjustableRelativeOrPeriodicDates:
    description: A class giving the choice between defining a series of dates as an explicit list of dates
      together with applicable adjustments or as relative to some other series of (anchor) dates, or as
      a calculation period schedule.
    attributes:
      adjustableDates:
        description: A series of dates that shall be subject to adjustment if they would otherwise fall
          on a day that is not a business day in the specified business centers, together with the convention
          for adjusting the date.
        range: AdjustableDates
      relativeDates:
        description: A series of dates specified as some offset to another series of dates (the anchor
          dates).
        range: RelativeDates
      periodicDates:
        description: A calculation period schedule.
        range: PeriodicDates
    all_of:
      - description: 'AdjustableRelativeOrPeriodicDatesChoice: Choice rule to represent an FpML choice
          construct.'
        exactly_one_of:
          - slot_conditions:
              adjustableDates:
                value_presence: PRESENT
          - slot_conditions:
              relativeDates:
                value_presence: PRESENT
          - slot_conditions:
              periodicDates:
                value_presence: PRESENT
    annotations:
      rosetta_metadata: key
  AdjustedRelativeDateOffset:
    is_a: RelativeDateOffset
    description: A type defining a date (referred to as the derived date) as a relative offset from another
      date (referred to as the anchor date) plus optional date adjustments.
    attributes:
      relativeDateAdjustments:
        description: The business day convention and financial business centers used for adjusting the
          relative date if it would otherwise fall on a day that is not a business date in the specified
          business centers.
        range: BusinessDayAdjustments
    rules:
      - description: 'From Period. DayPeriod: FpML specifies that if the periodMultiplier value is 0 (zero)
          then period must contain the value D (day).'
        preconditions:
          slot_conditions:
            periodMultiplier:
              equals_number: 0
        postconditions:
          slot_conditions:
            period:
              equals_string: D
  AveragingSchedule:
    description: Class to representing a method for generating a series of dates.
    attributes:
      startDate:
        description: Date on which this period begins.
        range: date
        required: true
      endDate:
        description: Date on which this period ends.
        range: date
        required: true
      averagingPeriodFrequency:
        description: The frequency at which averaging period occurs with the regular part of the valuation
          schedule and their roll date convention.
        range: CalculationPeriodFrequency
        required: true
  BusinessCenterTime:
    description: A class for defining a time with respect to a business day calendar location. For example,
      11:00:00 GBLO.
    attributes:
      hourMinuteTime:
        description: A time specified in hh:mm:ss format where the second component must be '00', e.g.
          11am would be represented as 11:00:00.
        range: time
        required: true
      businessCenter:
        description: A code identifying a business day calendar location. A business day calendar location
          is drawn from the list identified by the business day calendar location enumeration.
        range: BusinessCenter
        required: true
        annotations:
          rosetta_metadata: scheme
  BusinessCenters:
    description: A class for specifying the business day calendar location used in determining whether
      a day is a business day or not, either by specifying this business center by reference to an enumerated
      list that is maintained by the FpML standard, or by reference to such specification when it exists
      elsewhere as part of the instance document. This class corresponds to the FpML BusinessCentersOrReference.model.
    attributes:
      businessCenter:
        description: A code identifying one or several business day calendar location(s). The set of business
          day calendar locations are specified by the business day calendar location enumeration which
          is maintained by the FpML standard.
        range: BusinessCenter
        multivalued: true
        annotations:
          rosetta_metadata: scheme
      commodityBusinessCalendar:
        range: CommodityBusinessCalendarEnum
        multivalued: true
        annotations:
          rosetta_metadata: scheme
      businessCentersReference:
        description: A reference to a financial business center location specified elsewhere in the instance
          document.
        range: BusinessCenters
        annotations:
          rosetta_metadata: reference
    all_of:
      - description: 'BusinessCentersChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              businessCenter:
                value_presence: PRESENT
          - slot_conditions:
              businessCentersReference:
                value_presence: PRESENT
          - slot_conditions:
              commodityBusinessCalendar:
                value_presence: PRESENT
    annotations:
      rosetta_metadata: key
  BusinessDateRange:
    is_a: DateRange
    description: A class defining a range of contiguous business days by defining an unadjusted first
      date, an unadjusted last date and a business day convention and business centers for adjusting the
      first and last dates if they would otherwise fall on a non business day in the specified business
      centers. The days between the first and last date must also be good business days in the specified
      centers to be counted in the range.
    attributes:
      businessDayConvention:
        description: The convention for adjusting a date if it would otherwise fall on a day that is not
          a business day, as specified by an ISDA convention (e.g. Following, Precedent).
        range: BusinessDayConventionEnum
        required: true
      businessCenters:
        description: The business center(s), specified either explicitly or by reference to those specified
          somewhere else in the instance document.
        range: BusinessCenters
  BusinessDayAdjustments:
    description: A class defining the business day convention and financial business centers used for
      adjusting any relevant date if it would otherwise fall on a day that is not a business day in the
      specified business center.
    attributes:
      businessDayConvention:
        description: The convention for adjusting a date if it would otherwise fall on a day that is not
          a business day.
        range: BusinessDayConventionEnum
        required: true
      businessCenters:
        description: The business center(s), specified either explicitly or by reference to those specified
          somewhere else in the instance document.
        range: BusinessCenters
    annotations:
      rosetta_metadata: key
  CalculationFrequency:
    description: Represents the parameters for describing how often something (such as collateral interest)
      is to be calculated.
    attributes:
      period:
        description: Specifies the time period at which calculation is performed, e.g. 1 month.
        range: Period
        required: true
      monthOfYear:
        description: Specifies the month of the year if used.
        range: decimal
      dayOfMonth:
        description: Specifies the day of the month if used.
        range: decimal
      dayOfWeek:
        description: Specifies the day of the week if used.
        range: DayOfWeekEnum
      weekOfMonth:
        description: Specifies the week of the month if used.
        range: decimal
      offsetDays:
        description: Specifies how many days from the trigger event should the payment occur.
        range: decimal
        required: true
      dateLocation:
        description: Specifies where is the time measured.
        range: BusinessCenterTime
        required: true
      businessCenter:
        description: Specifies the business center for adjustment of calculation period.
        range: BusinessCenter
        multivalued: true
    rules:
      - description: Moy
        preconditions:
          slot_conditions:
            monthOfYear:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            monthOfYear:
              maximum_value: 12
      - description: Dom
        preconditions:
          slot_conditions:
            dayOfMonth:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            dayOfMonth:
              maximum_value: 31
      - description: Wom
        preconditions:
          slot_conditions:
            weekOfMonth:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            weekOfMonth:
              maximum_value: 5
    comments:
      - 'Rosetta condition MoyTerm is not stated in LinkML: if monthOfYear exists then (period -> period
        = PeriodEnum -> Y)'
      - 'Rosetta condition DomTerm is not stated in LinkML: if dayOfMonth exists then (period -> period
        = PeriodEnum -> M)'
      - 'Rosetta condition DowTerm is not stated in LinkML: if dayOfWeek exists then (period -> period
        = PeriodEnum -> W)'
      - 'Rosetta condition WomTerm is not stated in LinkML: if weekOfMonth exists then (period -> period
        = PeriodEnum -> M)'
  CalculationPeriodFrequency:
    is_a: Frequency
    description: A class to specify the frequency at which calculation period end dates occur within the
      regular part of the calculation period schedule and their roll date convention.
    attributes:
      rollConvention:
        description: The roll convention specifies the period term as part of a periodic schedule, i.e.
          the calculation period end date within the regular part of the calculation period. The value
          could be a rule, e.g. IMM Settlement Dates, which is the 3rd Wednesday of the month, or it could
          be a specific day of the month, such as the first day of the applicable month. It is used in
          conjunction with a frequency and the regular period start date of a calculation period.
        range: RollConventionEnum
        required: true
      balanceOfFirstPeriod:
        description: Indicates, when true, that that the first Calculation Period should run from the
          Effective Date to the end of the calendar period in which the Effective Date falls, e.g. Jan
          15 - Jan 31 if the calculation periods are one month long and Effective Date is Jan 15. If false,
          the first Calculation Period should run from the Effective Date for one whole period, e.g. Jan
          15 to Feb 14 if the calculation periods are one month long and Effective Date is Jan 15. Mostly
          used in Commmodity Swaps.
        range: boolean
    all_of:
      - description: 'From Frequency. PositivePeriodMultiplier: FpML specifies periodMultiplier as a positive
          integer.'
        slot_conditions:
          periodMultiplier:
            minimum_value: 1
    rules:
      - description: 'From Frequency. TermPeriod: FpML specifies that if period value is T (Term) then
          periodMultiplier must contain the value 1.'
        preconditions:
          slot_conditions:
            period:
              equals_string: T
        postconditions:
          slot_conditions:
            periodMultiplier:
              equals_number: 1
      - description: 'FpML_ird_58: FpML validation rule ird-58 - Context: CalculationPeriodFrequency.
          When the period is ''W'', the rollConvention must be a week day, ''SFE'' or ''NONE''.'
        preconditions:
          slot_conditions:
            period:
              equals_string: W
        postconditions:
          any_of:
            - slot_conditions:
                rollConvention:
                  equals_string: NONE
            - slot_conditions:
                rollConvention:
                  equals_string: SFE
            - slot_conditions:
                rollConvention:
                  equals_string: MON
            - slot_conditions:
                rollConvention:
                  equals_string: TUE
            - slot_conditions:
                rollConvention:
                  equals_string: WED
            - slot_conditions:
                rollConvention:
                  equals_string: THU
            - slot_conditions:
                rollConvention:
                  equals_string: FRI
            - slot_conditions:
                rollConvention:
                  equals_string: SAT
            - slot_conditions:
                rollConvention:
                  equals_string: SUN
      - description: 'FpML_ird_60: FpML validation rule ird-60 - Context: CalculationPeriodFrequency.
          When the period is ''T'', the rollConvention must be ''NONE''.'
        preconditions:
          slot_conditions:
            period:
              equals_string: T
        postconditions:
          slot_conditions:
            rollConvention:
              equals_string: NONE
    comments:
      - 'Rosetta condition FpML_ird_57 is not stated in LinkML: if period = PeriodExtendedEnum -> M or
        period = PeriodExtendedEnum -> Y then rollConvention <> RollConventionEnum -> NONE and rollConvention
        <> RollConventionEnum -> SFE and rollConvention <> RollConventionEnum -> MON and rollConvention
        <> RollConventionEnum -> TUE and rollConvention <> RollConventionEnum -> WED and rollConvention
        <> RollConventionEnum -> THU and rollConvention <> RollConventionEnum -> FRI and rollConvention
        <> RollConventionEnum -> SAT and rollConvention <> RollConventionEnum -> SUN'
  CustomisableOffset:
    description: A class to specify an offset either as a normalized [multiplier, period, dayType] or
      as a custom provision of type string.
    attributes:
      offset:
        range: Offset
      customProvision:
        range: string
  DateList:
    description: List of dates.
    attributes:
      date:
        range: date
        required: true
        multivalued: true
  DateRange:
    description: A class defining a contiguous series of calendar dates. The date range is defined as
      all the dates between and including the start and the end date. The start date must fall on or before
      the end date.
    attributes:
      startDate:
        description: The first date of a date range.
        range: date
        required: true
      endDate:
        description: The last date of a date range.
        range: date
        required: true
    comments:
      - 'Rosetta condition DatesOrdered is not stated in LinkML: startDate <= endDate'
  DateTimeList:
    description: List of dateTimes.
    attributes:
      dateTime:
        description: The CDM specifies that the zoned date time is to be expressed in accordance with
          ISO 8601, either as UTC as an offset to UTC.
        range: datetime
        required: true
        multivalued: true
  DirectOrRelativeTime:
    description: Represents a time definition that can be either an absolute (direct) time or a time calculated
      relative to another referenced time. Either one directTime or one relativeTime should be provided
    attributes:
      directTime:
        description: An absolute time value expressed in a specific time zone.
        range: TimeZone
      relativeTime:
        description: A time value calculated relative to another reference time.
        range: RelativeTime
  Frequency:
    description: A class for defining a date frequency, e.g. one day, three months, through the combination
      of an integer value and a standardized period value that is specified as part of an enumeration.
    attributes:
      periodMultiplier:
        description: A time period multiplier, e.g. 1, 2, or 3. If the period value is T (Term) then period
          multiplier must contain the value 1.
        range: integer
        required: true
      period:
        description: A time period, e.g. a day, week, month, year or term of the stream.
        range: PeriodExtendedEnum
        required: true
    all_of:
      - description: 'PositivePeriodMultiplier: FpML specifies periodMultiplier as a positive integer.'
        slot_conditions:
          periodMultiplier:
            minimum_value: 1
    rules:
      - description: 'TermPeriod: FpML specifies that if period value is T (Term) then periodMultiplier
          must contain the value 1.'
        preconditions:
          slot_conditions:
            period:
              equals_string: T
        postconditions:
          slot_conditions:
            periodMultiplier:
              equals_number: 1
    annotations:
      rosetta_metadata: key
  Offset:
    is_a: Period
    description: A class defining an offset used in calculating a new date relative to a reference date,
      e.g. calendar days, business days, commodity Business days, etc.
    attributes:
      dayType:
        description: In the case of an offset specified as a number of days, this element defines whether
          consideration is given as to whether a day is a good business day or not. If a day type of business
          days is specified then non-business days are ignored when calculating the offset. The financial
          business centers to use for determination of business days are implied by the context in which
          this element is used. This element must only be included when the offset is specified as a number
          of days. If the offset is zero days then the dayType element should not be included.
        range: DayTypeEnum
    rules:
      - description: 'From Period. DayPeriod: FpML specifies that if the periodMultiplier value is 0 (zero)
          then period must contain the value D (day).'
        preconditions:
          slot_conditions:
            periodMultiplier:
              equals_number: 0
        postconditions:
          slot_conditions:
            period:
              equals_string: D
    comments:
      - 'Rosetta condition DayType is not stated in LinkML: if period <> PeriodEnum -> D or periodMultiplier
        = 0 then dayType is absent'
  Period:
    description: A class to define recurring periods or time offsets.
    attributes:
      periodMultiplier:
        description: A time period multiplier, e.g. 1, 2 or 3 etc. A negative value can be used when specifying
          an offset relative to another date, e.g. -2 days.
        range: integer
        required: true
      period:
        description: A time period, e.g. a day, week, month or year of the stream. If the periodMultiplier
          value is 0 (zero) then period must contain the value D (day).
        range: PeriodEnum
        required: true
    rules:
      - description: 'DayPeriod: FpML specifies that if the periodMultiplier value is 0 (zero) then period
          must contain the value D (day).'
        preconditions:
          slot_conditions:
            periodMultiplier:
              equals_number: 0
        postconditions:
          slot_conditions:
            period:
              equals_string: D
    annotations:
      rosetta_metadata: key
  PeriodBound:
    description: Indicator to specify if the period bound is defined as a period and whether the bound
      is inclusive.
    attributes:
      period:
        description: Specifies the period is to be used as the bound, e.g. 5Y.
        range: Period
        required: true
      inclusive:
        description: Specifies whether the period bound is inclusive, e.g. for a lower bound, false would
          indicate greater than, whereas true would indicate greater than or equal to.
        range: boolean
        required: true
  PeriodRange:
    description: Indicates The period range defined as either a lower and upper period bound, or both.
    attributes:
      lowerBound:
        description: Specifies the lower bound of a period range, e.g. greater than or equal to 5Y.
        range: PeriodBound
      upperBound:
        description: Specifies the upper bound of a period range, e.g. less than to 10Y.
        range: PeriodBound
    all_of:
      - description: AtLeastOneOf
        any_of:
          - slot_conditions:
              lowerBound:
                value_presence: PRESENT
          - slot_conditions:
              upperBound:
                value_presence: PRESENT
  PeriodicDates:
    description: A class for specifying a calculation period schedule.
    attributes:
      startDate:
        description: The start date of the calculation period. FpML specifies that for interest rate swaps
          this date must only be specified if it is not equal to the effective date. It is always specified
          in the case of equity swaps and credit default swaps with periodic payments. This date may be
          subject to adjustment in accordance with a business day convention.
        range: AdjustableOrRelativeDate
      endDate:
        description: The end date of the calculation period. FpML specifies that for interest rate swaps
          this date must only be specified if it is not equal to the termination date. It is always specified
          in the case of equity swaps with periodic payments. This date may be subject to adjustment in
          accordance with a business day convention.
        range: AdjustableOrRelativeDate
      periodFrequency:
        description: The frequency at which calculation period end dates occur with the regular part of
          the calculation period schedule and their roll date convention.
        range: CalculationPeriodFrequency
      periodDatesAdjustments:
        description: The specification of the business day convention and financial business centers used
          for adjusting any calculation period date if it would otherwise fall on a day that is not a
          business day in the specified business center.
        range: BusinessDayAdjustments
      dayType:
        description: Denotes the enumerated values to specify the day type classification used in counting
          the number of days between two dates.
        range: DayTypeEnum
  RelativeDateOffset:
    is_a: Offset
    description: A class defining a date (referred to as the derived date) as a relative offset from another
      date (referred to as the anchor date). If the anchor date is itself an adjustable date then the
      offset is assumed to be calculated from the adjusted anchor date. A number of different scenarios
      can be supported, namely; 1) the derived date may simply be a number of calendar periods (days,
      weeks, months or years) preceding or following the anchor date; 2) the unadjusted derived date may
      be a number of calendar periods (days, weeks, months or years) preceding or following the anchor
      date with the resulting unadjusted derived date subject to adjustment in accordance with a specified
      business day convention, i.e. the derived date must fall on a good business day; 3) the derived
      date may be a number of business days preceding or following the anchor date. Note that the businessDayConvention
      specifies any required adjustment to the unadjusted derived date. A negative or positive value in
      the periodMultiplier indicates whether the unadjusted derived precedes or follows the anchor date.
      The businessDayConvention should contain a value NONE if the day type element contains a value of
      Business (since specifying a negative or positive business days offset would already guarantee that
      the derived date would fall on a good business day in the specified business centers).
    attributes:
      businessDayConvention:
        description: The convention for adjusting a date if it would otherwise fall on a day that is not
          a business day, as specified by an ISDA convention (e.g. Following, Precedent).
        range: BusinessDayConventionEnum
        required: true
      businessCenters:
        range: BusinessCenters
      businessCentersReference:
        description: A pointer style reference to a set of financial business centers defined elsewhere
          in the document. This set of business centers is used to determine whether a particular day
          is a business day or not.
        range: BusinessCenters
        annotations:
          rosetta_metadata: reference
      dateRelativeTo:
        description: Specifies the anchor as an href attribute. The href attribute value is a pointer
          style reference to the element or component elsewhere in the document where the anchor date
          is defined.
        range: date
        annotations:
          rosetta_metadata: reference
      adjustedDate:
        description: The date once the adjustment has been performed. (Note that this date may change
          if the business center holidays change).
        range: date
    rules:
      - description: 'From Period. DayPeriod: FpML specifies that if the periodMultiplier value is 0 (zero)
          then period must contain the value D (day).'
        preconditions:
          slot_conditions:
            periodMultiplier:
              equals_number: 0
        postconditions:
          slot_conditions:
            period:
              equals_string: D
  RelativeDates:
    is_a: RelativeDateOffset
    description: A class describing a set of dates defined as relative to another set of dates.
    attributes:
      periodSkip:
        description: The number of periods in the referenced date schedule that are between each date
          in the relative date schedule. Thus a skip of 2 would mean that dates are relative to every
          second date in the referenced schedule. If present this should have a value greater than 1.
        range: integer
      scheduleBounds:
        description: The first and last dates of a schedule. This can be used to restrict the range of
          values in a reference series of dates.
        range: DateRange
    rules:
      - description: 'From Period. DayPeriod: FpML specifies that if the periodMultiplier value is 0 (zero)
          then period must contain the value D (day).'
        preconditions:
          slot_conditions:
            periodMultiplier:
              equals_number: 0
        postconditions:
          slot_conditions:
            period:
              equals_string: D
      - description: 'PeriodSkipGreaterThanOne: FpML specifies that, if present, the period skip should
          have a value greater than 1.'
        preconditions:
          slot_conditions:
            periodSkip:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            periodSkip:
              minimum_value: 2
  RelativeTime:
    is_a: RelativeTimeOffset
    description: Defines a time value calculated relative to a reference time. The final value is derived
      by applying any offset and rounding rules inherited from RelativeTimeOffset to the reference time.
    attributes:
      timeRelativeTo:
        description: The reference time zone or base time from which the relative time is calculated.
        range: TimeZone
        annotations:
          rosetta_metadata: reference
  RelativeTimeOffset:
    description: Describes how a time is offset from a reference point, including the unit, magnitude,
      and rounding behavior.
    attributes:
      offsetTimeUnit:
        description: The unit of time for the offset (e.g., seconds, minutes, hours, days).
        range: TimeUnitEnum
      offsetMultiplier:
        description: A time offset multiplier, e.g. 1, 2 or 3 etc. A negative value can be used when specifying
          a negative offset, e.g. -2 hours.
        range: integer
      rounding:
        description: Optional rules that define how the calculated time should be rounded after the offset
          has been applied.
        range: TimeRounding
  TimeRounding:
    description: Specifies how a calculated time should be rounded, including both the direction of rounding
      and the unit to which the time is rounded. Rounding is applied after all offsets have been calculated.
    attributes:
      roundingDirection:
        description: The direction in which rounding is performed (e.g., up, down, or to the nearest value).
        range: RoundingDirectionEnum
        required: true
      roundToUnit:
        description: The time unit to which the value should be rounded (e.g., minute, hour, day).
        range: TimeUnitEnum
  TimeZone:
    description: The time alongside with the timezone location information. This class makes use of the
      FpML TimezoneLocation construct.
    attributes:
      time:
        description: The observation time.
        range: time
        required: true
      location:
        description: FpML specifies the timezoneLocationScheme by reference to the Time Zone Database
          (a.k.a. tz database) maintained by IANA, the Internet Assigned Numbers Authority.
        range: string
        annotations:
          rosetta_metadata: scheme
    annotations:
      rosetta_metadata: key
