    annotations:
      doc_reference: ISDA FpML_Coding_Scheme schemeLocation http://www.fpml.org/coding-scheme/commodity-business-calendar
    see_also:
      - http://www.fpml.org/coding-scheme/commodity-business-calendar
  CompoundingTypeEnum:
    description: The enumerated values to specify how the compounding calculation is done
    permissible_values:
      None:
        description: Compounding is not applicable
      Business:
        description: Compounding is done only on business days, i.e. not compounded each day on weekends
          or holidays.
      Calendar:
        description: Compounding is done on each calendar day.
  DayOfWeekEnum:
    description: The enumerated values to specify a day of the seven-day week.
    permissible_values:
      MON:
        description: Monday
      TUE:
        description: Tuesday
      WED:
        description: Wednesday
      THU:
        description: Thursday
      FRI:
        description: Friday
      SAT:
        description: Saturday
      SUN:
        description: Sunday
  DayTypeEnum:
    description: Lists the enumerated values to specify the day type classification used in counting the
      number of days between two dates.
    permissible_values:
      Business:
        description: Applies when calculating the number of days between two dates the count includes
          only business days.
      Calendar:
        description: Applies when calculating the number of days between two dates the count includes
          all calendar days.
      CurrencyBusiness:
        description: Applies when calculating the number of days between two dates the count includes
          only currency business days.
      ExchangeBusiness:
        description: Applies when calculating the number of days between two dates the count includes
          only stock exchange business days.
      ScheduledTradingDay:
        description: Applies when calculating the number of days between two dates the count includes
          only scheduled trading days.
  PeriodEnum:
    description: The enumerated values to specify the period, e.g. day, week.
    permissible_values:
      D:
        description: Day
      W:
        description: Week
      M:
        description: Month
      Y:
        description: Year
  PeriodExtendedEnum:
    description: The enumerated values to specify a time period containing the additional value of Term.
    permissible_values:
      H:
        description: Hour
      D:
        description: Day
      W:
        description: Week
      M:
        description: Month
      Y:
        description: Year
      T:
        description: Term. The period commencing on the effective date and ending on the termination date.
          The T period always appears in association with periodMultiplier = 1, and the notation is intended
          for use in contexts where the interval thus qualified (e.g. accrual period, payment period,
          reset period, ...) spans the entire term of the trade.
      C:
        description: CalculationPeriod - the period corresponds to the calculation period For example,
          used in the Commodity Markets to indicate that a reference contract is the one that corresponds
          to the period of the calculation period.
  PeriodTimeEnum:
    description: The enumeration values to specify a time period containing additional values such as
      Term.
    permissible_values:
      Hour:
        description: Period measured in hours.
      Minute:
        description: Period measured in minutes.
      Second:
        description: Period measured in seconds.
  RollConventionEnum:
    description: The enumerated values to specify the period term as part of a periodic schedule, i.e.
      the calculation period end date within the regular part of the calculation period. The value could
      be a rule, e.g. IMM Settlement Dates, which is the 3rd Wednesday of the month, or it could be a
      specific day of the month, such as the first day of the applicable month.
    permissible_values:
      EOM:
        description: Rolls on month end dates irrespective of the length of the month and the previous
          roll day.
      FRN:
        description: Roll days are determined according to the FRN Convention or Euro-dollar Convention
          as described in ISDA 2000 definitions.
      IMM:
        description: IMM Settlement Dates. The third Wednesday of the (delivery) month.
      IMMCAD:
        description: The last trading day/expiration day of the Canadian Derivatives Exchange (Bourse
          de Montreal Inc) Three-month Canadian Bankers' Acceptance Futures (Ticker Symbol BAX). The second
          London banking day prior to the third Wednesday of the contract month. If the determined day
          is a Bourse or bank holiday in Montreal or Toronto, the last trading day shall be the previous
          bank business day. Per Canadian Derivatives Exchange BAX contract specification.
      IMMAUD:
        description: The last trading day of the Sydney Futures Exchange 90 Day Bank Accepted Bills Futures
          contract (see http://www.sfe.com.au/content/sfe/trading/con_specs.pdf). One Sydney business
          day preceding the second Friday of the relevant settlement.
      IMMNZD:
        description: The last trading day of the Sydney Futures Exchange NZ 90 Day Bank Bill Futures contract
          (see http://www.sfe.com.au/content/sfe/trading/con_specs.pdf). The first Wednesday after the
          ninth day of the relevant settlement month.
      SFE:
        description: Sydney Futures Exchange 90-Day Bank Accepted Bill Futures Settlement Dates. The second
          Friday of the (delivery) month
      NONE:
        description: The roll convention is not required. For example, in the case of a daily calculation
          frequency.
      TBILL:
        description: 13-week and 26-week U.S. Treasury Bill Auction Dates. Each Monday except for U.S.
          (New York) holidays when it will occur on a Tuesday.
