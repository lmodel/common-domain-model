  NationalizationOrInsolvencyOrDelistingEventEnum:
    description: Defines the consequences of nationalization, insolvency and delisting events relating
      to the underlying.
    permissible_values:
      NegotiatedCloseout:
        description: The parties may, but are not obliged, to terminate the transaction on mutually acceptable
          terms and if the terms are not agreed then the transaction continues.
      CancellationAndPayment:
        description: The trade is terminated.
classes:
  MasterAgreementBase:
    description: A set of elections that can be shared across master agreement types - this should be
      built upon for specific contracts.
  MasterAgreementElections:
    description: A representation of a master agreement extended from a base agreement of shared elections.
    attributes:
      islaGmsla:
        description: The set of elections that define a GMSLA.
        range: GlobalMasterSecuritiesLendingAgreement
      icmaGmra:
        description: The set of elections that define a GMRA.
        range: GlobalMasterRepoAgreement
      isdaMaster:
        description: The set of elections that define an ISDA Master Agreement.
        range: MasterAgreement
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
