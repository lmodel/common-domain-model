---
id: https://w3id.org/lmodel/common-domain-model/cdm_product_template
name: cdm_product_template
title: CDM cdm.product.template
description: Template feature concepts to define payouts.
version: 8.0.0-dev.13
source: https://github.com/finos/common-domain-model/tree/8.0.0-dev.13
license: Apache-2.0
prefixes:
  common_domain_model: https://w3id.org/lmodel/common-domain-model/
  linkml: https://w3id.org/linkml/
default_prefix: common_domain_model
default_range: string
imports:
  - linkml:types
  - ./cdm_base_datetime
  - ./cdm_base_math
  - ./cdm_base_staticdata_asset_common
  - ./cdm_base_staticdata_codelist
  - ./cdm_base_staticdata_identifier
  - ./cdm_base_staticdata_party
  - ./cdm_event_common
  - ./cdm_observable_asset
  - ./cdm_observable_common
  - ./cdm_observable_event
  - ./cdm_product_asset
  - ./cdm_product_collateral
  - ./cdm_product_common
  - ./cdm_product_common_schedule
  - ./cdm_product_common_settlement
enums:
  AssetPayoutTradeTypeEnum:
    description: An enumerator to differentiate the different trade types used in securities finance and
      modelled on an AssetPayout.
    permissible_values:
      Repo:
        description: In the case of a repurchase transaction, an immediate and equal income payment (often
          call a manufactured payment) is made by the buyer to the seller.
      Buy/Sell-Back:
        description: In the case of a buy/sell-back, there is no income payment between buyer and seller.
          Instead, the repurchase price to be paid on the repurchase date is reduced by the amount of
          the income payment on the collateral plus some extra interest to compensate the seller for the
          delay between the income payment date on the collateral and the repurchase date of the repo.
        aliases:
          - BuySellBack
      SecurityLending:
        description: Denotes this payout as being associated to the security being lent as part of a securities
          lending contract.
  AveragingInOutEnum:
    description: The enumerated values to specify the type of averaging used in an Asian option.
    permissible_values:
      In:
        description: The average price is used to derive the strike price. Also known as 'Asian strike'
          style option.
      Out:
        description: The average price is used to derive the expiration price. Also known as 'Asian price'
          style option.
      Both:
        description: The average price is used to derive both the strike and the expiration price.
  CallingPartyEnum:
    description: Identifies a party to the on-demand repo transaction that has a right to demand for termination
      of the Security Finance transaction.
    permissible_values:
      InitialBuyer:
        description: Initial buyer to the repo transaction.
      InitialSeller:
        description: Initial seller to the repo transaction.
      Either:
        description: Either, Buyer or Seller to the repo transaction.
      AsDefinedInMasterAgreement:
        description: As defined in Master Agreement.
  ExerciseNoticeGiverEnum:
    description: Defines the principal party to the trade that has the right to exercise.
    permissible_values:
      Buyer:
        description: Specifies that only the option buyer has the right to exercise.
      Seller:
        description: Specifies that only the option seller has the right to exercise.
      Both:
        description: Specifies that both the option buyer and option seller has the right to exercise.
      AsSpecifiedInMasterAgreement:
        description: Specifies that the Master Agreement defines the principal party to the trade that
          has the right to exercise.
  ExpirationTimeTypeEnum:
    description: The time of day at which the equity option expires, for example the official closing
      time of the exchange.
    permissible_values:
      Close:
        description: The official closing time of the exchange on the valuation date.
      Open:
        description: The official opening time of the exchange on the valuation date.
      OSP:
        description: The time at which the official settlement price is determined.
      SpecificTime:
        description: The time specified in the element equityExpirationTime or valuationTime (as appropriate)
      XETRA:
        description: The time at which the official settlement price (following the auction by the exchange)
          is determined by the exchange.
      DerivativesClose:
        description: The official closing time of the derivatives exchange on which a derivative contract
          is listed on that security underlyer.
      AsSpecifiedInMasterConfirmation:
        description: The time is determined as provided in the relevant Master Confirmation.
  OptionExerciseStyleEnum:
    description: The enumerated values to specify the option exercise style. i.e., European, Bermuda or
      American.
    permissible_values:
      European:
        description: Single Exercise
      Bermuda:
        description: Multiple specified exercise dates
      American:
        description: Continuous exercise over a range of dates
  OptionTypeEnum:
    description: The enumerated values to specify the type or strategy of the option.
    permissible_values:
      Put:
        description: A put option gives the holder the right to sell the underlying asset by a certain
          date for a certain price.
      Call:
        description: A call option gives the holder the right to buy the underlying asset by a certain
          date for a certain price.
      Payer:
        description: 'A ''payer'' option: If you buy a ''payer'' option you have the right but not the
          obligation to enter into the underlying swap transaction as the ''fixed'' rate/price payer and
          receive float.'
      Receiver:
        description: 'A ''receiver'' option: If you buy a ''receiver'' option you have the right but not
          the obligation to enter into the underlying swap transaction as the ''fixed'' rate/price receiver
          and pay float.'
      Straddle:
        description: A straddle strategy, which involves the simultaneous buying of a put and a call of
          the same underlier, at the same strike and same expiration date
    annotations:
      rosetta_extends: PutCallEnum
classes:
  AssetLeg:
    description: Defines each asset movement of an asset payout.
    attributes:
      settlementDate:
        description: Specifies the settlement date of securities. In a repo transaction the purchase date
          would always be the effective date as specified under Economic Terms, the repurchase date would
          always be the termination date as specified under Economic Terms.
        range: AdjustableOrRelativeDate
        required: true
      deliveryMethod:
        description: Specifies a delivery method for the security transaction.
        range: DeliveryMethodEnum
        required: true
  AssetPayout:
    is_a: PayoutBase
    description: Security finance payout specification in case the product payout involves some form of
      security collateral, as in a securities financing transaction. Plus additional description for ICMA.
    attributes:
      assetLeg:
        description: Defines each asset movement as a buy/sell at different dates, typically 1 near leg
          and 1 far leg in a securities financing transaction.
        range: AssetLeg
        required: true
        multivalued: true
      underlier:
        description: Specifies the Purchased Asset, usually a Security.
        range: Asset
        required: true
      minimumFee:
        description: A contractual minimum amount which the borrower will pay, regardless of the duration
          of the loan. A mechanism for making sure that a trade generates enough income.
        range: Money
      dividendTerms:
        description: Specifies the terms under which dividends received by the borrower are passed through
          to the lender.
        range: DividendTerms
      tradeType:
        description: The trade type, eg repurchase transaction or buy/sell-back.
        range: AssetPayoutTradeTypeEnum
    all_of:
      - description: 'Quantity: When there is an OptionPayout the quantity can be expressed as part of
          the payoutQuantity, or as part of the underlier in the case of a Swaption. For all other payouts
          that extend PayoutBase the payoutQuantity is a mandatory attribute.'
        slot_conditions:
          priceQuantity:
            value_presence: PRESENT
    comments:
      - 'Rosetta condition UnderlierNotCash is not stated in LinkML: underlier as Cash is absent'
      - 'Rosetta condition SettlementCentreRequired is not stated in LinkML: if underlier as Security
        exists then (settlementTerms -> securitySettlementCentre exists and settlementTerms -> cashSettlementCentre
        exists)'
  AutomaticExercise:
    description: A type to define automatic exercise of a swaption. With automatic exercise the option
      is deemed to have exercised if it is in the money by more than the threshold amount on the exercise
      date.
    attributes:
      thresholdRate:
        description: A threshold rate. The threshold of 0.10% would be represented as 0.001
        range: decimal
      isApplicable:
        description: Boolean that indicates if it has an automaticExercise
        range: boolean
  AveragingCalculation:
    description: Defines parameters for use in cases when a valuation or other term is based on an average
      of market observations.
    attributes:
      averagingMethod:
        description: Specifies enumerations for the type of averaging calculation.
        range: AveragingCalculationMethod
        required: true
      precision:
        description: Rounding applied to the average calculation.
        range: Rounding
        required: true
  AveragingFeature:
    description: As per ISDA 2002 Definitions.
    attributes:
      averagingCalculation:
        description: Defines parameters for use in cases when a valuation or other term is based on an
          average of market observations.
        range: AveragingCalculation
        required: true
      averagingInOut:
        range: AveragingInOutEnum
        required: true
      strikeFactor:
        description: The factor of strike.
        range: decimal
      averagingPeriodIn:
        description: The averaging in period.
        range: AveragingPeriod
      averagingPeriodOut:
        description: The averaging out period.
        range: AveragingPeriod
  AveragingStrikeFeature:
    description: Defines the terms required to calculate the average observations associated with an averaging
      strike.
    attributes:
      averagingCalculation:
        description: Defines parameters for use in cases when a valuation or other term is based on an
          average of market observations.
        range: AveragingCalculation
        required: true
      observationTerms:
        description: Class containing terms that are associated with observing a price/benchmark/index
          across either single or multple observations.
        range: ObservationTerms
        required: true
  Barrier:
    description: As per ISDA 2002 Definitions.
    attributes:
      knockIn:
        description: The option only becomes active when a predetermined trigger level is breached.
        range: TriggerEvent
        multivalued: true
      knockOut:
        description: The option becomes null and void when a predetermined trigger level is breached.
        range: TriggerEvent
        multivalued: true
  CalculationSchedule:
    description: A class that allows the full representation of a payout by defining a set of schedule
      periods. It supports standard schedule customization by expressing all the dates, quantities, and
      pricing data in a non-parametric way.
    attributes:
      schedulePeriod:
        description: Defines a period of a calculation schedule structure.
        range: SchedulePeriod
        required: true
        multivalued: true
  CalendarSpread:
    description: A type for defining a calendar spread feature.
    attributes:
      expirationDateTwo:
        range: AdjustableOrRelativeDate
        required: true
  CancelableProvision:
    is_a: BuyerSeller
    description: 'A data defining: the right of a party to cancel a swap transaction on the specified
      exercise dates. The provision is for ''walk-away'' cancellation (i.e. the fair value of the swap
      is not paid). A fee payable on exercise can be specified. As a difference from the FpML construct,
      the canonical model extends the BuyerSeller class.'
    attributes:
      exerciseNotice:
        description: Definition of the party to whom notice of exercise should be given.
        range: ExerciseNotice
      followUpConfirmation:
        description: A flag to indicate whether follow-up confirmation of exercise (written or electronic)
          is required following telephonic notice by the buyer to the seller or seller's agent.
        range: boolean
        required: true
      cancelableProvisionAdjustedDates:
        description: The adjusted dates associated with a cancelable provision. These dates have been
          adjusted for any applicable business day convention.
        range: CancelableProvisionAdjustedDates
      finalCalculationPeriodDateAdjustment:
        description: Business date convention adjustment to final payment period per leg (swapStream)
          upon exercise event. The adjustments can be made in-line with leg level BDC's or they can be
          specified separately.
        range: FinalCalculationPeriodDateAdjustment
        multivalued: true
      initialFee:
        description: An initial fee for the cancelable option.
        range: Transfer
      callingParty:
        description: The party with right to exercise a cancellation. Allows for buyer, seller or either.
        range: CallingPartyEnum
      earliestDate:
        description: The first day when cancelation is permitted to take effect. A party may give notice
          prior to this date and taken together with the effective period would be necessary to cancel
          on this date.
        range: AdjustableOrRelativeDate
      expirationDate:
        description: The last day within the term of the contract that cancelation is allowed.
        range: AdjustableOrRelativeDate
      effectiveDate:
        description: The effective date if cancelation is invoked otherwise the cancellation period defines
          the cancellation date.
        range: AdjustableOrRelativeDates
      effectivePeriod:
        description: Effective period for cancelation when notice is given. This is the period after notice
          is given that cancellation becomes effecticve.
        range: Period
      earliestCancellationTime:
        description: The earliest time in a business day that notice of cancelation can be given.
        range: BusinessCenterTime
      latestCancelationTime:
        description: The latest time at which notice of cancelation can be given.
        range: BusinessCenterTime
      exerciseTerms:
        description: The exercise terms associated with the cancelable provision, including details such
          as exercise style, exercise fees, and any other relevant conditions or terms governing the cancellation
          of the swap transaction.
        range: ExerciseTerms
        required: true
    all_of:
      - description: 'EffectiveDate: Must select one of predefined cancellation types of effectiveDate
          or effectivePeriod.'
        exactly_one_of:
          - slot_conditions:
              effectiveDate:
                value_presence: PRESENT
          - slot_conditions:
              effectivePeriod:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  effectiveDate:
                    value_presence: ABSENT
              - slot_conditions:
                  effectivePeriod:
                    value_presence: ABSENT
    comments:
      - 'Rosetta condition CancelableProvisionExerciseNoticeReceiverParty is not stated in LinkML: if
        exerciseNotice -> exerciseNoticeReceiver exists then exerciseNotice -> exerciseNoticeReceiver
        = AncillaryRoleEnum -> ExerciseNoticeReceiverPartyCancelableProvision'
  CancelableProvisionAdjustedDates:
    description: 'A data to: define the adjusted dates for a cancelable provision on a swap transaction.'
    attributes:
      cancellationEvent:
        description: The adjusted dates for an individual cancellation date.
        range: CancellationEvent
        required: true
        multivalued: true
  CancellationEvent:
    description: The adjusted dates for a specific cancellation date, including the adjusted exercise
      date and adjusted termination date.
    attributes:
      adjustedExerciseDate:
        description: The date on which option exercise takes place. This date should already be adjusted
          for any applicable business day convention.
        range: date
        required: true
      adjustedEarlyTerminationDate:
        description: The early termination date that is applicable if an early termination provision is
          exercised. This date should already be adjusted for any applicable business day convention.
        range: date
        required: true
    annotations:
      rosetta_metadata: key
  Composite:
    description: Specifies the conditions to be applied for converting into a reference currency when
      the actual currency rate is not determined upfront.
    attributes:
      determinationMethod:
        description: Specifies the method according to which an amount or a date is determined.
        range: DeterminationMethodEnum
      relativeDate:
        description: A date specified as some offset to another date (the anchor date).
        range: RelativeDateOffset
      fxSpotRateSource:
        description: Specifies the methodology (reference source and, optionally, fixing time) to be used
          for determining a currency conversion rate.
        range: FxSpotRateSource
      fixingTime:
        description: The time at which the spot currency exchange rate will be observed. It is specified
          as a time in a business day calendar location, e.g. 11:00am London time.
        range: BusinessCenterTime
  ConstituentWeight:
    description: A class describing the weight of each of the underlier constituent within the basket,
      either in absolute or relative terms.
    attributes:
      openUnits:
        description: The number of units (index or securities) that constitute the underlier of the swap.
          In the case of a basket swap, this element is used to reference both the number of basket units,
          and the number of each asset components of the basket when these are expressed in absolute terms.
        range: decimal
      basketPercentage:
        description: The relative weight of each respective basket constituent, expressed in percentage.
          A basket percentage of 5% would be represented as 0.05.
        range: decimal
    rules:
      - description: 'BasketPercentage: FpML specifies basketPercentage as a RestrictedPercentage type,
          meaning that the value needs to be comprised between 0 and 1.'
        preconditions:
          slot_conditions:
            basketPercentage:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            basketPercentage:
              minimum_value: 0
              maximum_value: 1
  DividendTerms:
    description: Information related to dividends and payments.
    attributes:
      manufacturedIncomeRequirement:
        description: Specifies the proportion of the value of the dividend on the borrowed shares that
          the borrower is legally obligated to return to the lender.
        range: DividendPayoutRatio
        required: true
      dividendEntitlement:
        description: Defines the date on which the receiver of the equity return is entitled to the dividend.
        range: DividendEntitlementEnum
      minimumBillingAmount:
        description: daily fee increments accrue until a threshold is crossed, at which point payment
          becomes due)
        range: Money
  EarlyTerminationEvent:
    description: 'A data to: define the adjusted dates associated with an early termination provision.'
    attributes:
      adjustedExerciseDate:
        description: The date on which option exercise takes place. This date should already be adjusted
          for any applicable business day convention.
        range: date
        required: true
      adjustedEarlyTerminationDate:
        description: The early termination date that is applicable if an early termination provision is
          exercised. This date should already be adjusted for any applicable business day convention.
        range: date
        required: true
      adjustedCashSettlementValuationDate:
        description: The date by which the cash settlement amount must be agreed. This date should already
          be adjusted for any applicable business day convention.
        range: date
        required: true
      adjustedCashSettlementPaymentDate:
        description: The date on which the cash settlement amount is paid. This date should already be
          adjusted for any applicable business date convention.
        range: date
        required: true
      adjustedExerciseFeePaymentDate:
        description: The date on which the exercise fee amount is paid. This date should already be adjusted
          for any applicable business day convention.
        range: date
    annotations:
      rosetta_metadata: key
    comments:
      - 'Rosetta condition FpML_ird_39 is not stated in LinkML: adjustedExerciseDate <= adjustedEarlyTerminationDate'
      - 'Rosetta condition FpML_ird_40 is not stated in LinkML: adjustedExerciseDate <= adjustedCashSettlementValuationDate'
      - 'Rosetta condition FpML_ird_41 is not stated in LinkML: adjustedCashSettlementValuationDate <=
        adjustedCashSettlementPaymentDate'
  EarlyTerminationProvision:
    description: 'A data defining: an early termination provision for a swap. This early termination is
      at fair value, i.e. on termination the fair value of the product must be settled between the parties.'
    attributes:
      mandatoryEarlyTermination:
        description: A mandatory early termination provision to terminate the swap at fair value.
        range: MandatoryEarlyTermination
      mandatoryEarlyTerminationDateTenor:
        description: Period after trade date of the mandatory early termination date.
        range: Period
      optionalEarlyTermination:
        description: An option for either or both parties to terminate the swap at fair value.
        range: OptionalEarlyTermination
      optionalEarlyTerminationParameters:
        description: Definition of the first early termination date and the frequency of the termination
          dates subsequent to that. American exercise is defined by having a frequency of one day.
        range: ExercisePeriod
    all_of:
      - description: 'MandatoryEarlyTermination: The FpML MandatoryEarlyTermination.model specifies a
          required choice node. The choice node associated with the FpML EarlyTerminationProvision is
          quite complex and using the data rule provides a more flexible approach than adding complexity
          to the condition grammar.'
        any_of:
          - slot_conditions:
              mandatoryEarlyTermination:
                value_presence: PRESENT
          - slot_conditions:
              optionalEarlyTermination:
                value_presence: PRESENT
          - slot_conditions:
              mandatoryEarlyTermination:
                value_presence: PRESENT
              optionalEarlyTermination:
                value_presence: PRESENT
    annotations:
      rosetta_metadata: key
  EconomicTerms:
    description: 'This class represents the full set of price-forming features associated with a contractual
      product: the payout component, the notional/quantity, the effective and termination date and the
      date adjustment provisions when applying uniformily across the payout components. This class also
      includes the legal provisions which have valuation implications: cancelable provision, extendible
      provision, early termination provision and extraordinary events specification.'
    attributes:
      effectiveDate:
        description: The first day of the terms of the trade. This day may be subject to adjustment in
          accordance with a business day convention.
        range: AdjustableOrRelativeDate
        annotations:
          doc_reference: ICMA GMRA namingConvention Purchase Date | ICMA ERCCBestPractice namingConvention
            Purchase Date
      effectiveTime:
        description: The time and zone of the first day of the terms of the trade. It can also be specified
          in relation to another time.
        range: DirectOrRelativeTime
      terminationDate:
        description: The last day of the terms of the trade. This date may be subject to adjustments in
          accordance with the business day convention. It can also be specified in relation to another
          scheduled date (e.g. the last payment date).
        range: AdjustableOrRelativeDate
        annotations:
          doc_reference: ICMA GMRA namingConvention Repurchase Date | ICMA ERCCBestPractice namingConvention
            Repurchase Date
      terminationTime:
        description: The time and zone of the last day of the terms of the trade. It can also be specified
          in relation to another time.
        range: DirectOrRelativeTime
      dateAdjustments:
        description: The business day adjustment convention when it applies across all the payout components.
          This specification of the business day convention and financial business centers is used for
          adjusting any calculation period date if it would otherwise fall on a day that is not a business
          day in the specified business center.
        range: BusinessDayAdjustments
      payout:
        description: The payout specifies the future cashflow computation methodology which characterizes
          a financial product.
        range: Payout
        required: true
        multivalued: true
      terminationProvision:
        description: Contains optional provisions pertaining to the termination characteristics of a contract.
        range: TerminationProvision
      calculationAgent:
        description: The ISDA calculation agent responsible for performing duties as defined in the applicable
          product definitions.
        range: CalculationAgent
      nonStandardisedTerms:
        description: Specifies, when boolean value is True, that additional economic terms exist that
          have not been included in the product representation.
        range: boolean
      collateral:
        description: Represents the collateral obligations of a party.
        range: Collateral
    comments:
      - 'Rosetta condition ReturnType_Total_Requires_Dividends is not stated in LinkML: if payout as PerformancePayout
        -> returnTerms -> priceReturnTerms -> returnType all = ReturnTypeEnum -> Total then payout as
        PerformancePayout -> returnTerms -> dividendReturnTerms exists'
      - 'Rosetta condition LastRegularPaymentDate is not stated in LinkML: if payout as InterestRatePayout
        -> paymentDates -> lastRegularPaymentDate exists and payout as InterestRatePayout -> stubPeriod
        -> finalStub exists then payout as InterestRatePayout count = 2'
      - 'Rosetta condition PayRelativeTo is not stated in LinkML: if payout as InterestRatePayout count
        = 2 and payout as InterestRatePayout -> paymentDates exists then payout as InterestRatePayout
        -> paymentDates -> payRelativeTo exists'
      - 'Rosetta condition PaymentDatesAdjustments is not stated in LinkML: if payout as InterestRatePayout
        count = 2 and payout as InterestRatePayout -> paymentDates exists then payout as InterestRatePayout
        -> paymentDates -> paymentDatesAdjustments exists'
      - 'Rosetta condition PaymentFrequency is not stated in LinkML: if payout as InterestRatePayout count
        = 2 and payout as InterestRatePayout -> paymentDates exists then payout as InterestRatePayout
        -> paymentDates -> paymentFrequency exists'
      - 'Rosetta condition Quantity is not stated in LinkML: if payout as OptionPayout exists then payout
        as OptionPayout -> priceQuantity exists or payout as OptionPayout -> underlier as Product ->>
        economicTerms -> payout as InterestRatePayout count = 2'
      - 'Rosetta condition DayCountFraction is not stated in LinkML: if payout as InterestRatePayout count
        = 2 then payout as InterestRatePayout -> dayCountFraction exists'
      - 'Rosetta condition PaymentDates is not stated in LinkML: if payout as InterestRatePayout count
        = 2 then payout as InterestRatePayout -> dayCountFraction exists'
      - 'Rosetta condition MarketPrice is not stated in LinkML: if payout as CreditDefaultPayout -> generalTerms
        -> indexReferenceInformation is absent then payout as CreditDefaultPayout -> transactedPrice ->
        marketFixedRate is absent and payout as CreditDefaultPayout -> transactedPrice -> marketPrice
        is absent'
      - 'Rosetta condition NotionalResetOnPerformancePayout is not stated in LinkML: payout as CreditDefaultPayout
        -> priceQuantity -> reset is absent and payout as AssetPayout -> priceQuantity -> reset is absent
        and payout as CommodityPayout -> priceQuantity -> reset is absent and payout as FixedPricePayout
        -> priceQuantity -> reset is absent and payout as SettlementPayout -> priceQuantity -> reset is
        absent and payout as OptionPayout -> priceQuantity -> reset is absent'
      - 'Rosetta condition NotionalResetInterestRatePayoutExists is not stated in LinkML: if payout as
        PerformancePayout -> priceQuantity -> reset contains True then payout as InterestRatePayout exists'
      - 'Rosetta condition FpML_cd_26_28 is not stated in LinkML: True'
      - 'Rosetta condition FpML_cd_27 is not stated in LinkML: True'
      - 'Rosetta condition FpML_cd_30 is not stated in LinkML: if payout as InterestRatePayout -> paymentDates
        -> lastRegularPaymentDate exists and terminationDate exists then payout as InterestRatePayout
        -> paymentDates -> lastRegularPaymentDate all < terminationDate -> adjustableDate -> unadjustedDate
        or payout as InterestRatePayout -> paymentDates -> lastRegularPaymentDate all < terminationDate
        -> adjustableDate -> adjustedDate'
      - 'Rosetta condition IndependentCalculationAgent is not stated in LinkML: if calculationAgent ->
        calculationAgentParty exists then calculationAgent -> calculationAgentParty = AncillaryRoleEnum
        -> CalculationAgentIndependent'
  EvergreenProvision:
    description: Specifies a transaction which automatically extends for a specified timeframe until the
      exercise of an embedded option.
    attributes:
      singlePartyOption:
        description: If evergreen termination is not available to both parties then this component specifies
          the buyer and seller of the option.
        range: PartyRole
      noticePeriod:
        description: The length of each evergreen extension period relative to the effective date of the
          preceding contract.
        range: RelativeDateOffset
        required: true
      noticeDeadlinePeriod:
        description: Defines the minimum period before an evergreen is scheduled to terminate that notice
          can be given that it will terminate beyond the scheduled termination date.
        range: RelativeDateOffset
      noticeDeadlineDateTime:
        description: A specific date and time for the notice deadline
        range: datetime
      extensionFrequency:
        description: The frequency with which the evergreen contract will be extended if notice is not
          given.
        range: AdjustableRelativeOrPeriodicDates
        required: true
      finalPeriodFeeAdjustment:
        description: An optional adjustment to the rate for the last period of the evergreen i.e. the
          period from when notice is given to stop rolling the contract through to the termination date.
        range: Price
  ExerciseFee:
    is_a: PayerReceiver
    description: A class defining the fee payable on exercise of an option. This fee may be defined as
      an amount or a percentage of the notional exercised. As a difference with FpML, it extends the BuyerSeller
      class.
    attributes:
      notionalReference:
        description: A pointer style reference to the associated notional schedule defined elsewhere in
          the document.
        range: Money
        required: true
        annotations:
          rosetta_metadata: reference
      feeAmount:
        description: The amount of fee to be paid on exercise. The fee currency is that of the referenced
          notional.
        range: decimal
      feeRate:
        description: A fee represented as a percentage of some referenced notional. A percentage of 5%
          would be represented as 0.05.
        range: decimal
      feePaymentDate:
        description: The date on which exercise fee(s) will be paid. It is specified as a relative date.
        range: RelativeDateOffset
        required: true
    all_of:
      - description: 'ExerciseFeeChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              feeAmount:
                value_presence: PRESENT
          - slot_conditions:
              feeRate:
                value_presence: PRESENT
  ExerciseFeeSchedule:
    is_a: PayerReceiver
    description: A class to define a fee or schedule of fees to be payable on the exercise of an option.
      This fee may be defined as an amount or a percentage of the notional exercised. As a difference
      with FpML, it extends the BuyerSeller class.
    attributes:
      notionalReference:
        description: A pointer style reference to the associated notional schedule defined elsewhere in
          the document.
        range: Money
        required: true
        annotations:
          rosetta_metadata: reference
      feeAmountSchedule:
        description: The exercise fee amount schedule. The fees are expressed as currency amounts. The
          currency of the fee is assumed to be that of the notional schedule referenced.
        range: AmountScheduleWithInitialValue
      feeRateSchedule:
        description: The exercise free rate schedule. The fees are expressed as percentage rates of the
          notional being exercised. The currency of the fee is assumed to be that of the notional schedule
          referenced.
        range: ScheduleWithInitialValue
      feePaymentDate:
        description: The date on which exercise fee(s) will be paid. It is specified as a relative date.
        range: RelativeDateOffset
        required: true
    all_of:
      - description: 'ExerciseFeeScheduleChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              feeAmountSchedule:
                value_presence: PRESENT
          - slot_conditions:
              feeRateSchedule:
                value_presence: PRESENT
  ExerciseNotice:
    description: Defines to whom and where notice of execution should be given. The exerciseNoticeGiver
      refers to one or both of the principal parties of the trade. If present the exerciseNoticeReceiver
      refers to a party, other than the principal party, to whom notice should be given.
    attributes:
      exerciseNoticeGiver:
        description: Specifies the principal party of the trade that has the right to exercise.
        range: ExerciseNoticeGiverEnum
        required: true
      exerciseNoticeReceiver:
        description: Specifies the party to which notice of exercise should be given, e.g. by the buyer
          of the option. Although in many cases it is the buyer of the option who sends the exercise notice
          to the seller of the option, this component is reused, e.g. in case of OptionEarlyTermination,
          either or both parties have the right to exercise.
        range: AncillaryRoleEnum
      businessCenter:
        description: Specifies the location where the exercise must be reported, e.g. where the exercise
          notice receiver is based.
        range: BusinessCenter
        required: true
        annotations:
          rosetta_metadata: scheme
  ExercisePeriod:
    description: This defines the time interval to the start of the exercise period, i.e. the earliest
      exercise date, and the frequency of subsequent exercise dates (if any).
    attributes:
      earliestExerciseDateTenor:
        description: The time interval to the first (and possibly only) exercise date in the exercise
          period.
        range: Period
        required: true
      exerciseFrequency:
        description: The frequency of subsequent exercise dates in the exercise period following the earliest
          exercise date. An interval of 1 day should be used to indicate an American style exercise period.
        range: Period
    annotations:
      rosetta_metadata: key
  ExerciseProcedure:
    description: A class describing how notice of exercise should be given. This can be either manual
      or automatic.
    attributes:
      manualExercise:
        description: Specifies that the notice of exercise must be given by the buyer to the seller or
          seller's agent.
        range: ManualExercise
      automaticExercise:
        description: If automatic is specified, then the notional amount of the underlying swap not previously
          exercised under the swaption will be automatically exercised at the expiration time on the expiration
          date if at such time the buyer is in-the-money, provided that the difference between the settlement
          rate and the fixed rate under the relevant underlying swap is not less than the specified threshold
          rate. The term in-the-money is assumed to have the meaning defining in the 2000 ISDA Definitions,
          Section 17.4 In-the-money.
        range: AutomaticExercise
      followUpConfirmation:
        description: A flag to indicate whether follow-up confirmation of exercise (written or electronic)
          is required following telephonic notice by the buyer to the seller or seller's agent.
        range: boolean
        required: true
      limitedRightToConfirm:
        description: Has the meaning defined as part of the 1997 ISDA Government Bond Option Definitions,
          section 4.5 Limited Right to Confirm Exercise. If present, (i) the Seller may request the Buyer
          to confirm its intent if not done on or before the expiration time on the Expiration date (ii)
          specific rules will apply in relation to the settlement mode.
        range: boolean
      splitTicket:
        description: Typically applicable to the physical settlement of bond and convertible bond options.
          If present, means that the party required to deliver the bonds will divide those to be delivered
          as notifying party desires to facilitate delivery obligations.
        range: boolean
    all_of:
      - description: 'ExerciseProcedureChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              manualExercise:
                value_presence: PRESENT
          - slot_conditions:
              automaticExercise:
                value_presence: PRESENT
  ExerciseTerms:
    description: A class defining the exercise period for an option together with any rules governing
      the notional amount of the underlying which can be exercised on any given exercise date and any
      associated exercise fees.
    attributes:
      style:
        description: Whether the option has a single exercise (european), multiple exercise dates (bermuda),
          or a continuous range of exercise (american).
        range: OptionExerciseStyleEnum
      commencementDate:
        description: The first day of the exercise period for an American style option.
        range: AdjustableOrRelativeDate
      exerciseDates:
        description: The dates that define the Bermuda option exercise dates and the expiration date.
          The last specified date is assumed to be the expiration date. The dates can either be specified
          as a series of explicit dates and associated adjustments or as a series of dates defined relative
          to another schedule of dates, for example, the calculation period start dates. Where a relative
          series of dates are defined the first and last possible exercise dates can be separately specified.
        range: AdjustableOrRelativeDates
      expirationDate:
        description: The last day within an exercise period for an American style option. For a European
          style option it is the only day within the exercise period.
        range: AdjustableOrRelativeDate
        multivalued: true
      relevantUnderlyingDate:
        description: The effective date on the underlying product if the option is exercised. For example,
          for a swaption it is the swap effective date, for an option on an FX spot or forward it is the
          value date for settlement, and in an extendible/cancelable provision it is the swap termination
          date, which is the date on which the termination is effective.'
        range: AdjustableOrRelativeDates
      earliestExerciseTime:
        description: The earliest time at which notice of exercise can be given by the buyer to the seller
          (or seller's agent) to, and including, the expiration date.
        range: BusinessCenterTime
      latestExerciseTime:
        description: For a Bermuda or American style option, the latest time on an exercise business day
          (excluding the expiration date) within the exercise period that notice can be given by the buyer
          to the seller or seller's agent. Notice of exercise given after this time will be deemed to
          have been given on the next exercise business day.
        range: BusinessCenterTime
      expirationTime:
        description: The latest time for exercise on expirationDate. It is made mandatory given that for
          all option styles, this field is required.
        range: BusinessCenterTime
      expirationTimeType:
        description: The time of day at which the equity option expires, for example the official closing
          time of the exchange.
        range: ExpirationTimeTypeEnum
        required: true
      multipleExercise:
        description: As defined in the 2000 ISDA Definitions, Section 12.4. Multiple Exercise, the buyer
          of the option has the right to exercise all or less than all the unexercised notional amount
          of the underlying swap on one or more days in the exercise period, but on any such day may not
          exercise less than the minimum notional amount or more that the maximum notional amount, and
          if an integral multiple amount is specified, the notional amount exercised must be equal to,
          or be an integral multiple of, the integral multiple amount.
        range: MultipleExercise
      exerciseFeeSchedule:
        description: The fees associated with an exercise date. The fees are conditional on the exercise
          occurring. The fees can be specified as actual currency amounts or as percentages of the notional
          amount being exercised.
        range: ExerciseFeeSchedule
      exerciseProcedure:
        description: The set of parameters defining the procedure associated with the exercise, e.g. manual
          exercise.
        range: ExerciseProcedure
      exerciseFee:
        description: A fee to be paid on exercise. This could be represented as an amount or a rate and
          notional reference on which to apply the rate.
        range: ExerciseFee
      partialExercise:
        description: As defined in the 2000 ISDA Definitions, Section 12.3. Partial Exercise, the buyer
          of the option has the right to exercise all or less than all the notional amount of the underlying
          swap on the expiration date, but may not exercise less than the minimum notional amount, and
          if an integral multiple amount is specified, the notional amount exercised must be equal to,
          or be an integral multiple of, the integral multiple amount.
        range: PartialExercise
    all_of:
      - description: 'ExerciseDateExpirationDateChoice: Required choice rule between exercise dates and
          expiration date. The exerciseDates field can be used to extract the expiration date of a bermuda
          option, while the expirationDate field refers to the expiration date of an american or european
          option.'
        exactly_one_of:
          - slot_conditions:
              exerciseDates:
                value_presence: PRESENT
          - slot_conditions:
              expirationDate:
                value_presence: PRESENT
    rules:
      - description: 'CommencementAndExpirationDate: Condition to check that expiration date is present
          when commencement date is present.'
        preconditions:
          slot_conditions:
            commencementDate:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            expirationDate:
              value_presence: PRESENT
      - description: 'EuropeanExercise: Condition to check that only fields expected for a european option
          are present.'
        preconditions:
          slot_conditions:
            style:
              equals_string: European
        postconditions:
          slot_conditions:
            expirationDate:
              value_presence: PRESENT
            exerciseFeeSchedule:
              value_presence: ABSENT
            multipleExercise:
              value_presence: ABSENT
            latestExerciseTime:
              value_presence: ABSENT
            commencementDate:
              value_presence: ABSENT
      - description: 'BermudaExercise: Condition to check that only fields expected for a bermuda option
          are present.'
        preconditions:
          slot_conditions:
            style:
              equals_string: Bermuda
        postconditions:
          slot_conditions:
            exerciseDates:
              value_presence: PRESENT
            earliestExerciseTime:
              value_presence: PRESENT
            partialExercise:
              value_presence: ABSENT
            exerciseFee:
              value_presence: ABSENT
    annotations:
      rosetta_metadata: key
    comments:
      - 'Rosetta condition AmericanExercise is not stated in LinkML: if style = OptionExerciseStyleEnum
        -> American then commencementDate exists and exerciseFee is absent and partialExercise is absent
        and expirationDate count = 1'
      - 'Rosetta condition ExpirationTimeChoice is not stated in LinkML: (if expirationTime exists then
        expirationTimeType = ExpirationTimeTypeEnum -> SpecificTime and if expirationTimeType = ExpirationTimeTypeEnum
        -> SpecificTime then expirationTime exists)'
  ExtendibleProvision:
    is_a: BuyerSeller
    description: 'A data defining: an option to extend an existing swap transaction on the specified exercise
      dates for a term ending on the specified new termination date. As a difference from FpML, it extends
      the BuyerSeller class, which represents the BuyerSeller.model.'
    attributes:
      exerciseNotice:
        description: Definition of the party to whom notice of exercise should be given.
        range: ExerciseNotice
      followUpConfirmation:
        description: A flag to indicate whether follow-up confirmation of exercise (written or electronic)
          is required following telephonic notice by the buyer to the seller or seller's agent.
        range: boolean
      extendibleProvisionAdjustedDates:
        description: The adjusted dates associated with an extendible provision. These dates have been
          adjusted for any applicable business day convention.
        range: ExtendibleProvisionAdjustedDates
      callingParty:
        range: CallingPartyEnum
      singlePartyOption:
        description: If the ability to extend the contract is not available to both parties then this
          component specifies the buyer and seller of the option.
        range: PartyRole
      noticeDeadlinePeriod:
        description: Defines the minimum period before a contract is scheduled to terminate that notice
          can be given that it will terminate beyond the scheduled termination date.
        range: RelativeDateOffset
      noticeDeadlineDateTime:
        description: A specific date and time for the notice deadline
        range: datetime
      extensionTerm:
        description: The length of each extension period relative to the effective date of the preceding
          contract.
        range: RelativeDateOffset
      extensionPeriod:
        description: The period within which notice can be given that the contract will be extended.
        range: AdjustableRelativeOrPeriodicDates
      exerciseTerms:
        description: The exercise terms associated with the extendible provision, including details such
          as exercise style, exercise fees, and any other relevant conditions or terms governing the extension
          of the swap transaction.
        range: ExerciseTerms
        required: true
    comments:
      - 'Rosetta condition ExtendibleProvisionExerciseNoticeReceiverParty is not stated in LinkML: if
        exerciseNotice -> exerciseNoticeReceiver exists then exerciseNotice -> exerciseNoticeReceiver
        = AncillaryRoleEnum -> ExerciseNoticeReceiverPartyExtendibleProvision'
  ExtendibleProvisionAdjustedDates:
    description: 'A data defining: the adjusted dates associated with a provision to extend a swap.'
    attributes:
      extensionEvent:
        description: The adjusted dates associated with a single extendible exercise date.
        range: ExtensionEvent
        required: true
        multivalued: true
  ExtensionEvent:
    description: 'A data to: define the adjusted dates associated with an individual extension event.'
    attributes:
      adjustedExerciseDate:
        description: The date on which option exercise takes place. This date should already be adjusted
          for any applicable business day convention.
        range: date
        required: true
      adjustedExtendedTerminationDate:
        description: The termination date if an extendible provision is exercised. This date should already
          be adjusted for any applicable business day convention.
        range: date
        required: true
    annotations:
      rosetta_metadata: key
    comments:
      - 'Rosetta condition FpML_ird_42 is not stated in LinkML: adjustedExerciseDate < adjustedExtendedTerminationDate'
  FixedPricePayout:
    is_a: PayoutBase
    description: Represents a fixed price payout. There is no underlier associated with this payout type
      and is based on fixed pricing per a given unit (e.g. in commodities price per barrel)
    attributes:
      paymentDates:
        description: Specifies the parameters to generate the payment date schedule, either through a
          parametric representation or by reference to specified dates.
        range: PaymentDates
        required: true
      fixedPrice:
        description: Specifies the fixed price on which fixed forward payments are based.
        range: FixedPrice
        required: true
      schedule:
        description: Allows the full representation of a payout by defining a set of schedule periods.
          It supports standard schedule customization by expressing all the dates, quantities, and pricing
          data in a non-parametric way.
        range: CalculationSchedule
    all_of:
      - description: 'Quantity: When there is an OptionPayout the quantity can be expressed as part of
          the payoutQuantity, or as part of the underlier in the case of a Swaption. For all other payouts
          that extend PayoutBase the payoutQuantity is a mandatory attribute.'
        slot_conditions:
          priceQuantity:
            value_presence: PRESENT
  FxFeature:
    description: A type for defining FX Features.
    attributes:
      referenceCurrency:
        description: Specifies the reference currency of the trade.
        range: string
        required: true
        annotations:
          rosetta_metadata: id scheme
      composite:
        description: 'If ''Composite'' is specified as the Settlement Type in the relevant Transaction
          Supplement, an amount in the Settlement Currency, determined by the Calculation Agent as being
          equal to the number of Options exercised or deemed exercised, multiplied by: (Settlement Price
          – Strike Price) / (Strike Price – Settlement Price) x Multiplier provided that if the above
          is equal to a negative amount the Option Cash Settlement Amount shall be deemed to be zero.'
        range: Composite
      quanto:
        description: If 'Quanto' is specified as the Settlement Type in the relevant Transaction Supplement,
          an amount, as determined by the Calculation Agent in accordance with the Section 8.2 of the
          Equity Definitions.
        range: Quanto
      crossCurrency:
        description: 'If ''Cross-Currency'' is specified as the Settlement Type in the relevant Transaction
          Supplement, an amount in the Settlement Currency, determined by the Calculation Agent as being
          equal to the number of Options exercised or deemed exercised, multiplied by: (Settlement Price
          – Strike Price) / (Strike Price – Settlement Price) x Multiplier x one unit of the Reference
          Currency converted into an amount in the Settlement Currency using the rate of exchange of the
          Settlement Currency as quoted on the Reference Price Source on the Valuation Date, provided
          that if the above is equal to a negative amount the Option Cash Settlement Amount shall be deemed
          to be zero.'
        range: Composite
    all_of:
      - description: 'FxFeatureChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              composite:
                value_presence: PRESENT
          - slot_conditions:
              quanto:
                value_presence: PRESENT
          - slot_conditions:
              crossCurrency:
                value_presence: PRESENT
  MandatoryEarlyTermination:
    description: 'A data to: define an early termination provision for which exercise is mandatory.'
    attributes:
      mandatoryEarlyTerminationDate:
        description: The early termination date associated with a mandatory early termination of a swap.
        range: AdjustableDate
        required: true
      calculationAgent:
        description: The ISDA Calculation Agent responsible for performing duties associated with an optional
          early termination.
        range: CalculationAgent
        required: true
      cashSettlement:
        description: If specified, this means that cash settlement is applicable to the transaction and
          defines the parameters associated with the cash settlement procedure. If not specified, then
          physical settlement is applicable.
        range: SettlementTerms
        required: true
      mandatoryEarlyTerminationAdjustedDates:
        description: The adjusted dates associated with a mandatory early termination provision. These
          dates have been adjusted for any applicable business day convention.
        range: MandatoryEarlyTerminationAdjustedDates
    annotations:
      rosetta_metadata: key
    comments:
      - 'Rosetta condition MandatoryEarlyTerminationCalculationAgent is not stated in LinkML: if calculationAgent
        -> calculationAgentParty exists then calculationAgent -> calculationAgentParty = AncillaryRoleEnum
        -> CalculationAgentMandatoryEarlyTermination'
  MandatoryEarlyTerminationAdjustedDates:
    description: 'A data defining: the adjusted dates associated with a mandatory early termination provision.'
    attributes:
      adjustedEarlyTerminationDate:
        description: The early termination date that is applicable if an early termination provision is
          exercised. This date should already be adjusted for any applicable business day convention.
        range: date
        required: true
      adjustedCashSettlementValuationDate:
        description: The date by which the cash settlement amount must be agreed. This date should already
          be adjusted for any applicable business day convention.
        range: date
        required: true
      adjustedCashSettlementPaymentDate:
        description: The date on which the cash settlement amount is paid. This date should already be
          adjusted for any applicable business date convention.
        range: date
        required: true
    comments:
      - 'Rosetta condition FpML_ird_44 is not stated in LinkML: adjustedEarlyTerminationDate <= adjustedCashSettlementValuationDate
        and adjustedCashSettlementValuationDate <= adjustedCashSettlementPaymentDate'
  ManualExercise:
    description: A class defining manual exercise, i.e. that the option buyer counterparty must give notice
      to the option seller of exercise.
    attributes:
      exerciseNotice:
        description: Definition of the party to whom notice of exercise should be given.
        range: ExerciseNotice
      fallbackExercise:
        description: If fallback exercise is specified then the notional amount of the underlying swap,
          not previously exercised under the swaption, will be automatically exercised at the expiration
          time on the expiration date if at such time the buyer is in-the-money, provided that the difference
          between the settlement rate and the fixed rate under the relevant underlying swap is not less
          than one tenth of a percentage point (0.10% or 0.001). The term in-the-money is assumed to have
          the meaning defined in the 2000 ISDA Definitions, Section 17.4. In-the-money.
        range: boolean
    comments:
      - 'Rosetta condition ManualExerciseNoticeReceiverParty is not stated in LinkML: if exerciseNotice
        -> exerciseNoticeReceiver exists then exerciseNotice -> exerciseNoticeReceiver = AncillaryRoleEnum
        -> ExerciseNoticeReceiverPartyManual'
  MultipleExercise:
    is_a: PartialExercise
    description: A class defining multiple exercises. As defined in the 2000 ISDA Definitions, Section
      12.4. Multiple Exercise, the buyer of the option has the right to exercise all or less than all
      the unexercised notional amount of the underlying swap on one or more days in the exercise period,
      but on any such day may not exercise less than the minimum notional amount or more than the maximum
      notional amount, and if an integral multiple amount is specified, the notional exercised must be
      equal to or, be an integral multiple of, the integral multiple amount. In FpML, MultipleExercise
      is built upon the PartialExercise.model.
    attributes:
      maximumNotionalAmount:
        description: The maximum notional amount that can be exercised on a given exercise date.
        range: decimal
      maximumNumberOfOptions:
        description: The maximum number of options that can be exercised on a given exercise date. If
          the number is not specified, it means that the maximum number of options corresponds to the
          remaining unexercised options.
        range: integer
    all_of:
      - description: 'From PartialExercise. MinimumChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              minimumNotionalAmount:
                value_presence: PRESENT
          - slot_conditions:
              minimumNumberOfOptions:
                value_presence: PRESENT
      - description: 'MaximumChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              maximumNotionalAmount:
                value_presence: PRESENT
          - slot_conditions:
              maximumNumberOfOptions:
                value_presence: PRESENT
    rules:
      - description: 'MaximumNumberOfOptions: FpML MultipleExercise construct specifies the maximumNumberOfOptions
          as a positive integer.'
        preconditions:
          slot_conditions:
            maximumNumberOfOptions:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            maximumNotionalAmount:
              minimum_value: 0
      - description: 'MinimumNumberOfOptions: FpML MultipleExercise construct specifies the minimumNumberOfOptions
          as a positive integer.'
        preconditions:
          slot_conditions:
            minimumNumberOfOptions:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            minimumNumberOfOptions:
              minimum_value: 0
  NonTransferableProduct:
    description: A data type to specify the financial product's economic terms, alongside the product
      identification and product taxonomy. The non-transferable product data type represents a product
      that can be traded (as part of a TradableProduct) but cannot be transferred to others. It is meant
      to be used across the pre-execution, execution and (as part of the Contract) post-execution lifecycle
      contexts.
    attributes:
      identifier:
        description: Comprises a identifier and a source to uniquely identify the nonTransferableProduct.
        range: ProductIdentifier
        multivalued: true
      taxonomy:
        description: Specifies the product taxonomy, which is composed of a taxonomy value and a taxonomy
          source.
        range: ProductTaxonomy
        multivalued: true
      economicTerms:
        description: The price forming features, including payouts and provisions.
        range: EconomicTerms
        required: true
    annotations:
      rosetta_metadata: key
    comments:
      - 'Rosetta condition PrimaryAssetClass is not stated in LinkML: if economicTerms -> nonStandardisedTerms
        = True then taxonomy -> primaryAssetClass exists'
  OptionFeature:
    description: Defines additional optional features that can be included in an option contract.
    attributes:
      fxFeature:
        description: Describes a quanto or composite FX feature.
        range: FxFeature
        multivalued: true
      strategyFeature:
        description: Defines a simple strategy feature.
        range: StrategyFeature
      averagingFeature:
        description: Defines an option feature in which an average market observation price is determined
          on valuation and compared to the strike to determine a settlement amount.
        range: AveragingFeature
      barrier:
        description: Specifies a barrier feature.
        range: Barrier
      passThrough:
        description: Specifies the rules for pass-through payments from the underlier, such as dividends.
        range: PassThrough
  OptionPayout:
    is_a: PayoutBase
    description: The option payout specification terms. The associated globalKey denotes the ability to
      associate a hash value to the respective OptionPayout instantiation for the purpose of model cross-referencing,
      in support of functionality such as the event effect and the lineage.
    attributes:
      buyerSeller:
        range: BuyerSeller
        required: true
      feature:
        description: The option feature, such as quanto, Asian, barrier, knock.
        range: OptionFeature
      observationTerms:
        description: Class containing terms that are associated with observing a price/benchmark/index
          across either single or multple observations. To be used for option contracts that reference
          a benchmark price.
        range: ObservationTerms
      schedule:
        description: Allows the full representation of a payout by defining a set of schedule periods.
          It supports standard schedule customization by expressing all the dates, quantities, and pricing
          data in a non-parametric way.
        range: CalculationSchedule
      delivery:
        description: Contains the information relative to the delivery of the asset.
        range: AssetDeliveryInformation
      underlier:
        description: The financial product underlying the option, which can be of any type including an
          Asset, Basket, Index or a NonTransferableProduct.
        range: Underlier
        required: true
      optionType:
        description: The type of option transaction. From a usage standpoint, put/call is the default
          option type, while payer/receiver indicator is used for options on index credit default swaps,
          consistently with the industry practice. Straddle is used for the case of straddle strategy,
          that combine a call and a put with the same strike.
        range: OptionTypeEnum
      exerciseTerms:
        description: The terms for exercising the option, which include the option style (e.g. American
          style option), the exercise procedure (e.g. manual exercise) and the settlement terms (e.g.
          physical vs. cash).
        range: ExerciseTerms
        required: true
      strike:
        description: Specifies the strike of the option
        range: OptionStrike
    comments:
      - 'Rosetta condition AsianOptionChoice_averagingStrikeFeature is not stated in LinkML: if strike
        -> averagingStrikeFeature exists then feature -> averagingFeature is absent'
      - 'Rosetta condition AsianOptionChoice_averagingFeature is not stated in LinkML: if feature -> averagingFeature
        exists then strike -> averagingStrikeFeature is absent'
      - 'Rosetta condition ClearedPhysicalSettlementExists is not stated in LinkML: if settlementTerms
        -> physicalSettlementTerms exists and underlier as Product ->> economicTerms -> payout as InterestRatePayout
        exists and underlier as Product ->> economicTerms -> payout as InterestRatePayout count = 2 then
        settlementTerms -> physicalSettlementTerms -> clearedPhysicalSettlement exists'
      - 'Rosetta condition DeliveryCapacity is not stated in LinkML: if delivery -> deliveryCapacity exists
        then schedule -> schedulePeriod -> deliveryPeriod -> deliveryCapacity is absent and delivery ->
        periods -> profile -> block -> deliveryCapacity is absent and schedule -> schedulePeriod -> deliveryPeriod
        -> profile -> block -> deliveryCapacity is absent else if schedule -> schedulePeriod -> deliveryPeriod
        -> deliveryCapacity exists then delivery -> deliveryCapacity is absent and delivery -> periods
        -> profile -> block -> deliveryCapacity is absent and schedule -> schedulePeriod -> deliveryPeriod
        -> profile -> block -> deliveryCapacity is absent else if delivery -> periods -> profile -> block
        -> deliveryCapacity exists then schedule -> schedulePeriod -> deliveryPeriod -> deliveryCapacity
        is absent and schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> deliveryCapacity
        is absent else if schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> deliveryCapacity
        exists then delivery -> deliveryCapacity is absent and schedule -> schedulePeriod -> deliveryPeriod
        -> deliveryCapacity is absent and delivery -> periods -> profile -> block -> deliveryCapacity
        is absent'
      - 'Rosetta condition PriceTimeIntervalQuantity is not stated in LinkML: if schedule -> schedulePeriod
        -> deliveryPeriod -> priceTimeIntervalQuantity exists then delivery -> periods -> profile -> block
        -> priceTimeIntervalQuantity is absent and schedule -> schedulePeriod -> deliveryPeriod -> profile
        -> block -> priceTimeIntervalQuantity is absent else if delivery -> periods -> profile -> block
        -> priceTimeIntervalQuantity exists then schedule -> schedulePeriod -> deliveryPeriod -> priceTimeIntervalQuantity
        is absent and schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> priceTimeIntervalQuantity
        is absent else if schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> priceTimeIntervalQuantity
        exists then schedule -> schedulePeriod -> deliveryPeriod -> priceTimeIntervalQuantity is absent
        and delivery -> periods -> profile -> block -> priceTimeIntervalQuantity is absent'
      - 'Rosetta condition OptionStylePresent is not stated in LinkML: exerciseTerms -> style exists'
      - 'Rosetta condition OptionTypePresent is not stated in LinkML: if underlier as NonTransferableProduct
        is absent then optionType exists'
      - 'Rosetta condition SettlementCentreRequired is not stated in LinkML: if underlier as Security
        exists then (settlementTerms -> securitySettlementCentre exists and settlementTerms -> cashSettlementCentre
        exists)'
  OptionStrike:
    description: Defines the strike price of an option.
    attributes:
      strikePrice:
        description: Defines the strike of an option in the form of a price that could be a cash price,
          interestRate, or other types.
        range: Price
      strikeReference:
        description: Defines the strike of an option in reference to the spread of the underlying swap
          (typical practice in the case of an option on a credit single name swaps).
        range: FixedRateSpecification
        annotations:
          rosetta_metadata: reference
      referenceSwapCurve:
        description: Defines the strike of an option when expressed by reference to a swap curve (Typically
          the case for a convertible bond option).
        range: ReferenceSwapCurve
      averagingStrikeFeature:
        description: Defines an option strike that is calculated from an average of observed market prices.
        range: AveragingStrikeFeature
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              strikePrice:
                value_presence: PRESENT
          - slot_conditions:
              strikeReference:
                value_presence: PRESENT
          - slot_conditions:
              referenceSwapCurve:
                value_presence: PRESENT
          - slot_conditions:
              averagingStrikeFeature:
                value_presence: PRESENT
  OptionalEarlyTermination:
    description: 'A data defining: an early termination provision where either or both parties have the
      right to exercise.'
    attributes:
      singlePartyOption:
        description: If optional early termination is not available to both parties then this component
          specifies the buyer and seller of the option. In FpML, this attribute is of type SinglePsrtyOption,
          which actually consists of the BuyerSeller.model.
        range: BuyerSeller
      mutualEarlyTermination:
        description: Used for specifying whether the Mutual Early Termination Right that is detailed in
          the Master Confirmation will apply.
        range: boolean
      exerciseNotice:
        description: Definition of the party to whom notice of exercise should be given.
        range: ExerciseNotice
        multivalued: true
      followUpConfirmation:
        description: A flag to indicate whether follow-up confirmation of exercise (written or electronic)
          is required following telephonic notice by the buyer to the seller or seller's agent.
        range: boolean
      calculationAgent:
        description: The ISDA Calculation Agent responsible for performing duties associated with an optional
          early termination.
        range: CalculationAgent
      cashSettlement:
        description: If specified, this means that cash settlement is applicable to the transaction and
          defines the parameters associated with the cash settlement procedure. If not specified, then
          physical settlement is applicable.
        range: SettlementTerms
      optionalEarlyTerminationAdjustedDates:
        description: An early termination provision to terminate the trade at fair value where one or
          both parties have the right to decide on termination.
        range: OptionalEarlyTerminationAdjustedDates
      exerciseTerms:
        description: The exercise terms associated with the optional early termination, including details
          such as exercise style, exercise fees, and any other relevant conditions or terms.
        range: ExerciseTerms
        required: true
    comments:
      - 'Rosetta condition OptionalEarlyTerminationExerciseNoticeReceiverParty is not stated in LinkML:
        if exerciseNotice -> exerciseNoticeReceiver exists then exerciseNotice -> exerciseNoticeReceiver
        contains AncillaryRoleEnum -> ExerciseNoticeReceiverPartyOptionalEarlyTermination'
      - 'Rosetta condition MandatoryEarlyTerminationCalculationAgent is not stated in LinkML: if calculationAgent
        -> calculationAgentParty exists then calculationAgent -> calculationAgentParty = AncillaryRoleEnum
        -> CalculationAgentOptionalEarlyTermination'
  OptionalEarlyTerminationAdjustedDates:
    description: 'A data defining: the adjusted dates associated with an optional early termination provision.'
    attributes:
      earlyTerminationEvent:
        description: The adjusted dates associated with an individual early termination date.
        range: EarlyTerminationEvent
        required: true
        multivalued: true
  PartialExercise:
    description: A class defining partial exercise. As defined in the 2000 ISDA Definitions, Section 12.3
      Partial Exercise, the buyer of the option may exercise all or less than all the notional amount
      of the underlying swap but may not be less than the minimum notional amount (if specified) and must
      be an integral multiple of the integral multiple amount if specified.
    attributes:
      notionalReference:
        description: A pointer style reference to the associated notional schedule defined elsewhere in
          the document. This element has been made optional as part of its integration in the OptionBaseExtended,
          because not required for the options on securities.
        range: Money
        annotations:
          rosetta_metadata: reference
      integralMultipleAmount:
        description: A notional amount which restricts the amount of notional that can be exercised when
          partial exercise or multiple exercise is applicable. The integral multiple amount defines a
          lower limit of notional that can be exercised and also defines a unit multiple of notional that
          can be exercised, i.e. only integer multiples of this amount can be exercised.
        range: decimal
      minimumNotionalAmount:
        description: The minimum notional amount that can be exercised on a given exercise date. See multipleExercise.
        range: decimal
      minimumNumberOfOptions:
        description: The minimum number of options that can be exercised on a given exercise date.
        range: integer
    all_of:
      - description: 'MinimumChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              minimumNotionalAmount:
                value_presence: PRESENT
          - slot_conditions:
              minimumNumberOfOptions:
                value_presence: PRESENT
  PassThrough:
    description: Type which contains pass through payments.
    attributes:
      passThroughItem:
        description: One to many pass through payment items.
        range: PassThroughItem
        required: true
        multivalued: true
  PassThroughItem:
    description: Class to represent a single pass through payment.
    attributes:
      payerReceiver:
        description: This attribute doesn't exists in the FpML construct, which makes use of the PayerReceiver.model
          group.
        range: PayerReceiver
        required: true
      passThroughPercentage:
        description: Percentage of payments from the underlier which are passed through.
        range: decimal
        required: true
  Payout:
    description: 'Represents the set of future cashflow methodologies in the form of specific payout data
      type(s) which result from the financial product. Examples: a trade in a cash asset will use only
      a settlement payout; for derivatives, two interest rate payouts can be combined to specify an interest
      rate swap; one interest rate payout can be combined with a credit default payout to specify a credit
      default swap.'
    attributes:
      AssetPayout:
        description: Defines the assets and movements in a security financing transaction.
        range: AssetPayout
      CommodityPayout:
        description: Defines the payout for the floating leg of a Commodity Swap.
        range: CommodityPayout
      CreditDefaultPayout:
        description: The credit default payout, which provides the details necessary for determining when
          a credit payout will be triggered as well as the parameters for calculating the payout and the
          settlement terms.
        range: CreditDefaultPayout
      FixedPricePayout:
        description: Defines a payout in which one or more payouts are defined as a fixed price.
        range: FixedPricePayout
      InterestRatePayout:
        description: All of the terms necessary to define and calculate a cash flow based on a fixed,
          a floating or an inflation index rate. The interest rate payout can be applied to interest rate
          swaps and FRA (which both have two associated interest rate payouts), credit default swaps (to
          represent the fee leg when subject to periodic payments) and equity swaps (to represent the
          funding leg).
        range: InterestRatePayout
      OptionPayout:
        description: The option payout.
        range: OptionPayout
      PerformancePayout:
        description: The performance payout, which encompasses the equity price returns, dividend returns,
          volatility return, variance return and correlation provisions.
        range: PerformancePayout
      SettlementPayout:
        description: Represents a forward settling payout. The 'Underlier' attribute captures the underlying
          payout, which is settled according to the 'SettlementTerms' attribute. Both FX Spot and FX Forward
          should use this component.
        range: SettlementPayout
    all_of:
      - description: 'OneOf: A choice type holds exactly one of its options.'
        exactly_one_of:
          - slot_conditions:
              AssetPayout:
                value_presence: PRESENT
          - slot_conditions:
              CommodityPayout:
                value_presence: PRESENT
          - slot_conditions:
              CreditDefaultPayout:
                value_presence: PRESENT
          - slot_conditions:
              FixedPricePayout:
                value_presence: PRESENT
          - slot_conditions:
              InterestRatePayout:
                value_presence: PRESENT
          - slot_conditions:
              OptionPayout:
                value_presence: PRESENT
          - slot_conditions:
              PerformancePayout:
                value_presence: PRESENT
          - slot_conditions:
              SettlementPayout:
                value_presence: PRESENT
    annotations:
      rosetta_choice: 'true'
  PerformancePayout:
    is_a: PayoutBase
    description: Contains the necessary specifications for all performance payouts, encompassing equity
      return, dividend, variance, volatility and correlation products.
    attributes:
      observationTerms:
        description: Defines how and when a performance type option or performance type swap is to be
          observed.
        range: ObservationTerms
      valuationDates:
        description: Defines how and when a performance type option or performance type swap is to be
          valued, including both interim and final valuation.
        range: ValuationDates
        required: true
      paymentDates:
        description: Defines the payment date schedule, as defined by the parameters that are needed to
          specify it, either in a parametric way or by reference to another schedule of dates (e.g. the
          valuation dates).
        range: PaymentDates
        required: true
      underlier:
        description: Identifies the underlying product that is referenced for pricing of the applicable
          leg in a swap. Referenced in the '2018 ISDA CDM Equity Confirmation for Security Equity Swap'
          as Security.
        range: Underlier
      fxFeature:
        description: Defines quanto or composite FX features that are included in the swap leg.
        range: FxFeature
        multivalued: true
      returnTerms:
        description: Specifies the type of return of a performance payout.
        range: ReturnTerms
      portfolioReturnTerms:
        description: Specifies an individual type of return of a Performance Payout, when such individual
          return is part of an aggregation of multiple similar returns, at Performance Payout level
        range: PortfolioReturnTerms
        multivalued: true
      initialValuationPrice:
        description: Specifies the net initial valuation price(s) of the underlier at Performance Payout
          level. This price can be expressed either as an actual amount/currency, as a determination method,
          or by reference to another value specified in the swap document.
        range: PriceSchedule
        multivalued: true
        annotations:
          rosetta_metadata: address
      interimValuationPrice:
        description: Specifies the net initial valuation price(s) of the underlier at Performance Payout
          level. This price can be expressed either as an actual amount/currency, as a determination method,
          or by reference to another value specified in the swap document.
        range: PriceSchedule
        multivalued: true
        annotations:
          rosetta_metadata: address
      finalValuationPrice:
        description: Specifies the net final valuation price(s) of the underlier at Performance Payout
          level. This price can be expressed either as an actual amount/currency, as a determination method,
          or by reference to another value specified in the swap document.
        range: PriceSchedule
        multivalued: true
        annotations:
          rosetta_metadata: address
    all_of:
      - description: PortfolioOrStraightReturn
        exactly_one_of:
          - slot_conditions:
              returnTerms:
                value_presence: PRESENT
          - slot_conditions:
              portfolioReturnTerms:
                value_presence: PRESENT
      - description: 'Quantity: When there is an OptionPayout the quantity can be expressed as part of
          the payoutQuantity, or as part of the underlier in the case of a Swaption. For all other payouts
          that extend PayoutBase the payoutQuantity is a mandatory attribute.'
        slot_conditions:
          priceQuantity:
            value_presence: PRESENT
    comments:
      - 'Rosetta condition Underlier is not stated in LinkML: underlier as Observable exists'
      - 'Rosetta condition PortfolioReturnIsMultipleReturns is not stated in LinkML: if portfolioReturnTerms
        exists then portfolioReturnTerms count > 1'
      - 'Rosetta condition UnderlierOfPortfolioIsBasket is not stated in LinkML: if portfolioReturnTerms
        -> priceReturnTerms exists then underlier as Basket exists'
      - 'Rosetta condition NoSharePriceDividendAdjustmentIndex is not stated in LinkML: if underlier as
        Index exists then returnTerms -> varianceReturnTerms -> sharePriceDividendAdjustment is absent
        and returnTerms -> volatilityReturnTerms -> sharePriceDividendAdjustment is absent'
      - 'Rosetta condition NoSharePriceDividendAdjustmentForeignExchange is not stated in LinkML: if underlier
        as ForeignExchangeRateIndex exists then returnTerms -> varianceReturnTerms -> sharePriceDividendAdjustment
        is absent and returnTerms -> volatilityReturnTerms -> sharePriceDividendAdjustment is absent'
      - 'Rosetta condition CorrelationUnderlierOnlyBasket is not stated in LinkML: if returnTerms -> correlationReturnTerms
        exists then underlier as Basket exists'
      - 'Rosetta condition EquitySpecificAttributes is not stated in LinkML: if Qualify_UnderlierObservable_Equity
        (underlier as Observable) = False then returnTerms -> varianceReturnTerms -> dividendApplicability
        is absent and returnTerms -> varianceReturnTerms -> equityUnderlierProvisions is absent and returnTerms
        -> varianceReturnTerms -> sharePriceDividendAdjustment is absent and returnTerms -> volatilityReturnTerms
        -> dividendApplicability is absent and returnTerms -> volatilityReturnTerms -> equityUnderlierProvisions
        is absent and returnTerms -> volatilityReturnTerms -> sharePriceDividendAdjustment is absent and
        returnTerms -> correlationReturnTerms -> dividendApplicability is absent and returnTerms -> correlationReturnTerms
        -> equityUnderlierProvisions is absent and returnTerms -> correlationReturnTerms -> sharePriceDividendAdjustment
        is absent'
  PortfolioReturnTerms:
    is_a: ReturnTerms
    description: Specifies an individual type of return of a Performance Payout, when such individual
      return is part of an aggregation of multiple similar returns, at Performance Payout level.
    attributes:
      payerReceiver:
        description: Canonical representation of the payer and receiver parties applicable to each individual
          return leg.
        range: PayerReceiver
        required: true
      underlier:
        description: Defines the product that is the subject of a tradable product definition, an underlying
          product definition, a physical exercise, a position, or other purposes.
        range: Observable
        required: true
        annotations:
          rosetta_metadata: address
      quantity:
        description: Specifies a quantity schedule for the underlier, which applies to each individual
          return leg.
        range: NonNegativeQuantitySchedule
        annotations:
          rosetta_metadata: address
      initialValuationPrice:
        description: Specifies the initial valuation price(s) of the underlier. This price can be expressed
          either as an actual amount/currency, as a determination method, or by reference to another value
          specified in the swap document.
        range: PriceSchedule
        multivalued: true
        annotations:
          rosetta_metadata: address
      interimValuationPrice:
        description: Specifies the initial valuation price(s) of the underlier. This price can be expressed
          either as an actual amount/currency, as a determination method, or by reference to another value
          specified in the swap document.
        range: PriceSchedule
        multivalued: true
        annotations:
          rosetta_metadata: address
      finalValuationPrice:
        description: '2018 ISDA CDM Equity Confirmation for Security Equity Swap: Final Price | Specifies
          the final valuation price of the underlier. This price can be expressed either as an actual
          amount/currency, as a determination method, or by reference to another value specified in the
          swap document.'
        range: PriceSchedule
        multivalued: true
        annotations:
          rosetta_metadata: address
    annotations:
      rosetta_metadata: key
  Product:
    description: Enables either a TransferableProduct or a NonTransferableProduct to be used in an underlier.
    attributes:
      TransferableProduct:
        description: A TransferableProduct is a type of financial product which can be held or transferred,
          represented as an Asset with the addition of specific EconomicTerms.
        range: TransferableProduct
      NonTransferableProduct:
        description: The non-transferable product data type represents a product that can be traded (as
          part of a TradableProduct) but cannot be transferred to others.
        range: NonTransferableProduct
    all_of:
      - description: 'OneOf: A choice type holds exactly one of its options.'
        exactly_one_of:
          - slot_conditions:
              TransferableProduct:
                value_presence: PRESENT
          - slot_conditions:
              NonTransferableProduct:
                value_presence: PRESENT
    annotations:
      rosetta_choice: 'true'
  Quanto:
    description: Determines the currency rate that the seller of the equity amounts will apply at each
      valuation date for converting the respective amounts into a currency that is different from the
      currency denomination of the underlier.
    attributes:
      fxRate:
        description: Specifies a currency conversion rate.
        range: FxRate
        multivalued: true
      fxSpotRateSource:
        description: Specifies the methodology (reference source and, optionally, fixing time) to be used
          for determining a currency conversion rate.
        range: FxSpotRateSource
      fixingTime:
        description: The time at which the spot currency exchange rate will be observed. It is specified
          as a time in a business day calendar location, e.g. 11:00am London time.
        range: BusinessCenterTime
  RecallProvision:
    description: Defines the additional features that allow securities to be recalled by the lender before
      the term of the loan. A recall is not the same as an early termination, but may result in the early
      termination of a loan.
    attributes:
      isRecallable:
        description: Whether the securities on loan can be recalled by the lender.
        range: boolean
        required: true
      issuanceCutoffTime:
        description: The operational deadline on T+0 before which a recall must be requested. For the
          UK, best practice recommends that this would be 30 minutes before market close i.e. 16:00:00
          GMT.
        range: TimeZone
      notificationTime:
        description: The time on the day of intended settlement by which the borrower must notify the
          lender that they will be returning the requested security. For the UK, best practice recommends
          that this would be 30 minutes before the CREST DVP cut-off time i.e. 15:15:00 GMT
        range: TimeZone
      intendedSettlementDate:
        description: The intended settlement date of the recall, expressed as an offset against a relative
          date e.g. T+1. The best practice is that the borrower must make their best efforts to settle
          on T+1.
        range: RelativeDateOffset
  ReturnTerms:
    description: Specifies the type of return of a performance payout.
    attributes:
      priceReturnTerms:
        description: Return terms based upon the underlier's observed price.
        range: PriceReturnTerms
      dividendReturnTerms:
        description: Return terms based upon dividend payments associated to the underlier.
        range: DividendReturnTerms
      varianceReturnTerms:
        description: Return terms based upon the observed variance of the underlier's price.
        range: VarianceReturnTerms
      volatilityReturnTerms:
        description: Return terms based upon the observed volatility of the underlier's price.
        range: VolatilityReturnTerms
      correlationReturnTerms:
        description: Return terms based upon the observed correlation between the components of the underlying
          basket.
        range: CorrelationReturnTerms
    comments:
      - 'Rosetta condition ReturnTermsExists is not stated in LinkML: if priceReturnTerms -> returnType
        = ReturnTypeEnum -> Total then (priceReturnTerms, dividendReturnTerms) only exists else if priceReturnTerms
        -> returnType = ReturnTypeEnum -> Price then priceReturnTerms only exists else priceReturnTerms
        only exists or dividendReturnTerms only exists or varianceReturnTerms only exists or volatilityReturnTerms
        only exists or correlationReturnTerms only exists'
  SchedulePeriod:
    description: A class that defines the period of a schedule. The period contains a set of start and
      end dates, quantities, fixing, and pricing data.
    attributes:
      calculationPeriod:
        description: Period for which the payment is generated.
        range: DateRange
        required: true
      paymentDate:
        description: Adjusted payment date.
        range: date
        required: true
      fixingPeriod:
        description: Period over which the underlying price is observed.
        range: DateRange
        required: true
      deliveryPeriod:
        description: Period and time profile over which the delivery takes place.
        range: CalculationScheduleDeliveryPeriods
  SettlementPayout:
    is_a: PayoutBase
    description: Represents a forward settling payout. The underlier attribute captures the underlying
      payout, which is settled according to the settlementTerms attribute (which is part of PayoutBase).
      Both FX Spot and FX Forward should use this component.
    attributes:
      underlier:
        description: The underlying financial product that will be physically or cash settled, which can
          be of any type, eg an asset such as cash or a security, or the cash settlement of an index rate.
        range: Underlier
        required: true
      deliveryTerm:
        description: Also called contract month or delivery month. However, it's not always a month. It
          is usually expressed using a code, e.g. Z23 would be the Dec 2023 contract, (Z = December).
          For crude oil, the corresponding contract might be called CLZ23.
        range: string
      delivery:
        description: Contains the information relative to the delivery of the asset.
        range: AssetDeliveryInformation
      schedule:
        description: Allows the full representation of a payout by defining a set of schedule periods.
          It supports standard schedule customization by expressing all the dates, quantities, and pricing
          data in a non-parametric way.
        range: CalculationSchedule
    comments:
      - 'Rosetta condition Underlier is not stated in LinkML: underlier as NonTransferableProduct is absent'
      - 'Rosetta condition Basket is not stated in LinkML: if underlier as Basket exists then (underlier
        as Basket -> basketConstituent extract observable as Asset exists) all = True'
      - 'Rosetta condition Index is not stated in LinkML: if underlier as Index exists then settlementTerms
        -> cashSettlementTerms exists'
      - 'Rosetta condition SettlementTerms is not stated in LinkML: if underlier as Cash exists then settlementTerms
        exists'
      - 'Rosetta condition SettlementCentreRequired is not stated in LinkML: if underlier as Security
        exists then (settlementTerms -> securitySettlementCentre exists and settlementTerms -> cashSettlementCentre
        exists)'
      - 'Rosetta condition DeliveryCapacity is not stated in LinkML: if delivery -> deliveryCapacity exists
        then schedule -> schedulePeriod -> deliveryPeriod -> deliveryCapacity is absent and delivery ->
        periods -> profile -> block -> deliveryCapacity is absent and schedule -> schedulePeriod -> deliveryPeriod
        -> profile -> block -> deliveryCapacity is absent else if schedule -> schedulePeriod -> deliveryPeriod
        -> deliveryCapacity exists then delivery -> deliveryCapacity is absent and delivery -> periods
        -> profile -> block -> deliveryCapacity is absent and schedule -> schedulePeriod -> deliveryPeriod
        -> profile -> block -> deliveryCapacity is absent else if delivery -> periods -> profile -> block
        -> deliveryCapacity exists then schedule -> schedulePeriod -> deliveryPeriod -> deliveryCapacity
        is absent and schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> deliveryCapacity
        is absent else if schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> deliveryCapacity
        exists then delivery -> deliveryCapacity is absent and schedule -> schedulePeriod -> deliveryPeriod
        -> deliveryCapacity is absent and delivery -> periods -> profile -> block -> deliveryCapacity
        is absent'
      - 'Rosetta condition PriceTimeIntervalQuantity is not stated in LinkML: if schedule -> schedulePeriod
        -> deliveryPeriod -> priceTimeIntervalQuantity exists then delivery -> periods -> profile -> block
        -> priceTimeIntervalQuantity is absent and schedule -> schedulePeriod -> deliveryPeriod -> profile
        -> block -> priceTimeIntervalQuantity is absent else if delivery -> periods -> profile -> block
        -> priceTimeIntervalQuantity exists then schedule -> schedulePeriod -> deliveryPeriod -> priceTimeIntervalQuantity
        is absent and schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> priceTimeIntervalQuantity
        is absent else if schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> priceTimeIntervalQuantity
        exists then schedule -> schedulePeriod -> deliveryPeriod -> priceTimeIntervalQuantity is absent
        and delivery -> periods -> profile -> block -> priceTimeIntervalQuantity is absent'
  StrategyFeature:
    description: A class for defining option strategy features.
    attributes:
      strikeSpread:
        description: Definition of the upper strike in a strike spread.
        range: StrikeSpread
      calendarSpread:
        description: Definition of the later expiration date in a calendar spread.
        range: CalendarSpread
  Strike:
    description: A class describing a single cap or floor rate.
    attributes:
      strikeRate:
        description: The rate for a cap or floor.
        range: decimal
        required: true
      buyer:
        description: The buyer of the option.
        range: PayerReceiverEnum
      seller:
        description: The party that has sold.
        range: PayerReceiverEnum
    annotations:
      rosetta_metadata: key
  StrikeSchedule:
    is_a: RateSchedule
    description: A class describing a schedule of cap or floor rates.
    attributes:
      buyer:
        description: The buyer of the option.
        range: PayerReceiverEnum
      seller:
        description: The party that has sold.
        range: PayerReceiverEnum
  StrikeSpread:
    description: A class for defining a strike spread feature.
    attributes:
      upperStrike:
        description: Upper strike in a strike spread.
        range: OptionStrike
        required: true
      upperStrikeNumberOfOptions:
        description: Number of options at the upper strike price in a strike spread.
        range: decimal
        required: true
  TerminationProvision:
    description: A class for defining option provisions.
    attributes:
      cancelableProvision:
        description: A provision that allows the specification of an embedded option within a swap giving
          the buyer of the option the right to terminate the swap, in whole or in part, on the early termination
          date.
        range: CancelableProvision
      earlyTerminationProvision:
        description: Parameters specifying provisions relating to the optional and mandatory early termination
          of a swap transaction.
        range: EarlyTerminationProvision
      evergreenProvision:
        description: 'A data defining: the right of a party to exercise an Evergreen option'
        range: EvergreenProvision
      extendibleProvision:
        description: A provision that allows the specification of an embedded option with a swap giving
          the buyer of the option the right to extend the swap, in whole or in part, to the extended termination
          date.
        range: ExtendibleProvision
      recallProvision:
        description: A provision defining criteria controlling the ability for a lender to recall securities
          it has lent out.
        range: RecallProvision
    all_of:
      - description: TerminationProvisionChoice
        exactly_one_of:
          - slot_conditions:
              cancelableProvision:
                value_presence: PRESENT
          - slot_conditions:
              extendibleProvision:
                value_presence: PRESENT
          - slot_conditions:
              evergreenProvision:
                value_presence: PRESENT
          - slot_conditions:
              earlyTerminationProvision:
                value_presence: PRESENT
          - slot_conditions:
              recallProvision:
                value_presence: PRESENT
  TradableProduct:
    description: Definition of a product as ready to be traded, i.e. included in an execution or contract,
      by associating a specific price and quantity to this product plus an (optional) mechanism for any
      potential future quantity adjustment.
    attributes:
      product:
        description: The underlying product to be included in a contract or execution.
        range: NonTransferableProduct
        required: true
      tradeLot:
        description: Specifies the price, quantity and effective date of each trade lot, when the same
          product may be traded multiple times in different lots with the same counterparty. In a trade
          increase, a new trade lot is added to the list, with the corresponding effective date. In a
          trade decrease, the existing trade lot(s) are decreased of the corresponding quantity (and an
          unwind fee may have to be settled). The multiple cardinality and the ability to increase existing
          trades is used for Equity Swaps in particular.
        range: TradeLot
        required: true
        multivalued: true
      counterparty:
        description: Specifies the parties which are the two counterparties to the transaction. The product
          is agnostic to the actual parties to the transaction, with the party references abstracted away
          from the product definition and replaced by the counterparty enum (e.g. CounterpartyEnum values
          Party1 or Party2). The counterparty enum can then be positioned in the product (e.g. to specify
          which counterparty is the payer, receiver etc) and this counterparties attribute, which is positioned
          outside of the product definition, allows the counterparty enum to be associated with an actual
          party reference.
        range: Counterparty
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
        annotations:
          doc_reference: ICMA GMRA namingConvention Party
      ancillaryParty:
        description: Specifies the parties with ancillary roles in the transaction. The product is agnostic
          to the actual parties involved in the transaction, with the party references abstracted away
          from the product definition and replaced by the AncillaryRoleEnum. The AncillaryRoleEnum can
          then be positioned in the product and this AncillaryParty type, which is positioned outside
          of the product definition, allows the AncillaryRoleEnum to be associated with an actual party
          reference.
        range: AncillaryParty
        multivalued: true
      adjustment:
        description: 'Specifies the conditions that govern the adjustment to the quantity of a product
          being traded: e.g. execution, portfolio rebalancing etc. It is typically used in the context
          of Equity Swaps.'
        range: NotionalAdjustmentEnum
    comments:
      - 'Rosetta condition NotionalAdjustment is not stated in LinkML: if adjustment exists then product
        -> economicTerms -> payout as PerformancePayout -> returnTerms -> priceReturnTerms exists or product
        -> economicTerms -> payout as PerformancePayout exists'
      - 'Rosetta condition PerformancePayout_ExtraordinaryDividendsParty is not stated in LinkML: if product
        -> economicTerms -> payout as PerformancePayout -> returnTerms -> dividendReturnTerms -> extraordinaryDividendsParty
        exists then ancillaryParty -> role contains AncillaryRoleEnum -> ExtraordinaryDividendsParty and
        if ancillaryParty -> role contains AncillaryRoleEnum -> ExtraordinaryDividendsParty then product
        -> economicTerms -> payout as PerformancePayout -> returnTerms -> dividendReturnTerms -> extraordinaryDividendsParty
        exists'
      - 'Rosetta condition OptionPayout_PredeterminedClearingOrganizationParty is not stated in LinkML:
        if product -> economicTerms -> payout as OptionPayout -> settlementTerms -> physicalSettlementTerms
        -> predeterminedClearingOrganizationParty exists then ancillaryParty -> role contains AncillaryRoleEnum
        -> PredeterminedClearingOrganizationParty'
      - 'Rosetta condition ForwardPayout_PredeterminedClearingOrganizationParty is not stated in LinkML:
        if product -> economicTerms -> payout as SettlementPayout -> settlementTerms -> physicalSettlementTerms
        -> predeterminedClearingOrganizationParty exists then ancillaryParty -> role contains AncillaryRoleEnum
        -> PredeterminedClearingOrganizationParty'
      - 'Rosetta condition PredeterminedClearingOrganizationParty is not stated in LinkML: if ancillaryParty
        -> role contains AncillaryRoleEnum -> PredeterminedClearingOrganizationParty then product -> economicTerms
        -> payout as SettlementPayout -> settlementTerms -> physicalSettlementTerms -> predeterminedClearingOrganizationParty
        exists or product -> economicTerms -> payout as OptionPayout -> settlementTerms -> physicalSettlementTerms
        -> predeterminedClearingOrganizationParty exists'
      - 'Rosetta condition ExerciseNoticeReceiverPartyManual is not stated in LinkML: if product -> economicTerms
        -> payout as OptionPayout -> exerciseTerms -> exerciseProcedure -> manualExercise -> exerciseNotice
        -> exerciseNoticeReceiver exists then ancillaryParty -> role contains AncillaryRoleEnum -> ExerciseNoticeReceiverPartyManual
        and if ancillaryParty -> role contains AncillaryRoleEnum -> ExerciseNoticeReceiverPartyManual
        then product -> economicTerms -> payout as OptionPayout -> exerciseTerms -> exerciseProcedure
        -> manualExercise -> exerciseNotice -> exerciseNoticeReceiver exists'
      - 'Rosetta condition ExerciseNoticeReceiverPartyOptionalEarlyTermination is not stated in LinkML:
        if product -> economicTerms -> terminationProvision -> earlyTerminationProvision -> optionalEarlyTermination
        -> exerciseNotice -> exerciseNoticeReceiver exists then ancillaryParty -> role contains AncillaryRoleEnum
        -> ExerciseNoticeReceiverPartyOptionalEarlyTermination and if ancillaryParty -> role contains
        AncillaryRoleEnum -> ExerciseNoticeReceiverPartyOptionalEarlyTermination then product -> economicTerms
        -> terminationProvision -> earlyTerminationProvision -> optionalEarlyTermination -> exerciseNotice
        -> exerciseNoticeReceiver exists'
      - 'Rosetta condition ExerciseNoticeReceiverPartyCancelableProvision is not stated in LinkML: if
        product -> economicTerms -> terminationProvision -> cancelableProvision -> exerciseNotice -> exerciseNoticeReceiver
        exists then ancillaryParty -> role contains AncillaryRoleEnum -> ExerciseNoticeReceiverPartyCancelableProvision
        and if ancillaryParty -> role contains AncillaryRoleEnum -> ExerciseNoticeReceiverPartyCancelableProvision
        then product -> economicTerms -> terminationProvision -> cancelableProvision -> exerciseNotice
        -> exerciseNoticeReceiver exists'
      - 'Rosetta condition ExerciseNoticeReceiverPartyExtendibleProvision is not stated in LinkML: if
        product -> economicTerms -> terminationProvision -> extendibleProvision -> exerciseNotice -> exerciseNoticeReceiver
        exists then ancillaryParty -> role contains AncillaryRoleEnum -> ExerciseNoticeReceiverPartyExtendibleProvision
        and if ancillaryParty -> role contains AncillaryRoleEnum -> ExerciseNoticeReceiverPartyExtendibleProvision
        then product -> economicTerms -> terminationProvision -> extendibleProvision -> exerciseNotice
        -> exerciseNoticeReceiver exists'
      - 'Rosetta condition CalculationAgentIndependent is not stated in LinkML: if product -> economicTerms
        -> calculationAgent -> calculationAgentParty exists then ancillaryParty -> role contains AncillaryRoleEnum
        -> CalculationAgentIndependent and if ancillaryParty -> role contains AncillaryRoleEnum -> CalculationAgentIndependent
        then product -> economicTerms -> calculationAgent -> calculationAgentParty exists'
      - 'Rosetta condition CalculationAgentOptionalEarlyTermination is not stated in LinkML: if product
        -> economicTerms -> terminationProvision -> earlyTerminationProvision -> optionalEarlyTermination
        -> calculationAgent -> calculationAgentParty exists then ancillaryParty -> role contains AncillaryRoleEnum
        -> CalculationAgentOptionalEarlyTermination and if ancillaryParty -> role contains AncillaryRoleEnum
        -> CalculationAgentOptionalEarlyTermination then product -> economicTerms -> terminationProvision
        -> earlyTerminationProvision -> optionalEarlyTermination -> calculationAgent -> calculationAgentParty
        exists'
      - 'Rosetta condition CalculationAgentMandatoryEarlyTermination is not stated in LinkML: if product
        -> economicTerms -> terminationProvision -> earlyTerminationProvision -> mandatoryEarlyTermination
        -> calculationAgent -> calculationAgentParty exists then ancillaryParty -> role contains AncillaryRoleEnum
        -> CalculationAgentMandatoryEarlyTermination and if ancillaryParty -> role contains AncillaryRoleEnum
        -> CalculationAgentMandatoryEarlyTermination then product -> economicTerms -> terminationProvision
        -> earlyTerminationProvision -> mandatoryEarlyTermination -> calculationAgent -> calculationAgentParty
        exists'
  TradeLot:
    description: Specifies the price and quantity of a trade lot, where the same product could be traded
      multiple times with the same counterparty but in different lots (at a different date, in a different
      quantity and at a different price). One trade lot combined with a product definition specifies the
      entire economics of a trade. The lifecycle mechanics of each such trade lot (e.g. cashflow payments)
      is independent of the other lots.
    attributes:
      lotIdentifier:
        description: Specifies one or more identifiers for the lot, if any.
        range: Identifier
        multivalued: true
      priceQuantity:
        description: 'Specifies the settlement characteristics of a trade lot: price, quantity, observable
          (optionally) and the settlement terms. This attribute has a multiple cardinality to allow to
          specify the price, quantity and observable of different legs in a single, composite product
          (e.g. a Swap).'
        range: PriceQuantity
        required: true
        multivalued: true
  TransferableProduct:
    description: A TransferableProduct is a type of financial product which can be held or transferred,
      represented as an Asset with the addition of specific EconomicTerms.
    attributes:
      asset:
        description: An Asset is defined as something that can be owned and transferred in the financial
          markets.
        range: Asset
        required: true
      economicTerms:
        description: The price forming features, including payouts and provisions.
        range: EconomicTerms
        required: true
      productPartyRole:
        description: Overrides the parties on the trade to identify the party with the obligation to pay
          dividends or coupons, e.g issuer.
        range: CounterpartyRoleEnum
        required: true
    comments:
      - 'Rosetta condition AssetPartyRoleExists is not stated in LinkML: asset ->> partyRole exists'
  Underlier:
    description: The underlying financial product that will be physically or cash settled, which can be
      of any type, eg an asset such as cash or a security, a product, or the cash settlement of an index
      rate. Conditions are usually applied when used in a data type, such as a payout, to ensure this
      aligns with the use case.
    attributes:
      Observable:
        description: Specifies the object to be observed for a price, it could be an asset or a reference.
        range: Observable
        annotations:
          rosetta_metadata: address
      Product:
        description: Enables either a TransferableProduct or a NonTransferableProduct to be used in an
          underlier.
        range: Product
    all_of:
      - description: 'OneOf: A choice type holds exactly one of its options.'
        exactly_one_of:
          - slot_conditions:
              Observable:
                value_presence: PRESENT
          - slot_conditions:
              Product:
                value_presence: PRESENT
    annotations:
      rosetta_choice: 'true'
