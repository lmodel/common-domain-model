classes:
  BrokerConfirmation:
    description: Identifies the market sector in which the trade has been arranged.
    attributes:
      brokerConfirmationType:
        description: The type of broker confirmation executed between the parties.
        range: BrokerConfirmationTypeEnum
        required: true
        deprecated: Marked [deprecated] in the CDM.
        annotations:
          rosetta_metadata: scheme
  EquityMasterConfirmation:
    is_a: MasterConfirmationBase
    description: Specification for General Terms and Elections of an Equity Master Confirmation that is
      applicable across multiple Equity confirmations and is referenced by each of these confirmations,
      an example of which being the 2018 ISDA CDM Equity Confirmation for Security Equity Swap.
  EquitySwapMasterConfirmation2018:
    is_a: EquityMasterConfirmation
    description: Specification for the General Terms and Relationship Supplement Elections as provided
      in the 2018 ISDA CDM Equity Confirmation for Security Equity Swap.
    attributes:
      typeOfSwapElection:
        description: Per Part 1 Section 4, 'Dividend Obligations', of the 2018 ISDA CDM Equity Confirmation,
          Para 4.2 'Dividend Returns'.
        range: ReturnTypeEnum
        required: true
      pricingMethodElection:
        description: Per Part 1 Section 5, 'Pricing', of the 2018 ISDA CDM Equity Confirmation, Para 5.1.
        range: PriceReturnTerms
        required: true
      linearInterpolationElection:
        description: Per Part 1 Section 3, 'Floating Obligations', of the 2018 ISDA CDM Equity Confirmation.
          Para 3.3.
        range: InterpolationMethodEnum
        required: true
      settlementTerms:
        description: Per Part 1 Section 8, 'Settlement', of the 2018 ISDA CDM Equity Confirmation for
          Security Equity Swap.
        range: SettlementTerms
        required: true
      valuationDates:
        description: The parameters used to generate the 'Equity Valuation Dates' schedule, including
          the Effective Date and Termination Date for the Swap.
        range: ValuationDates
        required: true
      equityCashSettlementDates:
        description: The parameters used to generate the payment date schedule, relative to the equityCalculationPeriod.
          Per Part 1 Section 12, 'Definitions', of the 2018 ISDA CDM Equity Confirmation. Para 73.
        range: PaymentDates
        required: true
  MasterConfirmationBase:
    description: Legal agreement specification for General Terms and Elections that are applicable across
      multiple confirmations and are referenced by these confirmations.
