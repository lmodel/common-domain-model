classes:
  CodeList:
    description: A type hold a list of codes for business data validation
    attributes:
      identification:
        description: Identification information about the code list
        range: CodeListIdentification
        required: true
      codes:
        description: Code values
        range: CodeValue
        multivalued: true
  CodeListIdentification:
    description: A type to identify the version of a codelist
    slots:
      - description
      - version
    attributes:
      publicationDate:
        description: The most recent date the code list was published, e.g. 2021-10-05
        range: string
      shortName:
        description: A short name (without whitespace) for the code list, e.g. businessCenterScheme
        range: string
        required: true
      codeShortId:
        description: The name of the code list, e.g. business-center
        range: string
      canonicalUri:
        description: Canonical URI which uniquely identifies all versions (collectively) of the referenced
          code list. Must be an absolute URI. Must not be used as a de facto location URI.
        range: string
        required: true
      canonicalVersionUri:
        description: Canonical URI which uniquely identifies a specific version of the referenced code
          list. Must be an absolute URI. Must not be used as a de facto location URI.
        range: string
      locationUri:
        description: Suggested retrieval location for this version, in genericode format. An application
          must signal an error to the user if a document retrieved using a LocationUri is not in genericode
          format.
        range: string
    slot_usage:
      description:
        description: A description of the code list, e.g. A list of codes identifying business centers
        range: string
      version:
        description: The the most recent version of the codelist, eg. 9-1
        range: string
        required: true
  CodeValue:
    description: A type to hold the value of the code in a codelist
    slots:
      - description
      - source
    attributes:
      value:
        description: The value of the code, e.g. USNY
        range: string
        required: true
      effectiveDate:
        description: When the code became/becomes effective
        range: date
      deprecatedDate:
        description: When the code ceased to be valid for new uses
        range: date
    slot_usage:
      description:
        description: A description of the meaning of the code, e.g. New York City, USA
        range: string
      source:
        description: Where the code was defined,e.g. ISDA, FpML, Bloomberg
        range: string
