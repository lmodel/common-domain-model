---
id: https://w3id.org/lmodel/common-domain-model/cdm_base_staticdata_party
name: cdm_base_staticdata_party
title: CDM cdm.base.staticdata.party
description: 'Basic party concepts: legal entity, natural person, contact details, buyer / payer and all
  related enums.'
version: 8.0.0-dev.13
source: https://github.com/finos/common-domain-model/tree/8.0.0-dev.13
license: Apache-2.0
prefixes:
  common_domain_model: https://w3id.org/lmodel/common-domain-model/
  linkml: https://w3id.org/linkml/
default_prefix: common_domain_model
default_range: string
imports:
  - linkml:types
  - ./cdm_base_staticdata_identifier
  - ./common_domain_model_keys
enums:
  AccountTypeEnum:
    description: The enumeration values to qualify the type of account.
    permissible_values:
      AggregateClient:
        description: Aggregate client account, as defined under ESMA MiFIR.
      Client:
        description: The account contains trading activity or positions that belong to a client of the
          firm that opened the account.
      House:
        description: The account contains proprietary trading activity or positions, belonging to the
          firm that is the owner of the account.
  AncillaryRoleEnum:
    description: Defines the enumerated values to specify the ancillary roles to the transaction. The
      product is agnostic to the actual parties involved in the transaction, with the party references
      abstracted away from the product definition and replaced by the AncillaryRoleEnum. The AncillaryRoleEnum
      can then be positioned in the product and the AncillaryParty type, which is positioned outside of
      the product definition, allows the AncillaryRoleEnum to be associated with an actual party reference.
    permissible_values:
      DisruptionEventsDeterminingParty:
        description: Specifies the party which determines additional disruption events.
      ExtraordinaryDividendsParty:
        description: Specifies the party which determines if dividends are extraordinary in relation to
          normal levels.
      PredeterminedClearingOrganizationParty:
        description: Specifies the clearing organization (CCP, DCO) which the trade should be cleared.
      ExerciseNoticeReceiverPartyManual:
        description: Specifies the party to which notice of a manual exercise should be given.
      ExerciseNoticeReceiverPartyOptionalEarlyTermination:
        description: Specifies the party to which notice of a optional early termination exercise should
          be given.
      ExerciseNoticeReceiverPartyCancelableProvision:
        description: Specifies the party to which notice of a cancelable provision exercise should be
          given.
      ExerciseNoticeReceiverPartyExtendibleProvision:
        description: Specifies the party to which notice of a extendible provision exercise should be
          given.
      CalculationAgentIndependent:
        description: Specifies the party responsible for performing calculation agent duties as defined
          in the applicable product definition.
      CalculationAgentOptionalEarlyTermination:
        description: Specifies the party responsible for performing calculation agent duties associated
          with an optional early termination.
      CalculationAgentMandatoryEarlyTermination:
        description: Specifies the party responsible for performing calculation agent duties associated
          with an mandatory early termination.
      CalculationAgentFallback:
        description: Specifies the party responsible for deciding the fallback rate.
  AssetAncillaryPartyRoleEnum:
    description: The enumerated values that specify the role of a party with an indirect obligation related
      to an asset as agent, registrar or other.
    permissible_values:
      Registrar:
        description: The party responsible for maintaining records of asset owners and holders.
      TransferAgent:
        description: The party responsible for maintaining records of owners and processing changes in
          ownership.
      Exchange:
        description: The exchange or platform where the security has been issued and the exchange has
          an indirect role.
      RelatedExchange:
        description: An exchange or platform other than the primary exchange where the security has been
          issued and the exchange has an indirect role.
      SecuritySettlementCentre:
        description: Specifies the party that processes the transfer and delivery of securities between
          issuers, counterparties, agents and other service providers.
      CashSettlementCentre:
        description: Specifies the party that processes the transfer and delivery of cash between issuers,
          counterparties, agents and other service providers.
      PlaceOfDeposit:
        description: Specifies the party responsible for recording securities ownership, holding physical
          certificates and facilitating securities transfers.
      Custodian:
        description: Specifies the party responsible for safekeeping securities and performing securities
          lifecycle events.
  AssetPartyRoleEnum:
    description: The enumerated values that specify the role of a party with a direct obligation to the
      asset (i.e. Lender, Issuer).
    permissible_values:
      Exchange:
        description: The exchange or platform where the security has been issued and the exchange has
          a direct economic role.
      Borrower:
        description: The entity that receives cash or assets from a lender with the expectation that cash
          or assets will be returned at a future agreed date and price.
      Issuer:
        description: The entity that issues a financial product and has the obligation to pay coupons,
          dividends and principal to the product holder.
      Lender:
        description: The entity that provides cash or assets to a borrower with the expectation that cash
          or assets will be returned at a future agreed date and price.
  CounterpartyRoleEnum:
    description: Defines the enumerated values to specify the two counterparties to the transaction.
    permissible_values:
      Party1: {}
      Party2: {}
  EntityIdentifierTypeEnum:
    description: The enumeration values associated with legal entity identifier sources.
    permissible_values:
      BIC:
        description: The Bank Identifier Code.
      LEI:
        description: The ISO 17442:2012 Legal Entity Identifier.
      MIC:
        description: The ISO 10383 Market Identifier Code (MIC).
      REDID:
        description: The Reference Entity Database identifier.
      CountryCode:
        description: The ISO 3166 Country Code.
      Other:
        description: Used when the identifier type is not otherwise in this enumerated list because it
          is internal or other reasons. The source can be identified in the scheme which is part of the
          identifier attribute.
    annotations:
      rosetta_extends: PartyIdentifierTypeEnum
  EntityTypeEnum:
    description: The enumerated values to specify the reference entity types corresponding to a list of
      types defined in the ISDA First to Default documentation.
    permissible_values:
      Asian:
        description: Entity Type of Asian.
      AustralianAndNewZealand:
        description: Entity Type of Australian and New Zealand.
      EuropeanEmergingMarkets:
        description: Entity Type of European Emerging Markets.
      Japanese:
        description: Entity Type of Japanese.
      NorthAmericanHighYield:
        description: Entity Type of North American High Yield.
      NorthAmericanInsurance:
        description: Entity Type of North American Insurance.
      NorthAmericanInvestmentGrade:
        description: Entity Type of North American Investment Grade.
      Singaporean:
        description: Entity Type of Singaporean.
      WesternEuropean:
        description: Entity Type of Western European.
      WesternEuropeanInsurance:
        description: Entity Type of Western European Insurance.
  NaturalPersonRoleEnum:
    description: The enumerated values for the natural person's role.
    permissible_values:
      Broker:
        description: The person who arranged with a client to execute the trade.
      Buyer:
        description: Acquirer of the legal title to the financial instrument.
      DecisionMaker:
        description: The party or person with legal responsibility for authorization of the execution
          of the transaction.
      ExecutionWithinFirm:
        description: Person within the firm who is responsible for execution of the transaction.
      InvestmentDecisionMaker:
        description: Person who is responsible for making the investment decision.
      Seller:
        description: Seller of the legal title to the financial instrument.
      Trader:
        description: The person who executed the trade.
  PartyIdentifierTypeEnum:
    description: The enumeration values associated with party identifier sources.
    permissible_values:
      BIC:
        description: The Bank Identifier Code.
      LEI:
        description: The ISO 17442:2012 Legal Entity Identifier.
      MIC:
        description: The ISO 10383 Market Identifier Code (MIC).
  PartyRoleEnum:
    description: The enumerated values for the party role. The enumerated values go beyond the FpML partyRoleScheme
      as they also include elements that are part of the FpML Trade, such as the Barrier Determination
      Agent and the Hedging Party.
    permissible_values:
      Accountant:
        description: Organization responsible for preparing the accounting for the trade.
      AgentLender:
        description: An agent who lends securities of its principals under stock lending arrangements.
      AllocationAgent:
        description: The organization responsible for supplying the allocations for a trade to be allocated
          to multiple accounts/organizations.
      ArrangingBroker:
        description: 'The organization that arranged the trade, i.e. brought together the counterparties.
          Synonyms/Alternatives: Inter-dealer broker, agent.'
      BarrierDeterminationAgent:
        description: The party specified in the related confirmation as Barrier Determination Agent.
      BeneficialOwner:
        description: The party that lends out securities under stock lending arrangements via an Agent
          Lender.
      Beneficiary:
        description: Organization that suffers the economic benefit of the trade. The beneficiary may
          be distinct from the principal/counterparty - an example occurs when a hedge fund trades via
          a prime broker; in this case the principal is the prime broker, but the beneficiary is the hedge
          fund. This can be represented as a payer/receiver account in the name of the hedge fund, but
          it is also possible to add the party role of 'Beneficiary' at the partyTradeInformation level.
      BookingParty:
        description: The entity for which the organization supporting the trade's processing has booked/recorded
          the trade. This is used in non-reporting workflows situations in which the trade doesn\'t need
          to be reported but a firm still wants to specify their own side.
      Borrower:
        description: The party that borrows securities under stock lending arrangements.
      Buyer:
        description: Acquirer of the legal title to the financial instrument. In the case of an option,
          the buyer is the holder of the option. In the case of a swap or forward, the buyer will be determined
          by industry best practice. This does not refer to an investor or investment manager or other
          organization on what is typically called the 'Buy side'; for that, see the 'Client' role. Corresponds
          to 'Buyer' as defined in certain regulations such as ESMA MiFID II/MIFIR RTS 22 field 9.
      BuyerDecisionMaker:
        description: The party or person who, having legal authority to act on behalf of the trade counterparty
          acting as Buyer as defined in this coding scheme, made the decision to acquire the financial
          instrument. Corresponds to 'buyer decision maker' as defined in ESMA\'s MIFIR RTS 23 report.
          This does not refer to the decision maker for what is traditionally called the 'Buy side'; for
          that, see the 'Client Decision Maker' role.
      Chargor:
        description: The party that provides credit support under English Law.
      ClearingClient:
        description: An organization that clears trades through a clearing house, via a clearing broker
          (member of the clearing house) who acts as an agent on its behalf. The term 'client' refers
          to the organization\'s role in the clearing process in relation to its clearing broker, and
          not whether it is a price maker or taker in the execution process.
      ClearingExceptionParty:
        description: A party to the trade that claims a clearing exception, such as an end-user exception
          under Dodd-Frank Act provisions.
      ClearingFirm:
        description: 'Organization that submits the trade to a clearing house on behalf of the principal.
          Synonyms/alternates: Futures Commission Merchant (FCM), Clearing Broker, Clearing Member Firm.
          Some implementations use ''Clearing Broker'' as synonym.'
      ClearingOrganization:
        description: The organization that acts as a central counterparty to clear a derivatives contract.
          This is used to represent the role of Central Counterparties (CCPs) or Derivative Clearing Organizations
          (DCOs). Sometimes called 'ClearingService'. Some implementations also use the term 'Clearer'.
      Client:
        description: Client as defined under ESMA MIFIR. This is generally the investor or other client
          of an investment firm, and is synonymous with the Beneficiary in many circumstances.
      ClientDecisionMaker:
        description: The party or person who, having legal authority to act on behalf of a trade counterparty,
          made the decision to acquire or sell the financial instrument.
      ConfirmationPlatform:
        description: Organization serving as a financial intermediary for the purposes of electronic confirmation
          or providing services for post-processing of transactional data.
      ContractualParty:
        description: A party to a contractual document. If the intended usage relates to the context of
          the trade lifecycle, more specific annotations have been defined which might be more appropriate.
      CounterPartyAffiliate:
        description: Organization officially attached to the counterparty. e.g. partner, branch, subsidiary.
      CounterPartyUltimateParent:
        description: The topmost entity or organization, within the corporate hierarchy, responsible for
          the reporting party.
      Counterparty:
        description: 'An economic counterparty to the trade. Synonym: principal.'
      CreditSupportProvider:
        description: Organization that enhances the credit of another organization (similar to guarantor,
          but may not fully guarantee the obligation).
      Custodian:
        description: Organization that maintains custody of the asset represented by the trade on behalf
          of the owner/principal.
      DataSubmitter:
        description: Entity submitting the transaction report to the competent authority.
      DeterminingParty:
        description: The party referenced is specified in the contract confirmation as Determination Party.
      DisputingParty:
        description: Organization that is disputing the trade or transaction.
      DocumentRepository:
        description: A marketplace organization which purpose is to maintain document records. If the
          intended usage relates to the context of the trade lifecycle, more specific annotations have
          been defined which might be more appropriate.
      ExecutingBroker:
        description: The (generally sell-side) organization that executed the trade; the price-making
          party.
      ExecutingEntity:
        description: Entity executing the transaction. If the transaction is executed directly by the
          reporting party, it will be the reporting party. If it is executed by an execution agent or
          an affiliated party on behalf of the reporting party, it will be that affiliate or agent.
      ExecutionAgent:
        description: The (generally buy-side) organization that acts to execute trades on behalf of an
          investor. Typically this is an investment manager or asset manager, and also makes the investment
          decisions for the investor. If required, a separate InvestmentDecision role can be specified
          to distinguish that the party making the investment decision is different.
      ExecutionFacility:
        description: 'The facility, exchange, or market where the trade was executed. Synonym: Swap Execution
          Facility, Designated Contract Market, Execution Venue.'
      Guarantor:
        description: Organization that backs (guarantees) the credit risk of the trade.
      HedgingParty:
        description: The ISDA Hedging Party that is specified in the related confirmation as Hedging,
          or if no Hedging Party is specified, either party to the contract.
      Lender:
        description: The party that lends out securities under stock lending arrangements as principal.
      MarginAffiliate:
        description: Margin affiliate as defined by U.S. margin and capital rules §23.151.
      OrderTransmitter:
        description: 'The entity transmitting the order to the reporting firm. Synonym: Transmitting Firm.'
      Pledgor:
        description: The party that provides credit support under New York Law.
      PrimeBroker:
        description: The organization that takes on or took on the credit risk for this trade by stepping
          in between the two economic parties (without a central counterparty clearing mechanism).
      PriorTradeRepository:
        description: The trade repository at which the trade was reported previous to the current trade
          repository.
      PTRRServiceProvider:
        description: The party that acts as either a portfolio compression or portfolio rebalancing service
          provider, as defined under ESMA MIFIR
      PublicationVenue:
        description: The reporting service (whether trade repository, market data service, or exchange/facility/venue
          data distribution service) that published the report of this trade.
      ReportingParty:
        description: The party with the regulatory responsibility to report this trade.
      ReportingPartyAffiliate:
        description: Organization officially attached to the reporting party e.g. partner, branch, subsidiary.
      ReportingPartyUltimateParent:
        description: The topmost entity or organization, within the corporate hierarchy, responsible for
          the reporting party.
      Seller:
        description: 'A counterparty in a trade, which performs in one of the following capacities: 1)
          it transfers or agrees to transfer in the future an instrument or title to that instrument in
          exchange for payment, 2) it writes a derivatives instrument such as an option or a swap in which
          it provides risk protection to the buyer. This does not refer to the broker/dealer or other
          organization on what is typically called the ''Sell side''; for that, see the ''Executing Broker''
          role. Corresponds to ''Seller'' as defined in certain regulations such as ESMA MiFID II/MIFIR
          RTS 22 field 16.'
      SellerDecisionMaker:
        description: The party or person who, having legal authority to act on behalf of the trade counterparty
          acting as Seller as defined in this coding scheme, made the decision to sell the financial instrument.
          Corresponds to 'seller decision maker' as defined in ESMA\'s MIFIR RTS 23 report. This does
          not refer to the decision maker for what is traditionally called the 'Sell side'; for that,
          see the 'Trader' person role.
      SecuredParty:
        description: The party that receives credit support under New York or English Law.
      SettlementAgent:
        description: The organization that makes or receives payments on behalf of the given principal
          party.
      TradeRepository:
        description: An organization that maintains records of the trade for regulatory reporting purposes.
      TradeSource:
        description: The organization that originally supplied the record of the trade. In the context
          of regulatory reporting, it is the submitter of the trade record to a regulator or TR.
      TradingManager:
        description: 'The entity responsible for managing the assets/investments of this party. Synonym:
          Asset Manager, Investment Manager, Trading Advisory.'
      TradingPartner:
        description: An entity with which this party trades from time to time, ie. with which it acts
          as a counterparty on some transactions. This role is used for static reference data, not individual
          transactions.
      TripartyAgent:
        description: A third party entity that acts as an intermediary and provides automated clearing,
          settlement, allocation, valuation and reporting services.
      ThirdPartyCustodian:
        description: A third-party providing custody, settlement, segregation and reporting services.
  PayerReceiverEnum:
    description: The enumerated values to specify an interest rate stream payer or receiver party.
    permissible_values:
      Payer:
        description: The party identified as the stream payer.
      Receiver:
        description: The party identified as the stream receiver.
  PersonIdentifierTypeEnum:
    description: The enumeration values associated with person identifier sources.
    permissible_values:
      ARNU:
        description: Alien Registration Number, number assigned by a social security agency to identify
          a non-resident person.
      CCPT:
        description: Passport Number, number assigned by an authority to identify the passport number
          of a person.
      CUST:
        description: Customer Identification Number, number assigned by an issuer to identify a customer.
      DRLC:
        description: Drivers License Number, number assigned by an authority to identify a driver's license.
      EMPL:
        description: Employee Identification Number, number assigned by a registration authority to an
          employee.
      NIDN:
        description: National Identity Number, number assigned by an authority to identify the national
          identity number of a person..
      SOSE:
        description: Social Security Number, number assigned by an authority to identify the social security
          number of a person.
      TXID:
        description: Tax Identification Number, number assigned by a tax authority to identify a person.
      NPID:
        description: Natural Person Identifier. To identify the person who is acting as private individual,
          not as business entity. Used for regulatory reporting.
      PLID:
        description: Privacy Law Identifier. It refers to the DMO Letter No. 17-16, http://www.cftc.gov/idc/groups/public/@lrlettergeneral/documents/letter/17-16.pdf
  TelephoneTypeEnum:
    description: The enumerated values to specify the type of telephone number, e.g. work vs. mobile.
    permissible_values:
      Work:
        description: A number used primarily for work-related calls. Includes home office numbers used
          primarily for work purposes.
      Mobile:
        description: A number on a mobile telephone that is often or usually used for work-related calls.
          This type of number can be used for urgent work related business when a work number is not sufficient
          to contact the person or firm.
      Fax:
        description: A number used primarily for work-related facsimile transmissions.
      Personal:
        description: A number used primarily for non work-related calls. (Normally this type of number
          would be used only as an emergency backup number, not as a regular course of business).
classes:
  Account:
    description: A class to specify an account as an account number alongside, optionally. an account
      name, an account type, an account beneficiary and a servicing party.
    attributes:
      partyReference:
        description: A reference to the party to which the account refers to.
        range: Party
        annotations:
          rosetta_metadata: reference
      accountNumber:
        description: The account number.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      accountName:
        description: The name by which the account is known.
        range: string
        annotations:
          rosetta_metadata: scheme
      accountType:
        description: The type of account, e.g. client, house.
        range: AccountTypeEnum
        annotations:
          rosetta_metadata: scheme
      accountBeneficiary:
        description: A reference to the party beneficiary of the account.
        range: Party
        annotations:
          rosetta_metadata: reference
      servicingParty:
        description: The reference to the legal entity that services the account, i.e. in the books of
          which the account is held.
        range: Party
        annotations:
          rosetta_metadata: reference
    annotations:
      rosetta_metadata: key
  Address:
    description: A class to specify a post or street address.
    attributes:
      street:
        description: The set of street and building number information that identifies a postal address
          within a city.
        range: string
        required: true
        multivalued: true
      city:
        description: The city component of the postal address.
        range: string
      state:
        description: A country subdivision used in postal addresses in some countries. For example, US
          states, Canadian provinces, Swiss cantons, ...
        range: string
      country:
        description: The ISO 3166 standard code for the country within which the postal address is located.
        range: string
        annotations:
          rosetta_metadata: scheme
      postalCode:
        description: The code, required for computerized mail sorting systems, that is allocated to a
          physical address by a national postal authority.
        range: string
  AncillaryEntity:
    description: Holds an identifier for an ancillary entity, either identified directly via its ancillary
      role or directly as a legal entity.
    attributes:
      ancillaryParty:
        description: Identifies a party via its ancillary role on a transaction (e.g. CCP or DCO through
          which the trade should be cleared.)
        range: AncillaryRoleEnum
      legalEntity:
        range: LegalEntity
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              ancillaryParty:
                value_presence: PRESENT
          - slot_conditions:
              legalEntity:
                value_presence: PRESENT
  AncillaryParty:
    description: Defines an ancillary role enumerated value with an associated party reference. The product
      is agnostic to the actual parties involved in the transaction, with the party references abstracted
      away from the product definition and replaced by the AncillaryRoleEnum. The AncillaryRoleEnum can
      then be positioned in the product and this AncillaryParty type, which is positioned outside of the
      product definition, allows the AncillaryRoleEnum to be associated with an actual party reference.
    attributes:
      role:
        description: Specifies the AncillaryRoleEnum that is associated to the party reference. An ancillary
          party is any involved party that is not one of the two principal parties to the transaction.
        range: AncillaryRoleEnum
        required: true
      partyReference:
        description: Specifies the party, or parties, associated to the ancillary role.
        range: Party
        required: true
        multivalued: true
        annotations:
          rosetta_metadata: reference
      onBehalfOf:
        description: Optionally specifies the counterparty that the ancillary party is acting on behalf
          of.
        range: CounterpartyRoleEnum
  AssetAncillaryPartyRole:
    attributes:
      partyReference:
        description: A reference to the party to which the role refers to.
        range: Party
        required: true
        annotations:
          rosetta_metadata: reference
      role:
        description: The party role.
        range: AssetAncillaryPartyRoleEnum
        required: true
  AssetPartyRole:
    attributes:
      partyReference:
        description: A reference to the party to which the role refers to.
        range: Party
        required: true
        annotations:
          rosetta_metadata: reference
      role:
        description: The party role.
        range: AssetPartyRoleEnum
        required: true
  BusinessUnit:
    description: A class to specify an organizational unit.
    slots:
      - name
    attributes:
      identifier:
        description: An identifier used to uniquely identify the organizational unit
        range: Identifier
      contactInformation:
        description: The contact information for such business unit, when different from the contact information
          associated with the party.
        range: ContactInformation
    slot_usage:
      name:
        description: A name used to describe the organizational unit
        range: string
        required: true
    annotations:
      rosetta_metadata: key
  BuyerSeller:
    description: This class corresponds to the FpML BuyerSeller.model construct.
    attributes:
      buyer:
        description: 'Buyer party that can be resolved as one of the two principal parties to the transaction.
          The party that buys this instrument, i.e. pays for this instrument and receives the rights defined
          by it. ISDA 2002 Equity Definitions section 1.18: `Buyer` means the party specified as such
          in the related Confirmation. | ISDA 2006 Definitions article 12.1 (b)(i) relating to a Swaption:
          ''Buyer'' means the party that will, on each Premium Payment Date, pay to Seller the Premium
          | ISDA 2006 Definitions article 12.1 (b)(ii) relating to Swap Transactions with applicable Early
          Termination: the party specified as such in the related Confirmation, or the Exercising Party
          if neither party is specified | ISDA 2006 Definitions article 12.1 (b)(iii) relating to any
          other Option Transaction: the party specified as such in the related Confirmation. | ISDA 2014
          Credit Definition article 1.4: `Buyer` means the Fixed Rate Payer.'
        range: CounterpartyRoleEnum
        required: true
      seller:
        description: 'Seller party that can be resolved as one of the two principal parties to the transaction.
          The party that sells (''writes'') this instrument, i.e. that grants the rights defined by this
          instrument and in return receives a payment for it. ISDA 2002 Equity Definitions section 1.19:
          `Seller` means the party specified as such in the related Confirmation. | ISDA 2006 Definitions
          article 12.1 (a)(i) relating to a Swaption: ''Seller'' means the party the party specified as
          such or as writer in the related Confirmation | ISDA 2006 Definitions article 12.1 (a)(ii) relating
          to Swap Transactions with applicable Early Termination: the party specified as such or as writer
          in the related Confirmation or, if neither party is specified as such, the Non-exercising Party
          | ISDA 2006 Definitions article 12.1 (a)(iii) relating to any other Option Transaction: the
          party specified as such in the related Confirmation. | ISDA 2014 Credit Definition article 1.4:
          `Seller` means the Floating Rate Payer.'
        range: CounterpartyRoleEnum
        required: true
  ContactInformation:
    description: 'A class to specify contact information associated with a party: telephone, postal/street
      address, email and web page.'
    slots:
      - email
    attributes:
      telephone:
        description: The telephone number.
        range: TelephoneNumber
        multivalued: true
      address:
        description: The street/postal address.
        range: Address
        multivalued: true
      webPage:
        description: The web page. This attribute is not specified as part of the FpML ContactInformation
          complex type.
        range: string
        multivalued: true
    slot_usage:
      email:
        description: The email address.
        range: string
        multivalued: true
  Counterparty:
    description: Defines a counterparty enumerated value, e.g. Party1 or Party2, with an associated party
      reference. The product is agnostic to the actual parties to the transaction, with the party references
      abstracted away from the product definition and replaced by the CounterpartyEnum (e.g. values Party1
      or Party2). The CounterpartyEnum can then be positioned in the product (e.g. to specify which counterparty
      is the payer, receiver etc) and this Counterparty type, which is positioned outside of the product
      definition, allows the CounterpartyEnum to be associated with an actual party reference.
    attributes:
      role:
        description: Specifies the CounterpartyEnum, e.g. either Party1 or Party2, that is associated
          to the partyReference.
        range: CounterpartyRoleEnum
        required: true
      partyReference:
        description: Specifies the party that is associated to the counterparty.
        range: Party
        required: true
        annotations:
          rosetta_metadata: reference
  EntityIdentifier:
    description: Comprises an identifier and a source. The associated metadata key denotes the ability
      to associate a hash value to the EntityIdentifier instantiations for the purpose of model cross-referencing,
      in support of functionality such as the event effect and the lineage.
    attributes:
      identifier:
        description: Provides an identifier associated with a legal entity.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      identifierType:
        description: Defines the source of the identifier.
        range: EntityIdentifierTypeEnum
    annotations:
      rosetta_metadata: key
  LegalEntity:
    description: A class to specify a legal entity, with a required name and an optional entity identifier
      (such as the LEI).
    slots:
      - name
    attributes:
      entityIdentifier:
        description: A legal entity identifier with a source (e.g. RED entity code).
        range: EntityIdentifier
        multivalued: true
    slot_usage:
      name:
        description: The legal entity name.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
    annotations:
      rosetta_metadata: key
  NaturalPerson:
    description: A class to represent the attributes that are specific to a natural person.
    attributes:
      personId:
        description: The identifier associated with a person, e.g. the internal identification code.
        range: PersonIdentifier
        multivalued: true
        annotations:
          rosetta_metadata: scheme
      honorific:
        description: An honorific title, such as Mr., Ms., Dr. etc.
        range: string
      firstName:
        description: The natural person's first name. It is optional in FpML.
        range: string
      middleName:
        description: The natural person's middle name(s). If a middle name is provided then an initial
          should be absent.
        range: string
        multivalued: true
      initial:
        description: The natural person's middle initial(s). If a middle initial is provided then a name
          should be absent.
        range: string
        multivalued: true
      surname:
        description: The natural person's surname.
        range: string
      suffix:
        description: Name suffix, such as Jr., III, etc.
        range: string
      dateOfBirth:
        description: The natural person's date of birth.
        range: date
      contactInformation:
        description: The contact information for such person, when different from the contact information
          associated with the party.
        range: ContactInformation
    all_of:
      - description: NameOrIdChoice
        any_of:
          - slot_conditions:
              firstName:
                value_presence: PRESENT
              surname:
                value_presence: PRESENT
          - slot_conditions:
              personId:
                value_presence: PRESENT
      - description: 'NaturalPersonChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              middleName:
                value_presence: PRESENT
          - slot_conditions:
              initial:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  middleName:
                    value_presence: ABSENT
              - slot_conditions:
                  initial:
                    value_presence: ABSENT
    annotations:
      rosetta_metadata: key
  NaturalPersonRole:
    description: A class to specify the role(s) that natural person(s) may have in relation to the contract.
    attributes:
      personReference:
        description: A reference to the natural person to whom the role refers to.
        range: NaturalPerson
        required: true
        annotations:
          rosetta_metadata: reference
      role:
        description: FpML specifies a person role that is distinct from the party role.
        range: NaturalPersonRoleEnum
        multivalued: true
        annotations:
          rosetta_metadata: scheme
  Party:
    description: A class to specify a party, without a qualification as to whether this party is a legal
      entity or a natural person, although the model provides the ability to associate a person (or set
      of persons) to a party, which use case would imply that such party would be a legal entity (even
      if not formally specified as such).
    slots:
      - name
    attributes:
      partyId:
        description: The identifier associated with a party, e.g. the 20 digits LEI code.
        range: PartyIdentifier
        required: true
        multivalued: true
      businessUnit:
        description: Optional organization unit information used to describe the organization units (e.g.
          trading desks) involved in a transaction or business process, incl. the contact information
          (when relevant).
        range: BusinessUnit
        multivalued: true
      person:
        description: The person(s) who might be associated with the party as part of the execution, contract
          or legal document.
        range: NaturalPerson
        multivalued: true
      personRole:
        description: The role of the person(s)
        range: NaturalPersonRole
        multivalued: true
      account:
        description: The account that might be associated with the party. At most one account can be specified,
          as it is expected that this information is used in the context of a contract or legal document
          where only one account per party can be associated with such object.
        range: Account
      contactInformation:
        description: The postal/street address, telephone number, email address and/or web page. If the
          contact information is specific to the associated business unit(s) or person (s), it should
          be associated with those.
        range: ContactInformation
    slot_usage:
      name:
        description: The party name.
        range: string
        annotations:
          rosetta_metadata: scheme
    annotations:
      rosetta_metadata: key
  PartyIdentifier:
    description: Comprises an identifier and a source. The associated metadata key denotes the ability
      to associate a hash value to the PartyIdentifier instantiations for the purpose of model cross-referencing,
      in support of functionality such as the event effect and the lineage.
    attributes:
      identifier:
        description: Provides an identifier associated with a party. The identifier is unique within the
          public source specified in the source attribute.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      identifierType:
        description: Defines the source of the identifier.
        range: PartyIdentifierTypeEnum
    annotations:
      rosetta_metadata: key
  PartyReferencePayerReceiver:
    description: Specifies the parties responsible for making and receiving payments defined by this structure.
    attributes:
      payerPartyReference:
        description: The party responsible for making the payments defined by this structure.
        range: Party
        required: true
        annotations:
          rosetta_metadata: reference
      payerAccountReference:
        description: A reference to the account responsible for making the payments defined by this structure.
        range: Account
        annotations:
          rosetta_metadata: reference
      receiverPartyReference:
        description: The party that receives the payments corresponding to this structure.
        range: Party
        required: true
        annotations:
          rosetta_metadata: reference
      receiverAccountReference:
        description: A reference to the account that receives the payments corresponding to this structure.
        range: Account
        annotations:
          rosetta_metadata: reference
  PartyRole:
    description: A class to specify the role(s) that party(ies) may have in relation to the execution,
      contract or other legal agreement.
    attributes:
      partyReference:
        description: A reference to the party to which the role refers to.
        range: Party
        required: true
        annotations:
          rosetta_metadata: reference
      role:
        description: The party role.
        range: PartyRoleEnum
        required: true
      ownershipPartyReference:
        description: A reference to the party that has ownership of this party role information. FpML
          specifies that For shared trade information, this attribute will reference the originator of
          the data (for example, an execution facility or clearing house).
        range: Party
        annotations:
          rosetta_metadata: reference
  PayerReceiver:
    description: Specifies the parties responsible for making and receiving payments defined by this structure.
    attributes:
      payer:
        description: Specifies the counterparty responsible for making the payments defined by this structure.
          The party is one of the two principal parties to the transaction.
        range: CounterpartyRoleEnum
        required: true
        annotations:
          doc_reference: ICMA GMRA namingConvention Seller | ICMA ERCCBestPractice namingConvention Seller
      receiver:
        description: Specifies the party that receives the payments corresponding to this structure. The
          party is one of the two counterparties to the transaction.
        range: CounterpartyRoleEnum
        required: true
        annotations:
          doc_reference: ICMA GMRA namingConvention Buyer | ICMA ERCCBestPractice namingConvention Buyer
  PersonIdentifier:
    description: Comprises an identifier and a source. The associated metadata key denotes the ability
      to associate a hash value to the PersonIdentifier instantiations for the purpose of model cross-referencing,
      in support of functionality such as the event effect and the lineage.
    attributes:
      identifier:
        description: Provides an identifier associated with a person. The identifier is unique within
          the public source specified in the source attribute.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      identifierType:
        description: Defines the source of the identifier.
        range: PersonIdentifierTypeEnum
      country:
        description: The ISO 3166 standard code for the country issuing the identifier.
        range: string
        annotations:
          rosetta_metadata: scheme
    annotations:
      rosetta_metadata: key
  ReferenceBank:
    description: A class to describe an institution (party) identified by means of a coding scheme and
      an optional name.
    attributes:
      referenceBankId:
        description: An institution (party) identifier, e.g. a bank identifier code (BIC). FpML specifies
          a referenceBankIdScheme.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      referenceBankName:
        description: The name of the institution (party). A free format string. FpML does not define usage
          rules for the element.
        range: string
  ReferenceBanks:
    description: A class defining the list of reference institutions polled for relevant rates or prices
      when determining the cash settlement amount for a product where cash settlement is applicable.
    attributes:
      referenceBank:
        description: An institution (party) identified by means of a coding scheme and an optional name.
        range: ReferenceBank
        required: true
        multivalued: true
  RelatedParty:
    attributes:
      partyReference:
        description: Reference to a party.
        range: Party
        required: true
        annotations:
          rosetta_metadata: reference
      accountReference:
        description: Reference to an account.
        range: Account
        annotations:
          rosetta_metadata: reference
      role:
        description: The category of the relationship. The related party performs the role specified in
          this field for the base party. For example, if the role is ,Guarantor, the related party acts
          as a guarantor for the base party.
        range: PartyRoleEnum
        required: true
  TelephoneNumber:
    description: A class to specify a telephone number as a type of phone number (e.g. work, personal,
      ...) alongside with the actual number.
    attributes:
      telephoneNumberType:
        description: The type of telephone number, e.g. work, mobile.
        range: TelephoneTypeEnum
      number:
        description: The actual telephone number.
        range: string
        required: true
