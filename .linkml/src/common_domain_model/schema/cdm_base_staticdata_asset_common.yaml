  ProductIdTypeEnum:
    description: Provides the enumerated values to specify the product identifier source.
    permissible_values:
      BBGID:
        description: Published by Bloomberg, the BBGID is a 12-digit alphanumeric randomly generated ID
          covering active and non-active securities.
      BBGTICKER:
        description: Published by Bloomberg as a short code to identify publicly trades shares of a particular
          stock on a specific exchange.
      CUSIP:
        description: Derived from the Committee on Uniform Security Identification Procedures, CUSIPs
          are 9-character identifiers that capture an issue’s important differentiating characteristics
          for issuers and their financial instruments in the U.S. and Canada.
      FIGI:
        description: Issued under the guidelines of the Object Management Group, the Financial Instrument
          Global Identifier (FIGI) is a 12 character, alphanumeric, randomly generated ID covering hundreds
          of millions of active and inactive instruments. The identifier acts as a Uniform Resource Identifier
          (URI) to link to a set of metadata that uniquely and clearly describes the instrument.
      ISDACRP:
        description: Issued by the International Swaps Dealers Association as a string representing a
          Commodity Reference Price used for purposes of determining a relevant price for an underlying
          commodity in an OTC derivatives contract.
      ISIN:
        description: Issued by The International Securities Identification Number (ISIN) Organization,
          the ISIN is a 12-character alpha-numerical code used to uniformly identify a security for trading
          and settlement purposes. Securities with which ISINs can be used include debt securities, such
          as notes or bonds as well shares, such as common stock or shares of a fund, options, derivatives,
          and futures. The ISIN structure is defined in ISO 6166.
      Name:
        description: The name of the product.
      REDID:
        description: Assigned by S&P Global Market Intelligence, REDID (Reference Entity Data Identifier)
          is a unique alphanumeric code to reference entities, primarily utilized within the credit derivatives
          market for the standardized identification of underlying entities.
      RIC:
        description: Issued by Refinitiv (formerly Reuters), the Reuters Instrument Codes(RIC) uniquely
          identifies financial instruments, including where they are traded.
      Other:
        description: Used when the source is not otherwise in this enumerated list because it is internal
          or other reasons. The source can be identified in the scheme which is part of the identifier
          attribute.
      Sicovam:
        description: Issued by the French Société Interprofessionnelle pour la Compensation des Valeurs
          Mobilières (SICOVAM) to identify French securities listed on French stock exchanges.
      SEDOL:
        description: Assigned by the London Stock Exchange, the Stock Exchange Daily Official List (SEDOL)
          is a list of security identifiers used in the United Kingdom and Ireland for clearing purposes.
          SEDOLs serve as the National Securities Identifying Number for all securities issued in the
          United Kingdom and are therefore part of the security's ISIN as well.
      UPI:
        description: Assigned by the Derivatives Service Bureau Ltd (DSB), the Unique Product Identifier
          (UPI) is a unique code to describe an over-the-counter (OTC) derivatives product. The UPI is
          used for identifying the product in transaction reporting data.
      Valoren:
        description: Assigned by SIX Financial Information, Valoren is a unique numerical identification
          number typically ranging from six to nine digits primarily traded in Switzerland, Liechtenstein,
          and Belgium. This code enables the identification of securities such as stocks, bonds, and investment
          funds within these markets.
      Wertpapier:
        description: Issued by the Institute for the Issuance and Administration of Securities in Germany
          (Securities Information), the Wertpapierkennnummer (WKN, WPKN, WPK or simply Wert) consists
          of six digits or capital letters (excluding I and O), and no check digit. It is used to identify
          German securities.
  PropertyTypeEnum:
    description: Specifies different types of property.
    permissible_values:
      Commercial:
        description: Commercial property.
      Residential:
        description: Residential property.
  PutCallEnum:
    description: The enumerated values to specify the types of listed derivative options.
    permissible_values:
      Put:
        description: A put option gives the holder the right to sell the underlying asset by a certain
          date for a certain price.
      Call:
        description: A call option gives the holder the right to buy the underlying asset by a certain
          date for a certain price.
  RedemptionPartyEnum:
    description: Specifies the redeeming party of a debt security.
    permissible_values:
      Holder:
        description: Specifies the holder of a debt security.
      Issuer:
        description: Specifies the issuer of a debt security.
  RedemptionTypeEnum:
    description: Specifies the contractual redemption or conversion features associated with a debt security.
    permissible_values:
      Convertible:
        description: Specifies a debt instrument that can be converted into common shares.
      Exchangeable:
        description: Specifies a debt security that can be converted to equity in a company other than
          the issuing company.
      ContingentConvertible:
        description: Specifies a debt security that can be converted into equity if a pre-defined trigger
          event occurs.
      Sinkable:
        description: Specifies a debt security that requires the issuer to periodically set aside money
          to buy back portions of the debt.
      Extraordinary:
        description: Specifies a debt security that can be redeemed early if certain extraordinary events
          occur.
  SecuredTypeEnum:
    description: Specifies the type of secured debt.
    permissible_values:
      AssetBacked:
        description: Debt instrument with periodic income payments and value derived from or backed by
          a specified pool of underlying assets.
      CollateralizedObligation:
        description: Complex product that is backed by a pool of loans and other assets and sold to institutional
          investors.
      CoveredBonds:
        description: Specifies a debt obligations issued by credit institutions which offer a so-called
          double-recourse protection to bondholders.
  SecurityTypeEnum:
    description: Represents an enumeration list to indentify the type of a security.
    permissible_values:
      Debt:
        description: Identifies a security as a fixed income security of debt issued and securitized as
          a tradable asset.
      Equity:
        description: Identifies a security as an Equity value of holding of shares in listed company.
      Fund:
        description: Identifies a security as representing holding in an investment fund.
      Warrant:
        description: Identifies a security as a Warrant that give the right, but not the obligation, to
          buy or sell a security — most commonly an equity — at a certain price before expiration, or
          to receive the cash equivalent.
      Certificate:
        description: Identifies a security as one that that offers a derivative-based economic return
          which is not structured as a bond, an equity or a warrant. Note that this security type is not
          a Certificate of Deposit (aka CD).
  SupraNationalIssuerTypeEnum:
    description: Represents an enumeration list to identify the type of supranational entity issuing the
      asset.
    permissible_values:
      InternationalOrganisation:
        description: Specifies International Financial Institution.
      MultilateralBank:
        description: Specifies Multilateral Bank or Multilateral Development Bank.
  TaxonomySourceEnum:
    description: Represents the enumerated values to specify taxonomy sources.
    permissible_values:
      CFI:
        description: Represents the ISO 10962 Classification of Financial Instruments code.
      ISDA:
        description: Represents the ISDA product taxonomy.
      ICAD:
        description: Represents the ISDA Collateral Asset Definition Identifier code.
      EMIR:
        description: Represents the EMIR Article 9 Asset Definition Identifier code.
      EU_EMIR_EligibleCollateralAssetClass:
        description: Identifies European Union Eligible Collateral Assets classification categories based
          on EMIR Uncleared Margin Rules.
      UK_EMIR_EligibleCollateralAssetClass:
        description: 'Identifies United Kingdom Eligible Collateral Assets classification categories based
          on UK Onshored EMIR Uncleared Margin Rules Eligible Collateral asset classes for both initial
          margin (IM) and variation margin (VM) posted and collected between specified entities.Please
          note: UK EMIR regulation will detail which eligible collateral assets classes apply to each
          type of entity pairing (counterparty) and which apply to posting of IM and VM.'
      CFTC:
        description: Represents the Commodity Futures Trading Commission (CFTC) as a taxonomy source.
      US_CFTC_PR_EligibleCollateralAssetClass:
        description: 'Identifies US Eligible Collateral Assets classification categories based on Uncleared
          Margin Rules published by the CFTC and the US Prudential Regulator. Note: While the same basic
          categories exist in the CFTC and US Prudential Regulators margin rules, the precise definitions
          or application of those rules could differ between the two rules.'
      MAS:
        description: Represents the Monetary Authority of Singapore (MAS) as a taxonomy source.
      CSA:
        description: Represents the Canadian Securities Administrators (CSA) as a taxonomy source.
      Other:
        description: Denotes a user-specific scheme or taxonomy or other external sources not listed here.
  UK_EMIR_EligibleCollateralEnum:
    description: 'Identifies United Kingdom Eligible Collateral Assets classification categories based
      on UK Onshored EMIR Uncleared Margin Rules. Eligible Collateral asset classes for both initial margin
      (IM) and variation margin (VM) posted and collected between specified entities. Please note: UK
      EMIR regulation will detail which eligible collateral assets classes apply to each type of entity
      pairing (counterparty) and which apply to posting of IM and VM.'
    permissible_values:
      UK_EMIRTypeA:
        description: Denotes cash in the form of money credited to an account in any currency, or similar
          claims for the repayment of money, such as money market deposits.
      UK_EMIRTypeB:
        description: Denotes gold in the form of allocated pure gold bullion of recognised good delivery.
      UK_EMIRTypeC:
        description: Denotes debt securities issued by the central government of the United Kingdom or
          the Bank of England.
      UK_EMIRTypeD:
        description: Denotes debt securities issued by United Kingdom regional governments or local authorities
          whose exposures are treated as exposures to the central government of the United Kingdom in
          accordance with Article 115(2) of Regulation (EU) No 575/2013.
      UK_EMIRTypeE:
        description: Denotes debt securities issued by United Kingdom public sector entities whose exposures
          are treated as exposures to the central government, regional government or local authority of
          the United Kingdom in accordance with Article 116(4) of Regulation (EU) No 575/2013.
      UK_EMIRTypeF:
        description: Denotes debt securities issued by United Kingdom regional governments or local authorities
          other than those referred to in (TypeD).
      UK_EMIRTypeG:
        description: Denotes debt securities issued by United Kingdom public sector entities other than
          those referred to in (TypeE).
      UK_EMIRTypeH:
        description: Denotes debt securities issued by multilateral development banks listed in Article
          117(2) of Regulation (EU) No 575/2013.
      UK_EMIRTypeI:
        description: Denotes debt securities issued by the international organisations listed in Article
          118 of Regulation (EU) No 575/2013.
      UK_EMIRTypeJ:
        description: Denotes debt securities issued by third countries' governments or central banks.
      UK_EMIRTypeK:
        description: Denotes debt securities issued by third countries' regional governments or local
          authorities that meet the requirements of (TypeD) and (TypeE).
      UK_EMIRTypeL:
        description: Denotes debt securities issued by third countries' regional governments or local
          authorities other than those referred to in (TypeD) and (TypeE).
      UK_EMIRTypeM:
        description: Denotes debt securities issued by credit institutions or investment firms including
          bonds admitted to the register of regulated covered bonds maintained under Regulation 7(1)(b)
          of the Regulated Covered Bonds Regulations 2008 (SI 2008/346).
      UK_EMIRTypeN:
        description: Denotes corporate bonds.
      UK_EMIRTypeO:
        description: Denotes the most senior tranche of a securitisation, as defined in Article 4(61)
          of Regulation (EU) No 575/2013, that is not a re-securitisation as defined in Article 4(63)
          of that Regulation.
      UK_EMIRTypeP:
        description: Denotes convertible bonds provided that they can be converted only into equities
          which are included in an index specified pursuant to point (a) of Article 197 (8) of Regulation
          (EU) No 575/2013.
      UK_EMIRTypeQ:
        description: Denotes equities included in an index specified pursuant to point (a) of Article
          197(8) of Regulation (EU) No 575/2013.
      UK_EMIRTypeR:
        description: Denotes shares or units in undertakings for UK UCITS, provided that the conditions
          set out in Article 5 of EU Regulation 2016/2251 (as modified by the Technical Standards (European
          Market Infrastructure) (EU Exit) (No. 3) Instrument 2019) are met.
  US_CFTC_PR_EligibleCollateralEnum:
    description: 'Identifies US Eligible Collateral Assets classification categories based on Uncleared
      Margin Rules published by the CFTC and the US Prudential Regulator. Note: While the same basic categories
      exist in the CFTC and US Prudential Regulators margin rules, the precise definitions or application
      of those rules could differ between the two rules.'
    permissible_values:
      US_CFTC_PRType1:
        description: Denotes immediately available cash funds denominated in USD, a major currency, a
          currency of settlement for the uncleared swap.
      US_CFTC_PRType2:
        description: Denotes a security that is issued by, or unconditionally guaranteed as to the timely
          payment of principal and interest by, the U.S. Department of the Treasury.
      US_CFTC_PRType3:
        description: Denotes a security that is issued by, or unconditionally guaranteed as to the timely
          payment of principal and interest by, a U.S. government agency (other than the U.S. Department
          of Treasury) whose obligations are fully guaranteed by the full faith and credit of the United
          States government.
      US_CFTC_PRType4:
        description: Denotes a security that is issued by, or fully guaranteed as to the payment of principal
          and interest by, the European Central Bank or a sovereign entity that is assigned no higher
          than a 20 percent risk weight under the capital rules applicable to swap dealers subject to
          regulation by a prudential regulator.
      US_CFTC_PRType5A:
        description: Denotes a publicly traded debt security issued by, or an asset-backed security fully
          guaranteed as to the timely payment of principal and interest by, a U.S. Government-sponsored
          enterprise that is operating with capital support or another form of direct financial assistance
          received from the U.S. government that enables the repayments of the U.S. Government-sponsored
          enterprise's eligible securities.
      US_CFTC_PRType5B:
        description: Denotes a publicly traded debt security, but not an asset backed security, that is
          investment grade and issued by a U.S. Government-sponsored enterprise that is not operating
          with capital support or another form of direct financial assistance received from the U.S. government.
      US_CFTC_PRType6:
        description: Denotes a security that is issued by, or fully guaranteed as to the payment of principal
          and interest by, the Bank for International Settlements, the International Monetary Fund, or
          a multilateral development bank.
      US_CFTC_PRType7:
        description: 'Denotes publicly-traded debt, but not an asset backed security, that is investment
          grade and is not a debt security issued by a U.S. Government-sponsored enterprise. This category
          excludes a security issued by a non-bank financial institution supervised by the board of governors
          of the Federal Reserve System under Title I of the Dodd-Frank Wall Street Reform and Consumer
          Protection Act. This category also excludes a security issued by any of the following entities,
          by a company that would be any of the following entities if it were the organized under the
          laws of the United States or any State, or in either case by an affiliate of such an entity:
          the party posting the collateral, a bank holding company, a savings and loan holding company,
          a U.S. intermediate holding company, a foreign bank, a depositary institution, a securities
          holding company, a broker, a dealer, a futures commission merchant, a swap dealer, or a security-based
          swap dealer.'
      US_CFTC_PRType8A:
        description: 'Denotes a publicly traded common equity security that is included in the Standard
          & Poor''s Composite 500 Index or related indexes. This category excludes a security issued by
          a non-bank financial institution supervised by the board of governors of the Federal Reserve
          System under Title I of the Dodd-Frank Wall Street Reform and Consumer Protection Act. This
          category also excludes a security issued by any of the following entities, by a company that
          would be any of the following entities if it were the organized under the laws of the United
          States or any State, or in either case by an affiliate of such an entity: the party posting
          the collateral, a bank holding company, a savings and loan holding company, a U.S. intermediate
          holding company, a foreign bank, a depositary institution, a securities holding company, a broker,
          a dealer, a futures commission merchant, a swap dealer, or a security-based swap dealer.'
      US_CFTC_PRType8B:
        description: 'Denotes a publicly traded common equity security that is included in the Standard
          & Poor''s Composite 1500 Index or related indexes. This category excludes a security issued
          by a non-bank financial institution supervised by the board of governors of the Federal Reserve
          System under Title I of the Dodd-Frank Wall Street Reform and Consumer Protection Act. This
          category also excludes a security issued by any of the following entities, by a company that
          would be any of the following entities if it were the organized under the laws of the United
          States or any State, or in either case by an affiliate of such an entity: the party posting
          the collateral, a bank holding company, a savings and loan holding company, a U.S. intermediate
          holding company, a foreign bank, a depositary institution, a securities holding company, a broker,
          a dealer, a futures commission merchant, a swap dealer, or a security-based swap dealer.'
      US_CFTC_PRType8C:
        description: 'Denotes a publicly traded common equity security that is included in an index that
          a regulated swap entity''s supervisor in a foreign jurisdiction recognizes for purposes of including
          publicly traded common equity as initial margin under applicable regulatory policy, if held
          in that foreign jurisdiction. This category excludes a security issued by a non-bank financial
          institution supervised by the board of governors of the Federal Reserve System under Title I
          of the Dodd-Frank Wall Street Reform and Consumer Protection Act. This category also excludes
          a security issued by any of the following entities, by a company that would be any of the following
          entities if it were the organized under the laws of the United States or any State, or in either
          case by an affiliate of such an entity: the party posting the collateral, a bank holding company,
          a savings and loan holding company, a U.S. intermediate holding company, a foreign bank, a depositary
          institution, a securities holding company, a broker, a dealer, a futures commission merchant,
          a swap dealer, or a security-based swap dealer.'
      US_CFTC_PRType9:
        description: 'Denotes securities in the form of redeemable securities in a pooled investment fund
          representing the security-holder''s proportional interest in the fund''s net assets and that
          are issued and redeemed only on the basis of the market value of the fund''s net assets prepared
          each business day after the security-holder makes its investment commitment or redemption request
          to the fund, if the fund''s investments are limited to the following: (A) securities that are
          issued by, or unconditionally guaranteed as to the timely payment of principal and interest
          by, the U.S. Department of the Treasury, and immediately-available cash funds denominated in
          U.S. dollars; or (B) securities denominated in a common currency and issued by, or fully guaranteed
          as to the payment of principal and interest by, the European Central Bank or a sovereign entity
          that is assigned no higher than a 20 percent risk weight under the capital rules applicable
          to swap dealers subject to regulation by a prudential regulator, and immediately-available cash
          funds denominated in the same currency; and (C) assets of the fund may not be transferred through
          securities lending, securities borrowing, repurchase agreements, reverse repurchase agreements,
          or other means that involve the fund having rights to acquire the same or similar assets from
          the transferee.'
      US_CTFC_PRType10:
        description: Denotes Gold.
classes:
  Asset:
    description: An Asset is defined as something that can be owned and transferred in the financial markets.
      As a choice data type, one and only one of the attributes must be used.
    attributes:
      Cash:
        description: An Asset that consists solely of a monetary holding in a currency.
        range: Cash
      Commodity:
        description: An Asset comprised of raw or refined materials or agricultural products, eg gold,
          oil or wheat.
        range: Commodity
      DigitalAsset:
        description: An Asset that exists only in digital form, eg Bitcoin or Ethereum; excludes the digital
          representation of other Assets.
        range: DigitalAsset
      Instrument:
        description: An asset that is issued by one party to one or more others; Instrument is also a
          choice data type.
        range: Instrument
    all_of:
      - description: 'OneOf: A choice type holds exactly one of its options.'
        exactly_one_of:
          - slot_conditions:
              Cash:
                value_presence: PRESENT
          - slot_conditions:
              Commodity:
                value_presence: PRESENT
          - slot_conditions:
              DigitalAsset:
                value_presence: PRESENT
          - slot_conditions:
              Instrument:
                value_presence: PRESENT
    annotations:
      rosetta_choice: 'true'
  AssetBase:
    description: The base data type to specify common attributes for all Assets.
    attributes:
      identifier:
        description: Asset Identifiers are used to uniquely identify an Asset, using a specified Asset
          Identifier Type.
        range: AssetIdentifier
        required: true
        multivalued: true
      taxonomy:
        description: Defines the taxonomy of an object by combining a taxonomy source (i.e. the rules
          to classify the object) and a value (i.e. the output of those rules on the object.
        range: Taxonomy
        multivalued: true
      isExchangeListed:
        description: Defines whether the asset is listed on a public exchange.
        range: boolean
      party:
        description: The party with the obligation to pay dividends, coupons, or other payouts to the
          asset holder.
        range: Party
        multivalued: true
      partyRole:
        description: The role of the payer specific to the asset type, i.e. bond, equity.
        range: AssetPartyRole
      ancillaryPartyRole:
        description: The role of a party with indirect participation in the asset (i.e. transfer agent).
        range: AssetAncillaryPartyRole
        multivalued: true
      assetType:
        description: Specifies the type of asset.
        range: AssetTypeEnum
        required: true
    comments:
      - 'Rosetta condition RoleIsExchange is not stated in LinkML: if partyRole -> role = Exchange then
        isExchangeListed = True'
      - 'Rosetta condition ExchangeListed is not stated in LinkML: if isExchangeListed and partyRole exists
        then partyRole -> role = Exchange'
      - 'Rosetta condition IssuerRole is not stated in LinkML: if assetType = Security and partyRole exists
        then partyRole -> role = Issuer'
      - 'Rosetta condition ExchangeRole is not stated in LinkML: if assetType = ListedDerivative and partyRole
        exists then partyRole -> role = Exchange'
      - 'Rosetta condition LenderBorrowerRole is not stated in LinkML: if assetType = Loan and partyRole
        exists then partyRole -> role = Lender or partyRole -> role = Borrower'
  AssetIdentifier:
    description: The unique identifier for an Asset, specified using an Asset Identifier Type enumerator.
    attributes:
      identifier:
        description: The identifier value.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      identifierType:
        description: Defines the symbology source of the Asset Identifier, eg CUSIP, ISIN, etc.
        range: AssetIdTypeEnum
        required: true
  AssetType:
    description: Represents a class to allow specification of the asset product type.
    attributes:
      assetType:
        description: Represents a filter based on the type of collateral asset.
        range: AssetTypeEnum
        required: true
      securityType:
        description: Represents a filter based on the type of security.
        range: SecurityTypeEnum
      debtType:
        description: Represents a filter based on the type of bond.
        range: DebtType
      equityType:
        description: Represents a filter based on the type of equity.
        range: EquityType
      fundType:
        description: Represents a filter based on the type of fund.
        range: FundProductTypeEnum
      otherAssetType:
        description: Specifies the eligible asset type when not enumerated.
        range: string
        multivalued: true
    rules:
      - description: SecuritySubType
        preconditions:
          none_of:
            - slot_conditions:
                assetType:
                  equals_string: Security
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            securityType:
              value_presence: ABSENT
      - description: BondSubType
        preconditions:
          none_of:
            - slot_conditions:
                securityType:
                  equals_string: Debt
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            debtType:
              value_presence: ABSENT
      - description: EquitySubType
        preconditions:
          none_of:
            - slot_conditions:
                securityType:
                  equals_string: Equity
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            equityType:
              value_presence: ABSENT
      - description: FundSubType
        preconditions:
          none_of:
            - slot_conditions:
                securityType:
                  equals_string: Fund
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            fundType:
              value_presence: ABSENT
      - description: OtherAssetSubType
        preconditions:
          slot_conditions:
            assetType:
              equals_string: Other
        postconditions:
          slot_conditions:
            otherAssetType:
              value_presence: PRESENT
  Cash:
    is_a: AssetBase
    description: An Asset that consists solely of a monetary holding in a currency. The currency of the
      Cash asset is held in the string Identifier (from AssetBase) and the AssetIdTypeEnum must be set
      to define that a CurrencyCode is set. The function SetCashCurrency can be used to create (or update)
      a Cash object and the function GetCashCurrency can be used to retrieve the currency of a Cash object.
    all_of:
      - description: 'NoTaxonomy: Taxonomy is not applicable for a Cash asset.'
        slot_conditions:
          taxonomy:
            value_presence: ABSENT
      - description: 'NoExchange: Cash cannot be a listed Asset.'
        slot_conditions:
          isExchangeListed:
            value_presence: ABSENT
      - description: 'AssetType: AssetType must be cash.'
        slot_conditions:
          assetType:
            equals_string: Cash
    comments:
      - 'Rosetta condition CurrencyExists is not stated in LinkML: AssetIdentifierByType (identifier,
        AssetIdTypeEnum -> CurrencyCode) count = 1 and AssetIdentifierByType (identifier, AssetIdTypeEnum
        -> CurrencyCode) -> identifier first to-enum CurrencyCodeEnum exists'
  CollateralGuarantorType:
    description: Specifies the origin of entity guaranteeing the collateral.
    attributes:
      guarantorType:
        description: Specifies the origin of entity guaranteeing the collateral.
        range: CollateralEntityTypeEnum
        required: true
  CollateralIssuerType:
    description: Represents a class to allow specification of the type of entity issuing the collateral.
    attributes:
      issuerType:
        description: Specifies the origin of entity issuing the collateral.
        range: CollateralEntityTypeEnum
        required: true
      supraNationalType:
        description: Specifies debt issued by international organisations and multilateral banks.
        range: SupraNationalIssuerTypeEnum
      quasiGovernmentType:
        description: Specifies debt issues by institutions or bodies, typically constituted by statute,
          with a function mandated by the government and subject to government supervision inclusive of
          profit- and non-profit making bodies. Includes the US Agencies and GSEs and the EU concept of
          public sector entities. Excluding any entities which are also Regional Government.
        range: QuasiGovernmentIssuerType
      regionalGovernmentType:
        description: Specifies Regional government, local authority or municipal.
        range: RegionalGovernmentIssuerType
      specialPurposeVehicleType:
        description: Specifies a subsidiary company that is formed to undertake a specific business purpose
          of acquisition and financing of specific assets on a potentially limited recourse basis dependent
          of how it is designed. E.g. asset backed securities, including securitisations.
        range: SpecialPurposeVehicleIssuerType
    rules:
      - description: SupraNationalSubType
        preconditions:
          none_of:
            - slot_conditions:
                issuerType:
                  equals_string: SupraNational
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            supraNationalType:
              value_presence: ABSENT
      - description: QuasiGovernmentSubType
        preconditions:
          none_of:
            - slot_conditions:
                issuerType:
                  equals_string: QuasiGovernment
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            quasiGovernmentType:
              value_presence: ABSENT
      - description: RegionalGovernmentSubType
        preconditions:
          none_of:
            - slot_conditions:
                issuerType:
                  equals_string: RegionalGovernment
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            regionalGovernmentType:
              value_presence: ABSENT
      - description: SpecialPurposeVehicleSubType
        preconditions:
          none_of:
            - slot_conditions:
                issuerType:
                  equals_string: SpecialPurposeVehicle
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            specialPurposeVehicleType:
              value_presence: ABSENT
  CollateralTaxonomy:
    description: Specifies the collateral taxonomy, which is composed of a taxonomy value and a taxonomy
      source.
    attributes:
      taxonomyValue:
        description: Specifies the taxonomy value.
        range: CollateralTaxonomyValue
        required: true
      taxonomySource:
        description: Specifies the taxonomy source.
        range: TaxonomySourceEnum
        required: true
    comments:
      - 'Rosetta condition Eu_EligibleCollateralTaxonomy is not stated in LinkML: if taxonomySource =
        TaxonomySourceEnum -> EU_EMIR_EligibleCollateralAssetClass then taxonomyValue -> eu_EMIR_EligibleCollateral
        exists'
      - 'Rosetta condition UkEligibleCollateralTaxonomy is not stated in LinkML: if taxonomySource = TaxonomySourceEnum
        -> UK_EMIR_EligibleCollateralAssetClass then taxonomyValue -> uk_EMIR_EligibleCollateral exists'
      - 'Rosetta condition UsEligibleCollateralTaxonomy is not stated in LinkML: if taxonomySource = TaxonomySourceEnum
        -> US_CFTC_PR_EligibleCollateralAssetClass then taxonomyValue -> us_CFTC_PR_EligibleCollateral
        exists'
      - 'Rosetta condition TaxonomyValue is not stated in LinkML: if taxonomyValue -> nonEnumeratedTaxonomyValue
        exists then taxonomySource <> TaxonomySourceEnum -> EU_EMIR_EligibleCollateralAssetClass and taxonomySource
        <> TaxonomySourceEnum -> UK_EMIR_EligibleCollateralAssetClass and taxonomySource <> TaxonomySourceEnum
        -> US_CFTC_PR_EligibleCollateralAssetClass'
  CollateralTaxonomyValue:
    description: Specifies the collateral taxonomy value, either as a specified enumeration or as a string.
    attributes:
      eu_EMIR_EligibleCollateral:
        description: 'Identifies European Union Eligible Collateral Assets classification categories based
          on EMIR Uncleared Margin Rules. Eligible Collateral asset classes for both initial margin (IM)
          and variation margin (VM) posted and collected between specified entities. Please note: EMIR
          regulation will detail which eligible collateral assets classes apply to each type of entity
          pairing (counterparty) and which apply to posting of IM and VM'
        range: EU_EMIR_EligibleCollateralEnum
        multivalued: true
      uk_EMIR_EligibleCollateral:
        description: 'Identifies United Kingdom Eligible Collateral Assets classification categories based
          on UK Onshored EMIR Uncleared Margin Rules Eligible Collateral asset classes for both initial
          margin (IM) and variation margin (VM) posted and collected between specified entities. Please
          note: UK EMIR regulation will detail which eligible collateral assets classes apply to each
          type of entity pairing (counterparty) and which apply to posting of IM and VM.'
        range: UK_EMIR_EligibleCollateralEnum
        multivalued: true
      us_CFTC_PR_EligibleCollateral:
        description: 'Identifies US Eligible Collateral Assets classification categories based on Uncleared
          Margin Rules published by the CFTC and the US Prudential Regulator. Note: While the same basic
          categories exist in the CFTC and US Prudential Regulators’ margin rules, the precise definitions
          or application of those rules could differ between the two rules.'
        range: US_CFTC_PR_EligibleCollateralEnum
        multivalued: true
      nonEnumeratedTaxonomyValue:
        description: Identifies the taxonomy value when not specified as an enumeration.
        range: string
        multivalued: true
        annotations:
          rosetta_metadata: scheme
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              eu_EMIR_EligibleCollateral:
                value_presence: PRESENT
          - slot_conditions:
              uk_EMIR_EligibleCollateral:
                value_presence: PRESENT
          - slot_conditions:
              us_CFTC_PR_EligibleCollateral:
                value_presence: PRESENT
          - slot_conditions:
              nonEnumeratedTaxonomyValue:
                value_presence: PRESENT
  Commodity:
    is_a: AssetBase
    description: Identifies a specific commodity by referencing a product identifier or by a product definition.
    slots:
      - description
    attributes:
      commodityProductDefinition:
        description: Specifies the commodity underlier in the event that no ISDA Commodity Reference Benchmark
          exists.
        range: CommodityProductDefinition
      priceQuoteType:
        description: Describes the required quote type of the underlying price that will be observed.
          Example values include 'Bid, 'Ask', 'Settlement' (for a futures contract) and 'WeightedAverage'
          (for some published prices and indices).
        range: QuotationSideEnum
        required: true
      deliveryDateReference:
        description: Specifies the parameters for identifying the relevant contract date when the commodity
          reference price is a futures contract.
        range: DeliveryDateParameters
    slot_usage:
      description:
        description: Provides additional information about the commodity underlier.
        range: string
    all_of:
      - description: 'AssetType: AssetType must be commodity.'
        slot_conditions:
          assetType:
            equals_string: Commodity
    comments:
      - 'Rosetta condition ValueSource is not stated in LinkML: if taxonomy exists then (taxonomy -> source
        exists and taxonomy -> value exists)'
  CommodityProductDefinition:
    description: Specifies the commodity underlier in the event that no ISDA Commodity Reference Price
      exists.
    attributes:
      referenceFramework:
        description: Specifies the type of commodity.
        range: CommodityReferenceFramework
        required: true
      priceSource:
        description: Specifies a publication that provides the commodity price, including, where applicable
          the details of where in the publication the price is published. Applicable when the commodity
          reference price is not a futures contract
        range: PriceSource
      commodityInfoPublisher:
        description: Specifies the publication where the commodity prices can be found.
        range: CommodityInformationPublisherEnum
      exchangeId:
        description: 'Identifies the exchange from which the reference price should be sourced, using
          the scheme at the following url: http://www.fpml.org/coding-scheme/external/exchange-id-MIC-1-0'
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
    all_of:
      - description: 'CommodityProductDefinitionChoice: Requires the definition of either delivery date
          parameters or non-exchange price source.'
        exactly_one_of:
          - slot_conditions:
              exchangeId:
                value_presence: PRESENT
          - slot_conditions:
              priceSource:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  exchangeId:
                    value_presence: ABSENT
              - slot_conditions:
                  priceSource:
                    value_presence: ABSENT
  CommodityReferenceFramework:
    description: Specifies the type of commodity.
    attributes:
      commodityName:
        description: Identifies the commodity more specifically. Where possible, this should follow the
          naming convention used in the 2005 ISDA Commodity Definitions SubAnnex A, including the subCommodity
          and additional qualifiers, but should be limited to 256 characters or less.
        range: string
        required: true
      capacityUnit:
        description: Provides an enumerated value for a capacity unit, generally used in the context of
          defining quantities for commodities.
        range: CapacityUnitEnum
      weatherUnit:
        description: Provides an enumerated values for a weather unit, generally used in the context of
          defining quantities for commodities.
        range: WeatherUnitEnum
      currency:
        description: Defines the currency in which the commodity is priced.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
    all_of:
      - description: 'CommodityReferenceFrameworkChoice: Requires that either the capacity unit or weather
          unit is populated.'
        exactly_one_of:
          - slot_conditions:
              capacityUnit:
                value_presence: PRESENT
          - slot_conditions:
              weatherUnit:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  capacityUnit:
                    value_presence: ABSENT
              - slot_conditions:
                  weatherUnit:
                    value_presence: ABSENT
  DebtEconomics:
    description: Specifies selected economics of a debt security.
    attributes:
      seniority:
        description: Specifies the order of repayment in the event of a sale or bankruptcy of the issuer
          or a related party (eg guarantor).
        range: DebtSeniorityEnum
      interest:
        description: Specifies the general rule for periodic interest rate payment.
        range: DebtInterestEnum
      principal:
        description: Specifies the general rule for repayment of principal.
        range: DebtPrincipalEnum
      secured:
        description: Specifies the type of secured debt.
        range: SecuredDebt
      redemption:
        description: Specifies the general rule for redemption of a debt security.
        range: DebtRedemption
  DebtRedemption:
    description: Specifies the redemption features and whether the redemption right is exercised at the
      discretion of the issuer or the holder.
    attributes:
      redemptionType:
        description: Specifies the contractual redemption or conversion features associated with a debt
          security.
        range: RedemptionTypeEnum
      putCall:
        description: Specifies the embedded option feature of a debt security.
        range: PutCallEnum
      party:
        description: Specifies whether the debt security is redeemed at the election of the Issuer/Holder.
        range: RedemptionPartyEnum
    rules:
      - description: 'ConvertibleExchangablePartyElectionExists: A type of redemption must be specified
          if the redeeming party is specified.'
        preconditions:
          slot_conditions:
            party:
              value_presence: PRESENT
        postconditions:
          any_of:
            - slot_conditions:
                redemptionType:
                  value_presence: PRESENT
            - slot_conditions:
                putCall:
                  value_presence: PRESENT
  DebtType:
    description: Specifies the type of debt security.
    attributes:
      debtEconomics:
        description: Specifies selected financial terms of a debt security.
        range: DebtEconomics
        multivalued: true
  DeliveryDateParameters:
    description: Specifies a specific date or the parameters for identifying the relevant contract date
      when the commodity reference price is a futures contract.
    attributes:
      deliveryNearby:
        description: Provides a container for the parametric representation that specifies which nearby
          contract date would be used as a refrence for a price.
        range: Offset
      deliveryDate:
        description: Specifies the specific contract date for the contract that should be referenced for
          a price.
        range: AdjustableDate
      deliveryDateRollConvention:
        description: Specifies, for a Commodity Transaction that references a listed future, the day on
          which the specified future will roll to the next nearby month prior to the expiration of the
          referenced future. If the future will not roll at all - i.e. the price will be taken from the
          expiring contract, 0 days should be specified here. If the future will roll to the next nearby
          on the last trading day - i.e. the price will be taken from the next nearby on the last trading
          day, then 1 business day should be specified and so on.
        range: Offset
      deliveryDateExpirationConvention:
        description: 'Specifies, for a Commodity Transaction that references a listed future, the day
          on which the specified future will expire ahead of the actual expiration of the referenced future.
          For example: Z21 Contract expires on 19Nov21, with an adjust of 2D the ''expire'' will be 16Nov21.
          DeliveryDateRollConvention takes precedence. Example: Pricing on the Z21 Contract with NearbyContractDay
          and a deliveryDateRoll of 10D, Sampling of the F22 Contract will occur on 8Nov21 through the
          last Date of the Z21 Contract. With an ExpConvention of 5D, the last sampling date on the F22
          contract will be 12Nov21.'
        range: Offset
    all_of:
      - description: 'DeliveryDateParametersChoice: Requires definition of a delivery date or delieryNearby
          parameters.'
        exactly_one_of:
          - slot_conditions:
              deliveryNearby:
                value_presence: PRESENT
          - slot_conditions:
              deliveryDate:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  deliveryNearby:
                    value_presence: ABSENT
              - slot_conditions:
                  deliveryDate:
                    value_presence: ABSENT
  DigitalAsset:
    is_a: AssetBase
    description: An Asset that exists only in digital form, eg Bitcoin or Ethereum, that is not backed
      by other Assets; excludes the digital representation of other Assets, eg coins or Tokenised assets.
    all_of:
      - description: 'AssetType: Asset type must be Other.'
        slot_conditions:
          assetType:
            equals_string: Other
  EquityType:
    attributes:
      equityType:
        range: EquityTypeEnum
      depositaryReceipt:
        range: DepositaryReceiptTypeEnum
    rules:
      - description: DepositaryReceiptSubType
        preconditions:
          none_of:
            - slot_conditions:
                equityType:
                  equals_string: DepositaryReceipt
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            depositaryReceipt:
              value_presence: ABSENT
  Instrument:
    description: A type of Asset that is issued by one party to one or more others.
    attributes:
      ListedDerivative:
        description: A securitized derivative on another asset that is created by an exchange.
        range: ListedDerivative
      Loan:
        description: An Asset that represents a loan or borrow obligation.
        range: Loan
      Security:
        description: An Asset that is issued by a party to be held by or transferred to others.
        range: Security
    all_of:
      - description: 'OneOf: A choice type holds exactly one of its options.'
        exactly_one_of:
          - slot_conditions:
              ListedDerivative:
                value_presence: PRESENT
          - slot_conditions:
              Loan:
                value_presence: PRESENT
          - slot_conditions:
              Security:
                value_presence: PRESENT
    annotations:
      rosetta_choice: 'true'
  InstrumentBase:
    is_a: AssetBase
    description: Defines the common attributes for all Instrument data types.
  ListedDerivative:
    is_a: InstrumentBase
    description: A securitized derivative on another asset.
    attributes:
      deliveryTerm:
        description: Also called contract month or delivery month. However, it's not always a month. It
          is usually expressed using a code, e.g. Z23 would be the Dec 2023 contract, (Z = December).
          For crude oil, the corresponding contract might be called CLZ23. Optional as this can be uniquely
          identified in the identifier.
        range: string
      optionType:
        description: The type of option, ie Put or Call. Left empty if it is a Future.
        range: PutCallEnum
      strike:
        description: Specifies the strike of the option.
        range: decimal
    all_of:
      - description: 'AssetType: Asset type must be ListedDerivative.'
        slot_conditions:
          assetType:
            equals_string: ListedDerivative
    rules:
      - description: 'Options: Options must have a strike price.'
        preconditions:
          slot_conditions:
            optionType:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            strike:
              value_presence: PRESENT
        elseconditions:
          slot_conditions:
            strike:
              value_presence: ABSENT
  Loan:
    is_a: InstrumentBase
    description: Identifies a loan by referencing an asset identifier and through an optional set of attributes.
    attributes:
      lien:
        description: Specifies the seniority level of the lien.
        range: string
        annotations:
          rosetta_metadata: scheme
      facilityType:
        description: Specifies the type of loan facility (letter of credit, revolving, ...).
        range: string
        annotations:
          rosetta_metadata: scheme
      creditAgreementDate:
        description: 'Specifies the credit agreement date is the closing date (the date where the agreement
          has been signed) for the loans in the credit agreement. Funding of the facilities occurs on
          (or sometimes a little after) the Credit Agreement date. This underlier attribute is used to
          help identify which of the company''s outstanding loans are being referenced by knowing to which
          credit agreement it belongs. ISDA Standards Terms Supplement term: Date of Original Credit Agreement.'
        range: date
      tranche:
        description: 'Denotes the loan tranche that is subject to the derivative transaction. It will
          typically be referenced as the Bloomberg tranche number. ISDA Standards Terms Supplement term:
          Bloomberg Tranche Number.'
        range: string
        annotations:
          rosetta_metadata: scheme
    all_of:
      - description: 'AssetType: Asset type must be Loan.'
        slot_conditions:
          assetType:
            equals_string: Loan
  PriceSource:
    description: Specifies a publication that provides the commodity price, including, where applicable,
      the details of where in the publication the price is published.
    attributes:
      pricePublisher:
        description: 'Defines a publication in which the price can be found. (e.g Gas Daily, Platts Bloomberg.
          Commodity publishers can be found at this URL: http://www.fpml.org/coding-scheme/commodity-information-provider>'
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      priceSourceLocation:
        description: Specifies the location of the price which may be a specific page, electornic screen
          name, or a code (e.g. a RIC code) where the price can be found.
        range: string
      priceSourceHeading:
        description: Specifies the heading or field name for the price on a given page or screen, where
          applicable.
        range: string
      priceSourceTime:
        description: Specifies the time at which the price should be observed.
        range: time
    rules:
      - description: 'PriceSourceHeading: Requires that if a priceSourceHeading is specified, then a priceSourceLocation
          must be speficified'
        preconditions:
          slot_conditions:
            priceSourceHeading:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            priceSourceLocation:
              value_presence: PRESENT
  ProductIdentifier:
    description: Comprises an identifier and a source. The associated metadata key denotes the ability
      to associate a hash value to the ProductIdentifier instantiations for the purpose of model cross-referencing,
      in support of functionality such as the event effect and the lineage.
    slots:
      - source
    attributes:
      identifier:
        description: Provides an identifier associated with a specific product. The identifier is unique
          within the public source specified in the source attribute.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
    slot_usage:
      source:
        description: Defines the source of the identifier.
        range: ProductIdTypeEnum
        required: true
    annotations:
      rosetta_metadata: key
  ProductTaxonomy:
    is_a: Taxonomy
    description: Specifies the product taxonomy, which is composed of a taxonomy value and a taxonomy
      source.
    attributes:
      primaryAssetClass:
        description: Classifies the most important risk class of the trade.
        range: AssetClassEnum
        annotations:
          rosetta_metadata: scheme
      secondaryAssetClass:
        description: Classifies additional risk classes of the trade, if any.
        range: AssetClassEnum
        multivalued: true
        annotations:
          rosetta_metadata: scheme
    all_of:
      - description: 'TaxonomyType: Requires a taxonomy type to be chosen, either from a taxonomy source
          or using asset classes.'
        exactly_one_of:
          - slot_conditions:
              source:
                value_presence: PRESENT
          - slot_conditions:
              primaryAssetClass:
                value_presence: PRESENT
          - slot_conditions:
              secondaryAssetClass:
                value_presence: PRESENT
    rules:
      - description: 'TaxonomySource: A taxonomy source can only be associated with a taxonomy value.'
        preconditions:
          slot_conditions:
            source:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            value:
              value_presence: PRESENT
  QuasiGovernmentIssuerType:
    description: Represents a class to allow specification of different types of Quasi Government collateral.
    attributes:
      sovereignEntity:
        description: True if sovereign entity (e.g. not separate legal personality from sovereign) or
          false if non-sovereign entity (e.g. separate legal personality from sovereign).
        range: boolean
        required: true
      sovereignRecourse:
        description: Applies to non-sovereign entity (e.g. separate legal personality from sovereign).
          True if entity has recourse to sovereign (e.g. debt guaranteed by government). False if entity
          does not have recourse to sovereign.
        range: boolean
    comments:
      - 'Rosetta condition NonSovereignEntityRecourse is not stated in LinkML: if sovereignRecourse exists
        then sovereignEntity = False'
  RegionalGovernmentIssuerType:
    description: Represents a class to allow specification of different type of Regional government collateral.
    attributes:
      sovereignRecourse:
        description: Applies to regional governments, local authorities or municipals. True if entity
          has recourse to sovereign (e.g. debt guaranteed by government). False if entity does not have
          recourse to sovereign.
        range: boolean
        required: true
  SecuredDebt:
    attributes:
      securedType:
        description: Specifies the type of secured debt product.
        range: SecuredTypeEnum
      assetBacked:
        description: Specifies the type of Asset Backed Security.
        range: AssetBackedEnum
      collateralizedObligation:
        description: Specifies the type of Collateralized Obligation.
        range: CollateralizedObligationEnum
      coveredBond:
        description: Specifies the type of Covered Bond.
        range: CoveredBondEnum
      propertyType:
        description: Specifies the type of property when the security is linked to a property asset.
        range: PropertyTypeEnum
    rules:
      - description: 'AssetBackedExists: Condition to restrict selection of the assetBacked attribute
          if AssetBacked is not set as the securedType value.'
        preconditions:
          none_of:
            - slot_conditions:
                securedType:
                  equals_string: AssetBacked
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            assetBacked:
              value_presence: ABSENT
      - description: 'PropertyExists: Condition to restrict selection of the property attribute if the
          security is not linked to a property asset: mortgage, property, CMO.'
        preconditions:
          any_of:
            - none_of:
                - slot_conditions:
                    assetBacked:
                      equals_string: Mortgage
                      value_presence: PRESENT
            - none_of:
                - slot_conditions:
                    assetBacked:
                      equals_string: Property
                      value_presence: PRESENT
            - none_of:
                - slot_conditions:
                    collateralizedObligation:
                      equals_string: CMO
                      value_presence: PRESENT
        postconditions:
          slot_conditions:
            propertyType:
              value_presence: ABSENT
      - description: 'CollateralizedObligationExists: Condition to restrict selection of the collateralizedObligations
          attribute if CollateralizedObligation is not set as the securedType value.'
        preconditions:
          none_of:
            - slot_conditions:
                securedType:
                  equals_string: CollateralizedObligation
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            collateralizedObligation:
              value_presence: ABSENT
      - description: 'CoveredBondsExists: Condition to restrict selection of the coveredBonds attribute
          if CoveredBonds is not set as the securedType value.'
        preconditions:
          none_of:
            - slot_conditions:
                securedType:
                  equals_string: CoveredBonds
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            coveredBond:
              value_presence: ABSENT
  Security:
    is_a: InstrumentBase
    description: Identifies a security by referencing an identifier and by specifying the sector.
    attributes:
      securityType:
        description: Identifies the type of security using an enumerated list.
        range: SecurityTypeEnum
        required: true
      debtType:
        description: Identifies the type of debt and selected debt economics.
        range: DebtType
      equityType:
        description: Identifies the type of equity.
        range: EquityType
      fundType:
        description: Identifies the type of fund.
        range: FundProductTypeEnum
    all_of:
      - description: 'AssetType: Asset type must be Security.'
        slot_conditions:
          assetType:
            equals_string: Security
    rules:
      - description: DebtSubType
        preconditions:
          none_of:
            - slot_conditions:
                securityType:
                  equals_string: Debt
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            debtType:
              value_presence: ABSENT
      - description: EquitySubType
        preconditions:
          none_of:
            - slot_conditions:
                securityType:
                  equals_string: Equity
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            equityType:
              value_presence: ABSENT
      - description: FundSubType
        preconditions:
          none_of:
            - slot_conditions:
                securityType:
                  equals_string: Fund
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            fundType:
              value_presence: ABSENT
    annotations:
      doc_reference: ICMA GMRA namingConvention Purchased Security
  SpecialPurposeVehicleIssuerType:
    description: Represents a class to allow specification of different types of special purpose vehicle
      (SPV) collateral.
    attributes:
      creditRisk:
        description: Indicates tranched or untranched credit risk.
        range: CreditRiskEnum
  Taxonomy:
    description: Defines the taxonomy of an object by combining a taxonomy source (i.e. the rules to classify
      the object) and a value (i.e. the output of those rules on the object).
    slots:
      - source
    attributes:
      value:
        description: The value according to that taxonomy. Optional as it may not be possible to classify
          the object in that taxonomy.
        range: TaxonomyValue
      calculated:
        description: Specifies whether the taxonomy has been derived from the model features using a CDM
          qualification function that determines the product type based on the model features.
        range: boolean
    slot_usage:
      source:
        description: The source of the taxonomy that defines the rules for classifying the object. The
          taxonomy source is taken from a enumerated list of taxonomy names. Optional as the taxonomy
          source may not be provided.
        range: TaxonomySourceEnum
    comments:
      - 'Rosetta condition OrdinalExists is not stated in LinkML: if value -> classification count > 1
        then value -> classification -> ordinal count = value -> classification count'
      - 'Rosetta condition DifferentOrdinals is not stated in LinkML: if value -> classification -> ordinal
        exists then value -> classification -> ordinal count = value -> classification -> ordinal distinct
        count'
      - 'Rosetta condition SequentialOrdinals is not stated in LinkML: if value -> classification count
        > 1 then value -> classification -> ordinal count = value -> classification -> ordinal max'
  TaxonomyClassification:
    slots:
      - description
    attributes:
      className:
        description: The name defined by the classification system for a specific attribute in the taxonomy
        range: string
      value:
        description: The value set by the taxonomy that is specific to the className attribute.
        range: string
        required: true
      ordinal:
        description: In the case of multi-layered hierarchical classification systems such as commodity
          classification, the layer the value and className occupy in the classification hierarchy, where
          1 represents the top-layer.
        range: integer
    slot_usage:
      description:
        description: A description of the class.
        range: string
  TaxonomyValue:
    description: Defines a taxonomy value as either a simple string or a more granular expression with
      class names and values for each class.
    slots:
      - name
    attributes:
      classification:
        description: Specifies the taxonomy value as a set of class names and values for each class.
        range: TaxonomyClassification
        multivalued: true
    slot_usage:
      name:
        description: Specifies the taxonomy value as a simple string, which may be associated to an external
          scheme.
        range: string
        annotations:
          rosetta_metadata: scheme
    all_of:
      - description: ValueExists
        any_of:
          - slot_conditions:
              name:
                value_presence: PRESENT
          - slot_conditions:
              classification:
                value_presence: PRESENT
