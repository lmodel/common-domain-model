  DebtInterestEnum:
    description: Represents an enumeration list that specifies the general rule for periodic interest
      rate payment.
    permissible_values:
      Fixed:
        description: Denotes payment calculated with reference to a fixed interest rate.
      Floating:
        description: Denotes payment calculated with reference to a floating interest rate.
      InflationLinked:
        description: Denotes payment calculated with reference to one or more specified inflation rates.
      IndexLinked:
        description: Denotes payment calculated with reference to one or more price or other indices (other
          than inflation rates).
      InterestOnly:
        description: Denotes a stripped bond representing only the interest component.
      OtherStructured:
        description: Denotes payment calculated with reference to other underlyings (not being floating
          interest rates, inflation rates or indices) or with a non-linear relationship to floating interest
          rates, inflation rates or indices.
      InverseFloating:
        description: Denotes payment calculated with reference to the inverse of a floating interest rate.
      ZeroCoupon:
        description: Denotes a zero coupon bond that does not pay intetrest.
  DebtPrincipalEnum:
    description: Represents an enumeration list that specifies the general rule for repayment of principal.
    permissible_values:
      Bullet:
        description: Denotes that the principal is paid all at once on maturity of the debt insrument.
          Bullet debt instruments cannot be redeemed early by an issuer, which means they are non-callable.
      Callable:
        description: Denotes that the principal on the debt can be repaid early, in whole or in part,
          at the option of the issuer.
      Puttable:
        description: Denotes that the principal on the debt can be repaid early, in whole or in part,
          at the option of the holder.
      Amortising:
        description: Denotes that the principal on the debt is paid down regularly, along with its interest
          expense over the life of the debt instrument. Includes amortising instruments with a bullet
          balance repayment at maturity.
      InflationLinked:
        description: Denotes that the principal on the debt is calculated with reference to one or more
          specified inflation rates.
      IndexLinked:
        description: Denotes that the principal on the debt is calculated with reference to one or more
          price or other indices (other than inflation rates).
      OtherStructured:
        description: Denotes that the principal on the debt is calculated with reference to other underlyings
          (not being floating interest rates, inflation rates or indices) or with a non-linear relationship
          to floating interest rates, inflation rates or indices.
      PrincipalOnly:
        description: Denotes a stripped bond representing only the principal component.
  DebtSeniorityEnum:
    description: Specifies the order of repayment in the event of a sale or bankruptcy of the issuer or
      a related party (eg guarantor).
    permissible_values:
      Secured:
        description: Denotes debt which is secured over assets of the issuer or a related party (eg guarantor).
      Senior:
        description: Denotes debt which ranks pari passu with all other unsecured creditors of the issuer.
      Subordinated:
        description: Denotes debt owed to an unsecured creditor that in the event of a liquidation can
          only be paid after the claims of secured and senior creditors have been met.
  DeliveryNearbyTypeEnum:
    permissible_values:
      CalculationPeriod:
        description: Describes the reference contract as the one that pertains to the month-year of the
          calculation period. If used, the nearby count is expected to be 0.
      NearbyMonth:
        description: Specifies that the reference delivery date of the underlying Commodity shall be the
          expiration date of the futures contract in the nth nearby month.
      NearbyWeek:
        description: Specifies that the reference delivery date of the underlying Commodity shall be the
          expiration date of the futures contract in the nth nearby week.
  DepositaryReceiptTypeEnum:
    permissible_values:
      ADR:
        description: American Depositary Receipts. Identifies a depositary receipt that are issued only
          by U.S. banks for foreign stocks that are traded on a U.S. exchange.
      GDR:
        description: Global Depositary Receipts. Identifies a depositary receipt that is listed on European
          and other international exchanges.
      IDR:
        description: Indian Depositary Receipts. Identifies a depositary receipt that are issued only
          by domestic depositories for foreign stocks that are traded on an Indian exchange.
      EDR:
        description: European Depositary Receipts. Identifies a depositary receipt that are issued only
          by European banks for foreign stocks that are traded on a European exchange.
  EU_EMIR_EligibleCollateralEnum:
    description: 'Identifies European Union Eligible Collateral Assets classification categories based
      on EMIR Uncleared Margin Rules. Eligible Collateral asset classes for both initial margin (IM) and
      variation margin (VM) posted and collected between specified entities. Please note: EMIR regulation
      will detail which eligible collateral assets classes apply to each type of entity pairing (counterparty)
      and which apply to posting of IM and VM.'
    permissible_values:
      EU_EMIRTypeA:
        description: Denotes Cash in the form of money credited to an account in any currency, or similar
          claims for the repayment of money, such as money market deposits.
      EU_EMIRTypeB:
        description: Denotes gold in the form of allocated pure gold bullion of recognised good delivery.
      EU_EMIRTypeC:
        description: Denotes debt securities issued by Member States' central governments or central banks.
      EU_EMIRTypeD:
        description: Denotes debt securities issued by Member States' regional governments or local authorities
          whose exposures are treated as exposures to the central government of that Member State in accordance
          with Article 115(2) of Regulation (EU) No 575/2013.
      EU_EMIRTypeE:
        description: Denotes debt securities issued by Member States' public sector entities whose exposures
          are treated as exposures to the central government, regional government or local authority of
          that Member State in accordance with Article 116(4) of Regulation (EU) No 575/2013.
      EU_EMIRTypeF:
        description: Denotes debt securities issued by Member States' regional governments or local authorities
          other than those referred to in (TypeD.)
      EU_EMIRTypeG:
        description: Denotes debt securities issued by Member States' public sector entities other than
          those referred to in (TypeE).
      EU_EMIRTypeH:
        description: Denotes debt securities issued by multilateral development banks listed in Article
          117(2) of Regulation (EU) No 575/2013.
      EU_EMIRTypeI:
        description: Denotes debt securities issued by the international organisations listed in Article
          118 of Regulation (EU) No 575/2013.
      EU_EMIRTypeJ:
        description: Denotes debt securities issued by third countries' governments or central banks.
      EU_EMIRTypeK:
        description: Denotes debt securities issued by third countries' regional governments or local
          authorities that meet the requirements of (TypeD) and (TypeE).
      EU_EMIRTypeL:
        description: Denotes debt securities issued by third countries' regional governments or local
          authorities other than those referred to in (TypeD) and (TypeE).
      EU_EMIRTypeM:
        description: Denotes debt securities issued by credit institutions or investment firms including
          bonds referred to in Article 52(4) of Directive 2009/65/EC of the European Parliament and of
          the Council.
      EU_EMIRTypeN:
        description: Denotes corporate bonds.
      EU_EMIRTypeO:
        description: Denotes the most senior tranche of a securitisation, as defined in Article 4(61)
          of Regulation (EU) No 575/2013, that is not a re-securitisation as defined in Article 4(63)
          of that Regulation.
      EU_EMIRTypeP:
        description: Denotes convertible bonds provided that they can be converted only into equities
          which are included in an index specified pursuant to point (a) of Article 197 (8) of Regulation
          (EU) No 575/2013.
      EU_EMIRTypeQ:
        description: Denotes equities included in an index specified pursuant to point (a) of Article
          197(8) of Regulation (EU) No 575/2013.
      EU_EMIRTypeR:
        description: Denotes shares or units in undertakings for collective investments in transferable
          securities (UCITS), provided that the conditions set out in Article 5 of EU Regulation 2016/2251
          are met.
  EquityTypeEnum:
    description: Represents an enumeration list to identify the type of Equity.
    permissible_values:
      Ordinary:
        description: Identifies an Equity of Common stocks and shares.
      NonConvertiblePreference:
        description: Identifies an Equity of Non-Convertible Preference, Shares which hold priority to
          receive capital return in event of issuer liquidation.
      DepositaryReceipt:
        description: Identifies a negotiable depositary receipt certificate issued by a bank representing
          shares in a foreign company traded on a local stock exchange.
      ConvertiblePreference:
        description: Identifies an Equity of Convertible Preference, a stock which can be converted into
          a predetermined number of common shares and holds priority to receive capital return in event
          of issuer liquidation.
  FundProductTypeEnum:
    description: Represents an enumeration list to identify the fund product type.
    permissible_values:
      MoneyMarketFund:
        description: Denotes a fund that invests only in highly liquid near-term instruments such as cash,
          cash equivalent securities, and high credit rating debt instruments with a short-term maturity.
      ExchangeTradedFund:
        description: Denotes an investment fund consisting of stocks, bonds, and/or other assets that
          is passively managed and traded on a stock exchange.
      MutualFund:
        description: Denotes an investment fund consisting of stocks, bonds, and/or other assets that
          is actively managed and can only be purchased or sold through the investment manager.
      OtherFund:
        description: Denotes a fund that is not an Exchange Traded Fund, Money Market Fund or Mutual Fund.
