enums:
  AssetBackedEnum:
    description: Specifies the underlying asset or asset pool securing an Asset Backed debt instrument.
    permissible_values:
      HomeEquity:
        description: When the asset(s) backing the debt are home equity loans, in which the borrower uses
          the equity of their home as collateral.
      AutoLoan:
        description: When the asset(s) backing the debt are auto loans.
      StudentLoan:
        description: When the asset(s) backing the debt are student loans.
      CreditCard:
        description: When the asset(s) backing the debt are credit card loans.
      Property:
        description: When the asset(s) backing the debt are property, typically when the debt is a mortgage
          loan.
      Mortgage:
        description: When the asset(s) backing the debt instrument is a pool of mortgage loans, e.g. for
          a mortgage backed security.
      Other:
        description: Any other asset which generates receivables for an Asset Backed Security.
  AssetClassEnum:
    description: The enumerated values to specify the FpML asset class categorization.
    permissible_values:
      Commodity:
        description: Commodity.
      Credit:
        description: Credit.
      Equity:
        description: Equity.
      ForeignExchange:
        description: ForeignExchange.
      InterestRate:
        description: InterestRate.
      MoneyMarket:
        description: Money Market Assets like CP and CD.
  AssetIdTypeEnum:
    description: Extends product identifiers with additional identifier sources for Assets.
    permissible_values:
      BBGID:
        description: Published by Bloomberg, the BBGID is a 12-digit alphanumeric randomly generated ID
          covering active and non-active securities.
      BBGTICKER:
        description: Published by Bloomberg as a short code to identify publicly trades shares of a particular
          stock on a specific exchange.
      CUSIP:
        description: Derived from the Committee on Uniform Security Identification Procedures, CUSIPs
          are 9-character identifiers that capture an issue’s important differentiating characteristics
          for issuers and their financial instruments in the U.S. and Canada.
      FIGI:
        description: Issued under the guidelines of the Object Management Group, the Financial Instrument
          Global Identifier (FIGI) is a 12 character, alphanumeric, randomly generated ID covering hundreds
          of millions of active and inactive instruments. The identifier acts as a Uniform Resource Identifier
          (URI) to link to a set of metadata that uniquely and clearly describes the instrument.
      ISDACRP:
        description: Issued by the International Swaps Dealers Association as a string representing a
          Commodity Reference Price used for purposes of determining a relevant price for an underlying
          commodity in an OTC derivatives contract.
      ISIN:
        description: Issued by The International Securities Identification Number (ISIN) Organization,
          the ISIN is a 12-character alpha-numerical code used to uniformly identify a security for trading
          and settlement purposes. Securities with which ISINs can be used include debt securities, such
          as notes or bonds as well shares, such as common stock or shares of a fund, options, derivatives,
          and futures. The ISIN structure is defined in ISO 6166.
      Name:
        description: The name of the product.
      REDID:
        description: Assigned by S&P Global Market Intelligence, REDID (Reference Entity Data Identifier)
          is a unique alphanumeric code to reference entities, primarily utilized within the credit derivatives
          market for the standardized identification of underlying entities.
      RIC:
        description: Issued by Refinitiv (formerly Reuters), the Reuters Instrument Codes(RIC) uniquely
          identifies financial instruments, including where they are traded.
      Other:
        description: Used when the source is not otherwise in this enumerated list because it is internal
          or other reasons. The source can be identified in the scheme which is part of the identifier
          attribute.
      Sicovam:
        description: Issued by the French Société Interprofessionnelle pour la Compensation des Valeurs
          Mobilières (SICOVAM) to identify French securities listed on French stock exchanges.
      SEDOL:
        description: Assigned by the London Stock Exchange, the Stock Exchange Daily Official List (SEDOL)
          is a list of security identifiers used in the United Kingdom and Ireland for clearing purposes.
          SEDOLs serve as the National Securities Identifying Number for all securities issued in the
          United Kingdom and are therefore part of the security's ISIN as well.
      UPI:
        description: Assigned by the Derivatives Service Bureau Ltd (DSB), the Unique Product Identifier
          (UPI) is a unique code to describe an over-the-counter (OTC) derivatives product. The UPI is
          used for identifying the product in transaction reporting data.
      Valoren:
        description: Assigned by SIX Financial Information, Valoren is a unique numerical identification
          number typically ranging from six to nine digits primarily traded in Switzerland, Liechtenstein,
          and Belgium. This code enables the identification of securities such as stocks, bonds, and investment
          funds within these markets.
      Wertpapier:
        description: Issued by the Institute for the Issuance and Administration of Securities in Germany
          (Securities Information), the Wertpapierkennnummer (WKN, WPKN, WPK or simply Wert) consists
          of six digits or capital letters (excluding I and O), and no check digit. It is used to identify
          German securities.
      CurrencyCode:
        description: Used to identify the currency of a Cash Asset.
      ExchangeCode:
        description: The identifier follows the symbology set by the exchange which lists the asset.
      ClearingCode:
        description: The identifier follows the symbology set by the clearing house which clears the asset.
    annotations:
      rosetta_extends: ProductIdTypeEnum
  AssetTypeEnum:
    description: Represents an enumeration list to identify the asset type.
    permissible_values:
      Security:
        description: Identifies negotiable financial instrument of monetary value with an issue ownership
          position.
      Cash:
        description: Identifies cash in a currency form.
      Commodity:
        description: Identifies basic good used in commerce that is interchangeable with other goods of
          the same type.
      ListedDerivative:
        description: Identifies an asset as a listed derivative on an exchange.
      Loan:
        description: An asset that represents a loan or borrow obligation.
      LetterOfCredit:
        description: Identifies an asset as a letter of credit or documentary credit/ bankers commercial
          credit. A payment mechanism used in international trade to provide economic guarantee of payment
          by a creditworthy issuer for payment of exported goods.
      Other:
        description: Identifies other asset types.
  CollateralEntityTypeEnum:
    description: Represents an enumeration list to identify the type of entity issuing or guaranteeing
      the collateral asset.
    permissible_values:
      SupraNational:
        description: Specifies international organisations and multilateral banks, entities constituted
          by treaties or with multiple sovereign members includes Multilateral development Banks.
      SovereignCentralBank:
        description: Specifies Sovereign, Government Debt Securities including Central Banks.
      QuasiGovernment:
        description: Specifies institutions or bodies, typically constituted by statute, with a function
          mandated by the government and subject to government supervision inclusive of profit- and non-profit
          making bodies. Includes the US Agencies and GSEs and the EU concept of public sector entities.
          Excluding any entities which are also Regional Government.
      RegionalGovernment:
        description: Specifies Regional Governments including states within countries, local authorities
          and municipalities.
      Corporate:
        description: Specifies corporate bodies including Banks.
      Fund:
        description: Specifies a vehicle (with or without separate legal personality) designed for the
          purposes of collective investment towards a defined investment goal.
      SpecialPurposeVehicle:
        description: Specifies a vehicle setup for the purpose of acquisition and financing of specific
          assets on a limited recourse basis. E.g. asset backed securities, including securitisations.
