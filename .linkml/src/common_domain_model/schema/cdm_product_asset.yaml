---
id: https://w3id.org/lmodel/common-domain-model/cdm_product_asset
name: cdm_product_asset
title: CDM cdm.product.asset
description: Product concepts applicable to specific asset classes.
version: 8.0.0-dev.13
source: https://github.com/finos/common-domain-model/tree/8.0.0-dev.13
license: Apache-2.0
prefixes:
  common_domain_model: https://w3id.org/lmodel/common-domain-model/
  linkml: https://w3id.org/linkml/
default_prefix: common_domain_model
default_range: string
imports:
  - linkml:types
  - ./cdm_base_datetime
  - ./cdm_base_datetime_daycount
  - ./cdm_base_math
  - ./cdm_base_staticdata_asset_commodity
  - ./cdm_base_staticdata_asset_common
  - ./cdm_base_staticdata_asset_credit
  - ./cdm_base_staticdata_asset_rates
  - ./cdm_base_staticdata_identifier
  - ./cdm_base_staticdata_party
  - ./cdm_observable_asset
  - ./cdm_observable_asset_calculatedrate
  - ./cdm_observable_common
  - ./cdm_observable_event
  - ./cdm_product_common_schedule
  - ./cdm_product_common_settlement
  - ./cdm_product_template
enums:
  BankHolidayTreatmentEnum:
    description: Defines whether the bank holidays are treated as weekdays or weekends in terms of delivery
      profile in the context of commodity products, in particular those with peak or off-peak delivery
      profiles.
    permissible_values:
      AsWeekday:
        description: Bank holidays treated as weekdays.
      AsWeekend:
        description: Bank holidays treated as weekends.
  CompoundingMethodEnum:
    description: The enumerated values to specify the type of compounding, e.g. flat, straight.
    permissible_values:
      Flat:
        description: Flat compounding. Compounding excludes the spread. Note that the first compounding
          period has it's interest calculated including any spread then subsequent periods compound this
          at a rate excluding the spread.
      None:
        description: No compounding is to be applied.
      Straight:
        description: Straight compounding. Compounding includes the spread.
      SpreadExclusive:
        description: Spread Exclusive compounding.
  CreditSeniorityEnum:
    description: Seniority of debt instruments comprising the index.
    permissible_values:
      Other:
        description: Other as defined under EMIR.
      SeniorLossAbsorbingCapacity:
        description: 'Senior Loss Absorbing Capacity (RED Tier Code: SNRLAC).'
      SeniorSec:
        description: 'Senior domestic (RED Tier Code: SECDOM).'
      SeniorUnSec:
        description: 'Senior foreign (RED Tier Code: SNRFOR).'
      SubLowerTier2:
        description: 'Subordinate, Lower Tier 2 (RED Tier Code: SUBLT2).'
      SubTier1:
        description: 'Subordinate Tier 1 (RED Tier Code: PREFT1).'
      SubTier3:
        description: Subordinate, Tier 3.
      SubUpperTier2:
        description: 'Subordinate, Upper Tier 2 (RED Tier Code: JRSUBUT2).'
    annotations:
      doc_reference: ISDA FpML_Coding_Scheme schemeLocation http://www.fpml.org/coding-scheme/credit-seniority
    see_also:
      - http://www.fpml.org/coding-scheme/credit-seniority
  DayDistributionEnum:
    description: Denotes the method by which the pricing days are distributed across the pricing period.
    permissible_values:
      All: {}
      First: {}
      Last: {}
      Penultimate: {}
  DiscountingTypeEnum:
    description: The enumerated values to specify the method of calculating discounted payment amounts.
      This enumerations combines the FpML DiscountingTypeEnum and FraDiscountingEnum enumerations.
    permissible_values:
      Standard:
        description: As specified by the 2006 ISDA Definitions, Section 8.4. Discounting, paragraph (a).
      FRA:
        description: As specified by the 2006 ISDA Definitions, Section 8.4. Discounting, paragraph (b).
      FRAYield:
        description: As specified by the 2006 ISDA Definitions, Section 8.4. Discounting, paragraph (e).
      AFMA:
        description: As specified by the Australian Financial Markets Association (AFMA) OTC Financial
          Product Conventions. This discounting method should not be used for a trade documented under
          a legal framework where the 2006 ISDA Definitions have been incorporated.
  DividendAmountTypeEnum:
    description: The enumerated values to specify whether the dividend is paid with respect to the Dividend
      Period.
    permissible_values:
      RecordAmount:
        description: The record date for a dividend occurs during a dividend period.
      ExAmount:
        description: The ex-date for a dividend occurs during a dividend period.
      PaidAmount:
        description: The payment date for a dividend occurs during a dividend period.
      AsSpecifiedInMasterConfirmation:
        description: The Amount is determined as provided in the relevant Master Confirmation.
  DividendCompositionEnum:
    description: The enumerated values to specify how the composition of Dividends is to be determined.
    permissible_values:
      EquityAmountReceiverElection:
        description: The Equity Amount Receiver determines the composition of dividends (subject to conditions).
      CalculationAgentElection:
        description: The Calculation Agent determines the composition of dividends (subject to conditions).
  DividendDateReferenceEnum:
    description: The enumerated values to specify the date by reference to which the dividend will be
      paid.
    permissible_values:
      AdHocDate:
        description: The dividend date will be specified ad-hoc by the parties, typically on the dividend
          ex-date.
      CashSettlementPaymentDate:
        description: If 'Dividend Payment Date(s)' is specified in the Transaction Supplement as 'Cash
          Settlement Payment Date', then the Dividend Payment Date in respect of a Dividend Amount shall
          be the Cash Settlement Payment Date relating to the end of the Dividend Period during which
          the Shares commenced trading 'ex' the relevant dividend on the Exchange.
      CashSettlePaymentDateExDiv:
        description: If 'Dividend Payment Date(s)' is specified in the Transaction Supplement as 'Cash
          Settlement Payment Date – Ex Dividend'', then the Dividend Payment Date in respect of a Dividend
          Amount shall be the Cash Settlement Payment Date relating to the end of the Dividend Period
          during which the Shares commenced trading 'ex' the relevant dividend on the Exchange.
      CashSettlePaymentDateIssuerPayment:
        description: If 'Dividend Payment Date(s)' is specified in the Transaction Supplement as 'Cash
          Settlement Payment Date – Issuer Payment', then the Dividend Payment Date in respect of a Dividend
          Amount shall be the Cash Settlement Payment Date relating to the end of the Dividend Period
          during which the issuer pays the relevant dividend to a holder of record provided that in the
          case where the Equity Amount Payer is the party specified to be the sole Hedging Party and the
          Hedging Party has not received the Dividend Amount by such date, then the date falling a number
          of Currency Business Days as specified in the Cash Settlement Payment Date after actual receipt
          by the Hedging Party of the Received Ex Amount or Paid Ex Amount (as applicable).
      CumulativeEquityExDiv:
        description: Total of dividends which go ex, paid on next following Equity Payment Date, which
          is immediately following the Dividend Period during which the Shares commence trading ex-dividend
          on the Exchange.
      CumulativeEquityPaid:
        description: Total of paid dividends, paid on next following Equity Payment Date, which is immediately
          following the Dividend Period during which the dividend is paid by the Issuer to the holders
          of record of a Share.
      CumulativeEquityExDivBeforeReset:
        description: Total of paid dividends, paid on next following Equity Payment Date, which is immediately
          following the Dividend Ex Date, unless the Dividend Ex Date is between the Equity Valuation
          and Payment Date in which case the dividend is deferred to the following Equity Payment Date
      CumulativeEquityPaidBeforeReset:
        description: Total of paid dividends, paid on next following Equity Payment Date, which is immediately
          following the Dividend Pay Date, unless the Dividend Pay Date is between the Equity Valuation
          and Payment Date (not including the Valuation Date) in which case the dividend is deferred to
          the following Equity Payment Date
      CumulativeEquityPaidInclReset:
        description: Total of paid dividends, paid on next following Equity Payment Date, which is immediately
          following the Dividend Pay Date, unless the Dividend Pay Date is between the Equity Valuation
          and Payment Date (including the Valuation Date) in which case the dividend is deferred to the
          following Equity Payment Date
      CumulativeInterestExDiv:
        description: Total of dividends which go ex, paid on next following Interest Payment Date, which
          is immediately following the Dividend Period during which the Shares commence trading ex-dividend
          on the Exchange, or where the date on which the Shares commence trading ex-dividend is a Payment
          Date, such Payment Date.
      CumulativeInterestPaid:
        description: Total of paid dividends, paid on next following Interest Payment Date, which is immediately
          following the Dividend Period during which the dividend is paid by the Issuer to the holders
          of record of a Share.
      CumulativeInterestPaidInclReset:
        description: Total of paid dividends, paid on next following Interest Payment Date, which is immediately
          following the Dividend Pay Date, unless the Dividend Pay Date is between the Equity Valuation
          and Payment Date (including the Valuation Date) in which case the dividend is deferred to the
          following Interest Payment Date.
      CumulativeInterestPaidBeforeReset:
        description: Total of paid dividends, paid on next following Interest Payment Date, which is immediately
          following the Dividend Pay Date, unless the Dividend Pay Date is between the Equity Valuation
          and Payment Date (not including the Valuation Date) in which case the dividend is deferred to
          the following Interest Payment Date.
      DividendPaymentDate:
        description: Date on which the dividend will be paid by the issuer.
      DividendValuationDate:
        description: In respect of each Dividend Period, the relevant Dividend Valuation Date.
      EquityPaymentDate:
        description: Equity payment date of the swap.
      ExDate:
        description: Date on which a holder of the security is entitled to the dividend.
      FloatingAmountPaymentDate:
        description: If 'Dividend Payment Date(s)' is specified in the Transaction Supplement as 'Floating
          Amount Payment Date', then the Dividend Payment Date in respect of a Dividend Amount shall be
          the first Payment Date falling at least one Settlement Cycle after the date that the Shares
          have commenced trading 'ex' the relevant dividend on the Exchange.
      FollowingPaymentDate:
        description: The next payment date of the swap.
      RecordDate:
        description: Date on which the dividend will be recorded in the books of the paying agent.
      SharePayment:
        description: If 'Dividend Payment Date(s)' is specified in the Transaction Supplement as 'Share
          Payment', then the Dividend Payment Date in respect of a Dividend Amount shall fall on a date
          on or before the date that is two (or any other number that is specified in the Transaction
          Supplement) Currency Business Days following the day on which the Issuer of the Shares pays
          the relevant dividend to holders of record of the Shares.
      TerminationDate:
        description: Termination date of the swap.
      TradeDate:
        description: Trade date of the swap
      UnwindOrEquityExDiv:
        description: Pays a fraction of the Dividend Amount on each Unwind Trade Settlement Date which
          occurs after the Dividend Ex Date, until position is fully unwound OR on the next Equity Pay
          Date after the Dividend Pay Date. This will be whichever date comes first or a combination of
          both.
      UnwindOrEquityPaid:
        description: Pays a fraction of the Dividend Amount on each Unwind Trade Settlement Date which
          occurs after the Dividend Pay Date, until position is fully unwound OR on the next Equity Pay
          Date after the Dividend Pay Date. This will be whichever date comes first or a combination of
          both.
      UnwindOrInterestExDiv:
        description: Pays a fraction of the Dividend Amount on each Unwind Trade Settlement Date which
          occurs after the Dividend Ex Date, until position is fully unwound OR on the next Interest Pay
          Date after the Dividend Ex Date. This will be whichever date comes first or a combination of
          both.
      UnwindOrInterestPaid:
        description: Pays a fraction of the Dividend Amount on each Unwind Trade Settlement Date which
          occurs after the Dividend Pay Date, until position is fully unwound OR on the next Interest
          Pay Date after the Dividend Pay Date. This will be whichever date comes first or a combination
          of both.
      UnwindExDiv:
        description: Pays a fraction of the total on each Unwind Trade Settlement Date which occurs after
          the Dividend Ex Date, until trade is fully unwound.
      UnwindPaid:
        description: Pays a fraction of the total on each Unwind Trade Settlement Date which occurs after
          the Dividend Pay Date, until trade is fully unwound.
  DividendEntitlementEnum:
    description: The enumerated values to specify the date on which the receiver of the equity payout
      is entitled to the dividend.
    permissible_values:
      ExDate:
        description: Dividend entitlement is on the dividend ex-date.
      RecordDate:
        description: Dividend entitlement is on the dividend record date.
  DividendPeriodEnum:
    description: '2002 ISDA Equity Derivatives Definitions: First Period, Second Period |'
    permissible_values:
      FirstPeriod:
        description: '2002 ISDA Equity Derivatives Definitions: First Period means each period from, and
          including, one Cash Settlement Payment Date or Settlement Date, as the case may be, to, but
          excluding, the next following Cash Settlement Payment Date or Settlement Date, as the case may
          be, except that (i) the initial Dividend Period will commence on, and include, the Clearance
          System Business Day that is one Settlement Cycle following the Trade Date and (ii) the final
          Dividend Period will end on, but exclude, the final Cash Settlement Payment Date or Settlement
          Date, as the case may be.'
      SecondPeriod:
        description: '2002 ISDA Equity Derivatives Definitions: Second Period means each period from,
          but excluding, one Valuation Date to, and including, the next Valuation Date, except that (i)
          the initial Dividend Period will commence on, but exclude, the Trade Date and (ii) the final
          Dividend Period will end on, and include, the final Valuation Date or, in respect of a Physically-settled
          Forward Transaction to which Variable Obligation is not applicable, the date that is one Settlement
          Cycle prior to the Settlement Date.'
  FPVFinalPriceElectionFallbackEnum:
    description: Specifies the fallback provisions in respect to the applicable Futures Price Valuation.
    permissible_values:
      FPVClose:
        description: In respect of the Early Final Valuation Date, the provisions for FPV Close shall
          apply.
      FPVHedgeExecution:
        description: In respect of the Early Final Valuation Date, the provisions for FPV Hedge Execution
          shall apply.
  FinalPrincipalExchangeCalculationEnum:
    description: To be specified only for products that embed a redemption payment.
    permissible_values:
      Floored:
        description: 'If Floored is set then Principal Exchange takes the form: Notional Amount * Max(1,
          Index Final/ Index Base).'
      NonFloored:
        description: 'If NonFloored is set then the Principal Exchange takes the form: Notional Amount
          * Index Final / Index Base.'
  IndexAnnexSourceEnum:
    description: The enumerated values to specify the CDX index annex source.
    permissible_values:
      MasterConfirmation:
        description: As defined in the relevant form of Master Confirmation applicable to the confirmation
          of Dow Jones CDX indices.
      Publisher:
        description: As defined in the relevant form of Master Confirmation applicable to the confirmation
          of Dow Jones CDX indices.
  InterestShortfallCapEnum:
    description: The enumerated values to specify the interest shortfall cap, applicable to mortgage derivatives.
    permissible_values:
      Fixed: {}
      Variable: {}
  LoadTypeEnum:
    description: Specifies the load type of the delivery.
    permissible_values:
      BaseLoad:
        description: Base load
      PeakLoad:
        description: Peak load
      OffPeak:
        description: Off-peak load
      BlockHours:
        description: Block Hours
      Shaped:
        description: Shaped
      GasDay:
        description: Gas Day
      Other:
        description: Other
  NegativeInterestRateTreatmentEnum:
    description: The enumerated values to specify the method of calculating payment obligations when a
      floating rate is negative (either due to a quoted negative floating rate or by operation of a spread
      that is subtracted from the floating rate).
    permissible_values:
      NegativeInterestRateMethod:
        description: Negative Interest Rate Method. Per 2000 ISDA Definitions, Section 6.4 Negative Interest
          Rates, paragraphs (b) and (c).
      ZeroInterestRateMethod:
        description: Zero Interest Rate Method. Per 2000 ISDA Definitions, Section 6.4. Negative Interest
          Rates, paragraphs (d) and (e).
      ZeroInterestRateExcludingSpreadMethod:
        description: Per 2021 ISDA Definitions section 6.8.6
  NonCashDividendTreatmentEnum:
    description: The enumerated values to specify the treatment of Non-Cash Dividends.
    permissible_values:
      PotentialAdjustmentEvent:
        description: The treatment of any non-cash dividend shall be determined in accordance with the
          Potential Adjustment Event provisions.
      CashEquivalent:
        description: Any non-cash dividend shall be treated as a Declared Cash Equivalent Dividend.
  RateTreatmentEnum:
    description: The enumerated values to specify the methods for converting rates from one basis to another.
    permissible_values:
      BondEquivalentYield:
        description: Bond Equivalent Yield. Per Annex to the 2000 ISDA Definitions (June 2000 Version),
          Section 7.3. Certain General Definitions Relating to Floating Rate Options, paragraph (g).
      MoneyMarketYield:
        description: Money Market Yield. Per Annex to the 2000 ISDA Definitions (June 2000 Version), Section
          7.3. Certain General Definitions Relating to Floating Rate Options, paragraph (h).
  RealisedVarianceMethodEnum:
    description: The contract specifies which price must satisfy the boundary condition. Used for variance,
      volatility and correlation caps and floors.
    permissible_values:
      Previous:
        description: For a return on day T, the observed price on T-1 must be in range.
      Last:
        description: For a return on day T, the observed price on T must be in range.
      Both:
        description: For a return on day T, the observed prices on both T and T-1 must be in range
  ReturnTypeEnum:
    description: The enumerated values to specify the type of return associated the equity payout.
    permissible_values:
      Price:
        description: Price return, i.e. excluding dividends.
      Total:
        description: Total return, i.e. including dividend and price components.
  RollSourceCalendarEnum:
    description: Used in conjunction with an exchange-based pricing source. Identifies a date source calendar
      from which the pricing dates and thus roll to the next contract will be based off (e.g. pricing
      is based on the NYMEX WTI First Nearby Futures Contract, if Future is chosen, the pricing will roll
      to the next futures contract on expiration, if ListedOption is chosen, the pricing will roll to
      the next futures contract on the Option expiration date which is three business days before the
      expiration of the NYMEX WTI futures contract.) Omitting this element will result in the default
      behavior expected with the pricing source described within the commodity element.
    permissible_values:
      ListedOption: {}
      Future: {}
  SettledEntityMatrixSourceEnum:
    description: The enumerated values to specify the relevant settled entity matrix source.
    permissible_values:
      ConfirmationAnnex:
        description: The Relevant Settled Entity Matrix shall be the list agreed for this purpose by the
          parties. The list is not included as part of the electronic confirmation.
      NotApplicable:
        description: The term is not applicable.
      Publisher:
        description: The Settled Entity Matrix published by the Index Publisher.
  SpreadCalculationMethodEnum:
    description: 'Method by which spread is calculated. For example on an asset swap: ''ParPar'' or ''Proceeds''
      may be the method indicated.'
    permissible_values:
      ParPar: {}
      Proceeds: {}
  SpreadScheduleTypeEnum:
    description: The enumerated values to specify a long or short spread value.
    permissible_values:
      Long:
        description: Represents a Long Spread Schedule. Spread schedules defined as 'Long' will be applied
          to Long Positions.
      Short:
        description: Represents a Short Spread Schedule. Spread schedules defined as 'Short' will be applied
          to Short Positions.
classes:
  AdditionalFixedPayments:
    description: A class to specify the events that will give rise to the payment additional fixed payments.
    attributes:
      interestShortfallReimbursement:
        description: 'An additional Fixed Payment Event. Corresponds to the payment by or on behalf of
          the Issuer of an actual interest amount in respect to the reference obligation that is greater
          than the expected interest amount. ISDA 2003 Term: Interest Shortfall Reimbursement.'
        range: boolean
      principalShortfallReimbursement:
        description: 'An additional Fixed Payment Event. Corresponds to the payment by or on behalf of
          the Issuer of an actual principal amount in respect to the reference obligation that is greater
          than the expected principal amount. ISDA 2003 Term: Principal Shortfall Reimbursement.'
        range: boolean
      writedownReimbursement:
        description: 'An Additional Fixed Payment. Corresponds to the payment by or on behalf of the issuer
          of an amount in respect to the reference obligation in reduction of the prior writedowns. ISDA
          2003 Term: Writedown Reimbursement.'
        range: boolean
  AssetDeliveryInformation:
    description: Contains the information relative to the delivery of the asset.
    attributes:
      periods:
        description: Defines the periods of delivery, including the delivery profile.
        range: AssetDeliveryPeriods
      location:
        description: Defines the location of the delivery of the commodity.
        range: LocationIdentifier
        multivalued: true
      deliveryCapacity:
        description: The number of units included in the transaction for each delivery interval
        range: Quantity
      commodityGrade:
        description: Grade of product being delivered (e.g., grade of oil).
        range: ProductGradeEnum
        multivalued: true
  AssetDeliveryPeriods:
    description: Defines the periods of delivery, including the delivery profile.
    attributes:
      profile:
        description: Defines the delivery profile of the asset, including the load type and the delivery
          intervals.
        range: AssetDeliveryProfile
        multivalued: true
      startDate:
        description: Delivery start date
        range: date
      endDate:
        description: Delivery end date
        range: date
  AssetDeliveryProfile:
    description: Defines the delivery profile of the asset, including the load type and the delivery intervals.
    attributes:
      loadType:
        description: Identification of the delivery profile.
        range: LoadTypeEnum
      block:
        description: Defines a delivery profile block, including start and end time, days of the week,
          duration, delivery capacity and price time interval quantity.
        range: AssetDeliveryProfileBlock
        multivalued: true
      bankHolidaysTreatment:
        description: Specifies whether the dates defined include holidays or not.
        range: BankHolidayTreatmentEnum
  AssetDeliveryProfileBlock:
    description: Defines a delivery profile block, including start and end time, days of the week, duration,
      delivery capacity and price time interval quantity.
    attributes:
      startTime:
        description: The start time of the delivery interval for each block or shape.
        range: time
      endTime:
        description: The end time of the delivery interval for each block or shape.
        range: time
      dayOfWeek:
        description: The days of the week of the delivery.
        range: DayOfWeekEnum
        multivalued: true
        maximum_cardinality: 7
      deliveryCapacity:
        description: The number of units included in the transaction for each delivery interval
        range: Quantity
      priceTimeIntervalQuantity:
        description: Price per quantity per delivery time interval.
        range: Price
  BasketReferenceInformation:
    description: CDS Basket Reference Information.
    attributes:
      basketName:
        description: The name of the basket expressed as a free format string. FpML does not define usage
          rules for this element.
        range: string
        annotations:
          rosetta_metadata: scheme
      basketId:
        description: A CDS basket identifier.
        range: string
        multivalued: true
        annotations:
          rosetta_metadata: scheme
      referencePool:
        description: This element contains all the reference pool items to define the reference entity
          and reference obligation(s) in the basket.
        range: ReferencePool
        required: true
      nthToDefault:
        description: N th reference obligation to default triggers payout.
        range: integer
      mthToDefault:
        description: M th reference obligation to default to allow representation of N th to M th defaults.
        range: integer
      tranche:
        description: This element contains CDS tranche terms.
        range: Tranche
    all_of:
      - description: 'BasketReferenceInformationChoice: Choice rule to represent an FpML choice construct.
          This choice rule is complemented by the data rule BasketReferenceInformation_nthToDefault to
          represent the FpML construct where there is a choice between a tranche element and a [required
          nthToDefault, optional mthToDefault] branch.'
        exactly_one_of:
          - slot_conditions:
              nthToDefault:
                value_presence: PRESENT
          - slot_conditions:
              tranche:
                value_presence: PRESENT
    rules:
      - description: 'NthToDefault: As part of the branch of the choice node, FpML requires the nthToDefault
          element to be present, while the mthToDefault one is optional.'
        preconditions:
          slot_conditions:
            mthToDefault:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            nthToDefault:
              value_presence: PRESENT
    comments:
      - 'Rosetta condition MthToDefault is not stated in LinkML: if (nthToDefault exists and mthToDefault
        exists) then nthToDefault < mthToDefault'
  BondReference:
    description: Reference to a bond underlier to represent an asset swap or Condition Precedent Bond.
    attributes:
      bond:
        description: Reference to a bond underlier.
        range: Security
        required: true
      conditionPrecedentBond:
        description: To indicate whether the Condition Precedent Bond is applicable. The swap contract
          is only valid if the bond is issued and if there is any dispute over the terms of fixed stream
          then the bond terms would be used.
        range: boolean
        required: true
      discrepancyClause:
        description: To indicate whether the Discrepancy Clause is applicable.
        range: boolean
      couponRate:
        description: Specifies the coupon rate (expressed in percentage) of a fixed income security or
          convertible bond.
        range: FixedRateSpecification
    comments:
      - 'Rosetta condition BondUnderlier is not stated in LinkML: bond -> securityType = Debt'
  BoundedCorrelation:
    description: Describes correlation bounds, which form a cap and a floor on the realized correlation.
    attributes:
      minimumBoundaryPercent:
        description: Minimum Boundary as a percentage of the Strike Price.
        range: decimal
      maximumBoundaryPercent:
        description: Maximum Boundary as a percentage of the Strike Price.
        range: decimal
  BoundedVariance:
    attributes:
      realisedVarianceMethod:
        description: The contract specifies which price must satisfy the boundary condition.
        range: RealisedVarianceMethodEnum
        required: true
      daysInRangeAdjustment:
        description: The contract specifies whether the notional should be scaled by the Number of Days
          in Range divided by the Expected N. The number of Days in Ranges refers to the number of returns
          that contribute to the realized volatility.
        range: boolean
        required: true
      upperBarrier:
        description: All observations above this price level will be excluded from the variance calculation.
        range: decimal
      lowerBarrier:
        description: All observations below this price level will be excluded from the variance calculation.
        range: decimal
    comments:
      - 'Rosetta condition NonNegativeBarriers is not stated in LinkML: if upperBarrier exists then upperBarrier
        >= 0 and if lowerBarrier exists then lowerBarrier >= 0'
  CalculationScheduleDeliveryPeriods:
    is_a: AssetDeliveryPeriods
    description: Period and time profile over which the delivery takes place.
    attributes:
      deliveryCapacity:
        description: The number of units included in the transaction for each delivery interval
        range: Quantity
      priceTimeIntervalQuantity:
        description: Price per quantity per delivery time interval.
        range: Price
  CashflowRepresentation:
    description: 'A data defining: the cashflow representation of a swap trade.'
    attributes:
      cashflowsMatchParameters:
        description: A true/false flag to indicate whether the cashflows match the parametric definition
          of the stream, i.e. whether the cashflows could be regenerated from the parameters without loss
          of information.
        range: boolean
        required: true
      paymentCalculationPeriod:
        description: The adjusted payment date and associated calculation period parameters required to
          calculate the actual or projected payment amount. A list of payment calculation period elements
          may be ordered in the document by ascending adjusted payment date. An FpML document containing
          an unordered list of payment calculation periods is still regarded as a conformant document.
        range: PaymentCalculationPeriod
        multivalued: true
  CommodityPayout:
    is_a: PayoutBase
    description: Payout based on the averaged price of a referenced underlier. (e.g. Commodities). Can
      represent both average (average of many) & bullet (average of 1) pricing
    attributes:
      averagingFeature:
        description: Indicates if the averaging calculation, when applicable, is weighted or unweighted.
        range: AveragingCalculation
      commodityPriceReturnTerms:
        description: Defines parameters in which the commodity price is assessed.
        range: CommodityPriceReturnTerms
      pricingDates:
        description: Specifies specific dates or parametric rules for the dates on which the price will
          be determined.
        range: PricingDates
        required: true
      schedule:
        description: Allows the full representation of a payout by defining a set of schedule periods.
          It supports standard schedule customization by expressing all the dates, quantities, and pricing
          data in a non-parametric way.
        range: CalculationSchedule
      calculationPeriodDates:
        description: Defines the calculation period dates schedule.
        range: CalculationPeriodDates
      paymentDates:
        description: Defines the payment date schedule, as defined by the parameters that are needed to
          specify it, either in a parametric way or by reference to another schedule of dates (e.g. the
          valuation dates).
        range: PaymentDates
        required: true
      underlier:
        description: Identifies the underlying product that is referenced for pricing of the applicable
          leg in a swap. Referenced in the '2018 ISDA CDM Equity Confirmation for Security Equity Swap'
          as Security.
        range: Underlier
        required: true
      fxFeature:
        description: Defines quanto or composite FX features that are included in the swap leg.
        range: FxFeature
      delivery:
        description: Contains the information relative to the delivery of the asset.
        range: AssetDeliveryInformation
    all_of:
      - description: 'Quantity: When there is an OptionPayout the quantity can be expressed as part of
          the payoutQuantity, or as part of the underlier in the case of a Swaption. For all other payouts
          that extend PayoutBase the payoutQuantity is a mandatory attribute.'
        slot_conditions:
          priceQuantity:
            value_presence: PRESENT
      - description: 'CalculationPeriod: The calculation periods are either specified parametrically via
          CalculationPeriodDates or non-parametrically via SchedulePeriod.'
        exactly_one_of:
          - slot_conditions:
              schedule:
                value_presence: PRESENT
          - slot_conditions:
              calculationPeriodDates:
                value_presence: PRESENT
    annotations:
      rosetta_metadata: key
    comments:
      - 'Rosetta condition CommodityUnderlier is not stated in LinkML: if underlier as Observable exists
        then ObservableIsCommodity (underlier as Observable) else if underlier as TransferableProduct
        -> economicTerms -> payout only-element as OptionPayout exists then ObservableIsCommodity (underlier
        as TransferableProduct -> economicTerms -> payout only-element as OptionPayout -> underlier as
        Observable) else if underlier as TransferableProduct -> economicTerms -> payout only-element as
        SettlementPayout exists then ObservableIsCommodity (underlier as TransferableProduct -> economicTerms
        -> payout only-element as SettlementPayout -> underlier as Observable) else False'
      - 'Rosetta condition DeliveryCapacity is not stated in LinkML: if delivery -> deliveryCapacity exists
        then schedule -> schedulePeriod -> deliveryPeriod -> deliveryCapacity is absent and delivery ->
        periods -> profile -> block -> deliveryCapacity is absent and schedule -> schedulePeriod -> deliveryPeriod
        -> profile -> block -> deliveryCapacity is absent else if schedule -> schedulePeriod -> deliveryPeriod
        -> deliveryCapacity exists then delivery -> deliveryCapacity is absent and delivery -> periods
        -> profile -> block -> deliveryCapacity is absent and schedule -> schedulePeriod -> deliveryPeriod
        -> profile -> block -> deliveryCapacity is absent else if delivery -> periods -> profile -> block
        -> deliveryCapacity exists then schedule -> schedulePeriod -> deliveryPeriod -> deliveryCapacity
        is absent and schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> deliveryCapacity
        is absent else if schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> deliveryCapacity
        exists then delivery -> deliveryCapacity is absent and schedule -> schedulePeriod -> deliveryPeriod
        -> deliveryCapacity is absent and delivery -> periods -> profile -> block -> deliveryCapacity
        is absent'
      - 'Rosetta condition PriceTimeIntervalQuantity is not stated in LinkML: if schedule -> schedulePeriod
        -> deliveryPeriod -> priceTimeIntervalQuantity exists then delivery -> periods -> profile -> block
        -> priceTimeIntervalQuantity is absent and schedule -> schedulePeriod -> deliveryPeriod -> profile
        -> block -> priceTimeIntervalQuantity is absent else if delivery -> periods -> profile -> block
        -> priceTimeIntervalQuantity exists then schedule -> schedulePeriod -> deliveryPeriod -> priceTimeIntervalQuantity
        is absent and schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> priceTimeIntervalQuantity
        is absent else if schedule -> schedulePeriod -> deliveryPeriod -> profile -> block -> priceTimeIntervalQuantity
        exists then schedule -> schedulePeriod -> deliveryPeriod -> priceTimeIntervalQuantity is absent
        and delivery -> periods -> profile -> block -> priceTimeIntervalQuantity is absent'
  CorrelationReturnTerms:
    is_a: ReturnTermsBase
    attributes:
      correlationStrikePrice:
        description: Correlation Strike Price in accordance with the ISDA 2011 Equity Derivatives Definitions.
        range: Price
        required: true
      boundedCorrelation:
        description: Describes correlation bounds, which form a cap and a floor on the realized correlation.
        range: NumberRange
      numberOfDataSeries:
        description: Number of data series, normal market practice is that correlation data sets are drawn
          from geographic market areas, such as America, Europe and Asia Pacific, each of these geographic
          areas will have its own data series to avoid contagion.
        range: integer
    all_of:
      - description: 'From ReturnTermsBase. PositiveExpectedN: The number of expected trading dates must
          be positive'
        slot_conditions:
          expectedN:
            minimum_value: 1
    rules:
      - description: 'PositiveNumberOfDataSeries: The number of data series must be positive'
        preconditions:
          slot_conditions:
            numberOfDataSeries:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            numberOfDataSeries:
              minimum_value: 1
    comments:
      - 'Rosetta condition CorrelationValue is not stated in LinkML: correlationStrikePrice -> value >
        - 1 and correlationStrikePrice -> value < 1'
  CreditDefaultPayout:
    is_a: PayoutBase
    description: The credit default payout specification provides the details necessary for determining
      when a credit payout will be triggered as well as the parameters for calculating the payout and
      the settlement terms. The associated globalKey denotes the ability to associate a hash value to
      the CreditDefaultPayout instantiations for the purpose of model cross-referencing, in support of
      functionality such as the event effect and the lineage.
    attributes:
      generalTerms:
        description: The specification of the non-monetary terms for the Credit Derivative Transaction,
          including the buyer and seller and selected items from the ISDA 2014 Credit Definition article
          II, such as the reference obligation and related terms.
        range: GeneralTerms
        required: true
      protectionTerms:
        description: Specifies the terms for calculating a payout to protect the buyer of the swap in
          the case of a qualified credit event. These terms include the applicable credit events, the
          reference obligation, and in the case of a CDS on mortgage-backed securities, the floatingAmountEvents.
        range: ProtectionTerms
        multivalued: true
      transactedPrice:
        description: The qualification of the price at which the contract has been transacted, in terms
          of market fixed rate, initial points, market price and/or quotation style. In FpML, those attributes
          are positioned as part of the fee leg.
        range: TransactedPrice
    all_of:
      - description: 'Quantity: When there is an OptionPayout the quantity can be expressed as part of
          the payoutQuantity, or as part of the underlier in the case of a Swaption. For all other payouts
          that extend PayoutBase the payoutQuantity is a mandatory attribute.'
        slot_conditions:
          priceQuantity:
            value_presence: PRESENT
    comments:
      - 'Rosetta condition FpML_cd_12 is not stated in LinkML: if generalTerms -> referenceInformation
        -> referencePrice exists then generalTerms -> referenceInformation -> referencePrice -> value
        >= 0'
  DiscountingMethod:
    description: 'A data defining: discounting information. The 2000 ISDA definitions, section 8.4. discounting
      (related to the calculation of a discounted fixed amount or floating amount) apply. This type must
      only be included if discounting applies.'
    attributes:
      discountingType:
        description: The discounting method that is applicable.
        range: DiscountingTypeEnum
        required: true
      discountRate:
        description: A discount rate, expressed as a decimal, to be used in the calculation of a discounted
          amount. A discount amount of 5% would be represented as 0.05.
        range: decimal
      discountRateDayCountFraction:
        description: A discount day count fraction to be used in the calculation of a discounted amount.
        range: DayCountFractionEnum
        annotations:
          rosetta_metadata: scheme
    rules:
      - description: 'DiscountRate: In FpML discountingRate and discountRateDayCountFraction are part
          of an optional node, with discountingRate as the required element as part of that node.'
        preconditions:
          slot_conditions:
            discountRateDayCountFraction:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            discountRate:
              value_presence: PRESENT
  DividendCurrency:
    description: A class to specify the currency in which the dividends will be denominated, i.e. either
      in the dividend currency or in a currency specified as part of the contract.
    attributes:
      currency:
        description: The currency in which the dividend is denominated. The list of valid currencies is
          not presently positioned as an enumeration as part of the CDM because that scope is limited
          to the values specified by ISDA and FpML. As a result, implementers have to make reference to
          the relevant standard, such as the ISO 4217 standard for currency codes.
        range: string
        annotations:
          rosetta_metadata: scheme
      determinationMethod:
        description: Specifies the method according to which the dividend is determined, e.g. the dividend
          currency.
        range: DeterminationMethodEnum
      currencyReference:
        description: Reference to a currency specified elsewhere in the document
        range: string
        annotations:
          rosetta_metadata: reference
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              currency:
                value_presence: PRESENT
          - slot_conditions:
              determinationMethod:
                value_presence: PRESENT
          - slot_conditions:
              currencyReference:
                value_presence: PRESENT
  DividendDateReference:
    description: A class to specify the dividend date by reference to another date, with the ability to
      apply and offset. This class doesn't exist in FpML and is meant to simplify the choice constraint
      associated with the DividendPaymentDate class.
    attributes:
      dateReference:
        description: Specification of the dividend date using an enumeration, with values such as the
          pay date, the ex-date or the record date.
        range: DividendDateReferenceEnum
        required: true
      paymentDateOffset:
        description: Only to be used when SharePayment has been specified in the dividendDateReference
          element. The number of Currency Business Days following the day on which the Issuer of the Shares
          pays the relevant dividend to holders of record of the Shares.
        range: Offset
    rules:
      - description: 'PaymentDateOffset: FpML specifies that paymentDateOffset is only to be used when
          SharePayment has been specified in the dividendDateReference element.'
        preconditions:
          slot_conditions:
            paymentDateOffset:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            dateReference:
              equals_string: SharePayment
  DividendPaymentDate:
    description: A class describing the date on which the dividend will be paid/received. This class is
      also used to specify the date on which the FX rate will be determined, when applicable.
    attributes:
      dividendDateReference:
        range: DividendDateReference
      dividendDate:
        range: AdjustableOrRelativeDate
        annotations:
          rosetta_metadata: reference
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              dividendDateReference:
                value_presence: PRESENT
          - slot_conditions:
              dividendDate:
                value_presence: PRESENT
  DividendPayoutRatio:
    description: A class describing the dividend payout ratio associated with an equity underlier. In
      certain cases the actual ratio is not known on trade inception, and only general conditions are
      then specified.
    attributes:
      totalRatio:
        description: Specifies the total actual dividend payout ratio associated with the equity underlier.
          A ratio of 90% should be expressed at 0.90.
        range: decimal
        required: true
      cashRatio:
        description: Specifies the cash actual dividend payout ratio associated with the equity underlier.
          A ratio of 90% should be expressed at 0.90.
        range: decimal
      nonCashRatio:
        description: Specifies the non cash actual dividend payout ratio associated with the equity underlier.
          A ratio of 90% should be expressed at 0.90.
        range: decimal
      basketConstituent:
        description: In the case of a basket underlier, specifies to which component of the basket this
          particular set of dividend payout ratios correspond.
        range: BasketConstituent
        annotations:
          rosetta_metadata: address
    all_of:
      - description: 'DividendPayoutRatioTotal: The dividend payout ratio should be comprised between
          0 and 100%, meaning 0 and 1.'
        slot_conditions:
          totalRatio:
            minimum_value: 0
            maximum_value: 1
    rules:
      - description: 'DividendPayoutRatioCash: The cash dividend payout ratio should be comprised between
          0 and 100%, meaning 0 and 1.'
        preconditions:
          slot_conditions:
            cashRatio:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            cashRatio:
              minimum_value: 0
            totalRatio:
              maximum_value: 1
      - description: 'DividendPayoutRatioNonCash: The non cash dividend payout ratio should be comprised
          between 0 and 100%, meaning 0 and 1.'
        preconditions:
          slot_conditions:
            nonCashRatio:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            nonCashRatio:
              minimum_value: 0
            totalRatio:
              maximum_value: 1
  DividendPeriod:
    description: Time bounded dividend payment periods, each with a dividend payment date per period.
    attributes:
      startDate:
        description: Dividend period start date.
        range: DividendPaymentDate
      endDate:
        description: Dividend period end date.
        range: DividendPaymentDate
      dateAdjustments:
        description: Date adjustments for all unadjusted dates in this dividend period.
        range: BusinessDayAdjustments
        required: true
      basketConstituent:
        description: For basket underliers, reference to the basket component which is paying dividends
          in the specified period.
        range: BasketConstituent
        annotations:
          rosetta_metadata: address
      dividendPaymentDate:
        description: Specifies when the dividend will be paid to the receiver of the equity return. Has
          the meaning as defined in the ISDA 2002 Equity Derivatives Definitions. Is not applicable in
          the case of a dividend reinvestment election.
        range: DividendPaymentDate
        required: true
      dividendValuationDate:
        description: Specifies the dividend valuation dates of the swap.
        range: AdjustableOrRelativeDate
  DividendReturnTerms:
    description: A class describing the conditions governing the payment of dividends to the receiver
      of the equity return, with the exception of the dividend payout ratio, which is defined for each
      of the underlying components.
    attributes:
      dividendPayoutRatio:
        description: Specifies the dividend payout ratio associated with each underlier. In FpML 5.10
          the payout is positioned at the underlier level, although there is an intent to reconsider this
          approach and position it at the leg level. This is approach adopted by the CDM.
        range: DividendPayoutRatio
        multivalued: true
      dividendReinvestment:
        description: Boolean element that defines whether the dividend will be reinvested or not.
        range: boolean
      dividendEntitlement:
        description: Defines the date on which the receiver of the equity return is entitled to the dividend.
        range: DividendEntitlementEnum
      dividendAmountType:
        description: Specifies whether the dividend is paid with respect to the Dividend Period.
        range: DividendAmountTypeEnum
      performance:
        description: Performance calculation, in accordance with Part 1 Section 12 of the 2018 ISDA CDM
          Equity Confirmation for Security Equity Swap, Para 75. 'Equity Performance'. Cumulative performance
          is used as a notional multiplier factor on both legs of an Equity Swap.
        range: string
      firstOrSecondPeriod:
        description: '2002 ISDA Equity Derivatives Definitions: Dividend Period as either the First Period
          or the Second Period. |'
        range: DividendPeriodEnum
      extraordinaryDividendsParty:
        description: Specifies the party which determines if dividends are extraordinary in relation to
          normal levels.
        range: AncillaryRoleEnum
      excessDividendAmount:
        description: Determination of Gross Cash Dividend per Share.
        range: DividendAmountTypeEnum
      dividendCurrency:
        description: Specifies the currency in which the dividend will be denominated, e.g. the dividend
          currency, or a specified currency. This class is not specified as such in FpML, which makes
          use of the CurrencyAndDeterminationMethod.model to specify such terms.
        range: DividendCurrency
      nonCashDividendTreatment:
        description: Specifies the treatment of Non-Cash Dividends.
        range: NonCashDividendTreatmentEnum
      dividendComposition:
        description: Specifies how the composition of Dividends is to be determined.
        range: DividendCompositionEnum
      specialDividends:
        description: Specifies the method according to which special dividends are determined.
        range: boolean
      materialDividend:
        description: If present and true, then material non cash dividends are applicable.
        range: boolean
      dividendPeriod:
        description: One to many time bounded dividend payment periods, each with a dividend payment date
          per period.
        range: DividendPeriod
        multivalued: true
    rules:
      - description: ExtraordinaryDividendsParty
        preconditions:
          slot_conditions:
            extraordinaryDividendsParty:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            extraordinaryDividendsParty:
              equals_string: ExtraordinaryDividendsParty
    comments:
      - 'Rosetta condition DividendPeriod is not stated in LinkML: if firstOrSecondPeriod exists then
        dividendPeriod -> startDate is absent and dividendPeriod -> endDate is absent'
  EquityUnderlierProvisions:
    attributes:
      multipleExchangeIndexAnnexFallback:
        description: For an index option or swap transaction, a flag to indicate whether a relevant Multiple
          Exchange Index Annex is applicable to the transaction. This annex defines additional provisions
          which are applicable where an index is comprised of component securities that are traded on
          multiple exchanges.
        range: boolean
      componentSecurityIndexAnnexFallback:
        description: For an index option or swap transaction, a flag to indicate whether a relevant Component
          Security Index Annex is applicable to the transaction.
        range: boolean
      localJurisdiction:
        description: The ISO 3166 standard code for the country within which the postal address is located.
        range: string
        annotations:
          rosetta_metadata: scheme
      relevantJurisdiction:
        description: The ISO 3166 standard code for the country within which the postal address is located.
        range: string
        annotations:
          rosetta_metadata: scheme
    all_of:
      - description: 'ComponentSecurityOrMultipleExchange: If multipleExchangeIndexAnnexFallback is present
          then componentSecurityIndexAnnexFallback must be absent and vice versa.'
        exactly_one_of:
          - slot_conditions:
              multipleExchangeIndexAnnexFallback:
                value_presence: PRESENT
          - slot_conditions:
              componentSecurityIndexAnnexFallback:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  multipleExchangeIndexAnnexFallback:
                    value_presence: ABSENT
              - slot_conditions:
                  componentSecurityIndexAnnexFallback:
                    value_presence: ABSENT
  FixedAmountCalculationDetails:
    description: Type for reporting the detailed results of calculating a cash flow for a calculation
      period. This is enhanced relative to the FpML-based cashflows structure to allow more information
      to be returned about daily compounded rates.
    attributes:
      calculationPeriod:
        description: The calculation period for which the floating calculation was performed.
        range: CalculationPeriodBase
        required: true
      calculationPeriodNotionalAmount:
        description: The notional in effect during the calculation period.
        range: Money
        required: true
      fixedRate:
        description: The value of the fixed rate that was used.
        range: decimal
        required: true
      yearFraction:
        description: The fraction of a year that this calculation represents, according to the day count
          fraction method.
        range: decimal
        required: true
      calculatedAmount:
        description: The amount of the cash flow that was computed, including any spreads and other processing.
        range: decimal
        required: true
  FixedRateSpecification:
    description: Type defining the specification for a fixed rate.
    attributes:
      rateSchedule:
        description: The fixed rate or fixed rate schedule expressed as explicit fixed rates and dates.
          In the case of a schedule, the step dates may be subject to adjustment in accordance with any
          adjustments specified in calculationPeriodDatesAdjustments.
        range: RateSchedule
    annotations:
      rosetta_metadata: key
  FloatingAmountEvents:
    description: A class to specify the ISDA terms relating to the floating rate payment events and the
      implied additional fixed payments, applicable to the credit derivatives transactions on mortgage-backed
      securities with pay-as-you-go or physical settlement.
    attributes:
      failureToPayPrincipal:
        description: 'A floating rate payment event. Corresponds to the failure by the Reference Entity
          to pay an expected principal amount or the payment of an actual principal amount that is less
          than the expected principal amount. ISDA 2003 Term: Failure to Pay Principal.'
        range: boolean
      interestShortfall:
        description: 'A floating rate payment event. With respect to any Reference Obligation Payment
          Date, either (a) the non-payment of an Expected Interest Amount or (b) the payment of an Actual
          Interest Amount that is less than the Expected Interest Amount. ISDA 2003 Term: Interest Shortfall.'
        range: InterestShortFall
      writedown:
        description: 'A floating rate payment event. Results from the fact that the underlier writes down
          its outstanding principal amount. ISDA 2003 Term: Writedown.'
        range: boolean
      impliedWritedown:
        description: A floating rate payment event. Results from the fact that losses occur to the underlying
          instruments that do not result in reductions of the outstanding principal of the reference obligation.
        range: boolean
      floatingAmountProvisions:
        description: Specifies the floating amount provisions associated with the floatingAmountEvents.
        range: FloatingAmountProvisions
      additionalFixedPayments:
        description: Specifies the events that will give rise to the payment additional fixed payments.
        range: AdditionalFixedPayments
  FloatingAmountProvisions:
    attributes:
      wacCapInterestProvision:
        description: As specified by the ISDA Supplement for use with trades on mortgage-backed securities,
          'WAC Cap' means a weighted average coupon or weighted average rate cap provision (however defined
          in the Underlying Instruments) of the Underlying Instruments that limits, increases or decreases
          the interest rate or interest entitlement, as set out in the Underlying Instruments on the Effective
          Date without regard to any subsequent amendment The presence of the element with value set to
          'true' signifies that the provision is applicable. From a usage standpoint, this provision is
          typically applicable in the case of CMBS and not applicable in case of RMBS trades.
        range: boolean
      stepUpProvision:
        description: As specified by the ISDA Standard Terms Supplement for use with trades on mortgage-backed
          securities. The presence of the element with value set to 'true' signifies that the provision
          is applicable. If applicable, the applicable step-up terms are specified as part of that ISDA
          Standard Terms Supplement. From a usage standpoint, this provision is typically applicable in
          the case of RMBS and not applicable in case of CMBS trades.
        range: boolean
  FloatingRate:
    is_a: FloatingRateBase
    attributes:
      floatingRateMultiplierSchedule:
        description: A rate multiplier or multiplier schedule to apply to the floating rate. A multiplier
          schedule is expressed as explicit multipliers and dates. In the case of a schedule, the step
          dates may be subject to adjustment in accordance with any adjustments specified in the calculationPeriodDatesAdjustments.
          The multiplier can be a positive or negative decimal. This element should only be included if
          the multiplier is not equal to 1 (one) for the term of the stream.
        range: RateSchedule
      rateTreatment:
        description: The specification of any rate conversion which needs to be applied to the observed
          rate before being used in any calculations. The two common conversions are for securities quoted
          on a bank discount basis which will need to be converted to either a Money Market Yield or Bond
          Equivalent Yield. See the Annex to the 2000 ISDA Definitions, Section 7.3. Certain General Definitions
          Relating to Floating Rate Options, paragraphs (g) and (h) for definitions of these terms.
        range: RateTreatmentEnum
      calculationParameters:
        description: Support for modular calculated rates, such such as lockout compound calculations.
        range: FloatingRateCalculationParameters
      fallbackRate:
        description: Definition of any fallback rate that may be applicable.
        range: FallbackRateParameters
  FloatingRateBase:
    description: A class defining a floating interest rate through the specification of the floating rate
      index, the tenor, the multiplier schedule, the spread, the qualification of whether a specific rate
      treatment and/or a cap or floor apply.
    attributes:
      rateOption:
        range: InterestRateIndex
        annotations:
          rosetta_metadata: address
      spreadSchedule:
        description: The ISDA Spread or a Spread schedule expressed as explicit spreads and dates. In
          the case of a schedule, the step dates may be subject to adjustment in accordance with any adjustments
          specified in calculationPeriodDatesAdjustments. The spread is a per annum rate, expressed as
          a decimal. For purposes of determining a calculation period amount, if positive the spread will
          be added to the floating rate and if negative the spread will be subtracted from the floating
          rate. A positive 10 basis point (0.1%) spread would be represented as 0.001.
        range: SpreadSchedule
      capRateSchedule:
        description: The cap rate or cap rate schedule, if any, which applies to the floating rate. The
          cap rate (strike) is only required where the floating rate on a swap stream is capped at a certain
          level. A cap rate schedule is expressed as explicit cap rates and dates and the step dates may
          be subject to adjustment in accordance with any adjustments specified in calculationPeriodDatesAdjustments.
          The cap rate is assumed to be exclusive of any spread and is a per annum rate, expressed as
          a decimal. A cap rate of 5% would be represented as 0.05.
        range: StrikeSchedule
      floorRateSchedule:
        description: The floor rate or floor rate schedule, if any, which applies to the floating rate.
          The floor rate (strike) is only required where the floating rate on a swap stream is floored
          at a certain strike level. A floor rate schedule is expressed as explicit floor rates and dates
          and the step dates may be subject to adjustment in accordance with any adjustments specified
          in calculationPeriodDatesAdjustments. The floor rate is assumed to be exclusive of any spread
          and is a per annum rate, expressed as a decimal. A floor rate of 5% would be represented as
          0.05.
        range: StrikeSchedule
    annotations:
      rosetta_metadata: key
  FloatingRateDefinition:
    description: 'A data defining: parameters associated with a floating rate reset. This data forms:
      part of the cashflows representation of a stream.'
    attributes:
      calculatedRate:
        description: The final calculated rate for a calculation period after any required averaging of
          rates A calculated rate of 5% would be represented as 0.05.
        range: decimal
      rateObservation:
        description: The details of a particular rate observation, including the fixing date and observed
          rate. A list of rate observation elements may be ordered in the document by ascending adjusted
          fixing date. An FpML document containing an unordered list of rate observations is still regarded
          as a conformant document.
        range: RateObservation
        multivalued: true
      floatingRateMultiplier:
        description: A rate multiplier to apply to the floating rate. The multiplier can be a positive
          or negative decimal. This element should only be included if the multiplier is not equal to
          1 (one).
        range: decimal
      spread:
        description: The ISDA Spread, if any, which applies for the calculation period. The spread is
          a per annum rate, expressed as a decimal. For purposes of determining a calculation period amount,
          if positive the spread will be added to the floating rate and if negative the spread will be
          subtracted from the floating rate. A positive 10 basis point (0.1%) spread would be represented
          as 0.001.
        range: decimal
      capRate:
        description: The cap rate, if any, which applies to the floating rate for the calculation period.
          The cap rate (strike) is only required where the floating rate on a swap stream is capped at
          a certain strike level. The cap rate is assumed to be exclusive of any spread and is a per annum
          rate, expressed as a decimal. A cap rate of 5% would be represented as 0.05.
        range: Strike
        multivalued: true
      floorRate:
        description: The floor rate, if any, which applies to the floating rate for the calculation period.
          The floor rate (strike) is only required where the floating rate on a swap stream is floored
          at a certain strike level. The floor rate is assumed to be exclusive of any spread and is a
          per annum rate, expressed as a decimal. The floor rate of 5% would be represented as 0.05.
        range: Strike
        multivalued: true
    comments:
      - 'Rosetta condition FloatingRateMultiplier is not stated in LinkML: if floatingRateMultiplier exists
        then floatingRateMultiplier <> 1'
  FloatingRateSpecification:
    is_a: FloatingRate
    description: 'A class to specify the floating interest rate by extending the floating rate definition
      with a set of attributes that specify such rate: the initial value specified as part of the trade,
      the rounding convention, the averaging method and the negative interest rate treatment.'
    attributes:
      initialRate:
        description: The initial floating rate reset agreed between the principal parties involved in
          the trade. This is assumed to be the first required reset rate for the first regular calculation
          period. It should only be included when the rate is not equal to the rate published on the source
          implied by the floating rate index. An initial rate of 5% would be represented as 0.05.
        range: Price
      finalRateRounding:
        description: The rounding convention to apply to the final rate used in determination of a calculation
          period amount.
        range: Rounding
      averagingMethod:
        description: If averaging is applicable, this component specifies whether a weighted or unweighted
          average method of calculation is to be used. The component must only be included when averaging
          applies.
        range: AveragingWeightingMethodEnum
      negativeInterestRateTreatment:
        description: The specification of any provisions for calculating payment obligations when a floating
          rate is negative (either due to a quoted negative floating rate or by operation of a spread
          that is subtracted from the floating rate).
        range: NegativeInterestRateTreatmentEnum
  FutureValueAmount:
    description: A class defining a currency and a future value date.
    attributes:
      quantity:
        range: NonNegativeQuantitySchedule
        annotations:
          rosetta_metadata: address
      currency:
        description: The currency in which the an amount is denominated. The list of valid currencies
          is not presently positioned as an enumeration as part of the CDM because that scope is limited
          to the values specified by ISDA and FpML. As a result, implementers have to make reference to
          the relevant standard, such as the ISO 4217 standard for currency codes.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      calculationPeriodNumberOfDays:
        description: The number of days from the adjusted calculation period start date to the adjusted
          value date, calculated in accordance with the applicable day count fraction.
        range: integer
        required: true
      valueDate:
        description: Adjusted value date of the future value amount.
        range: date
        required: true
    all_of:
      - description: 'PositiveCalculationPeriodNumberOfDays: FpML specifies calculationPeriodNumberOfDays
          as a positiveInteger.'
        slot_conditions:
          calculationPeriodNumberOfDays:
            minimum_value: 0
  GeneralTerms:
    description: A class specifying a set of non-monetary terms for the Credit Derivative Transaction,
      including the buyer and seller and selected items from the ISDA 2014 Credit Definition article II,
      such as the reference obligation and related terms. The CDM GeneralTerms class corresponds to the
      FpML GeneralTerms complex type, except that the effectiveDate and scheduledTerminationDate have
      been positioned as part of the InterestRatePayout class in the CDM instead of in GeneralTerms.
    attributes:
      referenceInformation:
        description: This attribute contains all the terms relevant to defining the reference entity and
          reference obligation(s).
        range: ReferenceInformation
      indexReferenceInformation:
        description: This attribute contains all the terms relevant to the underlying Index.
        range: CreditIndex
      basketReferenceInformation:
        description: This attribute contains all the terms relevant to defining the Credit Default Swap
          Basket.
        range: BasketReferenceInformation
      additionalTerm:
        description: This attribute is used for representing information contained in the Additional Terms
          field of the 2003 Master Credit Derivatives confirm.
        range: string
        multivalued: true
        annotations:
          rosetta_metadata: scheme
      substitution:
        description: Value of this attribute set to 'true' indicates that substitution is applicable.
        range: boolean
      modifiedEquityDelivery:
        description: Value of this attribute set to 'true' indicates that modified equity delivery is
          applicable.
        range: boolean
    all_of:
      - description: 'GeneralTermsChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              referenceInformation:
                value_presence: PRESENT
          - slot_conditions:
              indexReferenceInformation:
                value_presence: PRESENT
          - slot_conditions:
              basketReferenceInformation:
                value_presence: PRESENT
    rules:
      - description: 'FpML_cd_42: FpML validation rule cd-42 - If basketReferenceInformation does not
          exist, then substitution must not exist.'
        preconditions:
          slot_conditions:
            basketReferenceInformation:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            substitution:
              value_presence: ABSENT
    comments:
      - 'Rosetta condition FpML_cd_41 is not stated in LinkML: if indexReferenceInformation -> tranche
        is absent then modifiedEquityDelivery is absent'
      - 'Rosetta condition BasketReferenceInformationNameOrId is not stated in LinkML: if basketReferenceInformation
        exists then basketReferenceInformation -> basketName exists or basketReferenceInformation -> basketId
        exists'
  InflationRateSpecification:
    is_a: FloatingRateSpecification
    description: 'A data to: specify the inflation rate.'
    attributes:
      inflationLag:
        description: An off-setting period from the payment date which determines the reference period
          for which the inflation index is observed.
        range: Offset
        required: true
      indexSource:
        description: The reference source such as Reuters or Bloomberg. FpML specifies indexSource to
          be of type rateSourcePageScheme, but without specifying actual values.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      mainPublication:
        description: The current main publication source such as relevant web site or a government body.
          FpML specifies mainPublication to be of type mainPublicationSource, but without specifying actual
          values.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      interpolationMethod:
        description: The method used when calculating the Inflation Index Level from multiple points.
          The most common is Linear.
        range: InterpolationMethodEnum
        required: true
        annotations:
          rosetta_metadata: scheme
      initialIndexLevel:
        description: Initial known index level for the first calculation period.
        range: decimal
      fallbackBondApplicable:
        description: The applicability of a fallback bond as defined in the 2006 ISDA Inflation Derivatives
          Definitions, sections 1.3 and 1.8.
        range: boolean
        required: true
      calculationMethod:
        description: Indicates how to use the inflation index to calculate the payment (e.g. Ratio, Return,
          Spread). Added for Inflation Asset Swap
        range: InflationCalculationMethodEnum
      calculationStyle:
        description: Indicates the style of how the inflation index calculates the payment (e.g. YearOnYear,
          ZeroCoupon).
        range: InflationCalculationStyleEnum
      finalPrincipalExchangeCalculation:
        description: To be specified only for products that embed a redemption payment.
        range: FinalPrincipalExchangeCalculationEnum
    comments:
      - 'Rosetta condition InflationIndex is not stated in LinkML: rateOption as InflationIndex exists'
  InterestRatePayout:
    is_a: PayoutBase
    description: A class to specify all of the terms necessary to define and calculate a cash flow based
      on a fixed, a floating or an inflation index rate. The interest rate payout can be applied to interest
      rate swaps and FRA (which both have two associated interest rate payouts), credit default swaps
      (to represent the fee leg when subject to periodic payments) and equity swaps (to represent the
      funding leg). The associated globalKey denotes the ability to associate a hash value to the InterestRatePayout
      instantiations for the purpose of model cross-referencing, in support of functionality such as the
      event effect and the lineage.
    attributes:
      rateSpecification:
        description: The specification of the rate value(s) applicable to the contract using either a
          floating rate calculation, a single fixed rate, a fixed rate schedule, or an inflation rate
          calculation.
        range: RateSpecification
      dayCountFraction:
        description: The day count fraction. The cardinality has been relaxed when compared with the FpML
          interest rate swap for the purpose of accommodating standardized credit default swaps which
          DCF is not explicitly stated as part of the economic terms. The data rule InterestRatePayout_dayCountFraction
          requires that the DCF be stated for interest rate products.
        range: DayCountFractionEnum
        annotations:
          rosetta_metadata: scheme
      calculationPeriodDates:
        description: The parameters used to generate the calculation period dates schedule, including
          the specification of any initial or final stub calculation periods.
        range: CalculationPeriodDates
      paymentDates:
        description: The payment date schedule, as defined by the parameters that are needed to specify
          it, either in a parametric way or by reference to another schedule of dates (e.g. the reset
          dates).
        range: PaymentDates
      paymentDate:
        description: The payment date, where only one date is specified, as for the FRA product.
        range: AdjustableDate
      paymentDelay:
        description: Applicable to CDS on MBS to specify whether payment delays are applicable to the
          fixed Amount. RMBS typically have a payment delay of 5 days between the coupon date of the reference
          obligation and the payment date of the synthetic swap. CMBS do not, on the other hand, with
          both payment dates being on the 25th of each month.
        range: boolean
      resetDates:
        description: The reset dates schedule, i.e. the dates on which the new observed index value is
          applied for each period and the interest rate hence begins to accrue.
        range: ResetDates
      discountingMethod:
        description: The parameters specifying any discounting conventions that may apply. This element
          must only be included if discounting applies.
        range: DiscountingMethod
      compoundingMethod:
        description: If one or more calculation period contributes to a single payment amount this element
          specifies whether compounding is applicable and, if so, what compounding method is to be used.
          This element must only be included when more than one calculation period contributes to a single
          payment amount.
        range: CompoundingMethodEnum
      cashflowRepresentation:
        description: The cashflow representation of the swap stream.
        range: CashflowRepresentation
      stubPeriod:
        description: The stub calculation period amount parameters. This element must only be included
          if there is an initial or final stub calculation period. Even then, it must only be included
          if either the stub references a different floating rate tenor to the regular calculation periods,
          or if the stub is calculated as a linear interpolation of two different floating rate tenors,
          or if a specific stub rate or stub amount has been negotiated.
        range: StubPeriod
      bondReference:
        description: Reference to a bond underlier to represent an asset swap or Condition Precedent Bond.
        range: BondReference
      fixedAmount:
        description: Fixed Amount Calculation
        range: string
      floatingAmount:
        description: Floating Amount Calculation
        range: string
      spreadCalculationMethod:
        description: 'Method by which spread is calculated. For example on an asset swap: ''ParPar'' or
          ''Proceeds'' may be the method indicated.'
        range: SpreadCalculationMethodEnum
    all_of:
      - description: 'Quantity: When there is an OptionPayout the quantity can be expressed as part of
          the payoutQuantity, or as part of the underlier in the case of a Swaption. For all other payouts
          that extend PayoutBase the payoutQuantity is a mandatory attribute.'
        slot_conditions:
          priceQuantity:
            value_presence: PRESENT
      - description: 'InterestRatePayoutChoice: The paymentDates attributes is applicable to interest
          rate payouts with periodic payments, while the paymentDate reflects the FpML FRA implementation
          where one specific date is specified.'
        exactly_one_of:
          - slot_conditions:
              paymentDates:
                value_presence: PRESENT
          - slot_conditions:
              paymentDate:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  paymentDates:
                    value_presence: ABSENT
              - slot_conditions:
                  paymentDate:
                    value_presence: ABSENT
    comments:
      - 'Rosetta condition FutureValueNotional is not stated in LinkML: if rateSpecification as FixedRateSpecification
        is absent then priceQuantity -> futureValueNotional is absent'
      - 'Rosetta condition TerminationDate is not stated in LinkML: if priceQuantity -> futureValueNotional
        exists then priceQuantity -> futureValueNotional -> valueDate = calculationPeriodDates -> terminationDate
        -> adjustableDate -> adjustedDate'
      - 'Rosetta condition RateSpecification is not stated in LinkML: if rateSpecification is absent then
        priceQuantity -> priceSchedule exists'
      - 'Rosetta condition FpML_ird_6 is not stated in LinkML: if paymentDates -> firstPaymentDate exists
        and calculationPeriodDates -> effectiveDate exists then paymentDates -> firstPaymentDate > calculationPeriodDates
        -> effectiveDate -> adjustableDate -> unadjustedDate'
      - 'Rosetta condition FpML_ird_23 is not stated in LinkML: if stubPeriod -> initialStub exists then
        calculationPeriodDates -> firstRegularPeriodStartDate exists'
      - 'Rosetta condition FpML_ird_24 is not stated in LinkML: if stubPeriod -> finalStub exists then
        calculationPeriodDates -> lastRegularPeriodEndDate exists'
      - 'Rosetta condition InitialStubFinalStub is not stated in LinkML: if stubPeriod exists then stubPeriod
        -> initialStub exists or stubPeriod -> finalStub exists'
      - 'Rosetta condition CashSettlementTerms is not stated in LinkML: if settlementTerms -> settlementCurrency
        exists and (settlementTerms -> settlementCurrency <> priceQuantity -> quantitySchedule -> unit
        -> currency or settlementTerms -> settlementCurrency <> priceQuantity -> quantityMultiplier ->
        fxLinkedNotionalSchedule -> varyingNotionalCurrency) then (settlementTerms -> cashSettlementTerms
        -> valuationMethod exists and settlementTerms -> cashSettlementTerms -> valuationDate exists)
        or priceQuantity -> quantityMultiplier -> fxLinkedNotionalSchedule -> fxSpotRateSource exists'
      - 'Rosetta condition FpML_ird_7_1 is not stated in LinkML: if paymentDates -> paymentFrequency ->
        period = calculationPeriodDates -> calculationPeriodFrequency -> period and paymentDates -> paymentFrequency
        -> periodMultiplier = calculationPeriodDates -> calculationPeriodFrequency -> periodMultiplier
        then (compoundingMethod is absent or compoundingMethod = CompoundingMethodEnum -> None)'
      - 'Rosetta condition FpML_ird_7_2 is not stated in LinkML: if (paymentDates -> paymentFrequency
        -> period exists and calculationPeriodDates -> calculationPeriodFrequency -> period exists and
        paymentDates -> paymentFrequency -> period <> calculationPeriodDates -> calculationPeriodFrequency
        -> period) or (paymentDates -> paymentFrequency -> periodMultiplier exists and calculationPeriodDates
        -> calculationPeriodFrequency -> periodMultiplier exists and paymentDates -> paymentFrequency
        -> periodMultiplier <> calculationPeriodDates -> calculationPeriodFrequency -> periodMultiplier)
        then compoundingMethod exists'
      - 'Rosetta condition FpML_ird_9 is not stated in LinkML: if compoundingMethod exists and compoundingMethod
        <> CompoundingMethodEnum -> None then resetDates exists'
      - 'Rosetta condition FpML_ird_29 is not stated in LinkML: if compoundingMethod exists and compoundingMethod
        <> CompoundingMethodEnum -> None then rateSpecification as FixedRateSpecification is absent'
      - 'Rosetta condition CalculationPeriodDatesFirstCompoundingPeriodEndDate is not stated in LinkML:
        if compoundingMethod is absent or compoundingMethod = CompoundingMethodEnum -> None then calculationPeriodDates
        -> firstCompoundingPeriodEndDate is absent'
  InterestShortFall:
    description: A class to specify the interest shortfall floating rate payment event.
    attributes:
      interestShortfallCap:
        description: 'Specifies the nature of the interest Shortfall cap (i.e. Fixed Cap or Variable Cap)
          in the case where it is applicable. ISDA 2003 Term: Interest Shortfall Cap.'
        range: InterestShortfallCapEnum
        required: true
      compounding:
        range: boolean
        required: true
      rateSource:
        description: The rate source in the case of a variable cap.
        range: FloatingRateIndexEnum
        annotations:
          rosetta_metadata: scheme
  PriceReturnTerms:
    attributes:
      returnType:
        description: The type of return associated with the equity swap.
        range: ReturnTypeEnum
        required: true
      conversionFactor:
        description: Defines the conversion applied if the quantity unit on contract is different from
          unit on referenced underlier.
        range: decimal
      performance:
        description: Performance calculation, in accordance with Part 1 Section 12 of the 2018 ISDA CDM
          Equity Confirmation for Security Equity Swap, Para 75. 'Equity Performance'. Cumulative performance
          is used as a notional multiplier factor on both legs of an Equity Swap.
        range: string
  ProtectionTerms:
    description: A class to specify the terms for calculating a payout to protect the buyer of the swap
      in the case of a qualified credit event. These terms include the applicable credit events, the reference
      obligation, and in the case of a CDS on mortgage-backed securities, the floatingAmountEvents.
    attributes:
      creditEvents:
        description: Specifies the applicable Credit Events that would trigger a settlement, as specified
          in the related Confirmation and defined in the ISDA 2014 Credit Definition article IV section
          4.1.
        range: CreditEvents
      obligations:
        description: The underlying obligations of the reference entity on which you are buying or selling
          protection. The credit events Failure to Pay, Obligation Acceleration, Obligation Default, Restructuring,
          Repudiation/Moratorium are defined with respect to these obligations.
        range: Obligations
      floatingAmountEvents:
        description: This element contains the ISDA terms relating to the floating rate payment events
          and the implied additional fixed payments, applicable to the credit derivatives transactions
          on mortgage-backed securities with pay-as-you-go or physical settlement.
        range: FloatingAmountEvents
    annotations:
      rosetta_metadata: key
  RateSpecification:
    description: A data type to specify the fixed interest rate, floating interest rate or inflation rate.
    attributes:
      FixedRateSpecification:
        description: The fixed rate or fixed rate specification expressed as explicit fixed rates and
          dates.
        range: FixedRateSpecification
      FloatingRateSpecification:
        description: The floating interest rate specification, which includes the definition of the floating
          rate index. the tenor, the initial value, and, when applicable, the spread, the rounding convention,
          the averaging method and the negative interest rate treatment.
        range: FloatingRateSpecification
      InflationRateSpecification:
        description: An inflation rate calculation definition.
        range: InflationRateSpecification
    all_of:
      - description: 'OneOf: A choice type holds exactly one of its options.'
        exactly_one_of:
          - slot_conditions:
              FixedRateSpecification:
                value_presence: PRESENT
          - slot_conditions:
              FloatingRateSpecification:
                value_presence: PRESENT
          - slot_conditions:
              InflationRateSpecification:
                value_presence: PRESENT
    annotations:
      rosetta_choice: 'true'
  ReferenceInformation:
    description: A class specifying the Credit Default Swap Reference Information.
    attributes:
      referenceEntity:
        description: 'The corporate or sovereign entity which is subject to the swap transaction and any
          successor that assumes all or substantially all of its contractual and other obligations. Reference
          Entities cannot be senior or subordinated. It is the obligations of the Reference Entities that
          can be senior or subordinated. ISDA 2014 Credit definitions article II section 2.1: `Reference
          Entity` means the entity specified as such in the related Confirmation.'
        range: LegalEntity
        required: true
      referenceObligation:
        description: 'The Reference Obligation is a financial instrument that is either issued or guaranteed
          by the reference entity. It serves to clarify the precise reference entity protection is being
          offered upon, and its legal position with regard to other related firms (parents/subsidiaries).
          Furthermore the Reference Obligation is ALWAYS deliverable and establishes the Pari Passu ranking
          (as the deliverable bonds must rank equal to the reference obligation). ISDA 2003 Term: Reference
          Obligation.'
        range: ReferenceObligation
        multivalued: true
      noReferenceObligation:
        description: Used to indicate that there is no Reference Obligation associated with this Credit
          Default Swap and that there will never be one.
        range: boolean
      unknownReferenceObligation:
        description: Used to indicate that the Reference obligation associated with the Credit Default
          Swap is currently not known. This is not valid for Legal Confirmation purposes, but is valid
          for earlier stages in the trade life cycle (e.g. Broker Confirmation).
        range: boolean
      allGuarantees:
        description: 'Indicates whether an obligation of the Reference Entity, guaranteed by the Reference
          Entity on behalf of a non-Affiliate, is to be considered an Obligation for the purpose of the
          transaction. It will be considered an obligation if allGuarantees is applicable (true) and not
          if allGuarantees is inapplicable (false). ISDA 2003 Term: All Guarantees.'
        range: boolean
      referencePrice:
        description: 'Used to determine (a) for physically settled trades, the Physical Settlement Amount,
          which equals the Floating Rate Payer Calculation Amount times the Reference Price and (b) for
          cash settled trades, the Cash Settlement Amount, which equals the greater of (i) the difference
          between the Reference Price and the Final Price and (ii) zero. ISDA 2003 Term: Reference Price.'
        range: Price
      referencePolicy:
        description: Applicable to the transactions on mortgage-backed security, which can make use of
          a reference policy. Presence of the element with value set to 'true' indicates that the reference
          policy is applicable; absence implies that it is not.
        range: boolean
      securedList:
        description: 'With respect to any day, the list of Syndicated Secured Obligations of the Designated
          Priority of the Reference Entity published by Markit Group Limited or any successor thereto
          appointed by the Specified Dealers (the ''Secured List Publisher'') on or most recently before
          such day, which list is currently available at [http://www.markit.com]. ISDA 2003 Term: Relevant
          Secured List.'
        range: boolean
    all_of:
      - description: 'ReferenceInformationChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              referenceObligation:
                value_presence: PRESENT
          - slot_conditions:
              noReferenceObligation:
                value_presence: PRESENT
          - slot_conditions:
              unknownReferenceObligation:
                value_presence: PRESENT
  ReferenceObligation:
    description: A class to specify the reference obligation that is associated with a credit derivative
      instrument.
    attributes:
      security:
        description: Identifies the underlying asset when it is a security, such as a bond or convertible
          bond. The security data type requires one or more productIdentifiers, specificaiton of the security
          type (e.g. debt), and includes optional attributes to specify a debt class, such as asset-backed,
          as well as seniority.
        range: Security
      loan:
        description: Identifies the underlying asset when it is a loan.
        range: Loan
      primaryObligor:
        description: 'The entity primarily responsible for repaying debt to a creditor as a result of
          borrowing or issuing bonds. ISDA 2003 Term: Primary Obligor.'
        range: LegalEntity
      primaryObligorReference:
        description: A pointer style reference to a reference entity defined elsewhere in the document.
          Used when the reference entity is the primary obligor.
        range: LegalEntity
        annotations:
          rosetta_metadata: reference
      guarantor:
        description: 'The party that guarantees by way of a contractual arrangement to pay the debts of
          an obligor if the obligor is unable to make the required payments itself. ISDA 2003 Term: Guarantor.'
        range: LegalEntity
      guarantorReference:
        description: A pointer style reference to a reference entity defined elsewhere in the document.
          Used when the reference entity is the guarantor.
        range: string
      standardReferenceObligation:
        description: 'Indicates if the reference obligation is a Standard Reference Obligation. ISDA 2014
          Term: Standard Reference Obligation.'
        range: boolean
    all_of:
      - description: 'AssetChoice: Represents the choice in a CDS contract.'
        exactly_one_of:
          - slot_conditions:
              security:
                value_presence: PRESENT
          - slot_conditions:
              loan:
                value_presence: PRESENT
      - description: 'LegalEntityChoice: Represents the choice in a CDS contract..'
        exactly_one_of:
          - slot_conditions:
              primaryObligor:
                value_presence: PRESENT
          - slot_conditions:
              primaryObligorReference:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  primaryObligor:
                    value_presence: ABSENT
              - slot_conditions:
                  primaryObligorReference:
                    value_presence: ABSENT
    comments:
      - 'Rosetta condition MustBeDebtSecurity is not stated in LinkML: if security exists then security
        -> securityType = Debt'
  ReferencePair:
    attributes:
      referenceEntity:
        description: 'The corporate or sovereign entity on which you are buying or selling protection
          and any successor that assumes all or substantially all of its contractual and other obligations.
          It is vital to use the correct legal name of the entity and to be careful not to choose a subsidiary
          if you really want to trade protection on a parent company. Please note, Reference Entities
          cannot be senior or subordinated. It is the obligations of the Reference Entities that can be
          senior or subordinated. ISDA 2003 Term: Reference Entity.'
        range: LegalEntity
        required: true
      referenceObligation:
        description: 'The Reference Obligation is a financial instrument that is either issued or guaranteed
          by the reference entity. It serves to clarify the precise reference entity protection is being
          offered upon, and its legal position with regard to other related firms (parents/subsidiaries).
          Furthermore the Reference Obligation is ALWAYS deliverable and establishes the Pari Passu ranking
          (as the deliverable bonds must rank equal to the reference obligation). ISDA 2003 Term: Reference
          Obligation.'
        range: ReferenceObligation
      noReferenceObligation:
        description: Used to indicate that there is no Reference Obligation associated with this Credit
          Default Swap and that there will never be one.
        range: boolean
      entityType:
        description: Defines the reference entity types corresponding to a list of types in the ISDA First
          to Default documentation.
        range: EntityTypeEnum
        required: true
        annotations:
          rosetta_metadata: scheme
    all_of:
      - description: 'ReferenceChoice: Choice rule to represent an FpML choice construct.'
        exactly_one_of:
          - slot_conditions:
              referenceObligation:
                value_presence: PRESENT
          - slot_conditions:
              noReferenceObligation:
                value_presence: PRESENT
  ReferencePool:
    description: This type contains all the reference pool items to define the reference entity and reference
      obligation(s) in the basket.
    attributes:
      referencePoolItem:
        description: This type contains all the constituent weight and reference information.
        range: ReferencePoolItem
        required: true
        multivalued: true
    comments:
      - 'Rosetta condition FpML_cd_44_openUnits is not stated in LinkML: if referencePoolItem -> constituentWeight
        -> openUnits exists then referencePoolItem -> constituentWeight -> basketPercentage is absent'
      - 'Rosetta condition FpML_cd_44_basketPercentage is not stated in LinkML: if referencePoolItem ->
        constituentWeight -> basketPercentage exists then referencePoolItem -> constituentWeight -> openUnits
        is absent'
  ReferencePoolItem:
    description: This type contains all the constituent weight and reference information.
    attributes:
      constituentWeight:
        description: Describes the weight of each of the constituents within the basket. If not provided,
          it is assumed to be equal weighted.
        range: ConstituentWeight
      referencePair:
        range: ReferencePair
        required: true
      protectionTermsReference:
        description: Reference to the documentation terms applicable to this item.
        range: ProtectionTerms
        annotations:
          rosetta_metadata: reference
      cashSettlementTermsReference:
        description: Reference to the cash settlement terms applicable to this item.
        range: CashSettlementTerms
        annotations:
          rosetta_metadata: reference
      physicalSettlementTermsReference:
        description: Reference to the physical settlement terms applicable to this item.
        range: PhysicalSettlementTerms
        annotations:
          rosetta_metadata: reference
    all_of:
      - description: 'SettlementChoice: A choice rule between a reference to the cash or physical settlement
          terms.'
        exactly_one_of:
          - slot_conditions:
              cashSettlementTermsReference:
                value_presence: PRESENT
          - slot_conditions:
              physicalSettlementTermsReference:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  cashSettlementTermsReference:
                    value_presence: ABSENT
              - slot_conditions:
                  physicalSettlementTermsReference:
                    value_presence: ABSENT
  ReturnTermsBase:
    description: Contains all common elements in variance, volatility and correlation return Terms.
    attributes:
      valuationTerms:
        description: Contains all non-date valuation information.
        range: ValuationTerms
        required: true
      annualizationFactor:
        description: This specifies the numerator of an annualization factor. Frequently this number is
          equal to the number of observations of prices in a year e.g. 252.
        range: integer
      dividendApplicability:
        description: The parameters which define whether dividends are applicable
        range: DividendApplicability
      equityUnderlierProvisions:
        description: Contains Equity Underlyer provisions regarding jurisdiction and fallbacks.
        range: EquityUnderlierProvisions
      sharePriceDividendAdjustment:
        description: Indicates whether the price of shares is adjusted for dividends or not.
        range: boolean
      expectedN:
        description: Expected number of trading days.
        range: integer
        required: true
      initialLevel:
        description: Contract will strike off this initial level. Providing just the initialLevel without
          initialLevelSource, infers that this is AgreedInitialPrice - a specified Initial Index Level.
        range: decimal
      initialLevelSource:
        description: In this context, this is AgreedInitialPrice - a specified Initial Index Level.
        range: DeterminationMethodEnum
      meanAdjustment:
        description: Specifies whether Mean Adjustment is applicable or not in the calculation of the
          Realized Volatility, Variance or Correlation
        range: boolean
      performance:
        description: Performance calculation, in accordance with Part 1 Section 12 of the 2018 ISDA CDM
          Equity Confirmation for Security Equity Swap, Para 75. 'Equity Performance'. Cumulative performance
          is used as a notional multiplier factor on both legs of an Equity Swap.
        range: string
    all_of:
      - description: 'PositiveExpectedN: The number of expected trading dates must be positive'
        slot_conditions:
          expectedN:
            minimum_value: 1
    comments:
      - 'Rosetta condition InitialLevelOrInitialLevelSource is not stated in LinkML: if initialLevel is
        absent then initialLevelSource exists and if initialLevelSource is absent then initialLevel exists'
  SettledEntityMatrix:
    description: A class to specify the Relevant Settled Entity Matrix.
    attributes:
      matrixSource:
        description: Relevant settled entity matrix source.
        range: SettledEntityMatrixSourceEnum
        required: true
        annotations:
          rosetta_metadata: scheme
      publicationDate:
        description: Specifies the publication date of the applicable version of the matrix. When this
          element is omitted, the Standard Terms Supplement defines rules for which version of the matrix
          is applicable.
        range: date
  SpreadSchedule:
    is_a: RateSchedule
    description: Adds an optional spread type element to the Schedule to identify a long or short spread
      value.
    attributes:
      spreadScheduleType:
        description: An element which purpose is to identify a long or short spread value.
        range: SpreadScheduleTypeEnum
        annotations:
          rosetta_metadata: scheme
  StubFloatingRate:
    description: A class defining a floating rate.
    attributes:
      floatingRateIndex:
        description: The floating rate index.
        range: FloatingRateIndexEnum
        required: true
      indexTenor:
        description: The ISDA Designated Maturity, i.e. the tenor of the floating rate.
        range: Period
      floatingRateMultiplierSchedule:
        description: A rate multiplier or multiplier schedule to apply to the floating rate. A multiplier
          schedule is expressed as explicit multipliers and dates. In the case of a schedule, the step
          dates may be subject to adjustment in accordance with any adjustments specified in the calculationPeriodDatesAdjustments.
          The multiplier can be a positive or negative decimal. This element should only be included if
          the multiplier is not equal to 1 (one) for the term of the stream.
        range: ScheduleWithInitialValue
      spreadSchedule:
        description: The ISDA Spread or a Spread schedule expressed as explicit spreads and dates. In
          the case of a schedule, the step dates may be subject to adjustment in accordance with any adjustments
          specified in calculationPeriodDatesAdjustments. The spread is a per annum rate, expressed as
          a decimal. For purposes of determining a calculation period amount, if positive the spread will
          be added to the floating rate and if negative the spread will be subtracted from the floating
          rate. A positive 10 basis point (0.1%) spread would be represented as 0.001.
        range: SpreadSchedule
        multivalued: true
      rateTreatment:
        description: The specification of any rate conversion which needs to be applied to the observed
          rate before being used in any calculations. The two common conversions are for securities quoted
          on a bank discount basis which will need to be converted to either a Money Market Yield or Bond
          Equivalent Yield. See the Annex to the 2000 ISDA Definitions, Section 7.3. Certain General Definitions
          Relating to Floating Rate Options, paragraphs (g) and (h) for definitions of these terms.
        range: RateTreatmentEnum
      capRateSchedule:
        description: The cap rate or cap rate schedule, if any, which applies to the floating rate. The
          cap rate (strike) is only required where the floating rate on a swap stream is capped at a certain
          level. A cap rate schedule is expressed as explicit cap rates and dates and the step dates may
          be subject to adjustment in accordance with any adjustments specified in calculationPeriodDatesAdjustments.
          The cap rate is assumed to be exclusive of any spread and is a per annum rate, expressed as
          a decimal. A cap rate of 5% would be represented as 0.05.
        range: StrikeSchedule
        multivalued: true
      floorRateSchedule:
        description: The floor rate or floor rate schedule, if any, which applies to the floating rate.
          The floor rate (strike) is only required where the floating rate on a swap stream is floored
          at a certain strike level. A floor rate schedule is expressed as explicit floor rates and dates
          and the step dates may be subject to adjustment in accordance with any adjustments specified
          in calculationPeriodDatesAdjustments. The floor rate is assumed to be exclusive of any spread
          and is a per annum rate, expressed as a decimal. A floor rate of 5% would be represented as
          0.05.
        range: StrikeSchedule
        multivalued: true
  StubValue:
    description: A type defining how a stub calculation period amount is calculated. A single floating
      rate tenor different to that used for the regular part of the calculation periods schedule may be
      specified, or two floating rate tenors many be specified. If two floating rate tenors are specified
      then Linear Interpolation (in accordance with the 2000 ISDA Definitions, Section 8.3 Interpolation)
      is assumed to apply. Alternatively, an actual known stub rate or stub amount may be specified.
    attributes:
      floatingRate:
        description: The rates to be applied to the initial or final stub may be the linear interpolation
          of two different rates. While the majority of the time, the rate indices will be the same as
          that specified in the stream and only the tenor itself will be different, it is possible to
          specift two different rates. For example, a 2 month stub period may use the linear interpolation
          of a 1 month and 3 month rate. The different rates would be specified in this component. Note
          that a maximum of two rates can be specified. If a stub period uses the same floating rate index,
          including tenor, as the regular calculation periods then this should not be specified again
          within this component, i.e. the stub calculation period amount component may not need to be
          specified even if there is an initial or final stub period. If a stub period uses a different
          floating rate index compared to the regular calculation periods then this should be specified
          within this component. If specified here, they are likely to have id attributes, allowing them
          to be referenced from within the cashflows component.
        range: StubFloatingRate
        multivalued: true
        maximum_cardinality: 2
      stubRate:
        description: An actual rate to apply for the initial or final stub period may have been agreed
          between the principal parties (in a similar way to how an initial rate may have been agreed
          for the first regular period). If an actual stub rate has been agreed then it would be included
          in this component. It will be a per annum rate, expressed as a decimal. A stub rate of 5% would
          be represented as 0.05.
        range: decimal
      stubAmount:
        description: An actual amount to apply for the initial or final stub period may have been agreed
          between the two parties. If an actual stub amount has been agreed then it would be included
          in this component.
        range: Money
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              floatingRate:
                value_presence: PRESENT
          - slot_conditions:
              stubRate:
                value_presence: PRESENT
          - slot_conditions:
              stubAmount:
                value_presence: PRESENT
  Tranche:
    description: The class to represent a CDS Tranche.
    attributes:
      attachmentPoint:
        description: Lower bound percentage of the loss that the Tranche can endure, expressed as a decimal.
          An attachment point of 5% would be represented as 0.05. The difference between Attachment and
          Exhaustion points is called the width of the Tranche.
        range: decimal
        required: true
      exhaustionPoint:
        description: Upper bound percentage of the loss that the Tranche can endure, expressed as a decimal.
          An exhaustion point of 5% would be represented as 0.05. The difference between Attachment and
          Exhaustion points is call the width of the Tranche.
        range: decimal
        required: true
      incurredRecoveryApplicable:
        description: 'Outstanding Swap Notional Amount is defined at any time on any day, as the greater
          of: (a) Zero; If Incurred Recovery Amount Applicable: (b) The Original Swap Notional Amount
          minus the sum of all Incurred Loss Amounts and all Incurred Recovery Amounts (if any) determined
          under this Confirmation at or prior to such time.Incurred Recovery Amount not populated: (b)
          The Original Swap Notional Amount minus the sum of all Incurred Loss Amounts determined under
          this Confirmation at or prior to such time.'
        range: boolean
    all_of:
      - description: 'AttachmentPoint: FpML definition associated with the attachmentPoint element specifies
          that a schema facet to constraint the value between 0 to 1 will be introduced in FpML 4.3.'
        slot_conditions:
          attachmentPoint:
            minimum_value: 0
            maximum_value: 1
      - description: 'ExhaustionPoint: FpML definition associated with the exhaustionPoint element specifies
          that a schema facet to constraint the value between 0 to 1 will be introduced in FpML 4.3.'
        slot_conditions:
          exhaustionPoint:
            minimum_value: 0
            maximum_value: 1
    comments:
      - 'Rosetta condition AttachmentPointLessThanExhaustionPoint is not stated in LinkML: attachmentPoint
        <= exhaustionPoint'
  ValuationTerms:
    attributes:
      futuresPriceValuation:
        description: The official settlement price as announced by the related exchange is applicable,
          in accordance with the ISDA 2002 definitions.
        range: boolean
      optionsPriceValuation:
        description: The official settlement price as announced by the related exchange is applicable,
          in accordance with the ISDA 2002 definitions
        range: boolean
      numberOfValuationDates:
        description: The number of valuation dates between valuation start date and valuation end date.
        range: integer
      dividendValuationDates:
        description: Specifies the dividend valuation dates of the swap.
        range: AdjustableRelativeOrPeriodicDates
      fPVFinalPriceElectionFallback:
        description: Specifies the fallback provisions for Hedging Party in the determination of the Final
          Price.
        range: FPVFinalPriceElectionFallbackEnum
      multipleExchangeIndexAnnexFallback:
        description: For an index option transaction, a flag to indicate whether a relevant Multiple Exchange
          Index Annex is applicable to the transaction. This annex defines additional provisions which
          are applicable where an index is comprised of component securities that are traded on multiple
          exchanges.
        range: boolean
      componentSecurityIndexAnnexFallback:
        description: For an index option transaction, a flag to indicate whether a relevant Component
          Security Index Annex is applicable to the transaction.
        range: boolean
    rules:
      - description: 'PositiveNumberOfValuationDates: The number of valuation dates must be positive.'
        preconditions:
          slot_conditions:
            numberOfValuationDates:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            numberOfValuationDates:
              minimum_value: 1
  VarianceCapFloor:
    attributes:
      varianceCap:
        description: If present and true, then variance cap is applicable.
        range: boolean
        required: true
      unadjustedVarianceCap:
        description: For use when varianceCap is applicable. Contains the scaling factor of the Variance
          Cap that can differ on a trade-by-trade basis in the European market. For example, a Variance
          Cap of 2.5^2 x Variance Strike Price has an unadjustedVarianceCap of 2.5.
        range: decimal
      boundedVariance:
        description: Conditions which bound variance. The contract specifies one or more boundary levels.
          These levels are expressed as prices for confirmation purposes Underlyer price must be equal
          to or higher than Lower Barrier is known as Up Conditional Swap Underlyer price must be equal
          to or lower than Upper Barrier is known as Down Conditional Swap Underlyer price must be equal
          to or higher than Lower Barrier and must be equal to or lower than Upper Barrier is known as
          Barrier Conditional Swap.
        range: BoundedVariance
    comments:
      - 'Rosetta condition PositiveUnadjustedVarianceCap is not stated in LinkML: if unadjustedVarianceCap
        exists then unadjustedVarianceCap > 0'
      - 'Rosetta condition CapFloorApplicability is not stated in LinkML: if varianceCap = True then unadjustedVarianceCap
        exists or boundedVariance exists else unadjustedVarianceCap is absent and boundedVariance is absent'
  VarianceReturnTerms:
    is_a: ReturnTermsBase
    attributes:
      varianceStrikePrice:
        description: Variance Strike Price in accordance with the ISDA 2011 Equity Derivatives Definitions.
        range: Price
      volatilityStrikePrice:
        description: Volatility Strike Price in accordance with the ISDA 2011 Equity Derivatives Definitions.
        range: Price
      varianceCapFloor:
        description: Contains possible barriers for variance products, both variance-based and underlier
          price based
        range: VarianceCapFloor
      volatilityCapFloor:
        description: Contains containing volatility-based barriers
        range: VolatilityCapFloor
      vegaNotionalAmount:
        description: Vega Notional represents the approximate gain/loss at maturity for a 1% difference
          between RVol (realised vol) and KVol (strike vol). It does not necessarily represent the Vega
          Risk of the trade.
        range: NonNegativeQuantitySchedule
      exchangeTradedContractNearest:
        description: Specification of the exchange traded contract nearest.
        range: Observable
        annotations:
          rosetta_metadata: address
    all_of:
      - description: 'From ReturnTermsBase. PositiveExpectedN: The number of expected trading dates must
          be positive'
        slot_conditions:
          expectedN:
            minimum_value: 1
      - description: 'StrikePriceMustExist: The strike price must be present, but it can be expressed
          in either variance or volatility terms'
        exactly_one_of:
          - slot_conditions:
              volatilityStrikePrice:
                value_presence: PRESENT
          - slot_conditions:
              varianceStrikePrice:
                value_presence: PRESENT
    comments:
      - 'Rosetta condition Positive_VegaNotionalAmount is not stated in LinkML: if vegaNotionalAmount
        -> value exists then vegaNotionalAmount -> value > 0'
      - 'Rosetta condition UnderlierMustBeListedDerivative is not stated in LinkML: if exchangeTradedContractNearest
        exists then exchangeTradedContractNearest as ListedDerivative exists'
      - 'Rosetta condition ReferenceContract is not stated in LinkML: if valuationTerms -> futuresPriceValuation
        = True then exchangeTradedContractNearest exists'
      - 'Rosetta condition NonNegativeStrikePrice is not stated in LinkML: if volatilityStrikePrice ->
        value exists then volatilityStrikePrice -> value >= 0 and if varianceStrikePrice -> value exists
        then varianceStrikePrice -> value >= 0'
  VolatilityCapFloor:
    description: Contains volatility-based barriers. Volatility Cap needs to be specified in accordance
      with the ISDA 2011 Equity Derivatives Definitions.
    attributes:
      applicable:
        description: Indicates whether the volatility cap is applicable in accordance with the ISDA 2011
          Equity Derivatives Definitions. Setting the element 'applicable' to 'False' - means No Volatility
          Cap and no 'totalVolatilityCap' or 'volatilityCapFactor' should be provided. Setting the element
          'applicable' to 'True' - means Volatility Cap election, then 'totalVolatilityCap' or 'volatilityCapFactor'
          should be provided, otherwise it defaults to volatilityCapFactor=2.5.
        range: boolean
        required: true
      totalVolatilityCap:
        description: Volatility Cap Amount in accordance with the ISDA 2011 Equity Derivatives Definitions.
          This means the Volatility Cap Amount election is a number.
        range: decimal
      volatilityCapFactor:
        description: Volatility Cap Amount in accordance with the ISDA 2011 Equity Derivatives Definitions.
          The Calculated VolCapAmt can be optionally provided.
        range: decimal
    comments:
      - 'Rosetta condition CapFloorApplicability is not stated in LinkML: if applicable = True then totalVolatilityCap
        exists or volatilityCapFactor exists else totalVolatilityCap is absent and volatilityCapFactor
        is absent'
      - 'Rosetta condition PositiveCaps is not stated in LinkML: if totalVolatilityCap exists then totalVolatilityCap
        >= 0 and if volatilityCapFactor exists then volatilityCapFactor >= 0'
  VolatilityReturnTerms:
    is_a: ReturnTermsBase
    attributes:
      volatilityStrikePrice:
        description: Volatility Strike Price in accordance with the ISDA 2011 Equity Derivatives Definitions.
        range: Price
        required: true
      volatilityCapFloor:
        description: Contains volatility-based barriers
        range: VolatilityCapFloor
      exchangeTradedContractNearest:
        description: Specification of the exchange traded contract nearest.
        range: ListedDerivative
    all_of:
      - description: 'From ReturnTermsBase. PositiveExpectedN: The number of expected trading dates must
          be positive'
        slot_conditions:
          expectedN:
            minimum_value: 1
