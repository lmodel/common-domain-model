        range: SecurityAgreementElections
      clauseLibrarySchedule:
        description: Elections specified through a Clause Library.
        range: ClauseLibrarySchedule
      transactionAdditionalTerms:
        description: Any additional terms which mainly intend to specify the extraordinary events that
          may affect a trade and the related contractual rights and obligation of the parties when this
          happens
        range: TransactionAdditionalTerms
      masterAgreementElections:
        description: A legal representation of the different possible master agreements
        range: MasterAgreementElections
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              creditSupportAgreementElections:
                value_presence: PRESENT
          - slot_conditions:
              collateralTransferAgreementElections:
                value_presence: PRESENT
          - slot_conditions:
              securityAgreementElections:
                value_presence: PRESENT
          - slot_conditions:
              clauseLibrarySchedule:
                value_presence: PRESENT
          - slot_conditions:
              transactionAdditionalTerms:
                value_presence: PRESENT
          - slot_conditions:
              masterAgreementElections:
                value_presence: PRESENT
  AgreementName:
    description: Specifies the agreement name through an agreement type and optional detailed sub agreement
      type.
    attributes:
      agreementType:
        description: Specification of the legal agreement type.
        range: LegalAgreementTypeEnum
        required: true
      creditSupportAgreementType:
        description: Specification of the credit support agreement type.
        range: CreditSupportAgreementTypeEnum
        annotations:
          rosetta_metadata: scheme
      creditSupportAgreementMarginType:
        description: specifies the type of margin for which a legal agreement is named.
        range: CollateralMarginTypeEnum
      contractualDefinitionsType:
        description: The definitions such as those published by ISDA that will define the terms of the
          trade.
        range: ContractualDefinitionsEnum
        multivalued: true
        annotations:
          rosetta_metadata: scheme
      contractualTermsSupplement:
        description: A contractual supplement (such as those published by ISDA) that will apply to the
          trade.
        range: ContractualTermsSupplement
        multivalued: true
      contractualMatrix:
        description: A reference to a contractual matrix of elected terms/values (such as those published
          by ISDA) that shall be deemed to apply to the trade. The applicable matrix is identified by
          reference to a name and optionally a publication date. Depending on the structure of the matrix,
          an additional term (specified in the matrixTerm element) may be required to further identify
          a subset of applicable terms/values within the matrix.
        range: ContractualMatrix
        multivalued: true
      masterAgreementType:
        description: Specification of the master agreement type.
        range: MasterAgreementTypeEnum
        annotations:
          rosetta_metadata: scheme
      masterConfirmationType:
        description: The type of master confirmation executed between the parties.
        range: MasterConfirmationTypeEnum
        annotations:
          rosetta_metadata: scheme
      masterConfirmationAnnexType:
        description: The type of master confirmation annex executed between the parties.
        range: MasterConfirmationAnnexTypeEnum
        annotations:
          rosetta_metadata: scheme
      otherAgreement:
        description: Definition of an agreement that is not enumerated in the CDM.
        range: string
      brokerConfirmationType:
        range: BrokerConfirmationTypeEnum
    rules:
      - description: 'CreditSupportAgreement: A condition to ensure that the credit supoort agreement
          type is specified when required.'
        preconditions:
          slot_conditions:
            agreementType:
              equals_string: CreditSupportAgreement
        postconditions:
          slot_conditions:
            creditSupportAgreementType:
              value_presence: PRESENT
      - description: 'MasterConfirmation: If a master confirmation annex type is specified a master confirmation
          type must exist.'
        preconditions:
          slot_conditions:
            masterConfirmationAnnexType:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            masterConfirmationType:
              value_presence: PRESENT
      - description: 'CSAMarginType: A condition to ensure that CSA margin type is only specified if a
          credit support agreemnt type is specified.'
        preconditions:
          slot_conditions:
            creditSupportAgreementMarginType:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            creditSupportAgreementType:
              value_presence: PRESENT
    comments:
      - 'Rosetta condition AgreementType is not stated in LinkML: if agreementType <> LegalAgreementTypeEnum
        -> Other then otherAgreement is absent else if agreementType <> LegalAgreementTypeEnum -> MasterAgreement
        then masterAgreementType is absent else if agreementType <> LegalAgreementTypeEnum -> MasterConfirmation
        then masterConfirmationType is absent and masterConfirmationAnnexType is absent else if agreementType
        <> LegalAgreementTypeEnum -> Confirmation then contractualDefinitionsType is absent and contractualTermsSupplement
        is absent and contractualMatrix is absent'
  AgreementTerms:
    description: Specification of the content of a legal agreement.
    attributes:
      agreement:
        description: Specification of the standard set of terms that define a legal agreement.
        range: Agreement
        required: true
      clauseLibrary:
        description: Specification of whether the agreement terms have been negotiated using the clause
          library methodology.
        range: boolean
      counterparty:
        description: Specification of the roles of the counterparties to the agreement.
        range: Counterparty
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
  ContactInformationElection:
    description: Specifies the party reference and the associated contact information.
    attributes:
      partyReference:
        description: The party to which the election and details apply.
        range: CounterpartyRoleEnum
        required: true
      primaryContactInformation:
        description: The main notice/address information of the party.
        range: ContactInformation
  ContractualMatrix:
    attributes:
      matrixType:
        description: Identifies the form of applicable matrix.
        range: MatrixTypeEnum
        required: true
        annotations:
          rosetta_metadata: scheme
      matrixTerm:
        description: Defines any applicable key into the relevant matrix. For example, the Transaction
          Type would be the single term required for the Credit Derivatives Physical Settlement Matrix.
          This element should be omitted in the case of the 2000 ISDA Definitions Settlement Matrix for
          Early Termination and Swaptions.
        range: MatrixTermEnum
        annotations:
          rosetta_metadata: scheme
  ContractualTermsSupplement:
    description: A contractual supplement (such as those published by ISDA) and its publication date that
      will apply to the trade.
    attributes:
      contractualTermsSupplementType:
        description: Identifies the form of applicable contractual supplement.
        range: ContractualSupplementTypeEnum
        required: true
        annotations:
          rosetta_metadata: scheme
      publicationDate:
        description: Specifies the publication date of the applicable version of the contractual supplement.
        range: date
  LegalAgreement:
    is_a: LegalAgreementBase
    description: The specification of a legal agreement between two parties, being negotiated or having
      been executed. This includes the baseline information and the optional specialised elections
    attributes:
      agreementTerms:
        description: Specification of the content of the legal agreement.
        range: AgreementTerms
      relatedAgreements:
        description: Specifies the agreement(s) that govern the agreement, either as a reference to such
          agreements when specified as part of the CDM, or through identification of some of the key terms
          of those agreements, such as the type of agreement, the publisher, the vintage, the agreement
          identifier and the agreement date.
        range: LegalAgreement
        multivalued: true
      umbrellaAgreement:
        description: Specifies a set of legal entities which are part of a legal agreement beyond the
          two contracting parties to that agreement.
        range: UmbrellaAgreement
    all_of:
      - description: 'AgreementType: Either the Agreement Terms (i.e. a bilateral or one way agreement)
          or an Umbrella Agreement (i.e. an agreement where multiple parties and variations of terms are
          described within a single document but represent multiple agreements for operational purposes)
          should be included, but not both.'
        exactly_one_of:
          - slot_conditions:
              agreementTerms:
                value_presence: PRESENT
          - slot_conditions:
              umbrellaAgreement:
                value_presence: PRESENT
    annotations:
      rosetta_root_type: 'true'
      rosetta_metadata: key
    comments:
      - 'Rosetta condition ConsistentlyExecutedAgreements is not stated in LinkML: if relatedAgreements
        exists and agreementDate exists then relatedAgreements -> agreementDate exists'
      - 'Rosetta condition AgreementVerification is not stated in LinkML: if agreementTerms -> agreement
        -> securityAgreementElections exists then legalAgreementIdentification -> agreementName -> agreementType
        = LegalAgreementTypeEnum -> SecurityAgreement else if agreementTerms -> agreement -> creditSupportAgreementElections
        exists then legalAgreementIdentification -> agreementName -> creditSupportAgreementType = CreditSupportAgreementTypeEnum
        -> CreditSupportAnnex or legalAgreementIdentification -> agreementName -> creditSupportAgreementType
        = CreditSupportAgreementTypeEnum -> CreditSupportDeed else if agreementTerms -> agreement -> collateralTransferAgreementElections
        exists then legalAgreementIdentification -> agreementName -> creditSupportAgreementType = CreditSupportAgreementTypeEnum
        -> CollateralTransferAgreement else if agreementTerms -> agreement -> masterAgreementElections
        exists then legalAgreementIdentification -> agreementName -> agreementType = LegalAgreementTypeEnum
        -> MasterAgreement'
  LegalAgreementBase:
    description: Specifies the legal agreement baseline information, being negotiated or having been executed.
      It excludes specialized elections
    attributes:
      agreementDate:
        description: The date on which the legal agreement has been agreed between the parties. This corresponds
          to the Date of Deed in an English Law document.
        range: date
      effectiveDate:
        description: The date on which, or as of which, the agreement is effective, if different from
          the agreement date. It is expected that it will most often correspond to the agreement date,
          although there could be situations where the parties will explicitly agree on a distinct effective
          date.
        range: date
      identifier:
        description: The legal agreement identifier. Several identifiers can be specified.
        range: Identifier
        multivalued: true
      legalAgreementIdentification:
        description: 'The type of legal agreement, identified via a set of composable attributes: agreementName,
          publisher, governing law and version, e.g. ISDA 2013 Standard Credit Support Annex English Law.'
        range: LegalAgreementIdentification
        required: true
      contractualParty:
        description: The two contractual parties to the legal agreement, which reference information is
          positioned as part of the partyInformation attribute.
        range: Party
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
        annotations:
          rosetta_metadata: reference
      otherParty:
        description: The role(s) that other party(ies) may have in relation to the legal agreement, further
          to the contractual parties.
        range: PartyRole
        multivalued: true
      attachment:
        description: A human readable document, for example a confirmation.
        range: Resource
        multivalued: true
  LegalAgreementIdentification:
    description: 'Specifies the type of legal agreement, identified via a set of composable attributes:
      agreementName, publisher, governing law and version, e.g. ISDA 2013 Standard Credit Support Annex
      English Law.'
    attributes:
      governingLaw:
        description: The law governing the legal agreement, e.g. English Law, New York Law or Japanese
          Law.
        range: GoverningLawEnum
        annotations:
          doc_reference: AcadiaSoft AM_1_0 namingConvention governingLaw
      agreementName:
        description: The legal agreement name, e.g. Credit Support Annex for Variation Margin.
        range: AgreementName
        required: true
        annotations:
          doc_reference: AcadiaSoft AM_1_0 namingConvention documentName
      publisher:
        description: The legal agreement publisher, e.g. ISDA.
        range: LegalAgreementPublisherEnum
        annotations:
          doc_reference: AcadiaSoft AM_1_0 namingConvention publisher
      vintage:
        description: In the case where successive definitions of the legal agreement have been developed,
          the vintage identification. This is typically (but not necessarily) done by referencing the
          year, e.g. 2013 in the case of the ISDA 2013 Standard Credit Support Annex.
        range: integer
        annotations:
          doc_reference: AcadiaSoft AM_1_0 namingConvention csaVersion
    comments:
      - 'Rosetta condition CSAMarginType is not stated in LinkML: if agreementName -> creditSupportAgreementMarginType
        exists then agreementName -> creditSupportAgreementType exists and vintage >= 2016'
  NonLegalEntity:
    description: Specifies a non-legal entity that exists in the agreement with a defined relationship
      to a Legal entity to the agreement
    attributes:
      identifier:
        description: Specifies the unique identifier value for a non-legal entity such as a sleeve, or
          sub account, that is a party to the agreement and has a relationship with a legal entity defined
          on the agreement.
        range: string
        required: true
      identifierType:
        description: Specifies the Identifier type for a non-Legal entity to the agreement, for example
          the use of an alert code to uniquely identify a non-Legal entity.
        range: string
        required: true
  NoticeContactInformation:
    is_a: ContactInformation
    description: Specifies notice information including address and, optionally, an associated person.
      This type also supports the ISDA CSA representation as a single string, through the address attribute
      in Contact Information.
    attributes:
      naturalPerson:
        description: Optional information about people involved in a transaction or business process.
        range: NaturalPerson
        multivalued: true
      additionalInformation:
        description: Additional information on the recipient.
        range: string
  NoticeInformationElection:
    is_a: ContactInformationElection
    description: Specifies the party reference and the associated notice and contact information.
    attributes:
      additionalContactInformation:
        description: Additional notice/address information of the party.
        range: NoticeContactInformation
        multivalued: true
    slot_usage:
      primaryContactInformation:
        description: The main notice/address information of the party.
        range: NoticeContactInformation
        required: true
  OtherAgreement:
    description: A class for defining an agreement executed between parties.
    attributes:
      identifier:
        description: An identifier that has been created to identify the agreement.
        range: string
        annotations:
          rosetta_metadata: scheme
      otherAgreementType:
        description: The agreement executed between the parties and intended to govern product-specific
          derivatives transactions between those parties.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      version:
        description: The version of the agreement.
        range: string
        annotations:
          rosetta_metadata: scheme
      date:
        description: The date on which the agreement was signed.
        range: date
  OtherAgreementTerms:
    description: 'A class to specify a related legal agreement. For example, ISDA 2016 Credit Support
      Annex for Initial Margin, paragraph 13, General Principles, (s): Other CSA and Japanese Law CSA
      (VM). | ISDA 2016 Credit Support Annex for Variation Margin, paragraph 13, (o): Other CSA.'
    attributes:
      isSpecified:
        description: The qualification of whether some other related agreement is specified (True) or
          not (False).
        range: boolean
        required: true
      legalDocument:
        description: The specification of this other agreement, when the qualification is True.
        range: string
    comments:
      - 'Rosetta condition LegalDocumentNotSpecified is not stated in LinkML: if isSpecified = False then
        legalDocument is absent'
      - 'Rosetta condition LegalDocumentSpecified is not stated in LinkML: if isSpecified = True then
        legalDocument exists'
  Resource:
    description: Describes the resource that contains the media representation of a business event (i.e
      used for stating the Publicly Available Information). For example, can describe a file or a URL
      that represents the event. This type is an extended version of a type defined by RIXML (www.rixml.org).
      Rosetta restricts the FpML implementation by not providing the ability to associated a document
      in hexadecimalBinary or base64Binary until such time that actual use cases will come up.
    attributes:
      resourceId:
        description: The unique identifier of the resource within the event. FpML specifies this element
          of type resourceIdScheme but with no specified value.
        range: string
        required: true
        annotations:
          rosetta_metadata: scheme
      resourceType:
        description: A description of the type of the resource, e.g. a confirmation.
        range: ResourceTypeEnum
        annotations:
          rosetta_metadata: scheme
      language:
        description: Indicates the language of the resource, described using the ISO 639-2/T Code.
        range: string
        annotations:
          rosetta_metadata: scheme
      sizeInBytes:
        description: Indicates the size of the resource in bytes. It could be used by the end user to
          estimate the download time and storage needs.
        range: decimal
      length:
        description: Indicates the length of the resource. For example, if the resource were a PDF file,
          the length would be in pages.
        range: ResourceLength
      mimeType:
        description: Indicates the type of media used to store the content. mimeType is used to determine
          the software product(s) that can read the content. MIME Types are described in RFC 2046.
        range: string
        annotations:
          rosetta_metadata: scheme
      name:
        description: The name of the resource. It is specified as a NormalizedString in FpML.
        range: string
      comments:
        description: Any additional comments that are deemed necessary. For example, which software version
          is required to open the document? Or, how does this resource relate to the others for this event?
        range: string
      string:
        description: Provides extra information as string. In case the extra information is in XML format,
          a CDATA section must be placed around the source message to prevent its interpretation as XML
          content.
        range: string
      url:
        description: Indicates where the resource can be found, as a URL that references the information
          on a web server accessible to the message recipient.
        range: string
    all_of:
      - description: 'ResourceChoice: Choice rule to represent an FpML choice construct. Note that FpML
          also provides the ability to have hexadecimalBinary or base64Binary, which have not been implemented
          in Rosetta until we see actual use cases.'
        exactly_one_of:
          - slot_conditions:
              string:
                value_presence: PRESENT
          - slot_conditions:
              url:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  string:
                    value_presence: ABSENT
              - slot_conditions:
                  url:
                    value_presence: ABSENT
  ResourceLength:
    description: A class to indicate the length of the resource.
    attributes:
      lengthUnit:
        description: The length unit of the resource. For example, pages (pdf, text documents) or time
          (audio, video files).
        range: LengthUnitEnum
        required: true
      lengthValue:
        description: The length value of the resource.
        range: decimal
        required: true
  TransferContactInformation:
    is_a: ContactInformation
    description: Specifies transfer information including address and, optionally, an associated account.
      This type also supports the ISDA CSA representation as a single string, through the address attribute
      in Contact Information.
    attributes:
      account:
        description: Specifies the account infomation for transfers to a party.
        range: Account
        multivalued: true
      additionalInformation:
        description: Additional transfer information.
        range: string
  TransferInformationElection:
    is_a: ContactInformationElection
    description: Specifies the party reference and the associated transfer & contact information.
    slot_usage:
      primaryContactInformation:
        description: The main notice/address and account information of the party.
        range: TransferContactInformation
        required: true
  UmbrellaAgreement:
    description: Specifies the set of agreements, the parties of which are set within UmbrellaAgreementSet,
      beyond the two contracting parties to that agreement.
    attributes:
      agreementSet:
        description: The language associated with the umbrella agreement, and which applies to all the
          parties to the umbrella agreement.
        range: UmbrellaAgreementSet
        required: true
        multivalued: true
  UmbrellaAgreementParty:
    description: Specifies the entities that are part of the umbrella agreement.
    attributes:
      party:
        description: Specifies the party to the umbrella agreement
        range: Party
      actingAs:
        description: Specifies the CounterpartyRoleEnum, e.g. either Party1 or Party2, that is associated
          to the party.
        range: CounterpartyRoleEnum
      partyRole:
        description: Represents the legal role that each defined entity to the agreement performs within
          the structure of that agreement.
        range: UmbrellaPartyRoleEnum
      nonLegalEntity:
        description: Specifies a non-legal entity that exists in the agreement with a defined relationship
          to a Legal entity to the agreement.
        range: NonLegalEntity
      parentParty:
        description: Represents the identification of a parent child relationship between two entities
          in the Umbrella agreement, allowing non-legal entities to be linked to the appropriate legal
          entity and allowing funds, portfolio or managed accounts to be linked to their applicable Investment
          Manager or Agent within the agreement.
        range: Party
    all_of:
      - description: 'UmbrellaParty: Only a Party or a non-Legal entity can be set.'
        exactly_one_of:
          - slot_conditions:
              party:
                value_presence: PRESENT
          - slot_conditions:
              nonLegalEntity:
                value_presence: PRESENT
    rules:
      - description: 'ParentParty: Specifies that certain defined roles require that a parent party is
          identified.'
        preconditions:
          slot_conditions:
            partyRole:
              equals_string: Sleeve
        postconditions:
          slot_conditions:
            parentParty:
              value_presence: PRESENT
      - description: 'NonLegalEntityParent: Non-Legal entity must have a Parent Party.'
        preconditions:
          slot_conditions:
            nonLegalEntity:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            parentParty:
              value_presence: PRESENT
  UmbrellaAgreementSet:
    description: Represents the groups of agreement term elections that exist within the agreement and
      to which entities that particular group of elections apply. Where all entities under the umbrella
      have the same set of elections only one agreement set will exist. At least one agreement set must
      be defined for an Umbrella agreement
    attributes:
      agreement:
        description: Specification of the standard set of terms that define a legal agreement.
        range: Agreement
        required: true
      party:
        description: Specifies the underlying parties to the agreement that either act as legal parties
          to the agreement or represent legal constructs that are managed by a party to the agreement
          but do not represent a Legal Entity as of themselves.
        range: UmbrellaAgreementParty
        required: true
        multivalued: true
        minimum_cardinality: 2
      additionalLanguage:
        description: Represents any additional language that may need to be captured regarding the structure
          or application of terms that may exist for the agreement.
        range: string
    comments:
      - 'Rosetta condition ExcludeGMSLA is not stated in LinkML: agreement -> masterAgreementElections
        -> islaGmsla is absent'
