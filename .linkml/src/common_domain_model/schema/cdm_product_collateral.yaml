enums:
  AlternativeToInterestAmountEnum:
    description: If there is an alternative to interest amounts, how is it specified?
    permissible_values:
      Standard:
        description: Interest amount is not transferred if transfer would create or increase a delivery
          amount.
      ActualAmountReceived:
        description: The standard calculation of the Interest Amount is replaced with the amount of interest
          the secured party actually receives in relation to the Cash collateral.
      TransferIfDeliveryAmountBelowMTA:
        description: Interest amount is not transferred if transfer would create or increase a delivery
          amount. (This is the 'Standard' provision). However, interest Amount will be transferred if
          Delivery Amount is below Minimum Transfer Amount.
      Other:
        description: An other alternative option outside these choices that can be described as an alternative
          provision.
  AverageTradingVolumeMethodologyEnum:
    description: Indicates the type of equity average trading volume (single) the highest amount on one
      exchange, or (consolidated) volumes across more than one exchange.
    permissible_values:
      Single:
        description: Single, the highest amount on one exchange.
      Consolidated:
        description: Consolidated volume across more than one exchange.
