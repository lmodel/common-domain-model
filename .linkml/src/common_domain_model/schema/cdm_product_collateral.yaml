  CollateralInterestHandlingEnum:
    description: How is collateral interest to be handled?
    permissible_values:
      Transfer:
        description: Transfer the interest each period
      Adjust:
        description: Adjust the collateral balance to include the interest amount
      Transfer_or_Adjust:
        description: Transfer the interest if it meets certain criteria, or otherwise adjust the collateral
          balance to reflect the interest amount
  CollateralMarginTypeEnum:
    description: The enumerated values to specify the type of margin for which a legal agreement is named.
    permissible_values:
      VariationMargin:
        description: Denotes a margin agreement that is identified for use with Variation Margin/VM.
      InitialMargin:
        description: Denotes a margin agreement that is identified for use with Initial Margin/IM.
  CollateralTypeEnum:
    description: Specifies the types of collateral that are accepted by the Lender
    permissible_values:
      Cash:
        description: Security Lending Trades against Cash collateral
      NonCash:
        description: Security Lending Trades against NonCash collateral
      CashPool:
        description: Security Lending Trades against CashPool collateral
  ConcentrationLimitTypeEnum:
    description: Represents the enumerated values to identify where a concentration limit is applied in
      the eligible collateral schedule.
    permissible_values:
      Asset:
        description: Specifies a limit on a single asset in the eligible collateral schedule
      BaseCurrencyEquivalent:
        description: Specifies a limit on all cash valued in the base currency of the eligible collateral
          schedule.
      Issuer:
        description: Specifies a limit on a single issuer in the eligible collateral schedule.
      PrimaryExchange:
        description: Specifies a limit on a single exchange in the eligible collateral schedule.
      IndustrySector:
        description: Specifies a limit on a single industry sector in the eligible collateral schedule.
      UltimateParentInstitution:
        description: Specifies a limit on a single issuer in the eligible collateral schedule at the ultimate
          parent institution level.
      IssueOutstandingAmount:
        description: Specifies a limit of the issue compared to the outstanding amount of the asset on
          the market.
      MarketCapitalisation:
        description: Specifies a limit of the issue calculated as a percentage of the market capitalisation
          of the asset on the market.
      OutstandingBalance:
        description: Specifies a limit on the total outstanding balance for an asset in the portfolio.
  CreditSupportAgreementTypeEnum:
    description: The enumerated values to specify the type of Credit Support Agreement governing the transaction.
    permissible_values:
      CreditSupportDeed:
        description: A Credit Support Deed legal agreement.
      CreditSupportAnnex:
        description: A Credit Support Annex legal agreement.
        annotations:
          doc_reference: AcadiaSoft AM_1_0 namingConvention CSA
      CollateralTransferAgreement:
        description: A Collateral Transfer Agreement
  DeliveryAmountElectionEnum:
    description: The enumerated values to specify the application of Interest Amount with respect to the
      Delivery Amount through standard language.
    permissible_values:
      LastLocalBusinessDay:
        description: The delivery only includes `Transfer on last Local Business Day.
      LastAndAnyLocalBusinessDay:
        description: The delivery includes both `Transfer on last Local Business Day` and `Transfer a
          Delivery Amount (IM) consisting of cash on any Local Business Day.`
  RatingPriorityResolutionEnum:
    description: Represents an enumeration list to identify which Collateral Criteria type should have
      priority over others. If set to 'Issuer', the rating in the Issuer Criteria has priority or is used
      if there is no Asset criteria. If set to 'Asset', the rating in the Asset Criteria has priority
      or is used if there is no Issuer rating.
    permissible_values:
      Issuer:
        description: Denotes that the Issuer Criteria has priority.
      Asset:
        description: Denotes that the Asset Criteria has priority.
      Lowest:
        description: Denotes that lowest rating should be used if several criteria apply.
      Highest:
        description: Denotes that highest rating should be used if several criteria apply.
      Average:
        description: Denotes that average rating should be used if several criteria apply.
classes:
  AgencyRatingCriteria:
    description: Represents a class to specify a credit notation.
    attributes:
      creditNotation:
        description: Indicates the agency rating criteria specified for the asset or issuer.
        range: CreditNotation
        required: true
      mismatchResolution:
        description: Indicator for options to be used if several agency ratings (>1) are specified and
          its necessary to identify specific charateristics. i.e (lowest or highest).
        range: CreditNotationMismatchResolutionEnum
      referenceAgency:
        description: identifies the dominant reference agency if there is a missmatch and several reference
          agencies exsist.
        range: CreditRatingAgencyEnum
      boundary:
        description: Indicates the boundary of a credit agency rating i.e minimum or maximum.
        range: CreditNotationBoundaryEnum
    rules:
      - description: 'ReferenceAgency: If the mismatch resolution is ReferenceAgency, ensure that the
          reference agency is specified.'
        preconditions:
          slot_conditions:
            mismatchResolution:
              equals_string: ReferenceAgency
        postconditions:
          slot_conditions:
            referenceAgency:
              value_presence: PRESENT
  AllCriteria:
    description: Used to combine two or more Collateral Criteria using AND logic.
    attributes:
      allCriteria:
        range: CollateralCriteria
        required: true
        multivalued: true
        minimum_cardinality: 2
  AnyCriteria:
    description: Used to combine two or more Collateral Criteria using OR logic.
    attributes:
      anyCriteria:
        range: CollateralCriteria
        required: true
        multivalued: true
        minimum_cardinality: 2
  AssetAgencyRating:
    attributes:
      assetAgencyRating:
        description: Represents an agency rating based on default risk and creditors claim in event of
          default associated with specific instrument.
        range: AgencyRatingCriteria
        required: true
  AssetCountryOfOrigin:
    attributes:
      assetCountryOfOrigin:
        description: Represents a filter on the asset country of origin based on the ISO Standard 3166.
        range: ISOCountryCodeEnum
        required: true
  AssetMaturity:
    attributes:
      maturityType:
        description: Specifies whether the maturity range is the remaining or original maturity.
        range: MaturityTypeEnum
        required: true
      maturityRange:
        description: Represents a filter based on the underlying asset maturity.
        range: PeriodRange
        required: true
  AverageTradingVolume:
    description: Represents the average trading volume of an Equity product upon an exchange or set of
      exchanges.
    attributes:
      period:
        description: Represents the period of the equities average trading volume on the exchange/s.
        range: Period
        required: true
      methodology:
        description: Indicates the type of equity average trading volume being stated (single) the highest
          amount on one exchange, or (consolidated) volumes across multiple exchanges.
        range: AverageTradingVolumeMethodologyEnum
        required: true
  CheckEligibilityResult:
    description: Result for the CheckEligibilityByDetails and CheckEligibilityForProduct functions
    attributes:
      isEligible:
        description: a simple boolean which is set to true if the asset described in the EligibilityQuery
          input is eligible
        range: boolean
        required: true
      matchingEligibleCriteria:
        description: if there was a match, this will be the one or more criteria that were supplied in
          the EligbilityCollateralSpecification which matched with the query input
        range: EligibleCollateralCriteria
        multivalued: true
      eligibilityQuery:
        description: a copy of the input query that was checked against the eligible collateral specification
        range: EligibilityQuery
        required: true
      specification:
        description: a copy of the input EligbilityCollateralSpecification that was checked against the
          query
        range: EligibleCollateralSpecification
        required: true
  Collateral:
    description: A type for defining the obligations of the counterparty subject to credit support requirements.
    attributes:
      independentAmount:
        description: 'Independent Amount is an amount that usually less creditworthy counterparties are
          asked to provide. It can either be a fixed amount or a percentage of the Transaction''s value.
          The Independent Amount can be: (i) transferred before any trading between the parties occurs
          (as a deposit at a third party''s account or with the counterparty) or (ii) callable after trading
          has occurred (typically because a downgrade has occurred). In situation (i), the Independent
          Amount is not included in the calculation of Exposure, but in situation (ii), it is included
          in the calculation of Exposure. Thus, for situation (ii), the Independent Amount may be transferred
          along with any collateral call. Independent Amount is a defined term in the ISDA Credit Support
          Annex. (''with respect to a party, the amount specified as such for that party in Paragraph
          13; if no amount is specified, zero'').'
        range: IndependentAmount
      portfolioIdentifier:
        description: A list of identifiers pointing to the collateral portfolios which contain the collateral
          which covers a trade.
        range: Identifier
        multivalued: true
      collateralPortfolio:
        description: 'The collateral portfolios which contain the collateral which covers a trade. (NB:
          this can be provided by reference to a global key for each CollateralPortfolio object)'
        range: CollateralPortfolio
        multivalued: true
        annotations:
          rosetta_metadata: reference
      collateralProvisions:
        description: specifies the collateral provisions of the product.
        range: CollateralProvisions
    all_of:
      - description: 'CollateralExists: Collateral must represent either a simple independent amount or
          full collateral portfolio.'
        any_of:
          - slot_conditions:
              independentAmount:
                value_presence: PRESENT
          - slot_conditions:
              collateralPortfolio:
                value_presence: PRESENT
      - description: Collateralchoice
        exactly_one_of:
          - slot_conditions:
              independentAmount:
                value_presence: PRESENT
          - slot_conditions:
              portfolioIdentifier:
                value_presence: PRESENT
          - slot_conditions:
              collateralPortfolio:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  independentAmount:
                    value_presence: ABSENT
              - slot_conditions:
                  portfolioIdentifier:
                    value_presence: ABSENT
              - slot_conditions:
                  collateralPortfolio:
                    value_presence: ABSENT
    rules:
      - description: 'CollateralProvisions: When a collateral portfolio is provided, collateral provisions
          must exists that govern this collateral.'
        preconditions:
          slot_conditions:
            collateralPortfolio:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            collateralProvisions:
              value_presence: PRESENT
    annotations:
      rosetta_metadata: key
  CollateralAgreementFloatingRate:
    is_a: FloatingRateBase
    description: Represents the parameters needed to calculate the floating rate paid on collateral holdings.
    attributes:
      negativeInterest:
        description: Specifies how negative rates should be applied. If rates go negative, should the
          payment be reversed (true) or zeroed out (false)?
        range: boolean
        required: true
      compressibleSpread:
        description: Specifies how spreads should be applied in a low/negative rate environment. If true,
          spread is applied only if rate is positive.
        range: boolean
        required: true
  CollateralCriteria:
    description: The possible different terms that can be combined, using AND, OR and NOT logic, to define
      the issuers and/or assets that meet a given criteria for collateral.
    attributes:
      AllCriteria:
        description: Enables two or more Collateral Criteria to be combined using AND logic.
        range: AllCriteria
      AnyCriteria:
        description: Enables two or more Collateral Criteria to be combined using OR logic.
        range: AnyCriteria
      NegativeCriteria:
        description: Enables a single Collateral Criteria to be excluded using NOT logic.
        range: NegativeCriteria
      CollateralIssuerType:
        description: Criteria is the type of entity issuing the asset.
        range: CollateralIssuerType
      CollateralGuarantorType:
        description: Criteria is the type of entity guaranteeing the asset.
        range: CollateralGuarantorType
      AssetType:
        description: Criteria is the asset type of the collateral.
        range: AssetType
      IssuerCountryOfOrigin:
        description: Criteria is the issuing entity country of origin.
        range: IssuerCountryOfOrigin
      AssetCountryOfOrigin:
        description: Criteria is the collateral asset country of origin.
        range: AssetCountryOfOrigin
      CurrencyCodeEnum:
        description: Criteria is the denominated currency of the collateral.
        range: CurrencyCodeEnum
      IssuerName:
        description: Criteria is a specific named issuer entity.
        range: IssuerName
      IssuerAgencyRating:
        description: Criteria is the agency rating(s) of the issuer.
        range: IssuerAgencyRating
      SovereignAgencyRating:
        description: Criteria is the agency rating(s) of the country of the issuer.
        range: SovereignAgencyRating
      AssetAgencyRating:
        description: Criteria is the agency rating(s) of the collateral asset.
        range: AssetAgencyRating
      AssetMaturity:
        description: Criteria is the maturity characteristics of the collateral asset.
        range: AssetMaturity
      AssetIdentifier:
        description: Criteria is a specifically identified asset.
        range: AssetIdentifier
      CollateralTaxonomy:
        description: Criteria is the taxonomy characteristics of an collateral.
        range: CollateralTaxonomy
      ListingExchange:
        description: Criteria is that the collateral is listed on a specific exchange.
        range: ListingExchange
      ListingSector:
        description: Criteria is the industry sector of the collateral asset.
        range: ListingSector
      IndexType:
        description: Criteria is that the collateral is a constituent of a specific index.
        range: IndexType
      CounterpartyOwnIssuePermitted:
        description: Criteria includes collateral issued by the counterparty.
        range: CounterpartyOwnIssuePermitted
      DomesticCurrencyIssued:
        description: Criteria is that collateral must be denominated in the domestic currency of the issuer.
        range: DomesticCurrencyIssued
    all_of:
      - description: 'OneOf: A choice type holds exactly one of its options.'
        exactly_one_of:
          - slot_conditions:
              AllCriteria:
                value_presence: PRESENT
          - slot_conditions:
              AnyCriteria:
                value_presence: PRESENT
          - slot_conditions:
              NegativeCriteria:
                value_presence: PRESENT
          - slot_conditions:
              CollateralIssuerType:
                value_presence: PRESENT
          - slot_conditions:
              CollateralGuarantorType:
                value_presence: PRESENT
          - slot_conditions:
              AssetType:
                value_presence: PRESENT
          - slot_conditions:
              IssuerCountryOfOrigin:
                value_presence: PRESENT
          - slot_conditions:
              AssetCountryOfOrigin:
                value_presence: PRESENT
          - slot_conditions:
              CurrencyCodeEnum:
                value_presence: PRESENT
          - slot_conditions:
              IssuerName:
                value_presence: PRESENT
          - slot_conditions:
              IssuerAgencyRating:
                value_presence: PRESENT
          - slot_conditions:
              SovereignAgencyRating:
                value_presence: PRESENT
          - slot_conditions:
              AssetAgencyRating:
                value_presence: PRESENT
          - slot_conditions:
              AssetMaturity:
                value_presence: PRESENT
          - slot_conditions:
              AssetIdentifier:
                value_presence: PRESENT
          - slot_conditions:
              CollateralTaxonomy:
                value_presence: PRESENT
          - slot_conditions:
              ListingExchange:
                value_presence: PRESENT
          - slot_conditions:
              ListingSector:
                value_presence: PRESENT
          - slot_conditions:
              IndexType:
                value_presence: PRESENT
          - slot_conditions:
              CounterpartyOwnIssuePermitted:
                value_presence: PRESENT
          - slot_conditions:
              DomesticCurrencyIssued:
                value_presence: PRESENT
    annotations:
      rosetta_choice: 'true'
  CollateralCriteriaBase:
    description: Represents a set of criteria used to specify and describe collateral.
    attributes:
      collateralCriteria:
        description: The specific criteria that applies. It can be created using AND, OR and NOT logic,
          and both asset and issuer characteristics.
        range: CollateralCriteria
      appliesTo:
        description: Specifies which of the two counterparties the criteria applies to (either one or
          both counterparties). This attribute is optional, in case the applicable party is already specified
          elsewhere within a party election.
        range: CounterpartyRoleEnum
        multivalued: true
        maximum_cardinality: 2
      restrictTo:
        description: Restrict the criteria to only apply to a specific type of margin, ie IM or VM.
        range: CollateralMarginTypeEnum
      ratingPriorityResolution:
        description: Denotes which Criteria has priority if more than one agency rating applies.
        range: RatingPriorityResolutionEnum
  CollateralInterestCalculationParameters:
    description: Represents parameters for calculating the amount the floating interest calculation, e.g.
      for a single currency or defaults for all currencies.
    attributes:
      fixedRate:
        description: Specifies the applicable fixed rate if used.
        range: decimal
      floatingRate:
        description: Specifies the floating interest rate to be used.
        range: CollateralAgreementFloatingRate
      inBaseCurrency:
        description: If True, specifies that the interest transfers should be converted to base currency
          equivalent, or if False specifies that the transfer should be in the currency of the collateral.
        range: boolean
        required: true
      compoundingType:
        description: Specifies the type of compounding to be applied (None, Business, Calendar).
        range: CompoundingTypeEnum
      compoundingBusinessCenter:
        description: Specifies the applicable business centers for compounding.
        range: BusinessCenter
        multivalued: true
      dayCountFraction:
        description: Specifies the day count fraction to use for that currency.
        range: DayCountFractionEnum
        required: true
      rounding:
        description: Specifies the rounding rules for settling in that currency.
        range: Rounding
      roundingFrequency:
        description: Specifies when/how often is rounding applied?
        range: RoundingFrequencyEnum
      withholdingTaxRate:
        description: Specifies the withholding tax rate if a withholding tax is applicable.
        range: decimal
    all_of:
      - description: InterestRate
        exactly_one_of:
          - slot_conditions:
              fixedRate:
                value_presence: PRESENT
          - slot_conditions:
              floatingRate:
                value_presence: PRESENT
      - description: DCF
        any_of:
          - slot_conditions:
              dayCountFraction:
                equals_string: ACT/360
          - slot_conditions:
              dayCountFraction:
                equals_string: ACT/365.FIXED
    rules:
      - description: CompoundingBC1
        preconditions:
          slot_conditions:
            compoundingType:
              equals_string: Business
        postconditions:
          slot_conditions:
            compoundingBusinessCenter:
              value_presence: PRESENT
    comments:
      - 'Rosetta condition CompoundingBC2 is not stated in LinkML: if compoundingType <> CompoundingTypeEnum
        -> Business then compoundingBusinessCenter is absent'
  CollateralInterestHandlingParameters:
    description: Represents parameters that describe how calculated interest amounts are handled, i.e.
      are they transferred/distributed, or is the collateral balance adjusted, is netting done, and any
      other special handling.
    attributes:
      interestPaymentHandling:
        description: Specifies how the collateral interest is to be handled.
        range: CollateralInterestHandlingEnum
        required: true
      paymentBusinessCenter:
        description: Specifies applicable business centers for payments.
        range: BusinessCenter
        multivalued: true
      netPostedAndHeldInterest:
        description: Indicates whether to net Held and Posted Interest Payments (i.e. whether interest
          payable for a period can be netted with interest receivable).
        range: boolean
        required: true
      netInterestWithMarginCalls:
        description: Indicates whether the interest amount may be offset against any margin call deliver
          or return amounts? (aka 'net payments' indicator).
        range: boolean
        required: true
      includeAccrualInMarginCalc:
        description: Indicates whether or not to include the open interest accrual in the margin calculation.
        range: boolean
        required: true
      accrueInterestOnUnsettledInterest:
        description: Indicates whether interest accruing on unsettled interest amount is included (continues
          to be accrued) in the following period.
        range: boolean
      onFullReturn:
        description: Indicates the option that accrued interest should be calculated and distributed when
          a full return of collateral occurs.
        range: boolean
        required: true
      onPartialReturn:
        description: Indicates the option that accrued interest should be calculated and distributed when
          a partial return collateral occurs.
        range: boolean
        required: true
      interestAmountApplication:
        description: The application of Interest Amount with respect to the Delivery Amount and the Return
          Amount.
        range: InterestAmountApplication
      interestRolloverLimit:
        description: Specifies the level below which the interest will be rolled over.
        range: NumberBound
      writeoffLimit:
        description: Specifies the level below which the interest will be written off; if omitted write-off
          is not applicable.
        range: NumberBound
      alternativeToInterestAmount:
        description: Specifies the alternative to interest amounts.
        range: AlternativeToInterestAmountEnum
      alternativeProvision:
        description: Specifies an alternative to interest amount, when the alternative provision clause
          is specified.
        range: string
      cutoffTime:
        description: Specifies the time of day that interest needs to be confirmed by.
        range: time
      notification:
        description: Specifies the terms describing notification requirements.
        range: CollateralInterestNotification
    rules:
      - description: Alternative
        preconditions:
          slot_conditions:
            alternativeToInterestAmount:
              equals_string: Other
        postconditions:
          slot_conditions:
            alternativeProvision:
              value_presence: PRESENT
    comments:
      - 'Rosetta condition Alternative2 is not stated in LinkML: if alternativeToInterestAmount <> AlternativeToInterestAmountEnum
        -> Other then alternativeProvision is absent'
  CollateralInterestNotification:
    description: Represents the parameters describing when notifications should be made for required collateral
      interest transfers.
    attributes:
      trigger:
        description: Specifies what triggers notification (should be enum) Interest Statement Frequency,
          Period End Date.
        range: string
        required: true
      offset:
        description: Specifies the number of days before (negative) or after (positive) the trigger event.
        range: decimal
        required: true
      notificationTime:
        description: Specifies the time of day that the notification should occur.
        range: time
        required: true
      notificationDayType:
        description: The type of days on which notification should occur.
        range: DayTypeEnum
        required: true
  CollateralInterestParameters:
    description: Represents the floating interest calculation and distribution parameters for a single
      currency.
    attributes:
      postingParty:
        description: Represents the party to which these parameters apply (the applicable party). In other
          words, if the parameters are different depending on which party is posting/holding the collateral,
          for which party to the Collateral Agreement (Party 1 or Party 2) that is posting the collateral
          do these parameters apply?
        range: CounterpartyRoleEnum
      marginType:
        description: Specifies the type of margin for which interest is being calculated, if the parameters
          are different depending on type of margin (initial or variation).
        range: CollateralMarginTypeEnum
      currency:
        description: Specifies the currency for which the parameters are captured.
        range: string
      interestCalculationParameters:
        description: Represents the basic interest calculation parameters.
        range: CollateralInterestCalculationParameters
      interestCalculationFrequency:
        description: Represents how often and when interest is calculated.
        range: CalculationFrequency
      interestHandlingParameters:
        description: Represents the parameters describing how and when interest transfer occurs.
        range: CollateralInterestHandlingParameters
  CollateralProvisions:
    description: Contains collateral attributes which can also inherit information from a GMRA
    attributes:
      collateralType:
        description: Enumerates the collateral types which are accepted by the Seller.
        range: CollateralTypeEnum
        required: true
        annotations:
          doc_reference: ICMA GMRA namingConvention marginType
      eligibleCollateral:
        description: The eligible collateral as specified in relation to the transaction.
        range: EligibleCollateralCriteria
        multivalued: true
      substitutionProvisions:
        description: The provisions for collateral substitutions such as how many and when they are allowed.
        range: SubstitutionProvisions
  CollateralTreatment:
    description: Specifies the treatment terms for the eligible collateral criteria specified.
    attributes:
      valuationTreatment:
        description: Specification of the valuation treatment for the specified collateral.
        range: CollateralValuationTreatment
        annotations:
          doc_reference: ICMA GMRA namingConvention marginRatio
      concentrationLimit:
        description: Specification of concentration limits applicable to the collateral criteria.
        range: ConcentrationLimit
        multivalued: true
      isIncluded:
        description: A boolean attribute to specify whether collateral critieria are inclusion (True)
          or exclusion (False) criteria.
        range: boolean
        required: true
  CollateralValuationTreatment:
    description: Specification of the valuation treatment for the specified collateral.
    attributes:
      haircutPercentage:
        description: Specifies a haircut percentage to be applied to the value of asset and used as a
          discount factor to the value of the collateral asset,expressed as a percentage in decimal terms.
          As an example a 0.5% haircut would be represented as a decimal number 0.005.
        range: decimal
        annotations:
          doc_reference: ICMA GMRA namingConvention Haircut | ICMA ERCCBestPractice namingConvention Haircut
      marginPercentage:
        description: Specifies a percentage value of transaction needing to be posted as collateral expressed
          as a valuation. As an example a 104% requirement would be represented as a decimal number 1.04.
        range: decimal
        annotations:
          doc_reference: ICMA GMRA namingConvention Margin Ratio | ICMA ERCCBestPractice namingConvention
            Margin Ratio
      fxHaircutPercentage:
        description: Specifies an FX haircut applied to a specific asset which is agreed between the parties
          (for example, if pledgor eligible collateral is not denominated in the termination currency
          or under other specified cases in collateral support documents both for initial margin and variation
          margin).The percentage value is expressed as the discount haircut to the value of the collateral-
          as an example an 8% FX haircut would be expressed as 0.08.
        range: decimal
      additionalHaircutPercentage:
        description: Specifies a percentage value of any additional haircut to be applied to a collateral
          asset,the percentage value is expressed as the discount haircut to the value of the collateral-
          as an example a 5% haircut would be expressed as 0.05.
        range: decimal
    all_of:
      - description: 'HaircutPercentageOrMarginPercentage: Choice rule requiring that either a haircut
          percentage or margin percentage is specified.'
        exactly_one_of:
          - slot_conditions:
              haircutPercentage:
                value_presence: PRESENT
          - slot_conditions:
              marginPercentage:
                value_presence: PRESENT
    rules:
      - description: 'MarginPercentage: A data rule to validate that if a Margin Percentage is specified
          it should be greater than 1.'
        preconditions:
          slot_conditions:
            marginPercentage:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            marginPercentage:
              minimum_value: 1
    comments:
      - 'Rosetta condition HaircutPercentage is not stated in LinkML: if haircutPercentage exists then
        haircutPercentage >= 0 and haircutPercentage < 1'
      - 'Rosetta condition FxHaircutPercentage is not stated in LinkML: if fxHaircutPercentage exists
        then fxHaircutPercentage > 0 and fxHaircutPercentage < 1'
      - 'Rosetta condition AdditionalHaircutPercentage is not stated in LinkML: if additionalHaircutPercentage
        exists then additionalHaircutPercentage > 0 and additionalHaircutPercentage < 1'
  ConcentrationLimit:
    description: Represents a class to describe concentration limits that may be applicable to eligible
      collateral criteria.
    attributes:
      concentrationLimitCriteria:
        description: Specifies a set of criteria to describe the assets that the concentration limits
          apply to.
        range: ConcentrationLimitCriteria
      valueLimit:
        description: Specifies the value of collateral limit represented as a range.
        range: MoneyRange
      percentageLimit:
        description: Specifies the perecentage of collateral limit represented as a decimal number - example
          25% is 0.25.
        range: NumberRange
    all_of:
      - description: 'ConcentrationLimitValueChoice: Either a value or percentage concentration limit
          must be specified.'
        exactly_one_of:
          - slot_conditions:
              valueLimit:
                value_presence: PRESENT
          - slot_conditions:
              percentageLimit:
                value_presence: PRESENT
    comments:
      - 'Rosetta condition PercentageConcentrationLimit is not stated in LinkML: if concentrationLimitCriteria
        -> concentrationLimitType = ConcentrationLimitTypeEnum -> MarketCapitalisation then percentageLimit
        exists'
  ConcentrationLimitCriteria:
    is_a: CollateralCriteriaBase
    description: Respresents a class to describe a set of criteria to describe specific assets that the
      concentration limits apply to.
    attributes:
      concentrationLimitType:
        description: Specifies the type of concentration limit to be applied.
        range: ConcentrationLimitTypeEnum
      averageTradingVolume:
        description: Specifies an average trading volume on an exchange in relation to Equity products.
        range: AverageTradingVolume
    all_of:
      - description: 'ConcentrationLimitTypeChoice: Either a limit type or limit criteria must be specified.'
        exactly_one_of:
          - slot_conditions:
              concentrationLimitType:
                value_presence: PRESENT
          - slot_conditions:
              averageTradingVolume:
                value_presence: PRESENT
          - slot_conditions:
              collateralCriteria:
                value_presence: PRESENT
  CounterpartyOwnIssuePermitted:
    attributes:
      counterpartyOwnIssuePermitted:
        description: Represents a filter based on whether it is permitted for the underlying asset to
          be issued by the posting entity or part of their corporate family.
        range: boolean
        required: true
  DeliveryAmount:
    description: A class to specify the application of Interest Amount with respect the Delivery Amount.
    attributes:
      standardElection:
        description: The standard election as specified by an enumeration.
        range: DeliveryAmountElectionEnum
      customElection:
        description: The custom election that might be specified by the parties to the agreement.
        range: string
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              standardElection:
                value_presence: PRESENT
          - slot_conditions:
              customElection:
                value_presence: PRESENT
  DistributionAndInterestPayment:
    description: A class to specify the Distributions and Interest Payment provisions applicable to the
      collateral agreement.
    attributes:
      interestParameters:
        description: Represents the interest parameters for the various currencies, margin types, posting
          parties.
        range: CollateralInterestParameters
        multivalued: true
  DomesticCurrencyIssued:
    attributes:
      domesticCurrencyIssued:
        description: Identifies that the Security must be denominated in the domestic currency of the
          issuer.
        range: boolean
        required: true
  EligibilityQuery:
    description: Query to check against an EligibleCollateralSpecification
    attributes:
      maturity:
        description: Maturity in years
        range: decimal
        required: true
      collateralAssetType:
        description: The asset product type.
        range: AssetType
        required: true
      assetCountryOfOrigin:
        description: The asset country of origin.
        range: ISOCountryCodeEnum
        required: true
      denominatedCurrency:
        description: The underlying asset denominated currency.
        range: CurrencyCodeEnum
        required: true
      agencyRating:
        description: The agency rating based on default risk and creditors claim in event of default associated
          with specific instrument.
        range: AgencyRatingCriteria
        required: true
      issuerType:
        description: Represents a filter based on the type of entity issuing the asset.
        range: CollateralIssuerType
        required: true
      issuerName:
        description: Specifies the issuing entity name or LEI.
        range: LegalEntity
        required: true
  EligibleCollateralCriteria:
    is_a: CollateralCriteriaBase
    description: Represents a set of criteria used to specify eligible collateral.
    attributes:
      treatment:
        description: Identifies the treatment of specified collateral, e.g., haircuts,holding limits or
          exclusions.
        range: CollateralTreatment
        required: true
    slot_usage:
      collateralCriteria:
        description: The specific criteria in an Eligible Collateral Schedule. This is a mandatory attribute
          of an ECS so an override is required to enforce the cardinality.
        range: CollateralCriteria
        required: true
    comments:
      - 'Rosetta condition ConcentrationLimitTypeIssueOSAmountDebtOnly is not stated in LinkML: if treatment
        -> concentrationLimit -> concentrationLimitCriteria -> concentrationLimitType only-element = ConcentrationLimitTypeEnum
        -> IssueOutstandingAmount then CriteriaMatchesSecurityType (collateralCriteria, Debt) or (treatment
        -> concentrationLimit extract CriteriaMatchesSecurityType (item -> concentrationLimitCriteria
        -> collateralCriteria, Debt)) all = True'
      - 'Rosetta condition ConcentrationLimitTypeMarketCapEquityOnly is not stated in LinkML: if treatment
        -> concentrationLimit -> concentrationLimitCriteria -> concentrationLimitType only-element = ConcentrationLimitTypeEnum
        -> MarketCapitalisation then CriteriaMatchesSecurityType (collateralCriteria, Equity) or (treatment
        -> concentrationLimit extract CriteriaMatchesSecurityType (item -> concentrationLimitCriteria
        -> collateralCriteria, Equity)) all = True'
      - 'Rosetta condition AverageTradingVolumeEquityOnly is not stated in LinkML: if treatment -> concentrationLimit
        -> concentrationLimitCriteria -> averageTradingVolume exists then CriteriaMatchesSecurityType
        (collateralCriteria, Equity) or (treatment -> concentrationLimit extract CriteriaMatchesSecurityType
        (item -> concentrationLimitCriteria -> collateralCriteria, Equity)) all = True'
  EligibleCollateralSpecification:
    description: Represents a set of criteria used to specify eligible collateral.
    attributes:
      identifier:
        description: Specifies the identifier(s) to uniquely identify eligible collateral or a set of
          eligible collateral, such as a schedule or equivalant for an identity issuer.
        range: Identifier
        multivalued: true
      party:
        description: The parties associated with the specification.
        range: Party
        multivalued: true
        maximum_cardinality: 2
      counterparty:
        description: Specification of the roles of the counterparties to the specification.
        range: Counterparty
        multivalued: true
        maximum_cardinality: 2
      criteria:
        description: Represents a set of criteria used to specify eligible collateral.
        range: EligibleCollateralCriteria
        required: true
        multivalued: true
      partyRole:
        description: Specifies the role(s) that each of the party(s) is playing in the context of the
          specification, eg Payor or Receiver.
        range: PartyRole
        multivalued: true
    annotations:
      rosetta_root_type: 'true'
      rosetta_metadata: key
  IndependentAmount:
    is_a: PartyReferencePayerReceiver
    description: A class specifying the Independent Amount as the combination of a payer/receiver, a payment
      amount, a payment date and an associated payment calculation rule.
    attributes:
      paymentDetail:
        description: An attribute that specifies a payment as the combination of a payment amount, a payment
          date and an associated payment calculation rule.
        range: PaymentDetail
        required: true
        multivalued: true
  IndexType:
    description: Specification of an index.
    attributes:
      equityIndex:
        description: An enumerated list for equity indices.
        range: CollateralEquityIndexEnum
  InterestAmountApplication:
    description: A class to specify the application of Interest Amount with respect to the Delivery Amount
      and the Return Amount.
    attributes:
      returnAmount:
        description: The application of Interest Amount with respect the Return Amount.
        range: ReturnAmount
        required: true
      deliveryAmount:
        description: The application of Interest Amount with respect the Delivery Amount.
        range: DeliveryAmount
        required: true
  IssuerAgencyRating:
    attributes:
      issuerAgencyRating:
        description: Represents an agency rating based on default risk and creditors claim in event of
          default associated with asset issuer.
        range: AgencyRatingCriteria
        required: true
  IssuerCountryOfOrigin:
    attributes:
      issuerCountryOfOrigin:
        description: Represents a filter on the issuing entity country of origin based on the ISO Standard
          3166, which is the same as filtering by eligible Sovereigns.
        range: ISOCountryCodeEnum
        required: true
  IssuerName:
    attributes:
      issuerName:
        description: Specifies the issuing entity name or LEI.
        range: LegalEntity
        required: true
  ListingExchange:
    description: Specifies a filter based on a stock exchange.
    attributes:
      exchange:
        description: Represents a filter based on the Primary Stock Exchange facilitating the listing
          of companies, exchange of Stocks, Exchange traded Derivatives, Bonds, and other Securities expressed
          in ISO standard 10383.
        range: string
        required: true
        multivalued: true
        annotations:
          rosetta_metadata: scheme
  ListingSector:
    description: Specifies a filter based on an industry sector.
    attributes:
      sector:
        description: Represents a filter based on an industry sector defined under a system for classifying
          industry types such as Global Industry Classification Standard (GICS) and North American Industry
          Classification System (NAICS)
        range: string
        required: true
        multivalued: true
        annotations:
          rosetta_metadata: scheme
  NegativeCriteria:
    description: Used to apply a NOT logic condition to a single Collateral Criteria.
    attributes:
      negativeCriteria:
        range: CollateralCriteria
        required: true
  ReturnAmount:
    description: A class to specify the application of Interest Amount with respect the Return Amount.
    attributes:
      includesDefaultLanguage:
        description: Default language is included when True, and excluded when False.
        range: boolean
      customElection:
        description: Custom election that might be specified by the parties to the agreement.
        range: string
    comments:
      - 'Rosetta condition CustomElection is not stated in LinkML: if customElection exists then includesDefaultLanguage
        = False'
  SovereignAgencyRating:
    attributes:
      sovereignAgencyRating:
        description: Represents an agency rating based on default risk of the country of the issuer.
        range: AgencyRatingCriteria
        required: true
  SubstitutionProvisions:
    description: Defines collateral substitution provisions such as how many and with how much notice
      are substitutions allowed.
    attributes:
      numberOfSubstitutionsAllowed:
        description: Specifies if 1 or more substitutions are allowed.
        range: integer
      noticeDeadlinePeriod:
        description: Defines the min period for notify of a substitution.
        range: Period
      noticeDeadlineDateTime:
        description: A specific date and time for the notice deadline
        range: datetime
