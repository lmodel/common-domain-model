    attributes:
      calculationAgentTerms:
        description: Details of the party calculating the value of collateral to be delivered or returned.
        range: CalculationAgentTerms
      bespokeCalculationDate:
        description: The specification of bespoke Calculation Date terms for the purposes of Initial or
          Variation Margin by the parties to the agreement.
        range: BespokeCalculationDate
      bespokeCalculationTime:
        description: Bespoke terms to describe the time as of which such party (or the Calculation Agent
          (IM) (if applicale)) computes its end of day valuations of derivatives transactions.
        range: BespokeCalculationTime
      calculationDateLocation:
        description: The specified location where the credit exposure will be calculated by the respective
          parties.
        range: ValuationCalculationDateLocation
      cashSettlementDay:
        range: string
        annotations:
          doc_reference: ISDA CSA_IM_Japanese_2016 paragraph 4 clause (b)(i)
      securitiesSettlementDay:
        range: string
        annotations:
          doc_reference: ISDA CSA_IM_Japanese_2016 paragraph 12
  CalculationAndTimingInitialMargin:
    is_a: CalculationAndTimingBase
    description: Specification of the Calculation, Valuation and Timing terms specific to the Initial
      Margin Credit Support Annex.
    attributes:
      calculationAgentTerms:
        description: Details of the party calculating the value of collateral to be delivered or returned.
        range: CalculationAgentTerms
        required: true
      bespokeCalculationDate:
        description: The specification of bespoke Calculation Date terms for the purposes of Initial or
          Variation Margin by the parties to the agreement.
        range: BespokeCalculationDate
      bespokeCalculationTime:
        description: Bespoke terms to describe the time as of which such party (or the Calculation Agent
          (IM) (if applicale)) computes its end of day valuations of derivatives transactions.
        range: BespokeCalculationTime
      calculationDateLocation:
        description: The specified location where the credit exposure will be calculated by the respective
          parties.
        range: ValuationCalculationDateLocation
        required: true
      cashSettlementDay:
        range: string
        annotations:
          doc_reference: ISDA CSA_IM_Japanese_2016 paragraph 4 clause (b)(i)
      securitiesSettlementDay:
        range: string
        annotations:
          doc_reference: ISDA CSA_IM_Japanese_2016 paragraph 12
  CalculationAndTimingLegacy:
    is_a: CalculationAndTimingBase
    description: Specification of the Calculation, Valuation and Timing terms specific to the Legacy (1994/95)
      Credit Support Annex.
    attributes:
      valuationDate:
        description: Details of the days on which calculations are to be made to determine the Delivery
          Amount and/or Return Amount.
        range: CSAValuationDate
        required: true
      valuationTime:
        description: Specifies the time on which the value of collateral or exposure are calculated in
          accordance with the agreement.
        range: ValuationTime
        required: true
      valuationAgent:
        description: Details of the party calculating the value of collateral to be delivered or returned.
        range: ValuationAgent
        required: true
  CalculationAndTimingVariationMargin:
    is_a: CalculationAndTimingBase
    description: Specification of the Calculation, Valuation and Timing terms specific to the Variation
      Margin Credit Support Annex.
    attributes:
      valuationDate:
        description: Details of the days on which calculations are to be made to determine the Delivery
          Amount and/or Return Amount.
        range: CSAValuationDate
        required: true
      valuationTime:
        description: Specifies the time on which the value of collateral or exposure are calculated in
          accordance with the agreement.
        range: ValuationTime
        required: true
      valuationAgent:
        description: Details of the party valuating the collateral to be delivered or returned.
        range: ValuationAgent
        required: true
      valuationDateLocation:
        description: The specified location where the credit exposure will be calculated by the respective
          parties.
        range: ValuationCalculationDateLocation
        required: true
  CalculationCurrencyElection:
    description: A class to specify the ISDA SIMM Calculation Currency.
    attributes:
      party:
        description: The party which the SIMM Calculation Currency qualification applies to.
        range: CounterpartyRoleEnum
        required: true
      isBaseCurrency:
        description: The SIMM Calculation Currency (also known as SIMM Reporting Currency) means the Base
          Currency when True. It means a different currency when False. In that latter case, the SIMM
          Calculation Currency is specified as part of the currency attribute.
        range: boolean
        required: true
      currency:
        description: The currency in which the ISDA SIMM Calculation is denominated, when different from
          the Base Currency. The list of valid currencies is not presently positioned as an enumeration
          as part of the CDM because that scope is limited to the values specified by ISDA and FpML. As
          a result, implementers have to make reference to the relevant standard, such as the ISO 4217
          standard for currency codes.
        range: string
        annotations:
          rosetta_metadata: scheme
    annotations:
      doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (ee)(3
    comments:
      - 'Rosetta condition BaseCurrency is not stated in LinkML: if isBaseCurrency = True then currency
        is absent else currency exists'
  CollateralAccessBreach:
    description: A class to specify Collateral Access Breach language.
    attributes:
      isApplicable:
        description: Collateral Access Breach terms are applicable when True and not applicable when False.
        range: boolean
        required: true
      cabEndDateElection:
        description: Determination of whether the Collateral Access Breach end date is a number of days
          (True) or specified (False).
        range: boolean
      cabEndDate:
        description: The business days following the related Collateral Access Breach when the additional
          terms end.
        range: decimal
      cabEndDateTerms:
        description: Specific terms for when Collateral Access Breach terms end.
        range: string
    comments:
      - 'Rosetta condition CabEndDateTerms is not stated in LinkML: if cabEndDateElection = True then
        cabEndDateTerms is absent'
  CollateralManagementAgreement:
    description: A class to specify the Collateral Management Agreement election.
    attributes:
      partyElection:
        description: The parties' Collateral Management Agreement election.
        range: CollateralManagementAgreementElection
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
    annotations:
      doc_reference: ISDA CSA_IM_Japanese_2016 paragraph 13 General Principles clause (b)(i) name Collateral
        Management Agreement
  CollateralManagementAgreementElection:
    description: A class to specify the Collateral Management Agreement election.
    attributes:
      party:
        description: The elective party.
        range: CounterpartyRoleEnum
        required: true
      collateralManagementAgreement:
        description: The designated Collateral Management Agreement with respect to the elective party
          as the Obligee.
        range: string
        required: true
    annotations:
      doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (b(i) name Collateral Management
        Agreement
  CollateralRounding:
    description: A class to specify the rounding methodology applicable to the Delivery Amount and the
      Return Amount.
    attributes:
      deliveryAmount:
        description: The nearest integral multiple of Base Currency units to which the Delivery Amount
          will be rounded in accordance with the specified rounding direction.
        range: decimal
        required: true
      deliveryDirection:
        description: The rounding rule applicable to the Delivery Amount (which can be (i) up to nearest;
          (ii) down to nearest).
        range: RoundingModeEnum
        required: true
      returnAmount:
        description: The nearest integral multiple of Base Currency units to which the Return Amount will
          be rounded in accordance with the specified rounding direction.
        range: decimal
        required: true
      returnDirection:
        description: The rounding rule applicable to the Return Amount (which can be (i) up to nearest;
          (ii) down to nearest).
        range: RoundingModeEnum
        required: true
      currency:
        description: The currency in which the Delivery Amount and Return Amount rounding amounts are
          specified.
        range: ISOCurrencyCodeEnum
        required: true
      other:
        description: Utilised where the clause data structure is not able to capture a material aspect
          of the clause.
        range: string
    annotations:
      doc_reference: ISDA CSD_IM_English_2016 paragraph 13 General Principles clause (c)(vi)( C ) name
        Rounding | ISDA CSA_IM_Japanese_2016 paragraph 13 General Principles clause (d)(vi)( C ) name
        Rounding | ISDA CSA_IM_NewYork_2016 paragraph 13 General Principles clause (c)(vi)( C ) name Rounding
  CollateralTransferAgreementElections:
    description: The set of elections which specify a Collateral Transfer Agreement.
    attributes:
      regime:
        description: The Regime Table provision , which determines the regulatory regime(s) applicable
          to each of the parties to the agreement.
        range: Regime
        required: true
      oneWayProvisions:
        description: The determination of whether the One Way Provisions are applicable (true) or not
          applicable (false).
        range: OneWayProvisions
        required: true
      generalSimmElections:
        description: The specification of the ISDA SIMM Method for all Covered Transactions with respect
          to all Regimes.
        range: GeneralSimmElections
      identifiedCrossCurrencySwap:
        description: The qualification of whether cross-currency swaps need to be identified in the Confirmation
          so that the obligations to exchange principal be disregarded for the purpose of determining
          the Delivery Amount or Return Amount.
        range: boolean
      sensitivityMethodologies:
        description: The specification of methodologies to compute sensitivities specific to the agreement.
        range: SensitivityMethodologies
        required: true
      fxHaircutCurrency:
        description: The reference currency for the purpose of specifying the FX Haircut relating to a
          posting obligation, as being either the Termination Currency or an FX Designated Currency.
        range: FxHaircutCurrency
      postingObligations:
        description: The security providers posting obligations.
        range: PostingObligations
        required: true
      substitutedRegime:
        description: The specification of Additional regimes for purposes of determining whether a Regulatory
          Event has occurred.
        range: SubstitutedRegime
        required: true
      baseAndEligibleCurrency:
        description: The base and eligible currency(ies) for the document as specified by the parties
          to the agreement.
        range: BaseAndEligibleCurrency
        required: true
      creditSupportObligations:
        description: The Credit Support Obligations applicable to the agreement.
        range: CreditSupportObligationsCollateralTransferAgreement
        required: true
      calculationAndTiming:
        description: The set of elections for determining Valuation and Timing terms specific to the agreement.
        range: CalculationAndTimingCollateralTransferAgreement
        required: true
      conditionsPrecedent:
        description: The set of elections that may overwrite the default Condition Precedent provision,
          and the set of provisions that are deemed Access Condition.
        range: ConditionsPrecedent
      substitution:
        description: The conditions under which the Security Provider can substitute posted collateral.
        range: Substitution
      disputeResolution:
        description: The election terms under which a party disputes (i) the Calculation Agents calculation
          of a Delivery Amount or a Return Amount, or (ii) the Value of any Transfer of Eligible Credit
          Support or Posted Credit Support.
        range: DisputeResolution
        required: true
      rightsEvents:
        description: The bespoke provisions that might be specified by the parties to the agreement to
          specify the rights of Security Taker and/or Security Provider when an Early Termination or Access
          Condition event has occurred.
        range: RightsEvents
      custodyArrangements:
        description: The Custodian and Segregated Account details in respect of each party to the agreement.
        range: CustodyArrangements
      additionalRepresentations:
        description: The specification Additional Representations that may be applicable to the agreement.
        range: AdditionalRepresentations
      demandsAndNotices:
        description: The optional specification of address where the demands, specifications and notices
          will be communicated to for each of the parties to the agreement.
        range: DemandsAndNotices
      addressesForTransfer:
