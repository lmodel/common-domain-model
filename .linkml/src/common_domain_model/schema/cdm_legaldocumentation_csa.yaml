      - 'Rosetta condition Applicable is not stated in LinkML: if isApplicable = True then partyElection
        count = 2'
  FrenchLawAddendumElection:
    description: A class to specify party specific French Law Addendum language.
    attributes:
      party:
        description: The elective party.
        range: CounterpartyRoleEnum
        required: true
      isApplicable:
        description: The qualification of whether the party elects specific language.
        range: boolean
        required: true
      addendumLanguage:
        description: The party specific language to be included in the agreement.
        range: string
    comments:
      - 'Rosetta condition AddendumLanguage is not stated in LinkML: if isApplicable = True then addendumLanguage
        exists else if isApplicable = False then addendumLanguage is absent'
  FxHaircutCurrency:
    description: A class to specify the reference currency for the purpose of specifying the FX Haircut
      relating to a posting obligation, as being either the Termination Currency or an FX Designated Currency.
    attributes:
      isTerminationCurrency:
        description: The reference currency for the purpose of specifying the FX Haircut relating to a
          posting obligation is the Termination Currency when the Boolean value is set to True.
        range: boolean
        required: true
      fxDesignatedCurrency:
        description: When specified, the reference currency for the purpose of specifying the FX Haircut
          relating to a posting obligation. The list of valid currencies is not presently positioned as
          an enumeration as part of the CDM because that scope is limited to the values specified by ISDA
          and FpML. As a result, implementers have to make reference to the relevant standard, such as
          the ISO 4217 standard for currency codes.
        range: string
        annotations:
          rosetta_metadata: scheme
    comments:
      - 'Rosetta condition TerminationCurrency is not stated in LinkML: if isTerminationCurrency = True
        then fxDesignatedCurrency is absent'
      - 'Rosetta condition FxDesignatedCurrency is not stated in LinkML: if isTerminationCurrency = False
        then fxDesignatedCurrency exists'
  GeneralSimmElections:
    description: A class to specify the ISDA SIMM as the Method for all Covered Transactions with respect
      to all Regimes.
    attributes:
      simmVersion:
        description: The qualification of the ISDA SIMM version that is specified for all Covered Transactions.
        range: SimmVersion
        annotations:
          doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (ee)(1)
      simmCalculationCurrency:
        description: The SIMM Calculation Currency, as specified for each of the parties to the CSA Initial
          Margin.
        range: SimmCalculationCurrency
        required: true
        annotations:
          doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (ee)(3)
    annotations:
      doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (ee)
  HoldingAndUsingPostedCollateral:
    description: Specifies the conditions that need to be satisfied before the Secured Party or Custodian
      acting on its behalf can hold and use posted collateral.
    attributes:
      partyElection:
        description: The parties' elections for the holding and using of posted collateral.
