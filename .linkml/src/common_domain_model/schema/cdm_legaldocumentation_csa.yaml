        required: true
        multivalued: true
      currency:
        description: Specifies the currency applicable to the relevant Independent Amount.
        range: string
        annotations:
          rosetta_metadata: scheme
    rules:
      - description: 'From IndependentAmountRatings. RestrictCompare: Restricts allowable values pertaining
          to how multiple credit ratings are compared when determining the applicable Independent Amount.'
        preconditions:
          slot_conditions:
            compare:
              value_presence: PRESENT
        postconditions:
          any_of:
            - slot_conditions:
                compare:
                  equals_string: Compare
            - slot_conditions:
                compare:
                  equals_string: Lowest
            - slot_conditions:
                compare:
                  equals_string: Highest
      - description: 'From IndependentAmountRatings. NamedAffiliate: Ensures Named Affiliate is provided
          where the Rated Party is Named Affiliate.'
        preconditions:
          slot_conditions:
            ratedParty:
              equals_string: NamedAffiliate
        postconditions:
          slot_conditions:
            namedAffiliate:
              value_presence: PRESENT
        elseconditions:
          slot_conditions:
            namedAffiliate:
              value_presence: ABSENT
      - description: 'From IndependentAmountRatings. NamedEntity: Ensures Named Entity is provided where
          the Rated Party is Named Entity.'
        preconditions:
          slot_conditions:
            ratedParty:
              equals_string: NamedEntity
        postconditions:
          slot_conditions:
            namedEntity:
              value_presence: PRESENT
        elseconditions:
          slot_conditions:
            namedEntity:
              value_presence: ABSENT
      - description: 'RestrictCompare: Restricts allowable values pertaining to how multiple credit ratings
          are compared when determining the applicable Independent Amount.'
        preconditions:
          slot_conditions:
            compare:
              value_presence: PRESENT
        postconditions:
          any_of:
            - slot_conditions:
                compare:
                  equals_string: Lowest
            - slot_conditions:
                compare:
                  equals_string: Highest
  LegacyIndependentAmountRatingsXExposure:
    is_a: IndependentAmountRatings
    description: Specifies that the Independent Amount is determined using both credit rating and exposure
      metrics.
    attributes:
      highestLowestVariableSet:
        description: A logical container to hold a defined set of related data. In this case the collation
          of Ratings Information and associated exposure multiplier where highest or lowest of the associated
          credit ratings are used when determining the applicable Independent Amount.
        range: RatingMultiplier
        multivalued: true
      compareVariableSet:
        description: A logical container to hold a defined set of related data. In this case the collation
          of Ratings Information and associated exposure multiplier where multiple credit ratings are
          compared when determining the applicable Independent Amount.
        range: DirectionRatingMultiplier
        multivalued: true
    rules:
      - description: 'From IndependentAmountRatings. RestrictCompare: Restricts allowable values pertaining
          to how multiple credit ratings are compared when determining the applicable Independent Amount.'
        preconditions:
          slot_conditions:
            compare:
              value_presence: PRESENT
        postconditions:
          any_of:
            - slot_conditions:
                compare:
                  equals_string: Compare
            - slot_conditions:
                compare:
                  equals_string: Lowest
            - slot_conditions:
                compare:
                  equals_string: Highest
      - description: 'From IndependentAmountRatings. NamedAffiliate: Ensures Named Affiliate is provided
          where the Rated Party is Named Affiliate.'
        preconditions:
          slot_conditions:
            ratedParty:
              equals_string: NamedAffiliate
        postconditions:
          slot_conditions:
            namedAffiliate:
              value_presence: PRESENT
        elseconditions:
          slot_conditions:
            namedAffiliate:
              value_presence: ABSENT
      - description: 'From IndependentAmountRatings. NamedEntity: Ensures Named Entity is provided where
          the Rated Party is Named Entity.'
        preconditions:
          slot_conditions:
            ratedParty:
              equals_string: NamedEntity
        postconditions:
          slot_conditions:
            namedEntity:
              value_presence: PRESENT
        elseconditions:
          slot_conditions:
            namedEntity:
              value_presence: ABSENT
      - description: 'CompareIA: Ensures the appropriate variable set is populated based on how the Ratings
          are compared.'
        preconditions:
          slot_conditions:
            compare:
              equals_string: Compare
        postconditions:
          slot_conditions:
            compareVariableSet:
              value_presence: PRESENT
            highestLowestVariableSet:
              value_presence: ABSENT
      - description: 'LowestIA: Ensures the appropriate variable set is populated based on how the Ratings
          are compared.'
        preconditions:
          slot_conditions:
            compare:
              equals_string: Lowest
        postconditions:
          slot_conditions:
            highestLowestVariableSet:
              value_presence: PRESENT
            compareVariableSet:
              value_presence: ABSENT
      - description: 'HighestIA: Ensures the appropriate variable set is populated based on how the Ratings
          are compared.'
        preconditions:
          slot_conditions:
            compare:
              equals_string: Highest
        postconditions:
          slot_conditions:
            highestLowestVariableSet:
              value_presence: PRESENT
            compareVariableSet:
              value_presence: ABSENT
  LegacyResolutionAlternative:
