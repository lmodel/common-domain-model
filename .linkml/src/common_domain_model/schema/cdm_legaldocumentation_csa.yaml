        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
      additionalLanguage:
        description: The additional language that might be specified by the parties to the legal agreement.
        range: string
    annotations:
      doc_reference: ISDA CSA_VM_2016 paragraph 13 clause  (h) name Holding and Using Posted Collateral
        (VM) | ISDA CSA_NewYork_1994 paragraph 13 clause (g) | ISDA CSD_English_1995 paragraph 13 clause
        (h)
  HoldingAndUsingPostedCollateralElection:
    description: Specifies the parties' elections related to the holding and using of posted collateral.
    attributes:
      party:
        description: The party to which the elections apply.
        range: CounterpartyRoleEnum
        required: true
      eligibilityToHoldCollateral:
        description: The specification of the conditions under which a party and its custodian(s) are
          entitled to hold posted collateral.
        range: EligibilityToHoldCollateral
        required: true
      useOfPostedCollateral:
        description: Indicates whether the party has the right to reuse, rehypothecate, or otherwise make
          use of the posted collateral. 'True' if the party has the right,'False' if the party does not
          have the right.
        range: boolean
        required: true
        annotations:
          doc_reference: ISDA CSA_VM_2016 paragraph 13 clause (h)(ii) name Use of Posted Collateral (VM)
            | ISDA CSA_NewYork_1994 paragraph 13 clause (g)(ii)
    annotations:
      doc_reference: ISDA CSA_VM_2016 paragraph 13 clause  (h) name Holding and Using Posted Collateral
        (VM) | ISDA CSA_NewYork_1994 paragraph 13 clause (g) | ISDA CSD_English_1995 paragraph 13 clause
        (h)
  IndependentAmountRatings:
    description: A logical container designed to hold a set of related data. In this case, designed to
      hold a set of information required when Independent Amount is determined using credit ratings.
    attributes:
      compare:
        description: Specifies how multiple credit ratings are compared when determining the applicable
          Independent Amount, and whether that measure is highest, lowest, or a comparison of either.
        range: IndependentAmountCompareEnum
        required: true
      ratedParty:
        description: Specifies the party to whom the rating agency rating applies to for the purposes
          of determining the Independent Amount.
        range: RatedPartyEnum
        required: true
      namedAffiliate:
        description: Details the Named Affiliate where the Rated Party is Named Affiliate.
        range: LegalEntity
      namedEntity:
        description: Details the Named Entity where the Rated Party is Named Entity.
        range: LegalEntity
      ratingType:
        description: The relevant rating type.
        range: RatingTypeEnum
        required: true
    rules:
      - description: 'RestrictCompare: Restricts allowable values pertaining to how multiple credit ratings
          are compared when determining the applicable Independent Amount.'
        preconditions:
          slot_conditions:
            compare:
              value_presence: PRESENT
        postconditions:
          any_of:
            - slot_conditions:
                compare:
                  equals_string: Compare
            - slot_conditions:
                compare:
                  equals_string: Lowest
            - slot_conditions:
                compare:
                  equals_string: Highest
      - description: 'NamedAffiliate: Ensures Named Affiliate is provided where the Rated Party is Named
          Affiliate.'
        preconditions:
          slot_conditions:
            ratedParty:
              equals_string: NamedAffiliate
        postconditions:
          slot_conditions:
            namedAffiliate:
              value_presence: PRESENT
        elseconditions:
          slot_conditions:
            namedAffiliate:
              value_presence: ABSENT
      - description: 'NamedEntity: Ensures Named Entity is provided where the Rated Party is Named Entity.'
        preconditions:
          slot_conditions:
            ratedParty:
              equals_string: NamedEntity
        postconditions:
          slot_conditions:
            namedEntity:
              value_presence: PRESENT
        elseconditions:
          slot_conditions:
            namedEntity:
              value_presence: ABSENT
  IneligibleCreditSupport:
    description: Identifies collateral that has been designated as not meeting the eligibility criteria
      set out in the agreement.
    attributes:
      totalIneligibilityDate:
        description: Specifies the date from which all credit support provided by a party is treated as
