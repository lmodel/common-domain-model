          doc_reference: ISDA CSA_IM_Japanese_2016 paragraph 13 General Principles clause (n)(ii)
    annotations:
      doc_reference: ISDA CSA_IM_Japanese_2016 paragraph 13 General Principles clause (n)(ii)
  JapaneseSecuritiesProvisions:
    description: A class to specify Japanese Securities Provision elections.
    attributes:
      isApplicable:
