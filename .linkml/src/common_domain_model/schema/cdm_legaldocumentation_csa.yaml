classes:
  AdditionalObligations:
    description: The election of party specific additional obligations applicable to the agreement.
    attributes:
      party:
        description: The party that the additional obligations apply to.
        range: CounterpartyRoleEnum
        required: true
      additionalObligations:
        description: The party specific additional obligations applicable to the agreement.
        range: string
        required: true
  AdditionalRepresentation:
    description: A class to specify the Additional Representation.
    attributes:
      partyElection:
        description: A qualification as to whether the Additional Representation is applicable.
        range: AdditionalRepresentationElection
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
      customElection:
        description: A supplemental custom election that might be specified by the parties for the purpose
          of specifying the Additional Representation.
        range: string
    annotations:
      doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (o) name Additional Representations(s)
  AdditionalRepresentationElection:
    description: A class to specify the parties' Additional Representation(s) election.
    attributes:
      party:
        description: The elective party.
        range: CounterpartyRoleEnum
        required: true
      isApplicable:
        description: The Additional Representation is applicable when True, and not applicable when False.
        range: boolean
        required: true
      additionalLanguage:
        description: Details of any Additional Representations given by the relevant parties in relation
          to the collateral arrangement.
        range: string
  AdditionalRepresentations:
    description: A class to specify Additional Representations that may be applicable to an agreement.
    attributes:
      additionalRepresentation:
        description: The specification of the Additional Representation that may be applicable to the
          agreement.
        range: AdditionalRepresentation
      regulatoryComplianceRepresentation:
        description: The qualification of whether Additional Information related to Regulatory Compliance
          and Concentration Limits is applicable or not.
        range: boolean
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              additionalRepresentation:
                value_presence: PRESENT
          - slot_conditions:
              regulatoryComplianceRepresentation:
                value_presence: PRESENT
  AdditionalRightsEvent:
    description: A class to specify the Pledgor/Obligor/Chargor Additional Rights Event election.
    attributes:
      isApplicable:
        description: The Pledgor Additional Rights Event election is applicable when True, and not applicable
          when False.
        range: boolean
        required: true
      qualification:
        description: The qualification of the Pledgor Additional Rights Event election, when specified.
        range: string
    annotations:
      doc_reference: ISDA CSD_IM_English_2016 paragraph 13 General Principles clause (k) name Chargor
        Additional Rights Event | ISDA CSA_IM_Japanese_2016 paragraph 13 General Principles clause (k)
        name Obligor Additional Rights Event | ISDA CSA_IM_NewYork_2016 paragraph 13 General Principles
        clause (k) name Pledgor Additional Rights Event
    comments:
      - 'Rosetta condition Qualification is not stated in LinkML: if qualification exists then isApplicable
        = True'
  AdditionalType:
    description: The specification of the Additional Type of transaction that can require the collection
      or delivery of initial margin under a given regulatory regime for the purposes of Covered Transactions.
    attributes:
      standardValue:
        description: The qualification of the Additional Type of transaction that can require the collection
          or delivery of initial margin when specified as a standard value.
        range: AdditionalTypeEnum
        required: true
      customValue:
        description: The qualification of the Additional Type of transaction that can require the collection
          or delivery of initial margin when specified as a custom value by the parties to the legal agreement.
        range: string
    rules:
      - description: 'CustomValue: The specification of a custom value by the parties to the legal agreement
          takes place alongside the qualification of the `Other` value as part of the AdditionalTypeEnum.'
        preconditions:
          slot_conditions:
            standardValue:
              equals_string: Other
        postconditions:
          slot_conditions:
            customValue:
              value_presence: PRESENT
    annotations:
      doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (b)(B)
    comments:
      - 'Rosetta condition StandardValue is not stated in LinkML: if standardValue <> AdditionalTypeEnum
        -> Other then customValue is absent'
  AddressesForTransfer:
    description: Specifies the address for transfer as specified by the respective parties to the agreement.
    attributes:
      partyElection:
        description: The parties' contact and transfer information election.
        range: TransferInformationElection
        required: true
        multivalued: true
        maximum_cardinality: 2
  AllDirectionRating:
    description: Used to combine two or more Ratings and associated direction using AND logic.
    attributes:
      allDirectionRating:
        range: DirectionRatingSet
        required: true
        multivalued: true
        minimum_cardinality: 2
  AllEligibilityToHoldCollateralCriteria:
    description: Used to combine two or more Criteria using AND logic.
    attributes:
      allCriteria:
        range: EligibilityToHoldCollateralCriteria
        required: true
        multivalued: true
        minimum_cardinality: 2
  AmendmentEffectiveDate:
    description: A class to specify the effective date of the Amendment to Termination Currency. This
      date can be specified as either an actual date, a specific date (e.g. the annex date) or as a custom
      provision.
    attributes:
      date:
        description: The effective date of the Amendment to Termination Currency when specified as an
          actual date.
        range: date
      specificDate:
        description: The effective date of the Amendment to Termination Currency when specified as relative
          to another date (e.g. the annex date).
        range: AmendmentEffectiveDateEnum
      customProvision:
        description: The effective date of the Amendment to Termination Currency when specified as a non
          normalized custom provision.
        range: string
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              date:
                value_presence: PRESENT
          - slot_conditions:
              specificDate:
                value_presence: PRESENT
          - slot_conditions:
              customProvision:
                value_presence: PRESENT
  AmountOfNetCapital:
    description: The amount of net capital.
    attributes:
      amountOfNetCapital:
        description: The amount of net capital.
        range: Money
  AnyDirectionRating:
    description: Used to combine two or more Ratings and associated direction using OR logic.
    attributes:
      anyDirectionRating:
        range: DirectionRatingSet
        required: true
        multivalued: true
        minimum_cardinality: 2
  AnyEligibilityToHoldCollateralCriteria:
    description: Used to combine two or more Criteria using OR logic.
    attributes:
      anyCriteria:
        range: EligibilityToHoldCollateralCriteria
        required: true
        multivalued: true
        minimum_cardinality: 2
  ApplicableRegime:
    description: A class to specify the applicable regulatory regime(s) that parties to a legal agreement,
      such as the ISDA 2016 and 2018 CSA for Initial Margin, might be subject to.
    attributes:
      regime:
        description: The applicable regulatory regime, as specified through an enumeration.
        range: RegulatoryRegimeEnum
      additionalRegime:
        description: The additional regulatory regime as specified by the parties.
        range: string
      regimeTerms:
        description: A class that is used by the ApplicableRegime and the AdditionalRegime classes to
          specify the terms that are specific to each party and regime which are referred to in the Regime
          Table as part of certain legal agreements, such as the ISDA 2016 and 2018 CSA for Initial Margin.
        range: RegimeTerms
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
      additionalType:
        range: AdditionalTypeEnum
        annotations:
          doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (b)(B)
      additionalTerms:
        description: The bespoke Additional Type for the purposes of Covered Transactions (IM).
        range: string
    all_of:
      - description: 'ApplicableRegimeChoice: The applicable regime should be specified either as an enumeration
          or as an additional regime specified by the parties.'
        exactly_one_of:
          - slot_conditions:
              regime:
                value_presence: PRESENT
          - slot_conditions:
              additionalRegime:
                value_presence: PRESENT
  AppropriatedCollateralValuation:
    description: A class to specify the Valuation of Appropriated Collateral.
    attributes:
      isSpecified:
        description: The qualification of whether the Valuation of Appropriate Collateral provision is
          applicable (True) or not applicable (False).
        range: boolean
        required: true
      election:
        description: The parties' election that qualify the Valuation of Appropriate Collateral in the
          case where it is deemed applicable.
        range: string
    annotations:
      doc_reference: ISDA CSD_IM_English_2016 paragraph 13 General Principles clause (u) name Valuation
        of Appropriated Collateral
    comments:
      - 'Rosetta condition Specified is not stated in LinkML: if isSpecified = True then election exists'
      - 'Rosetta condition NotSpecified is not stated in LinkML: if isSpecified = False then election
        is absent'
  BaseAndEligibleCurrency:
    description: The base and eligible currency(ies) for the document as specified by the parties to the
      agreement.
    attributes:
      baseCurrency:
        description: The common agreed currency into which relevant amounts of all collateral arrangements
          between the parties are converted, or if not an actual currency, the process through which this
          is determined. Where hardcoded (e.g. under the 1994 ISDA Credit Support Annex (Security Interest
          NY Law)), the currency that effectively performs this function.
        range: ISOCurrencyCodeEnum
        required: true
      baseCurrencyTerminationCurrency:
        description: A flag detailing whether the Base Currency is set to the Termination Currency as
          defined in the related Master Agreement.
        range: boolean
        required: true
      baseCurrencyOther:
        description: Utilised where the clause data structure is not able to capture a material aspect
          of the clause.
        range: string
        annotations:
          rosetta_metadata: scheme
      eligibleCurrency:
        description: A definition of a currency agreed by the parties, typically to indicate the currencies
          of eligible cash collateral.
        range: ISOCurrencyCodeEnum
        multivalued: true
      eligibleCurrencyInclBaseCurrency:
        description: A flag detailing whether the Base Currency is included as an Eligible Currency.
        range: boolean
        required: true
      eligibleCurrencyOther:
        description: Utilised where the clause data structure is not able to capture a material aspect
          of the clause.
        range: string
        annotations:
          rosetta_metadata: scheme
  BespokeCalculationDate:
    description: A class to specify bespoke Calculation Date terms for the purposes of Initial Margin.
    attributes:
      isApplicable:
        description: Additional Calculation Date terms are applicable when True and not applicable when
          False.
        range: boolean
        required: true
      calculationDateImTerms:
        description: The Additional Calculation Date terms for the purposes of Initial Margin.
        range: string
    comments:
      - 'Rosetta condition CalculationDateImTerms is not stated in LinkML: if isApplicable = False then
        calculationDateImTerms is absent'
  BespokeCalculationTime:
    description: A class to specify additional Calculation Time terms for the purposes of Initial Margin.
    attributes:
      asCalculationAgent:
        description: If set to True, the Calculation Time for Initial Margin is the time as of which the
          Calculation Agent (IM) computes its end of day valuations of derivatives transactions.
        range: boolean
        required: true
      bespokeCalculationTimeTerms:
        description: Additional Terms applicable to Calculation Time for Initial Margin.
        range: string
    comments:
      - 'Rosetta condition AsCalculationAgentIm is not stated in LinkML: if asCalculationAgent = True
        then bespokeCalculationTimeTerms is absent'
      - 'Rosetta condition BespokeCalculationTimeTerms is not stated in LinkML: if asCalculationAgent
        = False then bespokeCalculationTimeTerms exists'
  BespokeTransferTiming:
    description: A class to specify any bespoke Transfer Timing language by each party to the agreement.
    attributes:
      isApplicable:
        description: A boolean flag to specify whether bespoke transfer terms are applicable or not.
        range: boolean
        required: true
      bespokeTransferTimingTerms:
        description: The bespoke transfer timing terms applicable to the agreement.
        range: string
  CSADeliveryAmount:
    description: In respect of a Valuation Date, the amount of collateral which a party is entitled to
      demand to be transferred to it as a Delivery Amount.
    attributes:
      deliveryAmount:
        description: Specifies whether the meaning of Delivery Amount follows the pre-print definition
          or deviates from this (either based on a rating or some other methodology).
        range: DeliveryReturnAmountEnum
        required: true
      additionalLanguage:
        description: The additional language that might be specified by the parties to the legal agreement.
        range: string
  CSAIndependentAmount:
    description: Sets out the additional amount of collateral that is required to be delivered by that
      party irrespective of the mark-to-market exposure under the related Transactions. It may take the
      form of a fixed amount, or be determined using credit ratings.
    attributes:
      partyElection:
        description: The party specific elections for the Independent Amount clause.
        range: LegacyIndependentAmountParty
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
      additionalLanguage:
        description: The additional language that might be specified by the parties to the legal agreement.
        range: string
    annotations:
      doc_reference: ISDA CSA_NewYork_1994 paragraph 13 clause (b)(iv)(A) | ISDA CSA_English_1995 paragraph
        11 clause (b)(iii)(A) | ISDA CSD_English_1995 paragraph 11 clause (c)(iii)(A)
  CSAMinimumTransferAmountVariableSet:
    description: Defines a combination of Rating Agency, Rating Value, amount and Currency code.
    attributes:
      name:
        description: The name of the Rating Agency.
        range: CreditRatingAgencyEnum
      value:
        description: The value assigned to the rating.
        range: string
      amount:
        description: The Minimum Transfer Amount (MTA) applicable to the Rating.
        range: integer
      amountIsInfinity:
        description: A flag that defines the Minimum Transfer Amount (MTA) as Infinity.
        range: boolean
    rules:
      - description: 'NameMustExist: If we have a name then we must also have a value.'
        preconditions:
          slot_conditions:
            name:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            value:
              value_presence: PRESENT
      - description: 'ValueMustExist: If we have a value then we must also have a name.'
        preconditions:
          slot_conditions:
            value:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            name:
              value_presence: PRESENT
  CSAReturnAmount:
    description: In respect of a Valuation Date, the amount of collateral which a party is entitled to
      demand to be recalled to it as a Return Amount.
    attributes:
      returnAmount:
        description: Specifies whether the meaning of Return Amount follows the pre-print definition or
          deviates from this (either based on a rating or some other methodology).
        range: DeliveryReturnAmountEnum
        required: true
  CSAThresholdVariableSet:
    description: Defines a combination of Rating Agency, Rating Value, Threshold amount and Currency code.
    attributes:
      name:
        description: The relevant rating agency.
        range: CreditRatingAgencyEnum
      value:
        description: Rating applicable to the party from a given rating agency.
        range: string
      amount:
        description: The amount value applicable to the Threshold.
        range: integer
    rules:
      - description: 'NameMustExist: If we have a name then we must also have a value.'
        preconditions:
          slot_conditions:
            name:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            value:
              value_presence: PRESENT
      - description: 'ValueMustExist: If we have a value then we must also have a name.'
        preconditions:
          slot_conditions:
            value:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            name:
              value_presence: PRESENT
  CSAValuationDate:
    description: Specifies the date on which the value of collateral or exposure are calculated in accordance
      with the agreement.
    attributes:
      date:
        description: Defines whether a date is defined by a certain day of the week or a particular date
          in the month. If not specified here, then additional language must be used.
        range: ValuationDateDateEnum
      day:
        description: Specific day(s) or day of the week, if any, specified for Valuation Time.
        range: ValuationDateDayEnum
      calendarDay:
        description: Defines the day of the calendar if this is specified for in the ValuationDateDateEnum.
        range: decimal
      frequency:
        description: Defines the regularity of the date specified for the Valuation Date.
        range: ValuationDateFrequencyEnum
      additionalLanguage:
        description: The additional language that might be specified by the parties to the legal agreement.
        range: string
    rules:
      - description: 'CalendarDay: If a specific calendar day is specified, it must be defined.'
        preconditions:
          slot_conditions:
            date:
              equals_string: CalendarDay
        postconditions:
          slot_conditions:
            calendarDay:
              value_presence: PRESENT
        elseconditions:
          slot_conditions:
            calendarDay:
              value_presence: ABSENT
      - description: 'AdditionalLanguage: If no methodology is defined, additional language must be specified.'
        preconditions:
          any_of:
            - slot_conditions:
                date:
                  value_presence: ABSENT
            - slot_conditions:
                frequency:
                  value_presence: ABSENT
        postconditions:
          slot_conditions:
            additionalLanguage:
              value_presence: PRESENT
  CalculationAgentTerms:
    description: Details of the party calculating the value of collateral to be delivered or returned.
    attributes:
      party:
        description: The party which is specified as Calculation Agent for Initial Margin.
        range: CalculationValuationAgentPartyEnum
      bespokeCalculationAgentTerms:
        description: The Calculation Agent (IM) terms when specified.
        range: string
    all_of:
      - description: Unnamed condition (one-of)
        exactly_one_of:
          - slot_conditions:
              party:
                value_presence: PRESENT
          - slot_conditions:
              bespokeCalculationAgentTerms:
                value_presence: PRESENT
  CalculationAndTimingBase:
