          - slot_conditions:
              customMethodology:
                value_presence: PRESENT
    annotations:
      doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (gg)(2)
  SensitivityToEquity:
    description: Represents risk sensitivity calculated with respect to the value of an individual equity
      instrument.
    attributes:
      sensitivityToIndices:
        description: Represents risk sensitivity calculated with respect to the level of an equity or
          market index.
        range: SensitivityMethodology
        required: true
      sensitivityToFunds:
        description: Represents risk sensitivity calculated with respect to the value of a fund, such
          as a mutual fund or collective investment vehicle.
        range: SensitivityMethodology
        required: true
      sensitivityToETFs:
        description: Represents risk sensitivity calculated with respect to the value of an exchange-traded
          fund (ETF).
        range: SensitivityMethodology
        required: true
  SimmCalculationCurrency:
    description: A class to specify the SIMM Calculation Currency elections by each party to the agreement.
    attributes:
      partyElection:
        description: The parties' SIMM Calculation Currency election.
        range: CalculationCurrencyElection
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
  SimmException:
    description: A class to specify the SIMM exception to the regulatory regime clause.
    attributes:
      standardisedException:
        description: The Standard Initial Margin Model exception when specified by the party according
          to one of the enumerated values.
        range: ExceptionEnum
      simmExceptionApplicable:
        description: The Standard Initial Margin model exception approach applicable when specified by
          the party according to one of the enumerated values.
        range: SimmExceptionApplicableEnum
      asSpecified:
        description: The Standard Initial Margin Model exception when specified as a customized approach
          by the party.
        range: string
    annotations:
      doc_reference: 'ISDA CSA_IM_2016 paragraph 13 General Principles name Regime: SIMM Exception.'
  SimmVersion:
    description: A class to specify the ISDA SIMM version that applies to the ISDA 2018 CSA for Initial
      Margin.
    attributes:
      isSpecified:
        description: A boolean attribute to determine whether the SIMM version is specified for the purpose
          of the legal agreement.
        range: boolean
      partyVersion:
        description: The party which the specified SIMM version applies to.
        range: CounterpartyRoleEnum
      asSpecified:
        description: The SIMM version exception when specified as a customized approach by the party.
        range: string
    annotations:
      doc_reference: ISDA CSA_IM_2018 paragraph 13 General Principles clause (ee)(1)
    comments:
      - 'Rosetta condition VersionNotSpecified is not stated in LinkML: if isSpecified = False then partyVersion
        is absent'
      - 'Rosetta condition VersionSpecified is not stated in LinkML: if isSpecified = True then partyVersion
        exists'
  SinglePostingParty:
    description: Where only a single party is explicitly designated to post collateral, the party which
      is specified as the sole poster of collateral.
    attributes:
      party:
        description: The party acting as the Single Posting Party.
        range: CounterpartyRoleEnum
      other:
        description: Utilised where the clause data structure is not able to capture a material aspect
          of the clause.
        range: string
  SpecifiedConditionOrAccessCondition:
    description: Specifies the events elected by the parties that are deemed an Access Condition (for
      Initial Margin CSA) or a Specified Condition (for Variation Margin and Legacy CSA), which, if triggered,
      may temporarily or permanently suspend rights to rehypothecate, transfer, or substitute collateral.
    attributes:
      isApplicable:
        description: Indicates whether events that could temporarily or permanently suspend rights to
          rehypothecate, transfer or substitute collateral are applicable. If applicable,'True'. If not
          applicable,'False'.
        range: boolean
        required: true
      partyElection:
        description: The party specific elections.
        range: SpecifiedOrAccessConditionPartyElection
        multivalued: true
        maximum_cardinality: 2
      additionalLanguage:
        description: The additional language that might be specified by the parties to the legal agreement.
        range: string
    annotations:
      doc_reference: ISDA CSA_NewYork_1994 paragraph 13 clause (d) | ISDA CSD_English_1995 paragraph 13
        clause (e)
  SpecifiedOrAccessConditionPartyElection:
    description: The party specific elections in respect to the Specified Condition and Access Condition
      clause.
    attributes:
      party:
        description: Identifies the party making the election.
        range: CounterpartyRoleEnum
        required: true
      specifiedOrAccessCondition:
        description: Specifies events that may temporarily or permanently suspend a partys rights to rehypothecate,
          transfer, or substitute collateral.
        range: CSASpecifiedOrAccessConditionEnum
        multivalued: true
      additionalTerminationEvent:
        description: Specifies events that may lead to the early termination of the Master Agreement,
          including suspension of the affected party's rights to rehypothecate, transfer, or substitute
          collateral.
        range: AdditionalTerminationEventEnum
        multivalued: true
      specifiedAdditionalTerminationEvent:
        description: Specifies any bespoke Additional Termination Event(s) that are set out in the related
          Specified Condition clause.
        range: string
        multivalued: true
    comments:
      - 'Rosetta condition AdditionalTerminationEvent is not stated in LinkML: if specifiedOrAccessCondition
        any = CSASpecifiedOrAccessConditionEnum -> AdditionalTerminationEvents then additionalTerminationEvent
        exists else additionalTerminationEvent is absent'
      - 'Rosetta condition SpecifiedAdditionalTerminationEvent is not stated in LinkML: if additionalTerminationEvent
        any = AdditionalTerminationEventEnum -> AsSpecified then specifiedAdditionalTerminationEvent exists
        else specifiedAdditionalTerminationEvent is absent'
  SubstitutedRegime:
    description: Specification of substituted regime.
    attributes:
      partyElection:
        description: The parties' Substituted Regime election.
        range: SubstitutedRegimeElection
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
  SubstitutedRegimeElection:
    description: The parties' Substituted Regime election.
    attributes:
      party:
        description: The party for which the regime terms are being specified when acting as collateral
          taker.
        range: CounterpartyRoleEnum
        required: true
      isApplicable:
        description: The specification of whether substituted regime is elected as applicable to the party
          when acting as collateral taker.
        range: boolean
        required: true
      regime:
        description: The applicable regulatory regime(s), as specified through an enumeration.
        range: RegulatoryRegimeEnum
        multivalued: true
      additionalRegime:
        description: The additional regulatory regime(s) as specified by the parties.
        range: string
        multivalued: true
    comments:
      - 'Rosetta condition SubstitutedRegimeIsApplicable is not stated in LinkML: if isApplicable = True
        then regime exists or additionalRegime exists'
      - 'Rosetta condition SubstitutedRegimeIsNotApplicable is not stated in LinkML: if isApplicable =
        False then regime is absent and additionalRegime is absent'
  Substitution:
    description: A class to specify the conditions under which the Security Provider can substitute posted
      collateral. The details required for 'Legacy' agreements are substantially different to those required
      for newer agreements; where the agreement is a 1994 or 1995 CSA, or 1995 CSD, the legacyConsent
      attribute needs to be used which contains additional values beyond a simple true/false value.
    attributes:
      partyElection:
        description: Party specific elections for substitution of posted collateral.
        range: SubstitutionPartyElection
        multivalued: true
        maximum_cardinality: 2
  SubstitutionPartyElection:
    description: Party specific elections for substitution of posted collateral.
    attributes:
      party:
        description: The party that is acting as the Pledgor/Obligor/Chargor/Security Provider.
        range: CounterpartyRoleEnum
        required: true
      needsConsent:
        description: The election as to whether the Pledgor/Obligor/Chargor/Security Provider must obtain
          the Secured Partys consent for any collateral substitution.
        range: boolean
        required: true
        annotations:
          doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (f)(ii) name Consent
            | ISDA CSA_VM_2016 paragraph 13 clause (f)(ii) name Consent
      substitutionDateLanguage:
        description: Substitution Date has the meaning specified in Paragraph4(d)(ii), unless otherwise
          specified.
        range: string
      specificConsentLanguage:
        description: Specific consent language might be specified by the parties.
        range: string
      legacyConsent:
        description: The process for substituting/exchanging one form of collateral held by a party for
          a different form of collateral, used with legacy agreements.
        range: LegacyConsentEnum
  TerminationCurrencyAmendment:
    description: A class to specify the Amendment to Termination Currency elections by the parties to
      the agreement.
    attributes:
      isApplicable:
        description: The qualification of whether the Amendment to Termination Currency is deemed applicable
          by the parties (True) or not (False).
        range: boolean
        required: true
      effectiveDate:
        description: The effective date of the Amendment to Termination Currency. This date can be specified
          as either an actual date, a specific date (e.g. the annex date) or as a custom provision.
        range: AmendmentEffectiveDate
      partyElection:
        description: The parties' Amendment Currency election.
        range: TerminationCurrencyElection
        multivalued: true
        maximum_cardinality: 2
    annotations:
      doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (t) name Amendment to Termination
        Currency.
    comments:
      - 'Rosetta condition Applicability is not stated in LinkML: if isApplicable = False then effectiveDate
        is absent and partyElection is absent'
  TerminationCurrencyElection:
    description: A class to specify the Amendment to Termination Currency election by the parties to the
      agreement.
    attributes:
      party:
        description: The elective party.
        range: CounterpartyRoleEnum
        required: true
        multivalued: true
        maximum_cardinality: 2
      isSpecified:
        description: The qualification of whether the Termination Currency is specified in this document
          (True) or in an Eligible Support Credit Support (IM) Schedule (False).
        range: boolean
        required: true
      currency:
        description: The Termination Currency associated with the party that referenced as part of this
          class. The list of valid currencies is not presently positioned as an enumeration as part of
          the CDM because that scope is limited to the values specified by ISDA and FpML. As a result,
          implementers have to make reference to the relevant standard, such as the ISO 4217 standard
          for currency codes.
        range: string
        annotations:
          rosetta_metadata: scheme
    annotations:
      doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (t)(A) & (B)
    comments:
      - 'Rosetta condition CurrencyElection is not stated in LinkML: if isSpecified = False then currency
        is absent'
  Threshold:
    description: Represents the amount of unsecured risk that a party is willing to tolerate without holding
      any posted collateral provided by the other party.
    attributes:
      partyElection:
        description: The party specific election for the threshold clause.
        range: ThresholdElection
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
    annotations:
      doc_reference: ISDA CSA_NewYork_1994 name Threshold | ISDA CSA_English_1995 name Threshold | ISDA
        CSD_English_1995 name Threshold | ISDA CSA_VM_English_2016 name Threshold | ISDA CSA_VM_NewYork_2016
        name Threshold
  ThresholdElection:
    description: Specifies whether the threshold is rating based, a fixed amount, or infinity.
    attributes:
      party:
        description: The party to which the threshold applies.
        range: CounterpartyRoleEnum
        required: true
      fixedAmount:
        description: Defines that the Threshold is a Fixed Amount.
        range: ThresholdMinimumTransferAmountFixedAmount
      ratingsBased:
        description: Defines that the Threshold is based on a Ratings condition(s).
        range: ThresholdRatingsBased
      infinity:
        description: Specifies that the Threshold is Infinity. If 'True' then the threshold for the elective
          party is Infinity.
        range: boolean
      other:
        description: Utilised where the clause data structure is not able to capture a material aspect
          of the clause.
        range: string
    all_of:
      - description: 'ThresholdOneOf: Ensures that threshold is specified as one-of fixedAmount, ratingsBased,
          infinity, or other.'
        exactly_one_of:
          - slot_conditions:
              fixedAmount:
                value_presence: PRESENT
          - slot_conditions:
              ratingsBased:
                value_presence: PRESENT
          - slot_conditions:
              infinity:
                value_presence: PRESENT
          - slot_conditions:
              other:
                value_presence: PRESENT
  ThresholdMinimumTransferAmountBase:
    description: A logical container designed to hold a set of related data. In this case, designed to
      hold a set of information required to specify conditions under which Threshold or Minimum Transfer
      Amount can fall to zero.
    attributes:
      zeroEvent:
        description: Indicates whether a trigger applies for the Threshold or Minimum Transfer Amount
          to fall to zero. If 'True' then such a trigger exists.
        range: boolean
        required: true
      event:
        description: Specifies the relevant trigger for the Threshold or Minimum Transfer Amount to fall
          to zero.
        range: ZeroEventEnum
        multivalued: true
    comments:
      - 'Rosetta condition ZeroEvent is not stated in LinkML: if zeroEvent = True then event exists'
  ThresholdMinimumTransferAmountFixedAmount:
    is_a: ThresholdMinimumTransferAmountBase
    description: Defines the Threshold or the Minimum Transfer Amount (MTA) as a fixed amount.
    attributes:
      amount:
        description: Specifies the monetary value of the Threshold or the Minimum Transfer Amount (MTA)
          applicable to collateral transfer obligations.
        range: Money
        required: true
  ThresholdRatingsBased:
    is_a: ThresholdMinimumTransferAmountBase
    description: Defines that the Threshold is based on Ratings condition(s).
    attributes:
      currency:
        description: The threshold currency code.
        range: ISOCurrencyCodeEnum
        required: true
      ratingType:
        description: The relevant rating type.
        range: RatingTypeEnum
        required: true
      variableSet:
        description: Defines a combination of Rating Agency, Rating Value, Threshold amount and Currency
          code.
        range: CSAThresholdVariableSet
        multivalued: true
      ratedParty:
        description: The party to which a rating applies.
        range: RatedPartyEnum
      namedEntity:
        description: Details the Named Entity where the Rated Party is Named Entity.
        range: string
      namedAffiliate:
        description: Details the Named Affiliate where the Rated Party is Named Affiliate.
        range: string
      compare:
        description: Where two ratings are specified whether the higher or lower rating prevails.
        range: CreditNotationMismatchResolutionEnum
      noRating:
        description: What conditions apply where a party has no rating.
        range: boolean
        required: true
      notRatedBy:
        description: Defines where conditions apply if no Rating where ratings may not exist.
        range: NotRatedByEnum
      numberOfRatingAgencies:
        description: Defines the number of Rating Agencies that the Party must be rated by.
        range: NumberOfRatingAgenciesEnum
    rules:
      - description: 'NamedEntity: If the rated party is NamedEntity then the entity must be specified.'
        preconditions:
          slot_conditions:
            ratedParty:
              equals_string: NamedEntity
        postconditions:
          slot_conditions:
            namedEntity:
              value_presence: PRESENT
      - description: 'NamedAffiliate: If rated party is NamedAffilite then the affiliate must be specified.'
        preconditions:
          slot_conditions:
            ratedParty:
              equals_string: NamedAffiliate
        postconditions:
          slot_conditions:
            namedAffiliate:
              value_presence: PRESENT
  TransferSettlementTiming:
    description: Specification of transfer / settlement timing for cash and securities collateral assuming
      that the notice is provided before the Notification Time (and with a 1LBD lag introduced if the
      notice is delivered after the Notification Time), and that securities allow for a further Local
      Business Day for transfer / settlement.
    attributes:
      cashCollateralTransferSettlementTime:
        description: Details the day on which collateral is required to be transferred relative to the
          Notification Time.
        range: CashCTSTimeEnum
      securititesCollateralTransferSettlementTime:
        description: Details the day on which collateral is required to be transferred relative to the
          Notification Time.
        range: SecuritiesCTSTimeEnum
      additionalLanguage:
        description: The additional language that might be specified by the parties to the legal agreement.
        range: string
    rules:
      - description: 'OtherValues: Additional language is required when ''Other'' values are used.'
        preconditions:
          any_of:
            - slot_conditions:
                cashCollateralTransferSettlementTime:
                  equals_string: Other
            - slot_conditions:
                securititesCollateralTransferSettlementTime:
                  equals_string: Other
        postconditions:
          slot_conditions:
            additionalLanguage:
              value_presence: PRESENT
  ValuationAgent:
    description: Details of the party valuating the collateral to be delivered or returned.
    attributes:
      party:
        description: Specification of which party calculating the value of collateral to be delivered
          or returned.
        range: CalculationValuationAgentPartyEnum
      valuationAgent:
        description: Specifies how the Valuation Agent is determined.
        range: ValuationAgentDeterminationEnum
        multivalued: true
      additionalLanguage:
        description: The additional language that might be specified by the parties to the legal agreement.
        range: string
    rules:
      - description: 'AdditionalLanguage: If no party is defined, additional language must be used to
          specify the elective party.'
        preconditions:
          slot_conditions:
            party:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            additionalLanguage:
              value_presence: PRESENT
  ValuationCalculationDateLocation:
    description: Specification of the Calculation Date Location for the respective parties to the legal
      agreement.
    attributes:
      partyElection:
        description: The parties' calculation date location election.
        range: ValuationCalculationDateLocationElection
        required: true
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
    annotations:
      doc_reference: ISDA CSD_IM_English_2016 paragraph 13 General Principles clause (d)(i) name Calculation
        Date Location | ISDA CSA_IM_Japanese_2016 paragraph 13 General Principles clause (e)(i) name Calculation
        Date Location | ISDA CSA_IM_NewYork_2016 paragraph 13 General Principles clause (d)(i) name Calculation
        Date Location
  ValuationCalculationDateLocationElection:
    description: A class to specify each of the party elections with respect to the Calculation Date Location.
    attributes:
      party:
        description: The elective party.
        range: CounterpartyRoleEnum
        required: true
      businessCenter:
        description: The Calculation Date Location when specified as a business center which corresponds
          to the FpML list of business centers or can be mapped to it.
        range: BusinessCenter
        multivalued: true
        annotations:
          rosetta_metadata: scheme
      customLocation:
        description: The Calculation Date Location when specified as a location which doesn't correspond
          to the FpML list of business centers or cannot be mapped to it.
        range: string
        multivalued: true
    annotations:
      doc_reference: ISDA CSD_IM_English_2016 paragraph 13 General Principles clause (d)(i) name Calculation
        Date Location | ISDA CSA_IM_Japanese_2016 paragraph 13 General Principles clause (e)(i) name Calculation
        Date Location | ISDA CSA_IM_NewYork_2016 paragraph 13 General Principles clause (d)(i) name Calculation
        Date Location
  ValuationTime:
    description: Specifies the time by which the value of the collateral and obligations to transfer or
      return collateral are to be calculated relative to the Valuation Date.
    attributes:
      day:
        description: The day in respect of which the Valuation Time is being specified. If not specified,
          addional language must be used to define the methodology.
        range: ValuationTimeDayEnum
      location:
        description: The location relevant to the timezone for the Valuation Time.
        range: BusinessCenter
        multivalued: true
      time:
        description: The type of time specified for the Valuation Time.
        range: ValuationTimeEnum
      hourminutetime:
        description: A time specified in a 24-hour notation, e.g. 3pm would be represented as 15:00.
        range: time
      timezone:
        description: Any relevant time zone where specified.
        range: BusinessCenter
      additionalLanguage:
        description: The additional language that might be specified by the parties to the legal agreement.
        range: string
    rules:
      - description: 'AdditionalLanguage: If no Day valuation methodology is defined, additional language
          must be specified.'
        preconditions:
          slot_conditions:
            day:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            additionalLanguage:
              value_presence: PRESENT
    comments:
      - 'Rosetta condition DayAndTime is not stated in LinkML: if day exists then time exists else time
        is absent and item -> location is absent and hourminutetime is absent and timezone is absent'
