enums:
  AdditionalTerminationEventEnum:
    description: Specifies the types of events found in the related Master Agreement that may lead to
      the early termination of the Master Agreement, including suspension of the affected party's rights
      to rehypothecate, transfer, or substitute collateral.
    permissible_values:
      FailureToNotifyNAV:
        description: Specifies an event where a party fails to notify the other of a decline in Net Asset
          Value by a specified amount over a specified period of time.
      InvestmentAdvisor:
        description: Specifies an event where the investment advisor of a party ceases to act for the
          party.
      KeyPersons:
        description: Specifies an event where a person deemed important to a party has departed.
      NAVDeclineTrigger:
        description: Specifies an event in which a partys Net Asset Value (NAV) has declined beyond a
          specified percentage or amount within a defined time period.
      NAVFloor:
        description: Specifies an event in which a partys Net Asset Value (NAV) falls below a predetermined
          absolute value, regardless of the timeframe over which the decline occurs. This value sets a
          minimum acceptable NAV threshold expressed as either a percentage or amount.
      OperativeDocs:
        description: Specifies an event where a party delivers operative documents that are invalid, untrue
          or unenforceable.
      RatingsDowngradeOrWithdrawalParty1:
        description: Specifies an event where Party 1 experiences a downgrade beyond a predetermined level,
          or has their credit rating withdrawn or suspended.
      RatingsDowngradeOrWithdrawalParty2:
        description: Specifies an event where Party 2 experiences a downgrade beyond a predetermined level,
          or has their credit rating withdrawn or suspended.
      AsApplicable:
        description: Represents the Additional Termination Event(s) in the related Master Agreement.
      AsSpecified:
        description: Represents any bespoke Additional Termination Event(s) that are set out in the related
          Specified Condition clause.
  AdditionalTypeEnum:
    description: The enumerated values to specify the Additional Type of transaction that can require
      the collection or delivery of initial margin under a given regulatory regime for the purposes of
      Covered Transactions.
    permissible_values:
      NotApplicable:
        description: No Additional Type of transaction is applicable to the regulatory regulatory regime.
      EquityOptionOrIndexOption:
        description: Single stock equity option or index option transaction as referred to in the transitional
          provisions (if any) of the EMIR RTS.
      Other: {}
    annotations:
      doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (b)(B)
  AmendmentEffectiveDateEnum:
    description: The enumerated values to specify the effective date of the Amendment to Termination Currency
      when specified as a specific date (e.g. the annex date).
    permissible_values:
      AnnexDate:
        description: The effective date corresponds to the Annex date.
      DeedDate:
        description: The effective date corresponds to the Deed date.
      AgreementDate:
        description: The effective date corresponds to the Agreement date.
      AmendmentEffectiveDate:
        description: The effective date corresponds to the Amendment Effective Date (IM).
    annotations:
      doc_reference: ISDA CSA_IM_2016 paragraph 13 General Principles clause (t)
  CSASpecifiedOrAccessConditionEnum:
    description: Specifies the types of events in the related Master Agreement that, when triggered, could
      temporarily or permanently suspend rights to rehypothecate, transfer or substitute collateral.
    permissible_values:
      Illegality:
        description: Specifies an event where a party is unable to comply with its obligations under the
          Master Agreement because to do so would be unlawful.
      TaxEvent:
        description: Specifies an event where a party experiences changes in tax laws incurring further
          tax liability.
      TaxEventUponMerger:
        description: Specifies an event where a party incurs tax liability due to a merger.
      CreditEventUponMerger:
        description: Specifies an event where a party merges and the new entity becomes materially less
          creditworthy than the original.
      AdditionalTerminationEvents:
        description: Specifies events which could trigger rights to early termination.
      ForceMajeureEvent:
        description: Specifies an event beyond the control of one or both of the parties which prevents
          or renders it impossible to fulfill their obligations to the other party.
      PotentialTerminationEvents:
        description: Specifies a potential event that could trigger rights to early termination.
  CalculationValuationAgentPartyEnum:
    description: Specification of which party is calculating the value of collateral to be delivered or
      returned.
    permissible_values:
      Party 1:
        description: Party 1 will calculate the value of collateral to be delivered or returned.
        aliases:
          - Party1
      Party 2:
        description: Party 2 will calculate the value of collateral to be delivered or returned.
        aliases:
          - Party2
      Party Making the Demand:
        description: The party making the demand will calculate the value of collateral to be delivered
          or returned.
        aliases:
          - PartyMakingDemand
  CashCTSTimeEnum:
    description: Details the day on which cash collateral is required to be transferred relative to the
      Notification Time.
    permissible_values:
      Same:
        description: The cash collateral should be transferred on the same day.
      Next:
        description: The cash collateral should be transferred on the next day.
      First Local Business Day:
        description: The cash collateral should be transferred on the first local business day.
        aliases:
          - FirstLBD
      Second Local Business Day:
        description: The cash collateral should be transferred on the second local business day.
        aliases:
          - SecondLBD
      Other:
        description: Exception value.
