    description: A class to specify execution location terms of a Security Agreement.
    attributes:
      executionLocation:
        description: The execution location of the agreement.
        range: ExecutionLocationEnum
        required: true
      otherLanguage:
        description: Bespoke execution location language to be included when specified.
        range: string
      dutyPayer:
        description: The payer of documentary duty.
        range: string
      dutyPayerLanguage:
        description: Bespoke terms specific to the payment of documentary duty.
        range: string
      dutyPaymentDate:
        description: The date that documentary duty will be paid.
        range: date
      dutyPaymentLanguage:
        description: Bespoke terms specific to the date that documentary duty will be paid.
        range: string
    rules:
      - description: 'DutyPayerLanguage: A data rule to enforce that Duty Payer Language should only be
          specified when required.'
        preconditions:
          slot_conditions:
            dutyPayer:
              equals_string: Specify
        postconditions:
          slot_conditions:
            dutyPayerLanguage:
              value_presence: PRESENT
      - description: 'DutyPaymentLanguage: A data rule to enforce that Duty Payment Language should be
          absent when a Duty Payment date is provided.'
        preconditions:
          slot_conditions:
            dutyPaymentDate:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            dutyPaymentLanguage:
              value_presence: ABSENT
      - description: 'OtherLanguage: A data rule to enforce that bespoke execution language must be included
          if non-standard execution language is specified.'
        preconditions:
          slot_conditions:
            executionLocation:
              equals_string: OtherLocation
        postconditions:
          slot_conditions:
            otherLanguage:
              value_presence: PRESENT
  ExecutionTerms:
    description: A class to specify execution location and language of execution to determine duty to
      be paid.
