      Credit Support Documents in regards to Calculation, Valuation and Timing terms.
    attributes:
      notificationTime:
        description: The time by which a demand for the Transfer of Eligible Credit Support (IM) or Posted
          Credit Support (IM) needs to be made in order for the transfer to take place in accordance with
          the Transfer Timing provisions.
