---
id: https://w3id.org/lmodel/common-domain-model/cdm_observable_asset_fro
name: cdm_observable_asset_fro
title: CDM cdm.observable.asset.fro
description: Support for floating rate option definitions.
version: 8.0.0-dev.13
source: https://github.com/finos/common-domain-model/tree/8.0.0-dev.13
license: Apache-2.0
prefixes:
  common_domain_model: https://w3id.org/lmodel/common-domain-model/
  linkml: https://w3id.org/linkml/
default_prefix: common_domain_model
default_range: string
imports:
  - linkml:types
  - ./cdm_base_datetime
  - ./cdm_base_datetime_daycount
  - ./cdm_base_math
  - ./cdm_base_staticdata_asset_common
  - ./cdm_base_staticdata_asset_rates
  - ./cdm_base_staticdata_codelist
  - ./cdm_base_staticdata_identifier
  - ./cdm_legaldocumentation_common
enums:
  FloatingRateIndexCalculationMethodEnum:
    description: 3rd level ISDA FRO category.
    permissible_values:
      OIS Compounding:
        description: A calculation methodology using the ISDA-defined OIS compounding formula.
        aliases:
          - OISCompound
      Overnight Averaging:
        description: A calculation methodology using the arithmetic mean.
        aliases:
          - Average
      Compounded Index:
        aliases:
          - Compounded
      All-In Compounded Index:
        aliases:
          - AllInCompounded
  FloatingRateIndexCategoryEnum:
    description: Top level ISDA FRO category.
    permissible_values:
      Screen Rate:
        description: The rate is observed directly from a screen.
        aliases:
          - ScreenRate
      Calculated Rate:
        description: The rate is calculated by the calculation agents from multiple observations.
        aliases:
          - Calculated
      Reference Banks Rate:
        description: The rate is obtained by polling several other banks.
        aliases:
          - ReferenceBanks
  FloatingRateIndexPeriodObservationTypeEnum:
    description: Defines the observation pattern for a floating rate index period.
    permissible_values:
      Single:
        description: Single observation date pattern (e.g., term rate / screen rate).
      Multiple:
        description: Multiple observation dates pattern requiring a date range generation.
      CompoundedIndex:
        description: Compounded Index pattern requiring start and end dates.
  FloatingRateIndexStyleEnum:
    description: Second level ISDA FRO category.
    permissible_values:
      Average FRO:
        description: An ISDA-defined calculated rate done using arithmetic averaging.
        aliases:
          - AverageFRO
      Compounded FRO:
        description: An ISDA-defined calculated rate done using arithmetic averaging.
        aliases:
          - CompoundedFRO
      Compounded Index:
        description: A published index calculated using compounding.
        aliases:
          - CompoundedIndex
      Index:
        description: A published index using a methodology defined by the publisher, e.g. S&P 500.
      Other: {}
      Overnight Rate:
        aliases:
          - Overnight
      Published Average Rate:
        description: A published rate computed using an averaging methodology.
        aliases:
          - PublishedAverage
      Specified Formula:
        aliases:
          - SpecifiedFormula
      Swap Rate:
        description: A rate representing the market rate for swaps of a given maturity.
        aliases:
          - SwapRate
      Term Rate:
        description: A rate specified over a given term, such as a libor-type rate.
        aliases:
          - TermRate
classes:
  BusinessDayOffset:
    is_a: Period
    description: This allows an offset to be specified as, for instance, N business days, with a business
      centers specified as included.
    attributes:
      businessCenters:
        description: The business centers for the offset.
        range: BusinessCenters
      fixingOffsetDefinition:
        description: Legal text that underlies the Fixing Offset. ISDA Fixing Offset Definition. (e.g.
          One day that is either a Sydney Business Day or a Melbourne Business Day following the Reset
          Date)
        range: string
      fixingOffsetReason:
        description: Fixing Offset Reason
        range: string
    rules:
      - description: 'From Period. DayPeriod: FpML specifies that if the periodMultiplier value is 0 (zero)
          then period must contain the value D (day).'
        preconditions:
          slot_conditions:
            periodMultiplier:
              equals_number: 0
        postconditions:
          slot_conditions:
            period:
              equals_string: D
  ContractualDefinition:
    attributes:
      identifier:
        description: Corresponds to the unique identifier of the Contractual Definition in which the code
          is published
        range: Identifier
      contractualDefinitionIdentifier:
        description: Contractual Definition Identifier in which the code is published. Includes Document
          Type and Document Version
        range: ContractualDefinitionIdentifier
      publicationDate:
        description: '2021-06-11'
        range: date
    all_of:
      - description: 'Choice: Choice between document uuid or document type and version'
        exactly_one_of:
          - slot_conditions:
              identifier:
                value_presence: PRESENT
          - slot_conditions:
              contractualDefinitionIdentifier:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  identifier:
                    value_presence: ABSENT
              - slot_conditions:
                  contractualDefinitionIdentifier:
                    value_presence: ABSENT
  ContractualDefinitionIdentifier:
    attributes:
      contractualDefinitionType:
        description: e.g. ISDA2021Definitions
        range: ContractualDefinitionsEnum
        required: true
      contractualDefinitionVersion:
        description: e.g. V1
        range: string
  FloatingRateIndexCalculationDefaults:
    description: This holds the rate calculation defaults applicable for a floating rate index.
    attributes:
      category:
        description: The ISDA FRO category (e.g. screen rate or calculated rate).
        range: FloatingRateIndexCategoryEnum
      indexStyle:
        description: The ISDA FRO style (e.g. term rate, swap rate, etc).
        range: FloatingRateIndexStyleEnum
      method:
        description: The ISDA FRO calculation method (e.g. OIS Compounding).
        range: FloatingRateIndexCalculationMethodEnum
      fixing:
        description: The default fixing details.
        range: FloatingRateIndexFixingDetails
        multivalued: true
      dayCountFraction:
        description: The default day count fraction.
        range: DayCountFractionEnum
      applicableBusinessDays:
        description: The default applicable business days.
        range: BusinessCenters
      publicationCalendar:
        description: Publication Calendar (e.g. EUR-ICESWAP)
        range: BusinessCenter
  FloatingRateIndexDefinition:
    attributes:
      fro:
        description: The underlying FRO name and designated maturity.
        range: FloatingRateIndexIdentification
        required: true
      calculationDefaults:
        description: Any calculation default values.
        range: FloatingRateIndexCalculationDefaults
      supportedDefinition:
        description: The definition version or versions supported by the FRO.
        range: ContractualDefinition
        multivalued: true
      definitionalSource:
        description: The source of an FRO, particularly if not a Contractual Definition (e.g. the broker
          rates matrix).
        range: string
      designatedMaturityApplicable:
        range: boolean
      mappings:
        description: Any mappings to other FRos.
        range: FloatingRateIndexMappings
      externalMappings:
        description: Any mappings to other codes for this index.
        range: FloatingRateIndexExternalMappings
      inLoan:
        description: YES / NO to flag FROs identified by the FpML Syndicated Loan WG as having underlying
          benchmark that may also be referenced in syndicated loans.
        range: boolean
      history:
        description: FRO History
        range: FroHistory
      deprecationReason:
        description: Deprecation and Code Descriptions
        range: string
      fpmlDescription:
        description: FpML Description
        range: string
      rounding:
        description: The rounding rules applicable to the floating rate index in case of a calculation.
        range: Rounding
  FloatingRateIndexExternalMap:
    description: A map for a single FRO to or from an equivalent or similar codes in a different standard
      such as ISO.
    attributes:
      externalId:
        description: The FRO name that is being mapped to/from.
        range: string
        required: true
      externalStandard:
        description: The standard/version to which the map applies.
        range: string
  FloatingRateIndexExternalMappings:
    description: Represents the mappings of FRO codes to other.
    attributes:
      isoCode:
        range: FloatingRateIndexExternalMap
  FloatingRateIndexFixingDetails:
    description: This type holds parameters defining the fixingt time and offset for a floating rate index.
    attributes:
      fixingTime:
        description: Parameters defining the normal fixing time (can vary by index tenor / designated
          maturity).
        range: FloatingRateIndexFixingTime
      fixingOffset:
        description: Parameters defining the normal fixing offset (can vary by index tenor / designated
          maturity).
        range: BusinessDayOffset
  FloatingRateIndexFixingOffset:
    is_a: BusinessDayOffset
    description: This type holds parameters defining the normal fixing offset for a floating rate index.
    attributes:
      designatedMaturity:
        description: Allows a reason to be specified for using the alternative fixing offset.
        range: string
    rules:
      - description: 'From Period. DayPeriod: FpML specifies that if the periodMultiplier value is 0 (zero)
          then period must contain the value D (day).'
        preconditions:
          slot_conditions:
            periodMultiplier:
              equals_number: 0
        postconditions:
          slot_conditions:
            period:
              equals_string: D
  FloatingRateIndexFixingTime:
    is_a: BusinessCenterTime
    description: This type holds parameters defining the normal fixing time for a floating rate index.
    attributes:
      designatedMaturity:
        description: Allows a designed maturity to be specified for the fixing time.
        range: string
      fixingTimeDefinition:
        description: Legal text that underlies the Fixing Time. ISDA Fixing Time Definition. (e.g. 09:30,
          Sydney time).
        range: string
      fixingReason:
        description: Fixing Reason
        range: string
  FloatingRateIndexIdentification:
    attributes:
      floatingRateIndex:
        description: The reference index that is used to specify the floating interest rate. The FpML
          standard maintains the list of such indices, which are positioned as enumeration values as part
          of the CDM.
        range: FloatingRateIndexEnum
        annotations:
          rosetta_metadata: scheme
      currency:
        description: FRO currency - 3 character ISO currrency code
        range: ISOCurrencyCodeEnum
      froType:
        description: FRO type (e.g. OIS)
        range: string
  FloatingRateIndexMap:
    description: A map for a single FRO to or from an equivalent or similar FRO in a different contractual
      definitions version.
    attributes:
      index:
        description: The FRO name that is being mapped to/from.
        range: FloatingRateIndexEnum
        multivalued: true
      contractualDefinitionIdentifier:
        description: Contractual Definition to which the map applies. Includes Document Type and Document
          Version
        range: ContractualDefinitionIdentifier
      identifier:
        description: Corresponds to the unique identifier of the Contractual Definition to which the map
          applies
        range: Identifier
    all_of:
      - description: 'Choice: Choice between document uuid or document type and version'
        exactly_one_of:
          - slot_conditions:
              identifier:
                value_presence: PRESENT
          - slot_conditions:
              contractualDefinitionIdentifier:
                value_presence: PRESENT
          - all_of:
              - slot_conditions:
                  identifier:
                    value_presence: ABSENT
              - slot_conditions:
                  contractualDefinitionIdentifier:
                    value_presence: ABSENT
  FloatingRateIndexMappings:
    description: This type defines mappings between FROs in different definitional versions.
    attributes:
      mapsTo:
        description: The successor FRO that this index maps to.
        range: FloatingRateIndexMap
      mapsFrom:
        description: The predecessor FRO(s) that this index maps to.
        range: FloatingRateIndexMap
        multivalued: true
  FroHistory:
    description: FRO History
    attributes:
      startDate:
        description: The date the Floating Rate Option was added to the 2006 Definitions or 2021 Floating
          Rate Matrix. (e.g. 2017/04/06)
        range: date
      firstDefinedIn:
        description: The supplement or version the FRO was first added to the 2006 Definitions or 2021
          Floating Rate Matrix. (e.g. S52)
        range: ContractualDefinition
      updateDate:
        description: The date the Floating Rate Option was last updated in the 2006 Definitions or 2021
          Floating Rate Matrix. (e.g. 2021/06/11)
        range: date
      lastUpdatedIn:
        description: The supplement or version the FRO was last updated in the 2006 Definitions or 2021
          Floating Rate Matrix. (e.g. FRO-M-V1)
        range: ContractualDefinition
      endDate:
        description: The date the Floating Rate Option was removed from the 2006 Definitions or 2021 Floating
          Rate Matrix. (e.g. 2014/01/01)
        range: date
